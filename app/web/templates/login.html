<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      try {
        const savedTheme = localStorage.getItem("sg-gateway-theme");
        document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark";
      } catch (_) {}
    </script>
    <title>SG-Gateway · Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='sg-luxury-jade-depth-v2.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='sg-readable-typography-v3.css') }}">
  </head>
  <body class="sg-body">
    <main class="login-shell">
      <section class="login-panel sg-ljd-card">
        <div class="brand">
          <div class="brand-mark">SG</div>
          <div>
            <div class="brand-name">SG-Gateway</div>
            <div class="brand-note">Вход в панель</div>
          </div>
        </div>

        <form class="settings-form" method="post" action="/login">
          <input type="hidden" name="next" value="{{ next_url }}">
          <label>
            Пароль администратора
            <input name="password" type="password" autocomplete="current-password" autofocus required>
          </label>

          {% if error %}
            <p class="error-text">Неверный пароль.</p>
          {% endif %}

          <button class="button primary sg-ljd-key-action" type="submit">Войти</button>
        </form>
      </section>
    </main>
  </body>
</html>
