name: Temporary quiet-install checksum refresh

on:
  push:
    branches:
      - fix/02206-quiet-clean-install-progress

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh source checksums
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = sorted(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          paths.remove("SOURCE-SHA256SUMS")
          rows = []
          for name in paths:
              rows.append(f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          if git diff --quiet -- SOURCE-SHA256SUMS; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "chore: refresh source checksums"
          git push
