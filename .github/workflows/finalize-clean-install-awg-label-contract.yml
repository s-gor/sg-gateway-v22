name: Finalize clean-install AWG label contract

on:
  push:
    branches:
      - fix/02206-clean-install-awg-label-contract

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary workflows and regenerate source checksums
        run: |
          git rm \
            .github/workflows/verify-clean-install-awg-label-contract.yml \
            .github/workflows/finalize-clean-install-awg-label-contract.yml
          git add -A
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ["git", "ls-files", "-z"],
          ).decode("utf-8").split("\0")
          paths = sorted(path for path in paths if path and path != "SOURCE-SHA256SUMS")
          rows = []
          for path in paths:
              data = subprocess.check_output(["git", "show", f":{path}"])
              rows.append(f"{hashlib.sha256(data).hexdigest()}  {path}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"Regenerated SOURCE-SHA256SUMS for {len(paths)} tracked files")
          PY
          git add SOURCE-SHA256SUMS
          git config user.name "Ser.Gor"
          git config user.email "293675787+s-gor@users.noreply.github.com"
          git commit -m "chore: finalize clean-install contract checksums"
          git push origin HEAD:fix/02206-clean-install-awg-label-contract
