name: DEV 02206 Reverify Once

on:
  push:
    branches: [dev-02206]
    paths:
      - .github/workflows/dev-02206-reverify-once.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-02206
          fetch-depth: 0
      - name: Absorb integrity refresh
        run: |
          sleep 20
          git fetch origin dev-02206
          git reset --hard origin/dev-02206
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -r requirements-dev.txt >/dev/null
      - id: focused
        continue-on-error: true
        run: python -m pytest -q tests/test_sg_gateway_v22_runtime_contract_data_backup.py
      - id: full
        continue-on-error: true
        run: python -m pytest tests
      - id: package
        continue-on-error: true
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-DEV-02206-REVERIFY-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only
      - name: Record result
        if: always()
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          FULL: ${{ steps.full.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
        run: |
          printf 'DEV 02206 reverify\nfocused_tests=%s\nfull_tests=%s\nfull_package=%s\n' "$FOCUSED" "$FULL" "$PACKAGE" > DEV-02206-REVERIFY.txt
          git rm .github/workflows/dev-02206-reverify-once.yml
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in tracked) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record dev-02206 runtime DATA reverify"
          git push origin HEAD:dev-02206
          test "$FOCUSED" = success
          test "$FULL" = success
          test "$PACKAGE" = success
