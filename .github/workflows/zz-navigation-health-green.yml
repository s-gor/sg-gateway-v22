name: Temporary Navigation Health GREEN
on:
  push:
    branches: [feature/02208-performance-clients]
permissions:
  contents: write
jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-performance-clients
          fetch-depth: 0
      - name: Apply navigation health change
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/maintenance/health.py')
          s = p.read_text()
          marker = '''def health_summary() -> str:\n    now = time.monotonic()\n'''
          replacement = '''def cached_health_summary(default: str = "warning") -> str:\n    """Return the last known health status without starting runtime diagnostics."""\n    value = _HEALTH_SUMMARY_CACHE.get("value")\n    if isinstance(value, str) and value in {"ok", "warning", "error"}:\n        return value\n    return default\n\n\ndef health_summary() -> str:\n    now = time.monotonic()\n'''
          assert marker in s
          p.write_text(s.replace(marker, replacement, 1))

          p = Path('app/main.py')
          s = p.read_text()
          old = 'from app.maintenance.health import collect_health_checks, health_summary\n'
          new = 'from app.maintenance.health import cached_health_summary, collect_health_checks, health_summary\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        try:\n            panel_health = health_summary()\n        except Exception:\n            panel_health = "warning"\n'''
          new = '''        try:\n            panel_health = cached_health_summary()\n        except Exception:\n            panel_health = "warning"\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify navigation health and related pages
        env:
          PYTHONPATH: .
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q \
            tests/test_page_runtime_performance_02208.py \
            tests/test_system_health_performance_02208.py \
            tests/test_other_pages_performance_02208.py
          python -B -m py_compile app/main.py app/maintenance/health.py
      - name: Commit and remove verifier
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-navigation-health-green.yml
          git add app/main.py app/maintenance/health.py
          git commit -m 'perf: keep full health checks off ordinary page navigation'
          git push origin HEAD:feature/02208-performance-clients
