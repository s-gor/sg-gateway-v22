name: Temporary AWG31 Header Finalizer

on:
  push:
    branches: [codex/awg31-nonoverlap-defaults]

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}/hostd:${{ github.workspace }}/engines

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify AWG31 regressions
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_v22_awg31_header_ranges.py \
            tests/test_sg_gateway_v22_awg31_stage1_core.py \
            tests/test_sg_gateway_v22_awg31_stage2_api_ui.py \
            tests/test_sg_gateway_v22_awg31_stage3a_install_update.py \
            tests/test_sg_gateway_v22_awg31_preserve_existing_awg3.py
      - name: Remove helper and refresh integrity
        run: |
          git rm .github/workflows/tmp-awg31-header-red.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          tracked = [path for path in tracked if path != "SOURCE-SHA256SUMS"]
          rows = [
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
              for path in tracked
          ]
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n", encoding="utf-8"
          )
          PY
          git diff --check
      - name: Commit finalized tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "chore: finalize AWG31 header range fix"
          git push
