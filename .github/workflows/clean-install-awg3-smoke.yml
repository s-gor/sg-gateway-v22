name: Clean install AWG retirement smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - install.sh
      - app/clients/**
      - app/maintenance/retire_legacy_awg.py
      - app/maintenance/awg31_stage3a.py
      - deploy/sg-gateway-awg31.service
      - deploy/sg-gateway-awg31-userspace.sh
      - .github/workflows/clean-install-awg3-smoke.yml
  push:
    branches: [stable-02208, main]
    paths:
      - install.sh
      - app/clients/**
      - app/maintenance/retire_legacy_awg.py
      - app/maintenance/awg31_stage3a.py
      - deploy/sg-gateway-awg31.service
      - deploy/sg-gateway-awg31-userspace.sh
      - .github/workflows/clean-install-awg3-smoke.yml

permissions:
  contents: read

jobs:
  clean-install-awg-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout clean-install candidate
        uses: actions/checkout@v4

      - name: Confirm clean SG-Gateway state
        run: |
          sudo test ! -e /opt/sg-gateway
          sudo test ! -e /etc/sg-gateway
          sudo test ! -e /var/lib/sg-gateway
          sudo test ! -e /etc/systemd/system/sg-gateway-awg.service
          sudo test ! -e /etc/systemd/system/sg-gateway-awg3.service

      - name: Seed unattended clean-install parameters
        run: |
          PUBLIC_IP="$(curl -4 -fsS --max-time 15 https://api.ipify.org)"
          python3 - "$PUBLIC_IP" <<'PY'
          import ipaddress, sys
          ip = ipaddress.ip_address(sys.argv[1])
          assert ip.version == 4 and ip.is_global, ip
          PY
          sudo install -m 0600 /dev/null /root/sg-gateway-02208-installer-resume.env
          sudo tee /root/sg-gateway-02208-installer-resume.env >/dev/null <<EOF
          PANEL_PORT=63443
          XRAY_PORT=443
          AWG_PORT=585
          REALITY_TARGET=www.bing.com:443
          REALITY_SNI=www.bing.com
          ADMIN_PASSWORD=CleanInstallTest2026
          ADMIN_PASSWORD_HASH=
          PUBLIC_ADDRESS=$PUBLIC_IP
          SERVER_NAME=sg-gateway-ci
          COUNTRY_CODE=us
          CREATE_SG_ADMIN=1
          SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          EOF

      - name: Run native clean installer
        env:
          SG_GATEWAY_SOURCE_DIR: ${{ github.workspace }}
          SG_GATEWAY_APT_WAIT_SECONDS: "900"
        run: sudo -E bash install.sh

      - name: Verify retired runtimes and live AWG31
        run: |
          sudo systemctl is-active --quiet sg-hostd.service
          sudo systemctl is-active --quiet sg-gateway.service
          ! sudo systemctl is-active --quiet sg-gateway-awg.service
          ! sudo systemctl is-active --quiet sg-gateway-awg3.service
          sudo systemctl is-active --quiet sg-gateway-awg31.service
          sudo test ! -e /etc/amnezia/amneziawg/awg0.conf
          sudo test ! -e /etc/amnezia/amneziawg/awg3.conf
          sudo test ! -S /run/amneziawg/awg3.sock
          ! sudo ip link show dev awg0 >/dev/null 2>&1
          ! sudo ip link show dev awg3 >/dev/null 2>&1
          sudo test -S /run/amneziawg/awg31.sock
          sudo ip link show dev awg31
          test "$(sudo /opt/sg-gateway/awg31/bin/awg show awg31 listen-port)" = "587"

      - name: Verify sg-admin exposes only current AWG profile
        run: |
          sudo bash -c '
            set -a
            source /etc/sg-gateway/runtime.env
            source /etc/sg-gateway/sg-gateway.env
            set +a
            runuser -u sg-gateway -- env PYTHONPATH=/opt/sg-gateway:/opt/sg-gateway/hostd \
              /opt/sg-gateway/.venv/bin/python - <<"PY"
          from app.clients.repository import device_access_tokens
          from app.db import connect
          with connect() as connection:
              primary = connection.execute("SELECT d.id FROM devices d JOIN clients c ON c.id=d.client_id WHERE c.name=? AND d.is_primary=1", ("sg-admin",)).fetchone()
              legacy = connection.execute("SELECT engine, COUNT(*) AS n FROM device_credentials WHERE engine IN (\"amneziawg\",\"amneziawg3\") GROUP BY engine").fetchall()
          assert primary is not None
          assert not legacy, [(row["engine"], row["n"]) for row in legacy]
          access = set(device_access_tokens(int(primary["id"])))
          assert "amneziawg" not in access
          assert "amneziawg3" not in access
          assert "amneziawg31" in access
          PY
          '

      - name: Print diagnostics on failure
        if: failure()
        run: |
          sudo systemctl status sg-gateway.service sg-hostd.service sg-gateway-awg.service sg-gateway-awg3.service sg-gateway-awg31.service --no-pager || true
          sudo journalctl -b -u sg-gateway.service -u sg-hostd.service -u sg-gateway-awg.service -u sg-gateway-awg3.service -u sg-gateway-awg31.service -n 200 --no-pager || true
          sudo tail -n 200 /var/log/sg-gateway-installer-02208.log || true
