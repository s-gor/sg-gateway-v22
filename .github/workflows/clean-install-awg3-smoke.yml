name: Clean install AWG3 smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev-02206
    paths:
      - install.sh
      - deploy/sg-gateway-awg3.service
      - deploy/sg-gateway-awg3-userspace.sh
      - deploy/sg-gateway-awg31.service
      - deploy/sg-gateway-awg31-userspace.sh
      - app/install_seed.py
      - app/maintenance/awg31_stage3a.py
      - app/maintenance/seeded_admin_awg3.py
      - app/clients/**
      - app/engines/provisioning.py
      - hostd/sg_hostd/awg3_runtime.py
      - tests/test_sg_gateway_v22_awg30_idle_bootstrap.py
      - .github/workflows/clean-install-awg3-smoke.yml
  push:
    branches:
      - dev-02206
      - test/clean-install-awg3
    paths:
      - install.sh
      - deploy/sg-gateway-awg3.service
      - deploy/sg-gateway-awg3-userspace.sh
      - deploy/sg-gateway-awg31.service
      - deploy/sg-gateway-awg31-userspace.sh
      - app/install_seed.py
      - app/maintenance/awg31_stage3a.py
      - app/maintenance/seeded_admin_awg3.py
      - app/clients/**
      - app/engines/provisioning.py
      - hostd/sg_hostd/awg3_runtime.py
      - tests/test_sg_gateway_v22_awg30_idle_bootstrap.py
      - .github/workflows/clean-install-awg3-smoke.yml

permissions:
  contents: read

jobs:
  clean-install-awg3:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout clean-install candidate
        uses: actions/checkout@v4

      - name: Confirm clean SG-Gateway state
        run: |
          sudo test ! -e /opt/sg-gateway
          sudo test ! -e /etc/sg-gateway
          sudo test ! -e /var/lib/sg-gateway
          sudo test ! -e /etc/systemd/system/sg-gateway-awg3.service

      - name: Seed unattended clean-install parameters
        run: |
          PUBLIC_IP="$(curl -4 -fsS --max-time 15 https://api.ipify.org)"
          python3 - "$PUBLIC_IP" <<'PY'
          import ipaddress
          import sys
          ip = ipaddress.ip_address(sys.argv[1])
          assert ip.version == 4 and ip.is_global, ip
          PY
          sudo install -m 0600 /dev/null /root/sg-gateway-02206-installer-resume.env
          sudo tee /root/sg-gateway-02206-installer-resume.env >/dev/null <<EOF
          PANEL_PORT=63443
          XRAY_PORT=443
          AWG_PORT=585
          REALITY_TARGET=www.bing.com:443
          REALITY_SNI=www.bing.com
          ADMIN_PASSWORD=CleanInstallTest2026
          ADMIN_PASSWORD_HASH=
          PUBLIC_ADDRESS=$PUBLIC_IP
          SERVER_NAME=sg-gateway-ci
          COUNTRY_CODE=us
          CREATE_SG_ADMIN=1
          SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          EOF

      - name: Run native clean installer
        env:
          SG_GATEWAY_SOURCE_DIR: ${{ github.workspace }}
          SG_GATEWAY_APT_WAIT_SECONDS: "900"
        run: sudo -E bash install.sh

      - name: Verify clean-install AWG3 unit
        run: |
          sudo cmp -s \
            /opt/sg-gateway/deploy/sg-gateway-awg3.service \
            /etc/systemd/system/sg-gateway-awg3.service
          sudo systemctl is-active --quiet sg-hostd.service
          sudo systemctl is-active --quiet sg-gateway.service

      - name: Verify seeded sg-admin AWG3 profile
        run: |
          sudo systemctl is-active --quiet sg-gateway-awg3.service
          sudo test -S /run/amneziawg/awg3.sock
          sudo ip link show dev awg3
          sudo test -s /etc/amnezia/amneziawg/awg3.conf
          sudo grep -q '^\[Peer\]' /etc/amnezia/amneziawg/awg3.conf
          sudo test ! -e /var/lib/sg-gateway/.seeded-admin-awg3.pending
          test "$(sudo /opt/sg-gateway/awg3/bin/awg show awg3 listen-port)" = "586"
          sudo awk -F= '
            $1 == "SG_GATEWAY_AWG3_PUBLIC_KEY" && length($2) >= 40 { ready=1 }
            END { exit(ready ? 0 : 1) }
          ' /etc/sg-gateway/engine-secrets.env
          sudo bash -c '
            set -a
            source /etc/sg-gateway/runtime.env
            source /etc/sg-gateway/sg-gateway.env
            set +a
            runuser -u sg-gateway -- env \
              PYTHONPATH=/opt/sg-gateway:/opt/sg-gateway/hostd \
              /opt/sg-gateway/.venv/bin/python - <<"PY"
          from app.clients.repository import list_clients
          from app.db import connect

          with connect() as connection:
              peers = connection.execute(
                  "SELECT COUNT(*) FROM device_credentials WHERE engine = ?",
                  ("amneziawg3",),
              ).fetchone()[0]
              seeded = connection.execute(
                  """
                  SELECT COUNT(*)
                  FROM device_credentials dc
                  JOIN devices d ON d.id = dc.device_id
                  JOIN clients c ON c.id = d.client_id
                  WHERE dc.engine = ? AND c.name = ?
                  """,
                  ("amneziawg3", "sg-admin"),
              ).fetchone()[0]
          assert int(peers) == 1, peers
          assert int(seeded) == 1, seeded
          assert list_clients(), "seeded catalogue is unexpectedly empty"
          PY
          '

      - name: Create and apply additional AWG3 client
        run: |
          sudo bash -c '
            set -a
            source /etc/sg-gateway/runtime.env
            source /etc/sg-gateway/sg-gateway.env
            set +a
            runuser -u sg-gateway -- env \
              PYTHONPATH=/opt/sg-gateway:/opt/sg-gateway/hostd \
              /opt/sg-gateway/.venv/bin/python - <<"PY"
          from app.clients.repository import create_client, delete_client
          from app.clients.runtime import apply_clients_runtime

          client_id = create_client("ci-clean-awg3", "amneziawg3")
          if not client_id:
              raise SystemExit("AWG3 clean-install client was not created")
          try:
              result = apply_clients_runtime()
          except Exception:
              delete_client(client_id)
              raise
          print(result.get("message") or result)
          PY
          '

      - name: Verify both userspace profiles remain live
        run: |
          sudo systemctl is-active --quiet sg-gateway-awg3.service
          sudo systemctl is-active --quiet sg-gateway-awg31.service
          sudo test -S /run/amneziawg/awg3.sock
          sudo test -S /run/amneziawg/awg31.sock
          sudo ip link show dev awg3
          sudo ip link show dev awg31
          test "$(sudo /opt/sg-gateway/awg3/bin/awg show awg3 listen-port)" = "586"
          test "$(sudo /opt/sg-gateway/awg31/bin/awg show awg31 listen-port)" = "587"
          sudo /opt/sg-gateway/awg3/bin/awg show awg3
          sudo /opt/sg-gateway/awg31/bin/awg show awg31

      - name: Print diagnostics on failure
        if: failure()
        run: |
          sudo systemctl status sg-gateway-awg3.service sg-gateway-awg31.service --no-pager || true
          sudo journalctl -b -u sg-gateway-awg3.service -u sg-gateway-awg31.service -n 150 --no-pager || true
          sudo tail -n 150 /var/log/sg-gateway-installer-02206.log || true
