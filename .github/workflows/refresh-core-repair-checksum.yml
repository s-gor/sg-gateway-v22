name: Refresh core repair checksum

on:
  push:
    branches: [fix/02208-clients-keys-dormant-restore]
    paths: [.github/workflows/refresh-core-repair-checksum.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02208-clients-keys-dormant-restore
          fetch-depth: 0
      - name: Refresh exact tracked source checksums
        run: |
          rm -f .github/workflows/refresh-core-repair-checksum.yml
          git add -A
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files', '--cached'], text=True).splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS' and Path(p).exists()]
          rows = []
          for path in sorted(tracked):
              rows.append(f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: refresh source integrity after core NaiveProxy repair'
          git push origin HEAD:fix/02208-clients-keys-dormant-restore
