name: Final disabled Xray selection fix

on:
  push:
    branches: [fix/disabled-xray-profile-selection]
    paths: [.github/workflows/final-disabled-xray-selection-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/disabled-xray-profile-selection
          fetch-depth: 0

      - run: python3 -m pip install -r requirements-dev.txt

      - name: Apply implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          path = Path("app/main.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def _prepare_client_protocols(values) -> list[str]:")
          end = text.index("\n\ndef normalize_country_code", start)
          function = dedent('''
          def _prepare_client_protocols(values) -> list[str]:
              # Add SG Client only when at least one subscription source is selected.
              protocols: list[str] = []
              for value in values:
                  token = str(value or "").strip().lower()
                  if not token or token == "sgclient" or token in protocols:
                      continue
                  protocols.append(token)

              selected_xray = [token for token in protocols if token.startswith("xray_")]
              if selected_xray:
                  overview = xray_profiles_overview()
                  profiles = overview.get("profiles")
                  if not isinstance(profiles, list):
                      profiles = []
                  titles: dict[str, str] = {}
                  ready: set[str] = set()
                  for profile in profiles:
                      profile_id = str(getattr(profile, "id", "") or "").strip().lower()
                      if not profile_id:
                          continue
                      profile_token = f"xray_{profile_id}"
                      titles[profile_token] = str(
                          getattr(profile, "title", "") or profile_id
                      ).strip()
                      if bool(getattr(profile, "ready", False)):
                          ready.add(profile_token)

                  unavailable = [token for token in selected_xray if token not in ready]
                  if unavailable:
                      token = unavailable[0]
                      title = titles.get(token, token.removeprefix("xray_"))
                      raise ValueError(
                          f"Xray-профиль «{title}» выключен или не готов на сервере. "
                          "Обновите страницу и выберите доступный профиль."
                      )

              has_subscription_source = any(
                  token in _CLIENT_SUBSCRIPTION_SOURCES
                  or token == "xray"
                  or token.startswith("xray_")
                  for token in protocols
              )
              if has_subscription_source:
                  protocols.append("sgclient")
              return protocols
          ''').lstrip().rstrip()
          text = text[:start] + function + text[end:]

          substitutions = [
              (
                  r'(?m)^    def add_client\(\):\n        protocols = _prepare_client_protocols\(request\.form\.getlist\("protocols"\)\)\n        access = ","\.join\(protocols\)\n        try:\n            client_id = create_client\(',
                  '    def add_client():\n        try:\n            protocols = _prepare_client_protocols(request.form.getlist("protocols"))\n            access = ",".join(protocols)\n            client_id = create_client(',
              ),
              (
                  r'(?m)^        protocols = _prepare_client_protocols\(request\.form\.getlist\("protocols"\)\)\n        try:\n            updated = update_client\(',
                  '        try:\n            protocols = _prepare_client_protocols(request.form.getlist("protocols"))\n            updated = update_client(',
              ),
              (
                  r'(?m)^        protocols = _prepare_client_protocols\(request\.form\.getlist\("protocols"\)\)\n        try:\n            updated = update_device\(',
                  '        try:\n            protocols = _prepare_client_protocols(request.form.getlist("protocols"))\n            updated = update_device(',
              ),
              (
                  r'(?m)^        snapshot = snapshot_client\(client_id\)\n        protocols = _prepare_client_protocols\(request\.form\.getlist\("protocols"\)\)\n        access = ","\.join\(protocols\)\n        try:\n            device_id = create_device\(',
                  '        snapshot = snapshot_client(client_id)\n        try:\n            protocols = _prepare_client_protocols(request.form.getlist("protocols"))\n            access = ",".join(protocols)\n            device_id = create_device(',
              ),
          ]
          for pattern, replacement in substitutions:
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"route substitution failed: {pattern[:70]}")
          path.write_text(text, encoding="utf-8", newline="\n")

          template_path = Path("app/web/templates/_client_edit_dialogs.html")
          template = template_path.read_text(encoding="utf-8")
          changes = [
              (
                  "{{ 'is-locked' if not profile.ready and not selected else '' }}",
                  "{{ 'is-locked' if not profile.ready else '' }}",
              ),
              (
                  "{% if selected %}checked{% endif %} {% if not profile.ready and not selected %}disabled{% endif %}",
                  "{% if selected and profile.ready %}checked{% endif %} {% if not profile.ready %}disabled{% endif %}",
              ),
              (
                  "{% if selected %}Подключён — реквизиты сохранятся{% elif profile.ready %}",
                  "{% if selected and not profile.ready %}Выключен на сервере — при сохранении будет удалён{% elif selected %}Подключён — реквизиты сохранятся{% elif profile.ready %}",
              ),
          ]
          for old, new in changes:
              if template.count(old) != 1:
                  raise SystemExit(f"template substitution failed: {old[:60]}")
              template = template.replace(old, new)
          template_path.write_text(template, encoding="utf-8", newline="\n")
          PY

      - name: Verify focused GREEN
        run: |
          python3 -m pytest -q tests/test_disabled_xray_profile_selection.py
          python3 -m py_compile app/main.py
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -- \
            .github/workflows/apply-disabled-xray-selection-fix.yml \
            .github/workflows/retry-disabled-xray-selection-fix.yml \
            .github/workflows/final-disabled-xray-selection-fix.yml
          git add app/main.py app/web/templates/_client_edit_dialogs.html
          git commit -m "fix: reject unavailable Xray client profiles"
          git push origin HEAD:fix/disabled-xray-profile-selection
