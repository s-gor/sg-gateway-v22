name: Finish 22.08 public exact-source pin

on:
  push:
    branches:
      - release/02208-rc
    paths:
      - .github/workflows/zz-finish-02208-public-pin.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin public Clean Install to final production commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "1a74b6e53fc1dd3343c77c1f05678dff2cec225e"
          new = "f709015548de91c631a5daf174194f245f7cce00"
          expected = {
              "README.md": 2,
              "PUBLICATION-02208.md": 2,
              "deploy/GITHUB-COMMANDS.md": 3,
          }

          for name, count in expected.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"unexpected old pin count in {name}: expected={count} actual={actual}")
              if new in text:
                  raise SystemExit(f"new pin already present in {name}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          for name, count in expected.items():
              text = Path(name).read_text(encoding="utf-8")
              if text.count(new) != count or old in text:
                  raise SystemExit(f"pin replacement failed in {name}")
          PY

      - name: Remove transient workflow and refresh source integrity
        shell: bash
        run: |
          git rm .github/workflows/zz-finish-02208-public-pin.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [item.decode("utf-8") for item in raw.split(b"\0") if item]
          rows = []
          for path in paths:
              if path == "SOURCE-SHA256SUMS":
                  continue
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              rows.append(f"{digest}  {path}\n")
          Path("SOURCE-SHA256SUMS").write_text("".join(rows), encoding="utf-8")
          print(f"refreshed SOURCE-SHA256SUMS: {len(rows)} files")
          PY

      - name: Run focused release regressions
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          python -m pip install -q pytest
          python -m pytest -q \
            tests/test_sg_gateway_v22_public_github_commands.py \
            tests/test_sg_gateway_v22_release_02208.py \
            tests/test_sg_gateway_v22_release_preparation.py

      - name: Commit finalized public pin
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "release: pin 22.08 Clean Install to final production commit"
          git push origin HEAD:release/02208-rc
