name: Temporary NaiveProxy TLS domain regression

on:
  push:
    branches:
      - fix/02208-awg23-restore-repair-persist

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run NaiveProxy TLS-domain regression
        run: python -m pytest -q tests/test_naiveproxy_tls_domain_restore_02208.py
