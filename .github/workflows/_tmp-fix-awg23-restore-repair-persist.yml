name: Temporary AWG2 AWG3 restore repair persist fix

on:
  push:
    branches: [fix/02208-awg23-restore-repair-persist]

permissions:
  contents: write

jobs:
  tdd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02208-awg23-restore-repair-persist
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: RED then GREEN AWG2/AWG3 repaired config persistence
        shell: bash
        run: |
          set -euo pipefail

          cat > tests/test_clients_keys_awg23_restore_repair_persist_02208.py <<'PYTEST'
          import importlib.util
          import json
          import sqlite3
          from pathlib import Path

          MODULE_PATH = Path(__file__).resolve().parents[1] / "hostd" / "sg_hostd" / "clients_keys_tls_backup_patch.py"
          SPEC = importlib.util.spec_from_file_location("clients_keys_tls_backup_patch_under_test", MODULE_PATH)
          assert SPEC is not None and SPEC.loader is not None
          patch = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(patch)


          def _make_db(path: Path) -> None:
              con = sqlite3.connect(path)
              try:
                  con.execute("CREATE TABLE connection_settings (engine TEXT PRIMARY KEY, enabled INTEGER, config_json TEXT)")
                  con.execute("CREATE TABLE device_credentials (id INTEGER PRIMARY KEY, engine TEXT, status TEXT, config_json TEXT)")
                  for engine in ("amneziawg", "amneziawg3"):
                      con.execute(
                          "INSERT INTO connection_settings(engine, enabled, config_json) VALUES (?, 1, '{}')",
                          (engine,),
                      )
                  con.execute(
                      "INSERT INTO device_credentials(id, engine, status, config_json) VALUES (1, 'amneziawg', 'applied', ?)",
                      (json.dumps({"private_key": "old-awg2-client-key"}),),
                  )
                  con.execute(
                      "INSERT INTO device_credentials(id, engine, status, config_json) VALUES (2, 'amneziawg3', 'applied', ?)",
                      (json.dumps({"private_key": "old-awg3-client-key"}),),
                  )
                  con.commit()
              finally:
                  con.close()


          def test_destination_policy_keeps_runtime_repaired_awg_configs(tmp_path: Path) -> None:
              db = tmp_path / "sg-gateway.sqlite"
              _make_db(db)

              repaired = {
                  "amneziawg": {
                      "private_key": "old-awg2-client-key",
                      "server_public_key": "destination-awg2-server-key",
                      "endpoint": "203.0.113.10:585",
                      "jc": 4,
                      "jmin": 10,
                      "jmax": 50,
                      "s1": 64,
                      "s2": 96,
                      "h1": 1001,
                      "h2": 1002,
                      "h3": 1003,
                      "h4": 1004,
                  },
                  "amneziawg3": {
                      "private_key": "old-awg3-client-key",
                      "server_public_key": "destination-awg3-server-key",
                      "endpoint": "203.0.113.10:586",
                      "jc": 4,
                      "jmin": 10,
                      "jmax": 50,
                      "s1": 64,
                      "s2": 96,
                      "s3": 48,
                      "s4": 12,
                      "h1": "2001",
                      "h2": "2002",
                      "h3": "2003",
                      "h4": "2004",
                      "header_protection_key": "destination-header-key",
                      "content_padding_addition": "10-100",
                      "rekey_after_time": "100-120",
                      "rekey_timeout": "3-7",
                      "reject_after_time": "150-180",
                      "keepalive_timeout": "5-15",
                      "max_handshake_attempts": "15-20",
                  },
              }

              with patch.destination_protocol_policy(db):
                  con = sqlite3.connect(db)
                  try:
                      for row_id, engine in ((1, "amneziawg"), (2, "amneziawg3")):
                          con.execute(
                              "UPDATE device_credentials SET status = 'checking', config_json = ? WHERE id = ?",
                              (json.dumps(repaired[engine], sort_keys=True), row_id),
                          )
                      con.commit()
                  finally:
                      con.close()

              con = sqlite3.connect(db)
              try:
                  rows = con.execute(
                      "SELECT engine, status, config_json FROM device_credentials ORDER BY id"
                  ).fetchall()
              finally:
                  con.close()

              assert [row[1] for row in rows] == ["applied", "applied"]
              assert json.loads(rows[0][2]) == repaired["amneziawg"]
              assert json.loads(rows[1][2]) == repaired["amneziawg3"]
          PYTEST

          set +e
          python -m pytest -q tests/test_clients_keys_awg23_restore_repair_persist_02208.py
          red_rc=$?
          set -e
          if (( red_rc == 0 )); then
            echo 'Expected RED test to fail on current implementation' >&2
            exit 1
          fi
          echo "RED confirmed: repaired AWG config is rolled back by destination_protocol_policy"

          python - <<'PY'
          from pathlib import Path

          path = Path('hostd/sg_hostd/clients_keys_tls_backup_patch.py')
          text = path.read_text(encoding='utf-8')
          old = '''            snapshots.append((int(row_id), str(status), raw))\n            if not settings.get(engine, True):\n'''
          new = '''            # Status is always temporary. config_json is temporary only for\n            # Xray, where this policy may narrow the selected profiles. AWG2\n            # and AWG3 runtime apply repairs destination server fields inside\n            # config_json; restoring their pre-apply snapshot here would undo\n            # that repair and leave exports dormant after restore.\n            snapshots.append((\n                int(row_id),\n                str(status),\n                raw if engine == "xray" else None,\n            ))\n            if not settings.get(engine, True):\n'''
          if old not in text:
              raise SystemExit('AWG restore persistence patch target not found')
          text = text.replace(old, new, 1)

          old_finally = '''            for row_id, status, raw in snapshots:\n                db.execute(\n                    "UPDATE device_credentials SET status = ?, config_json = ? WHERE id = ?",\n                    (status, raw, int(row_id)),\n                )\n'''
          new_finally = '''            for row_id, status, raw in snapshots:\n                if raw is None:\n                    db.execute(\n                        "UPDATE device_credentials SET status = ? WHERE id = ?",\n                        (status, int(row_id)),\n                    )\n                else:\n                    db.execute(\n                        "UPDATE device_credentials SET status = ?, config_json = ? WHERE id = ?",\n                        (status, raw, int(row_id)),\n                    )\n'''
          if old_finally not in text:
              raise SystemExit('AWG restore persistence finally target not found')
          path.write_text(text.replace(old_finally, new_finally, 1), encoding='utf-8', newline='\n')
          PY

          python -m pytest -q tests/test_clients_keys_awg23_restore_repair_persist_02208.py
          python -m pytest -q tests/test_clients_keys_dormant_restore_02208.py
          python -m py_compile hostd/sg_hostd/clients_keys_tls_backup_patch.py

          rm -f .github/workflows/_tmp-fix-awg23-restore-repair-persist.yml
          git add -A
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          rows = []
          for name in sorted(item for item in tracked if item != 'SOURCE-SHA256SUMS'):
              rows.append(f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
          PY
          git add SOURCE-SHA256SUMS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve repaired AWG2 and AWG3 configs after restore'
          git push origin HEAD:fix/02208-awg23-restore-repair-persist
