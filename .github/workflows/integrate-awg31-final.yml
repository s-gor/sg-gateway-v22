name: Final AWG 3.1 Integration

on:
  push:
    branches:
      - integrate-awg31-final-20260825

permissions:
  contents: write
  statuses: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration driver
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve driver and checkout dev-02206
        run: |
          cp .ci/integrate-awg31-final.sh "$RUNNER_TEMP/integrate-awg31-final.sh"
          git fetch origin dev-02206
          git checkout -B dev-02206 origin/dev-02206

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libmnl-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build, test, commit and push AWG 3.1
        shell: bash
        run: bash "$RUNNER_TEMP/integrate-awg31-final.sh"

      - name: Publish integration status
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          state = "success" if os.environ.get("JOB_STATUS") == "success" else "failure"
          payload = json.dumps({
              "state": state,
              "context": "awg31-final/integration",
              "description": "build, full test, commit and push AWG 3.1 to dev-02206",
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status, state, sha)
          PY
