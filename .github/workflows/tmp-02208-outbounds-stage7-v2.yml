name: TEMP 22.08 Outbounds stage 7 v2

on:
  push:
    branches: [tmp/02208-outbounds-stage7-run]
    paths: [.github/workflows/tmp-02208-outbounds-stage7-v2.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Prepare exact Stage 6 base
        run: |
          cp tools/tmp_02208_outbounds_stage7.py /tmp/stage7.py
          git fetch --no-tags --depth=1 origin 0086bce15da673f276e4bd7a5b8970327609f79e
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "0086bce15da673f276e4bd7a5b8970327609f79e"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Confirm RED Outbounds contracts
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('stage7','/tmp/stage7.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          mod.write_tests()
          PY
          set +e
          python -m pytest -q tests/test_sg_gateway_v22_outbounds_contract_02208.py
          structural_rc=$?
          python -m pytest -q tests/test_sg_gateway_v22_outbounds_geometry_02208.py
          geometry_rc=$?
          set -e
          test "$structural_rc" -ne 0
          test "$geometry_rc" -ne 0
          echo "Confirmed RED: structural=$structural_rc geometry=$geometry_rc"
      - name: Apply Outbounds 22.08 migration without width ownership
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('stage7','/tmp/stage7.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          mod.migrate()
          p=Path('app/web/static/sg-ui-outbounds-v22-08.css')
          css=p.read_text(encoding='utf-8')
          css=css.replace('[data-sg-ui-page="outbounds"] { --sg-ui-page-gap: 24px; width: 100%; margin-inline: 0; }\n[data-sg-ui-page="outbounds"] > .sg-ui-page-head,\n[data-sg-ui-page="outbounds"] > .sg-ui-section { width: 100%; margin-inline: 0; }\n', '[data-sg-ui-page="outbounds"] { --sg-ui-page-gap: 24px; }\n')
          if 'width: 100%; margin-inline: 0' in css:
              raise SystemExit('page outer width ownership remained')
          p.write_text(css, encoding='utf-8')
          contract=Path('tests/test_sg_gateway_v22_outbounds_contract_02208.py')
          contract.write_text(contract.read_text(encoding='utf-8') + '''\n\ndef test_02208_outbounds_page_css_does_not_own_outer_width() -> None:\n    css = PAGE_CSS.read_text(encoding="utf-8")\n    assert 'width: 100%; margin-inline: 0' not in css\n''', encoding='utf-8')
          PY
          git add -A
      - name: Focused GREEN
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_v22_outbounds_contract_02208.py \
            tests/test_sg_gateway_v22_outbounds_geometry_02208.py \
            tests/test_sg_gateway_v22_maintenance_contract_02208.py \
            tests/test_sg_gateway_v22_maintenance_geometry_02208.py \
            tests/test_sg_gateway_v22_ui_function_contract_02208.py \
            tests/test_sg_gateway_v22_ui_architecture_02208.py \
            tests/test_sg_gateway_v22_system_geometry_02208.py \
            tests/test_sg_gateway_v22_security_geometry_02208.py \
            tests/test_sg_gateway_v22_routing_geometry_02208.py \
            tests/test_sg_gateway_v22_clients_geometry_02208.py \
            tests/test_sg_gateway_v22_connections_geometry_02208.py
      - name: WARP and routing regression set
        run: python -m pytest tests -q -k 'warp or outbound or routing'
      - name: Refresh source integrity
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked=sorted(p for p in subprocess.check_output(['git','ls-files'], text=True).splitlines() if p != 'SOURCE-SHA256SUMS')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(f"{hashlib.sha256(subprocess.check_output(['git','show',f':{p}'])).hexdigest()}  {p}" for p in tracked)+'\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
      - name: Full pytest
        run: python -m pytest tests -q
      - name: Create clean commit
        run: |
          git config user.name 'Ser.Gor'
          git config user.email '293675787+s-gor@users.noreply.github.com'
          git commit -m 'refactor: migrate Outbounds to 22.08 UI rails'
      - name: Verify committed source integrity
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          expected={}
          for line in Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines():
              if line.strip(): digest,path=line.split('  ',1); expected[path]=digest
          tracked=sorted(p for p in subprocess.check_output(['git','ls-files'], text=True).splitlines() if p != 'SOURCE-SHA256SUMS')
          assert sorted(expected)==tracked
          for p in tracked: assert hashlib.sha256(subprocess.check_output(['git','show',f'HEAD:{p}'])).hexdigest()==expected[p],p
          print(f'Source integrity verified for {len(tracked)} tracked files')
          PY
      - name: FULL package verify
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only
      - name: Publish GREEN candidate
        run: git push --force origin HEAD:refs/heads/feature/02208-outbounds-stage7-green
