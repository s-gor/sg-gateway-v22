name: AWG31 Repair Trigger

on:
  push:
    branches: [dev-02206]
    paths:
      - .github/workflows/awg31-repair-trigger.yml

permissions:
  contents: write

jobs:
  repair-trigger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-02206
          fetch-depth: 0
      - name: Correct repair anchor and retrigger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/awg31-final-repair.yml')
          text = path.read_text(encoding='utf-8')
          old = '          if text.count(target) != 1:\n'
          new = '          if text.count(target) < 1:\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one repair anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/awg31-repair-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/awg31-final-repair.yml
          git commit -m "ci: correct final AWG31 repair anchor"
          git push origin HEAD:dev-02206
