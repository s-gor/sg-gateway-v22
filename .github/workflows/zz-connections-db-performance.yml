name: Temporary Connections DB Performance Verifier

on:
  push:
    branches: [feature/02208-performance-clients]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-performance-clients
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Write RED batch contract
        run: |
          cat > tests/test_connections_db_performance_02208.py <<'PY'
          import sqlite3


          def test_connection_settings_batch_uses_one_database_read(monkeypatch):
              from app.connections import settings

              db = sqlite3.connect(':memory:')
              db.row_factory = sqlite3.Row
              db.execute('CREATE TABLE connection_settings (engine TEXT PRIMARY KEY, enabled INTEGER, host TEXT, port INTEGER, config_json TEXT)')
              for engine, port in [('xray', 443), ('mihomo', 2099), ('amneziawg31', 587)]:
                  db.execute(
                      'INSERT INTO connection_settings(engine, enabled, host, port, config_json) VALUES (?, 1, ?, ?, ?)',
                      (engine, f'{engine}.example', port, '{}'),
                  )
              db.commit()
              calls = 0

              def fake_connect():
                  nonlocal calls
                  calls += 1
                  return db

              monkeypatch.setattr(settings, 'connect', fake_connect)
              result = settings.list_connection_settings(('xray', 'mihomo', 'amneziawg31'))
              assert set(result) == {'xray', 'mihomo', 'amneziawg31'}
              assert result['xray'].port == 443
              assert calls == 1
          PY
      - name: Prove RED
        run: |
          set +e
          python -m pytest -q tests/test_connections_db_performance_02208.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'Expected RED but batch API already exists'
            exit 1
          fi
          echo 'RED confirmed'
      - name: Implement batch settings read
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/connections/settings.py')
          text = path.read_text(encoding='utf-8')
          old = '''def get_connection_settings(engine: str) -> ConnectionSettings:\n    with connect() as connection:\n        row = connection.execute(\n            """\n            SELECT engine, enabled, host, port, config_json\n            FROM connection_settings\n            WHERE engine = ?\n            """,\n            (engine,),\n        ).fetchone()\n\n    if row is None:\n        raise KeyError(f"Unknown connection engine: {engine}")\n\n    return ConnectionSettings(\n        engine=row["engine"],\n        enabled=bool(row["enabled"]),\n        host=row["host"],\n        port=int(row["port"]),\n        config=json.loads(row["config_json"]),\n    )\n'''
          new = '''def _row_to_settings(row) -> ConnectionSettings:\n    return ConnectionSettings(\n        engine=row["engine"],\n        enabled=bool(row["enabled"]),\n        host=row["host"],\n        port=int(row["port"]),\n        config=json.loads(row["config_json"]),\n    )\n\n\ndef get_connection_settings(engine: str) -> ConnectionSettings:\n    with connect() as connection:\n        row = connection.execute(\n            """\n            SELECT engine, enabled, host, port, config_json\n            FROM connection_settings\n            WHERE engine = ?\n            """,\n            (engine,),\n        ).fetchone()\n\n    if row is None:\n        raise KeyError(f"Unknown connection engine: {engine}")\n    return _row_to_settings(row)\n\n\ndef list_connection_settings(engines) -> dict[str, ConnectionSettings]:\n    names = tuple(dict.fromkeys(str(engine) for engine in engines if str(engine)))\n    if not names:\n        return {}\n    placeholders = ",".join("?" for _ in names)\n    with connect() as connection:\n        rows = connection.execute(\n            f"SELECT engine, enabled, host, port, config_json FROM connection_settings WHERE engine IN ({placeholders})",\n            names,\n        ).fetchall()\n    return {str(row["engine"]): _row_to_settings(row) for row in rows}\n'''
          if old not in text:
              raise SystemExit('settings block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('app/connections/service.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from app.connections.settings import get_connection_settings\n', 'from app.connections.settings import list_connection_settings\n', 1)
          old_summary = '''def _summary(name: str, label: str, counts: dict[str, int], *, note: str = "") -> ConnectionSummary:\n    settings = get_connection_settings(name)\n'''
          new_summary = '''def _summary(name: str, label: str, counts: dict[str, int], settings, *, note: str = "") -> ConnectionSummary:\n'''
          if old_summary not in text:
              raise SystemExit('summary block not found')
          text = text.replace(old_summary, new_summary, 1)
          old_calls = '''    counts = {str(row["engine"]): int(row["total"]) for row in rows}\n\n    xray = _summary("xray", "Xray Reality", counts)\n\n    mihomo_settings = get_connection_settings("mihomo")\n'''
          new_calls = '''    counts = {str(row["engine"]): int(row["total"]) for row in rows}\n    settings_map = list_connection_settings(("xray", "mihomo", "amneziawg31"))\n\n    xray = _summary("xray", "Xray Reality", counts, settings_map["xray"])\n\n    mihomo_settings = settings_map["mihomo"]\n'''
          if old_calls not in text:
              raise SystemExit('list connections settings block not found')
          text = text.replace(old_calls, new_calls, 1)
          old_awg = '    awg31 = _summary("amneziawg31", "AmneziaWG 3.1", counts)\n'
          new_awg = '    awg31 = _summary("amneziawg31", "AmneziaWG 3.1", counts, settings_map["amneziawg31"])\n'
          if old_awg not in text:
              raise SystemExit('awg31 summary call missing')
          path.write_text(text.replace(old_awg, new_awg, 1), encoding='utf-8')
          PY
      - name: Prove GREEN
        run: |
          python -m pytest -q tests/test_connections_db_performance_02208.py
          python -m pytest -q tests -k 'connection_settings or connections_ui' --tb=short
      - name: Commit verified product change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/connections/settings.py app/connections/service.py tests/test_connections_db_performance_02208.py
          git rm .github/workflows/zz-connections-db-performance.yml
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          files = [p for p in files if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(files)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git commit -m 'perf: batch connection settings reads'
          git push origin HEAD:feature/02208-performance-clients
