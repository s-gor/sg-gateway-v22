name: One-shot classic dark Connections theme v4

on:
  push:
    branches:
      - fix30-ipv6-dual-stack
    paths:
      - .github/workflows/_connections-dark-classic-once-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix30-ipv6-dual-stack
          fetch-depth: 0

      - name: Apply and verify dark-only Connections styling
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          old_workflow = Path('.github/workflows/_connections-dark-classic-once.yml').read_text(encoding='utf-8')
          start = "css_path.write_text(r'''"
          end = "''', encoding='utf-8')"
          if old_workflow.count(start) != 1 or old_workflow.count(end) < 1:
              raise SystemExit('embedded CSS markers not found')
          css = old_workflow.split(start, 1)[1].split(end, 1)[0]
          css_path = Path('app/web/static/sg-connections-dark-classic-v1.css')
          if css_path.exists():
              raise SystemExit('dark classic stylesheet already exists')
          css_path.write_text(css, encoding='utf-8')

          base_path = Path('app/web/templates/base.html')
          base = base_path.read_text(encoding='utf-8')
          anchor = "  <link rel=\"stylesheet\" href=\"{{ url_for('static', filename='sg-controls-final-v1.css') }}\">\n"
          link = "  {% if active_page|default('') == 'connections' %}<link rel=\"stylesheet\" href=\"{{ url_for('static', filename='sg-connections-dark-classic-v1.css') }}?v={{ app_version }}-connections-dark-classic-v1\">{% endif %}\n"
          if base.count(anchor) != 1:
              raise SystemExit('base stylesheet anchor mismatch')
          if 'sg-connections-dark-classic-v1.css' in base:
              raise SystemExit('dark classic stylesheet link already present')
          base_path.write_text(base.replace(anchor, anchor + link), encoding='utf-8')

          test_path = Path('tests/test_ui_connections_visual_v1.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_connections_dark_classic_theme_is_scoped_and_loaded_last():'
          if marker in tests:
              raise SystemExit('dark classic regression test already exists')
          test_b64 = ''
          extra = base64.b64decode(test_b64).decode('utf-8')
          test_path.write_text(tests.rstrip() + extra + '\n', encoding='utf-8')

          final_css = css_path.read_text(encoding='utf-8')
          final_base = base_path.read_text(encoding='utf-8')
          final_tests = test_path.read_text(encoding='utf-8')
          assert 'html[data-theme="dark"] body.page-connections' in final_css
          assert 'html[data-theme="light"]' not in final_css
          assert '#65a9f3' in final_css and '#31cf91' in final_css
          assert final_base.index('sg-controls-final-v1.css') < final_base.index('sg-connections-dark-classic-v1.css')
          assert marker in final_tests
          PY

      - name: Refresh integrity and commit
        shell: bash
        run: |
          rm -f .github/workflows/_connections-dark-classic-once.yml
          rm -f .github/workflows/_connections-dark-classic-once-v2.yml
          rm -f .github/workflows/_connections-dark-classic-once-v3.yml
          rm -f .github/workflows/_connections-dark-classic-once-v4.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          skip = {'SOURCE-SHA256SUMS'}
          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          excluded_prefix = '.github/workflows/_connections-dark-classic-once'
          paths = [p for p in tracked if p not in skip and not p.startswith(excluded_prefix)]
          new_css = 'app/web/static/sg-connections-dark-classic-v1.css'
          if new_css not in paths:
              paths.append(new_css)
          rows = []
          for path in sorted(paths):
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f'final tracked file missing: {path}')
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {path}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

          test -s app/web/static/sg-connections-dark-classic-v1.css
          grep -q 'sg-connections-dark-classic-v1.css' app/web/templates/base.html
          grep -q 'test_connections_dark_classic_theme_is_scoped_and_loaded_last' tests/test_ui_connections_visual_v1.py
          test ! -e .github/workflows/_connections-dark-classic-once.yml
          test ! -e .github/workflows/_connections-dark-classic-once-v2.yml
          test ! -e .github/workflows/_connections-dark-classic-once-v3.yml
          test ! -e .github/workflows/_connections-dark-classic-once-v4.yml

          git add -A
          git status --short
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "UI: restore classic blue dark Connections style"
          git push origin HEAD:fix30-ipv6-dual-stack
