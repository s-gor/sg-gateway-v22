name: Hide internal server address everywhere

on:
  push:
    branches:
      - feature/02208-compatible-subscription-awg31-from-good-snapshot

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-compatible-subscription-awg31-from-good-snapshot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: RED - no template may render internal server address
        id: red
        continue-on-error: true
        run: python -m pytest -q tests/test_sg_gateway_v22_hide_awg31_internal_ui.py
      - name: Require expected RED
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.red.outcome }}" != "failure" ]; then
            echo "Expected RED did not fail"
            exit 1
          fi
          grep -RIn 'server_identity\.address' app/web/templates || true
      - name: GREEN - remove address rendering from all templates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for p in Path('app/web/templates').rglob('*'):
              if not p.is_file():
                  continue
              s=p.read_text(encoding='utf-8', errors='ignore')
              if 'server_identity.address' not in s:
                  continue
              # Remove common standalone display forms while preserving server name/flag/layout.
              replacements = [
                  ('<small>{{ server_identity.address }}</small>', ''),
                  ('<span>{{ server_identity.address }}</span>', ''),
                  (' · {{ server_identity.address }}', ''),
                  ('{{ server_identity.address }} · ', ''),
                  ('{{ server_identity.address }}', ''),
              ]
              new=s
              for old,repl in replacements:
                  new=new.replace(old,repl)
              if new != s:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          print('changed templates:')
          print('\n'.join(changed))
          PY
      - name: Verify GREEN and focused regressions
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q \
            tests/test_sg_gateway_v22_hide_awg31_internal_ui.py \
            tests/test_sg_gateway_v22_client_protocol_edit_cleanup.py
      - name: Refresh SOURCE-SHA256SUMS
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          transient='.github/workflows/zz-hide-server-address-everywhere.yml'
          tracked=subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines()
          tracked=[p for p in tracked if p not in {'SOURCE-SHA256SUMS', transient}]
          rows=[f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(tracked)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/zz-hide-server-address-everywhere.yml
      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ui: hide internal server address everywhere"
          git push origin HEAD:feature/02208-compatible-subscription-awg31-from-good-snapshot
