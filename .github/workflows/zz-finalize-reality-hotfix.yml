name: Finalize Reality Restore Hotfix

on:
  push:
    branches:
      - fix/02208-reality-restore-runtime

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'chore: finalize Reality restore update candidate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize exact source manifest and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-finalize-reality-hotfix.yml
          tmp="$(mktemp)"
          git ls-files -z | while IFS= read -r -d '' f; do
            [ "$f" = "SOURCE-SHA256SUMS" ] && continue
            digest="$(git show ":$f" | sha256sum | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$f"
          done | LC_ALL=C sort -k2 > "$tmp"
          mv "$tmp" SOURCE-SHA256SUMS
          git add SOURCE-SHA256SUMS
          git commit -m "chore: finalize Reality restore update candidate"
          git push origin HEAD:fix/02208-reality-restore-runtime
