name: One-shot AWG2 stale kernel repair

on:
  push:
    branches: [fix-awg2-stale-kmod-clean-install]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch clean install and full uninstall
        run: |
          python3 - <<'PY'
          from pathlib import Path

          installer = Path('install.sh')
          text = installer.read_text(encoding='utf-8')
          old = '''  echo "AmneziaWG kernel module ${AMNEZIAWG_KMOD_VERSION}: DKMS из локального source"
          local dkms_existing=""
          dkms_existing="$(dkms status -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" 2>/dev/null || true)"
          if [[ -n "$dkms_existing" ]]; then
            dkms remove -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" --all || true
          fi
          # DKMS can leave this directory behind even when `dkms status` is empty.
          # Removing only our pinned module/version makes repeated clean installs idempotent.
          rm -rf "/var/lib/dkms/amneziawg/${AMNEZIAWG_DKMS_VERSION}"
          rm -rf "/usr/src/amneziawg-${AMNEZIAWG_DKMS_VERSION}"
          make -C "$kmod_src/src" dkms-install PREFIX=/usr
          dkms add -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"
          dkms build -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"
          dkms install -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"
          modprobe amneziawg
          modinfo amneziawg
          rm -rf "$temp"
          '''
          new = '''  echo "AmneziaWG kernel module ${AMNEZIAWG_KMOD_VERSION}: DKMS из локального source"

          # A previous AWG3/experimental install can leave a 3.x amneziawg.ko in
          # /lib/modules even after its DKMS bookkeeping was removed.  DKMS then
          # sees the pinned 1.0.0 package as already installed and skips replacing
          # that stale module, while AWG2 userspace later fails with EINVAL.
          # Clean Install owns the SG AWG runtime, so remove the stale loaded/file
          # state before rebuilding the frozen AWG2 module from our vendor source.
          systemctl stop sg-gateway-awg.service sg-gateway-awg3.service >/dev/null 2>&1 || true
          ip link delete awg0 >/dev/null 2>&1 || true
          ip link delete awg3 >/dev/null 2>&1 || true
          modprobe -r amneziawg >/dev/null 2>&1 || true

          local dkms_existing=""
          dkms_existing="$(dkms status -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" 2>/dev/null || true)"
          if [[ -n "$dkms_existing" ]]; then
            dkms remove -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" --all || true
          fi
          rm -rf "/var/lib/dkms/amneziawg/${AMNEZIAWG_DKMS_VERSION}"
          rm -rf "/usr/src/amneziawg-${AMNEZIAWG_DKMS_VERSION}"
          find "/lib/modules/$(uname -r)" -type f \\
            \( -name 'amneziawg.ko' -o -name 'amneziawg.ko.*' \) \\
            -path '*/updates/dkms/*' -delete
          depmod -a

          make -C "$kmod_src/src" dkms-install PREFIX=/usr
          dkms add -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"
          dkms build -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"
          dkms install -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" --force
          depmod -a
          modprobe amneziawg

          local module_version=""
          module_version="$(modinfo -F version amneziawg 2>/dev/null || true)"
          if [[ ! "$module_version" =~ ^1\\. ]]; then
            echo "AmneziaWG 2 kernel mismatch: expected frozen 1.x module, detected ${module_version:-unknown}" >&2
            rm -rf "$temp"
            return 1
          fi
          modinfo amneziawg
          rm -rf "$temp"
          '''
          if old not in text:
              raise SystemExit('installer AWG2 block anchor not found')
          installer.write_text(text.replace(old, new, 1), encoding='utf-8')

          uninstall = Path('deploy/full-uninstall-ubuntu.sh')
          text = uninstall.read_text(encoding='utf-8')
          old = '''  modprobe -r amneziawg >/dev/null 2>&1 || true
          if command -v dkms >/dev/null 2>&1; then
            dkms remove -m amneziawg -v 1.0.0 --all >/dev/null 2>&1 || true
          fi
          rm -rf /var/lib/dkms/amneziawg/1.0.0 /usr/src/amneziawg-1.0.0
          apt-get -o Dpkg::Use-Pty=0 purge -y amneziawg amneziawg-dkms amneziawg-tools >/dev/null 2>&1 || true
          rm -f /usr/bin/awg /usr/bin/awg-quick
          rm -f /usr/share/man/man8/awg.8 /usr/share/man/man8/awg.8.gz /usr/share/man/man8/awg-quick.8 /usr/share/man/man8/awg-quick.8.gz
          rm -f /usr/share/bash-completion/completions/awg /usr/share/bash-completion/completions/awg-quick
          rm -f /etc/apt/sources.list.d/amnezia-ubuntu-ppa-*.sources /etc/apt/sources.list.d/amnezia-ubuntu-ppa-*.list
          depmod -a >/dev/null 2>&1 || true
          '''
          new = '''  modprobe -r amneziawg >/dev/null 2>&1 || true
          if command -v dkms >/dev/null 2>&1; then
            dkms remove -m amneziawg -v 1.0.0 --all >/dev/null 2>&1 || true
          fi
          rm -rf /var/lib/dkms/amneziawg/1.0.0 /usr/src/amneziawg-1.0.0
          apt-get -o Dpkg::Use-Pty=0 purge -y amneziawg amneziawg-dkms amneziawg-tools >/dev/null 2>&1 || true

          # DKMS may have lost its bookkeeping while leaving the compiled module
          # under updates/dkms.  Full uninstall must remove that stale SG module
          # too, otherwise the next Clean Install can accidentally reuse it.
          find /lib/modules -type f \\
            \( -name 'amneziawg.ko' -o -name 'amneziawg.ko.*' \) \\
            -path '*/updates/dkms/*' -delete

          rm -f /usr/bin/awg /usr/bin/awg-quick
          rm -f /usr/share/man/man8/awg.8 /usr/share/man/man8/awg.8.gz /usr/share/man/man8/awg-quick.8 /usr/share/man/man8/awg-quick.8.gz
          rm -f /usr/share/bash-completion/completions/awg /usr/share/bash-completion/completions/awg-quick
          rm -f /etc/apt/sources.list.d/amnezia-ubuntu-ppa-*.sources /etc/apt/sources.list.d/amnezia-ubuntu-ppa-*.list
          depmod -a >/dev/null 2>&1 || true
          '''
          if old not in text:
              raise SystemExit('full uninstall AWG block anchor not found')
          uninstall.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_sg_gateway_021_vendored_five_engines.py')
          body = test.read_text(encoding='utf-8')
          old = '''def test_dkms_reinstall_cleans_only_pinned_stale_state():
              installer = read("install.sh")
              assert 'dkms remove -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" --all' in installer
              assert 'rm -rf "/var/lib/dkms/amneziawg/${AMNEZIAWG_DKMS_VERSION}"' in installer
              assert 'rm -rf "/usr/src/amneziawg-${AMNEZIAWG_DKMS_VERSION}"' in installer
              assert 'dkms add -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"' in installer
              assert 'dkms build -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"' in installer
              assert 'dkms install -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"' in installer
          '''
          new = '''def test_dkms_reinstall_cleans_stale_module_file_and_forces_frozen_awg2():
              installer = read("install.sh")
              assert 'ip link delete awg0' in installer
              assert 'ip link delete awg3' in installer
              assert 'modprobe -r amneziawg' in installer
              assert 'dkms remove -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" --all' in installer
              assert 'rm -rf "/var/lib/dkms/amneziawg/${AMNEZIAWG_DKMS_VERSION}"' in installer
              assert 'rm -rf "/usr/src/amneziawg-${AMNEZIAWG_DKMS_VERSION}"' in installer
              assert 'find "/lib/modules/$(uname -r)" -type f' in installer
              assert "-path '*/updates/dkms/*' -delete" in installer
              assert 'dkms add -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"' in installer
              assert 'dkms build -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"' in installer
              assert 'dkms install -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" --force' in installer
              assert 'modinfo -F version amneziawg' in installer
              assert '[[ ! "$module_version" =~ ^1\\\\. ]]' in installer


          def test_full_uninstall_removes_orphaned_awg_dkms_module_files():
              uninstall = read("deploy/full-uninstall-ubuntu.sh")
              assert 'dkms remove -m amneziawg -v 1.0.0 --all' in uninstall
              assert 'find /lib/modules -type f' in uninstall
              assert "-path '*/updates/dkms/*' -delete" in uninstall
              assert uninstall.index('find /lib/modules -type f') < uninstall.index('depmod -a')
          '''
          if old not in body:
              raise SystemExit('AWG2 regression-test anchor not found')
          test.write_text(body.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate patched sources
        run: |
          bash -n install.sh
          bash -n deploy/full-uninstall-ubuntu.sh
          python3 -m pip install -q 'pytest>=8,<9'
          python3 -m pytest -q tests/test_sg_gateway_021_vendored_five_engines.py

      - name: Remove one-shot workflow and refresh integrity inventory
        run: |
          git rm .github/workflows/fix-awg2-stale-kmod.yml
          git add install.sh deploy/full-uninstall-ubuntu.sh tests/test_sg_gateway_021_vendored_five_engines.py
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}" for name in sorted(tracked)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS

      - name: Commit repair
        run: |
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Fix clean install stale AWG2 kernel module reuse"
          git push origin HEAD:fix-awg2-stale-kmod-clean-install
