name: Refresh AWG-only integrity from clean tree once

on:
  push:
    branches:
      - fix/02206-awg-only-subscription-contract

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout clean feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild integrity from exact clean HEAD
        env:
          BRANCH_NAME: fix/02206-awg-only-subscription-contract
        run: |
          git reset --hard HEAD
          git rm .github/workflows/refresh-awg-only-integrity-clean-once.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          tracked = [path for path in tracked if path != "SOURCE-SHA256SUMS"]
          rows = [
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
              for path in tracked
          ]
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n", encoding="utf-8", newline="\n"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "chore: refresh AWG-only source integrity from clean tree"
          git push origin "HEAD:${BRANCH_NAME}"
