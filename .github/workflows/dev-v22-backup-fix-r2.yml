name: dev-v22 Full Backup fix runner R2

on:
  push:
    branches: [dev-v22]
    paths:
      - .github/workflows/dev-v22-backup-fix-r2.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev-v22
        uses: actions/checkout@v4
        with:
          ref: dev-v22
          fetch-depth: 0

      - name: Guard expected state
        run: |
          test "$(cat VERSION)" = "0.1.0-021.12"
          test "$(git branch --show-current)" = "dev-v22"
          test -f .github/workflows/dev-v22-backup-fix.yml
          test -f .github/workflows/dev-v22-backup-fix-r2.yml
          git diff --exit-code

      - name: Reuse exact Fix 01 patch body from first runner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/dev-v22-backup-fix.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          target = '      - name: Apply Full Backup verifier and unlimited upload fix'
          try:
              start = lines.index(target)
          except ValueError:
              raise SystemExit('Fix 01 apply step not found in first runner')
          run_line = None
          for i in range(start + 1, len(lines)):
              if lines[i] == '        run: |':
                  run_line = i
                  break
              if lines[i].startswith('      - name:'):
                  break
          if run_line is None:
              raise SystemExit('Fix 01 run block not found')
          body = []
          for line in lines[run_line + 1:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  raise SystemExit(f'unexpected indentation in extracted run block: {line!r}')
          script = '\n'.join(body) + '\n'
          if 'stage_uploaded_full_backup_for_verification' not in script:
              raise SystemExit('extracted Fix 01 body is incomplete')
          Path('/tmp/apply-fix01.sh').write_text(script, encoding='utf-8', newline='\n')
          PY
          bash /tmp/apply-fix01.sh

      - name: Update inherited 021.11 upload contract test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_sg_gateway_02111_backup_domain_release.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "client_max_body_size 1024m;" in access\n'
          new = '    assert "client_max_body_size 0;" in access\n'
          if text.count(old) != 1:
              raise SystemExit(f'legacy 1024m assertion count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Remove temporary workflows from validation tree
        run: |
          git rm .github/workflows/dev-v22-backup-fix.yml .github/workflows/dev-v22-backup-fix-r2.yml

      - name: Rebuild permanent source integrity manifest
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(tracked)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
          print(f'SOURCE-SHA256SUMS rebuilt for {len(rows)} permanent tracked files')
          PY

      - name: Reject every old Full Backup upload cap
        run: |
          if grep -RsnE 'MAX_UPLOAD_BYTES|максимум 512 MiB|client_max_body_size 1024m;' app hostd deploy install.sh; then
            echo 'Old Full Backup upload cap remains' >&2
            exit 1
          fi
          grep -n 'client_max_body_size 0;' install.sh deploy/configure-panel-access.sh hostd/sg_hostd/full_backup_runtime.py

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python3 -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'syntax ok: {len(files)} files')"

      - name: Run targeted Full Backup tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/hostd
        run: |
          python3 -m pytest -q tests/test_sg_gateway_v22_full_backup_verify.py tests/test_sg_gateway_v22_full_backup_upload_unlimited.py tests/test_sg_gateway_02111_backup_domain_release.py

      - name: Run full repository tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/hostd
        run: python3 -m pytest -q tests

      - name: Verify working-tree source integrity
        run: |
          python3 - <<'PY'
          import hashlib, re, subprocess
          from pathlib import Path
          rows = Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines()
          expected = {}
          for line_no, raw in enumerate(rows, 1):
              if not raw.strip():
                  continue
              m = re.fullmatch(r'([0-9a-f]{64})  (.+)', raw)
              if m is None:
                  raise SystemExit(f'invalid checksum line {line_no}: {raw!r}')
              digest, path = m.groups()
              if path in expected:
                  raise SystemExit(f'duplicate checksum path: {path}')
              expected[path] = digest
          tracked = set(subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines())
          tracked.discard('SOURCE-SHA256SUMS')
          if set(expected) != tracked:
              raise SystemExit(f'inventory mismatch: missing={sorted(tracked-set(expected))[:20]} extra={sorted(set(expected)-tracked)[:20]}')
          for path in sorted(tracked):
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != expected[path]:
                  raise SystemExit(f'hash mismatch: {path}')
          print(f'working-tree source integrity ok: {len(tracked)} files')
          PY

      - name: Build and verify FULL CLEAN artifact
        run: |
          bash build-run.sh /tmp/SG-Gateway-v22-Fix01-FULL-CLEAN.run
          bash /tmp/SG-Gateway-v22-Fix01-FULL-CLEAN.run --verify-only

      - name: Commit tested permanent Fix 01 without workflow deletion
        run: |
          git restore --staged .github/workflows/dev-v22-backup-fix.yml .github/workflows/dev-v22-backup-fix-r2.yml
          git config user.name "SG-Gateway Fix Runner"
          git config user.email "actions@users.noreply.github.com"
          git add app hostd deploy install.sh tests SOURCE-SHA256SUMS
          git diff --cached --stat
          git commit -m "Fix 01: verify Full Backup and remove upload size limit"
          git push origin HEAD:dev-v22
