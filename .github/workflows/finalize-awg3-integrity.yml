name: Finalize AWG3 source integrity

on:
  push:
    branches:
      - fix/awg3-initialize-on-install
    paths:
      - .github/workflows/finalize-awg3-integrity.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/awg3-initialize-on-install
          fetch-depth: 0
      - name: Allow removal of this one-shot workflow
        run: sleep 20
      - name: Refresh integrity from final branch tree
        run: |
          git fetch origin fix/awg3-initialize-on-install
          git reset --hard origin/fix/awg3-initialize-on-install
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          tracked = [path for path in tracked if path != "SOURCE-SHA256SUMS"]
          rows = [
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
              for path in tracked
          ]
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "chore: refresh AWG3 bootstrap source integrity"
          git push origin HEAD:fix/awg3-initialize-on-install
