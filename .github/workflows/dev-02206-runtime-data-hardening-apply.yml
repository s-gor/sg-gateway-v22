name: DEV 02206 Runtime + DATA Hardening Apply

on:
  push:
    branches: [dev-02206]
    paths:
      - scripts/dev-02206-runtime-data-hardening.py
      - .github/workflows/dev-02206-runtime-data-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dev-02206
        uses: actions/checkout@v4
        with:
          ref: dev-02206
          fetch-depth: 0

      - name: Absorb integrity-guard commit
        run: |
          sleep 20
          git fetch origin dev-02206
          git reset --hard origin/dev-02206

      - name: Apply hardening patch
        run: python3 scripts/dev-02206-runtime-data-hardening.py

      - name: Remove one-shot patch machinery
        run: |
          git rm scripts/dev-02206-runtime-data-hardening.py
          git rm .github/workflows/dev-02206-runtime-data-hardening-apply.yml

      - name: Refresh source integrity
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in tracked]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

      - name: Commit generated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add runtime contracts and portable DATA backups"
          git push origin HEAD:dev-02206
