name: Codex AWG31 Preserve AWG3

on:
  push:
    branches:
      - codex/awg31-update-preserve-awg3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Add regression and prove RED
        run: |
          cat > tests/test_sg_gateway_v22_awg31_preserve_existing_awg3.py <<'PYTEST'
          from __future__ import annotations

          import json
          import sqlite3
          from pathlib import Path

          from app.maintenance.awg31_stage3a import Stage3AInstaller

          ROOT = Path(__file__).resolve().parents[1]


          class RecordingOS:
              def __init__(self) -> None:
                  self.commands: list[tuple[str, ...]] = []

              def run(self, *command: str) -> None:
                  self.commands.append(tuple(command))


          def _seed_database(path: Path) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              with sqlite3.connect(path) as db:
                  db.executescript(
                      """
                      PRAGMA foreign_keys = ON;
                      CREATE TABLE clients (
                          id INTEGER PRIMARY KEY,
                          name TEXT NOT NULL,
                          enabled INTEGER NOT NULL DEFAULT 1,
                          expires_at TEXT,
                          created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
                      );
                      CREATE TABLE devices (
                          id INTEGER PRIMARY KEY,
                          client_id INTEGER NOT NULL REFERENCES clients(id) ON DELETE CASCADE,
                          name TEXT NOT NULL,
                          enabled INTEGER NOT NULL DEFAULT 1,
                          expires_at TEXT,
                          is_primary INTEGER NOT NULL DEFAULT 0,
                          last_seen_at TEXT,
                          created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
                      );
                      CREATE TABLE device_credentials (
                          id INTEGER PRIMARY KEY AUTOINCREMENT,
                          device_id INTEGER NOT NULL REFERENCES devices(id) ON DELETE CASCADE,
                          engine TEXT NOT NULL,
                          status TEXT NOT NULL DEFAULT 'pending',
                          engine_object_id TEXT,
                          config_json TEXT,
                          rotated_at TEXT,
                          created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
                          UNIQUE(device_id, engine)
                      );
                      CREATE TABLE connection_settings (
                          engine TEXT PRIMARY KEY,
                          enabled INTEGER NOT NULL DEFAULT 1,
                          host TEXT NOT NULL DEFAULT '',
                          port INTEGER NOT NULL DEFAULT 0,
                          config_json TEXT NOT NULL DEFAULT '{}',
                          updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP
                      );
                      INSERT INTO clients(id, name) VALUES (1, 'alpha');
                      INSERT INTO devices(id, client_id, name, is_primary)
                      VALUES (11, 1, 'main', 1);
                      """
                  )
                  config = {
                      "endpoint": "awg31.internal:587",
                      "i1": "<b 0x160301>",
                      "i2": "<r 16><t>",
                      "i3": "<rd 12>",
                      "i4": "<rc 24>",
                      "i5": "<b 0x01020304><r 8>",
                      "jc": 2,
                      "jmin": 10,
                      "jmax": 20,
                      "s1": 1,
                      "s2": 2,
                      "s3": 3,
                      "s4": 4,
                      "h1": "1-2",
                      "h2": "3",
                      "h3": "4",
                      "h4": "5",
                  }
                  db.execute(
                      "INSERT INTO connection_settings(engine, host, port, config_json) "
                      "VALUES ('amneziawg31', 'awg31.internal', 587, ?)",
                      (json.dumps(config, sort_keys=True),),
                  )


          def test_stage3a_preserves_an_existing_awg3_runtime_byte_for_byte(tmp_path: Path) -> None:
              root = tmp_path / "root"
              database = root / "var/lib/sg-gateway/sg-gateway.sqlite"
              _seed_database(database)

              marker = root / "opt/sg-gateway/awg3/local-runtime.marker"
              marker.parent.mkdir(parents=True)
              marker.write_bytes(b"installed-awg3-runtime-must-not-change\x00\xff")
              before = marker.read_bytes()

              awg3_unit = root / "etc/systemd/system/sg-gateway-awg3.service"
              awg3_unit.parent.mkdir(parents=True)
              awg3_unit.write_text("existing-awg3-unit\n", encoding="utf-8")

              os_boundary = RecordingOS()
              result = Stage3AInstaller(
                  source_root=ROOT,
                  root=root,
                  os_boundary=os_boundary,
              ).migrate(database=database)

              assert marker.read_bytes() == before
              assert (root / "opt/sg-gateway/awg31/bin/awg").is_file()
              assert result.created_credentials == 1
              assert (
                  "systemctl",
                  "try-restart",
                  "sg-gateway-awg3.service",
              ) not in os_boundary.commands
          PYTEST

          set +e
          python -m pytest -q tests/test_sg_gateway_v22_awg31_preserve_existing_awg3.py > /tmp/red.log 2>&1
          rc=$?
          set -e
          cat /tmp/red.log
          test "$rc" -ne 0
          grep -Eq 'FileNotFoundError|AssertionError|local-runtime.marker' /tmp/red.log

      - name: Preserve existing AWG3 in Stage3A
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/maintenance/awg31_stage3a.py')
          text = path.read_text(encoding='utf-8')

          old = '''        committed = False
          try:
              vendor, deploy = self._copy_install_media(work)
          '''
          new = '''        committed = False
          preserve_awg3_runtime = (
              self.layout.awg3_runtime.exists() or self.layout.awg3_runtime.is_symlink()
          )
          try:
              vendor, deploy = self._copy_install_media(work)
          '''
          if old not in text:
              raise SystemExit('cannot locate Stage3A transaction prelude')
          text = text.replace(old, new, 1)

          old = '''            replacements.append(self._replace(self.layout.awg3_runtime, awg3_runtime, backups))
              replacements.append(self._replace(self.layout.awg31_runtime, awg31_runtime, backups))
          '''
          new = '''            if not preserve_awg3_runtime:
                  replacements.append(
                      self._replace(self.layout.awg3_runtime, awg3_runtime, backups)
                  )
              replacements.append(self._replace(self.layout.awg31_runtime, awg31_runtime, backups))
          '''
          if old not in text:
              raise SystemExit('cannot locate AWG3 runtime replacement')
          text = text.replace(old, new, 1)

          old = '''            if self.layout.awg3_unit.is_file():
                  self.os.run("systemctl", "try-restart", "sg-gateway-awg3.service")
              connection.commit()
          '''
          new = '''            if not preserve_awg3_runtime and self.layout.awg3_unit.is_file():
                  self.os.run("systemctl", "try-restart", "sg-gateway-awg3.service")
              connection.commit()
          '''
          if old not in text:
              raise SystemExit('cannot locate successful AWG3 restart')
          text = text.replace(old, new, 1)

          old = '''            if self.layout.awg3_unit.is_file():
                  with contextlib.suppress(RuntimeError):
                      self.os.run("systemctl", "try-restart", "sg-gateway-awg3.service")
              raise
          '''
          new = '''            if not preserve_awg3_runtime and self.layout.awg3_unit.is_file():
                  with contextlib.suppress(RuntimeError):
                      self.os.run("systemctl", "try-restart", "sg-gateway-awg3.service")
              raise
          '''
          if old not in text:
              raise SystemExit('cannot locate rollback AWG3 restart')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Prove GREEN
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_v22_awg31_preserve_existing_awg3.py \
            tests/test_sg_gateway_v22_awg31_stage3a_install_update.py \
            tests/test_sg_gateway_v22_awg31_update_transaction.py

      - name: Refresh integrity and commit
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p not in {'SOURCE-SHA256SUMS', '.github/workflows/codex-awg31-preserve-awg3.yml'}]
          new_test = 'tests/test_sg_gateway_v22_awg31_preserve_existing_awg3.py'
          if new_test not in tracked:
              tracked.append(new_test)
          tracked = sorted(tracked)
          rows = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in tracked]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

          rm -f .github/workflows/codex-awg31-preserve-awg3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve existing AWG3 during AWG31 update"
          git push origin HEAD:codex/awg31-update-preserve-awg3
