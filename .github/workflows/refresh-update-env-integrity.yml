name: Refresh updater fix integrity

on:
  push:
    branches:
      - fix/update-env-data-not-shell
    paths:
      - .github/workflows/refresh-update-env-integrity.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-env-data-not-shell
          fetch-depth: 0
      - name: Refresh final tracked source integrity
        run: |
          git add deploy/update-from-github.sh tests/test_update_env_data_not_shell.py
          git rm .github/workflows/refresh-update-env-integrity.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          tracked = [path for path in tracked if path != "SOURCE-SHA256SUMS"]
          rows = [
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
              for path in tracked
          ]
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "chore: finalize updater env fix integrity"
          git push origin HEAD:fix/update-env-data-not-shell
