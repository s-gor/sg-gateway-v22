name: Fix and strictly verify Xray 26.9.9

on:
  push:
    branches:
      - feature/02208-xray-26-9-9

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-xray-26-9-9
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: RED - prove Xray 26.9.9 rejects legacy proxySettings
        id: red
        continue-on-error: true
        run: python -m pytest -q tests/test_fix30_routing_ip_family.py::test_bundled_xray_accepts_family_gate_schema

      - name: Require expected RED
        run: test "${{ steps.red.outcome }}" = "failure"

      - name: Apply Xray 26.9.9 compatibility and contract fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          replace_exact(
              'app/routing/runtime.py',
              '        result["proxySettings"] = {"tag": proxy_tag}',
              '        result["streamSettings"] = {"sockopt": {"dialerProxy": proxy_tag}}',
          )
          replace_exact(
              'tests/test_fix30_routing_ip_family.py',
              '    assert warp6["proxySettings"] == {"tag": "warp-core"}',
              '    assert "proxySettings" not in warp6\n    assert warp6["streamSettings"]["sockopt"]["dialerProxy"] == "warp-core"',
          )
          replace_exact(
              'tests/test_fix30_routing_ip_family.py',
              '    assert by_tag["warp4"]["proxySettings"] == {"tag": "warp-core"}\n    assert by_tag["warp6"]["proxySettings"] == {"tag": "warp-core"}',
              '    assert "proxySettings" not in by_tag["warp4"]\n    assert "proxySettings" not in by_tag["warp6"]\n    assert by_tag["warp4"]["streamSettings"]["sockopt"]["dialerProxy"] == "warp-core"\n    assert by_tag["warp6"]["streamSettings"]["sockopt"]["dialerProxy"] == "warp-core"',
          )

          p = Path('tests/test_preview31_xray_updates.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('    assert profiles._version_supported("26.7.28") is True\n    assert profiles._version_supported("26.8.1") is True\n    assert profiles._version_supported("26.7.11") is False\n    assert profiles._version_supported("26.6.27") is False',
               '    assert profiles._version_supported("26.9.9") is True\n    assert profiles._version_supported("26.10.1") is True\n    assert profiles._version_supported("26.9.8") is False\n    assert profiles._version_supported("26.7.28") is False'),
              ('stdout="Xray 26.7.28 test\\n"', 'stdout="Xray 26.9.9 test\\n"'),
              ('== "26.7.28"', '== "26.9.9"'),
              ('lambda channel: {"tag_name": "v26.7.28"}', 'lambda channel: {"tag_name": "v26.9.9"}'),
              ('минимально поддерживаемой v26.7.28', 'минимально поддерживаемой v26.9.9'),
              ('XRAY_REQUIRED_VERSION="v26.7.28"', 'XRAY_REQUIRED_VERSION="v26.9.9"'),
              ('XRAY_MINIMUM_VERSION="v26.7.28"', 'XRAY_MINIMUM_VERSION="v26.9.9"'),
              ('manifest["xray"]["minimum_version"] == "v26.7.28"', 'manifest["xray"]["minimum_version"] == "v26.9.9"'),
              ('manifest["xray"]["required_version"] == "v26.7.28"', 'manifest["xray"]["required_version"] == "v26.9.9"'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'tests/test_preview31_xray_updates.py: missing {old!r}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          replace_exact('install.sh', 'XRAY_REQUIRED_VERSION="v26.7.28"', 'XRAY_REQUIRED_VERSION="v26.9.9"')
          replace_exact('install.sh', 'XRAY_MINIMUM_VERSION="v26.7.28"', 'XRAY_MINIMUM_VERSION="v26.9.9"')
          replace_exact('release-manifest.json', '    "minimum_version": "v26.7.28",', '    "minimum_version": "v26.9.9",')
          replace_exact('release-manifest.json', '    "required_version": "v26.7.28",', '    "required_version": "v26.9.9",')
          replace_exact('app/web/templates/_xray_xmux_settings.html', 'Xray-core 26.7.28 · закреплено', 'Xray-core 26.9.9 · закреплено')

          old_test = Path('tests/test_sg_gateway_02208_xmux_xray26728.py')
          s = old_test.read_text(encoding='utf-8')
          s = s.replace('xray_26728', 'xray_2699').replace('26728', '2699').replace('26.7.28', '26.9.9')
          s = s.replace('8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40', '1eb9175d0f0a8f8149c9230a7fc5ae66ce332ed20a53155ce61fe62e3f58b7df')
          Path('tests/test_sg_gateway_02208_xmux_xray2699.py').write_text(s, encoding='utf-8')
          old_test.unlink()
          PY

      - name: GREEN - focused Xray 26.9.9 regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_fix30_routing_ip_family.py \
            tests/test_preview31_xray_updates.py \
            tests/test_sg_gateway_02208_xmux_xray2699.py \
            tests/test_sg_gateway_v22_xray_2699_contract.py

      - name: Verify exact bundled archive SHA256 and binary version
        shell: bash
        run: |
          set -euo pipefail
          grep '  vendor/cores/Xray-linux-64.zip$' SOURCE-SHA256SUMS | sha256sum -c -
          (cd vendor/cores && grep '  Xray-linux-64.zip$' SHA256SUMS | sha256sum -c -)
          rm -rf /tmp/xray-2699-final && mkdir -p /tmp/xray-2699-final
          unzip -q vendor/cores/Xray-linux-64.zip -d /tmp/xray-2699-final
          test -x /tmp/xray-2699-final/xray
          actual="$(/tmp/xray-2699-final/xray version | head -n1 | awk '{print $2}' | sed 's/^v//')"
          test "$actual" = '26.9.9'

      - name: Snapshot exact tested Xray product files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app/routing/runtime.py
            app/web/templates/_xray_xmux_settings.html
            install.sh
            release-manifest.json
            tests/test_fix30_routing_ip_family.py
            tests/test_preview31_xray_updates.py
            tests/test_sg_gateway_02208_xmux_xray2699.py
          )
          tar -cf /tmp/xray-2699-product-snapshot.tar "${files[@]}"
          sha256sum "${files[@]}" > /tmp/xray-2699-product-snapshot.sha256

      - name: Prepare isolated baseline checkout
        uses: actions/checkout@v4
        with:
          ref: d58c3785832fc3442af3408e7c2f3b2372ad76a9
          fetch-depth: 0
          path: baseline-compare

      - name: Run complete fixed candidate suite and capture outcomes
        shell: bash
        run: |
          set +e
          python -m pytest -q tests 2>&1 | tee /tmp/candidate-final.log
          echo "${PIPESTATUS[0]}" > /tmp/candidate-final.status
          grep -E '^(FAILED|ERROR) ' /tmp/candidate-final.log | sed 's/ - .*//' | sort -u > /tmp/candidate-final.outcomes || true
          exit 0

      - name: Run complete baseline suite in isolated checkout
        working-directory: baseline-compare
        shell: bash
        run: |
          set +e
          python -m pytest -q tests 2>&1 | tee /tmp/baseline-final.log
          echo "${PIPESTATUS[0]}" > /tmp/baseline-final.status
          grep -E '^(FAILED|ERROR) ' /tmp/baseline-final.log | sed 's/ - .*//' | sort -u > /tmp/baseline-final.outcomes || true
          exit 0

      - name: Require zero new failures versus exact baseline
        shell: bash
        run: |
          set -euo pipefail
          comm -13 /tmp/baseline-final.outcomes /tmp/candidate-final.outcomes > /tmp/new-final.outcomes
          cat /tmp/new-final.outcomes
          test ! -s /tmp/new-final.outcomes

      - name: Restore exact tested product snapshot after test side effects
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree --source=HEAD -- .
          tar -xf /tmp/xray-2699-product-snapshot.tar
          rm -f tests/test_sg_gateway_02208_xmux_xray26728.py
          sha256sum -c /tmp/xray-2699-product-snapshot.sha256

      - name: Ensure only intended product files changed
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain
          python - <<'PY'
          import subprocess
          from pathlib import Path

          expected_tracked = {
              'app/routing/runtime.py',
              'app/web/templates/_xray_xmux_settings.html',
              'install.sh',
              'release-manifest.json',
              'tests/test_fix30_routing_ip_family.py',
              'tests/test_preview31_xray_updates.py',
              'tests/test_sg_gateway_02208_xmux_xray26728.py',
          }
          tracked = set(subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines())
          if tracked != expected_tracked:
              raise SystemExit(f'unexpected tracked changes: symmetric_diff={sorted(tracked ^ expected_tracked)} actual={sorted(tracked)}')

          new_test = Path('tests/test_sg_gateway_02208_xmux_xray2699.py')
          if not new_test.is_file():
              raise SystemExit('renamed Xray 26.9.9 contract test is missing')
          listed = subprocess.check_output(['git','ls-files','--others','--exclude-standard','--',str(new_test)], text=True).splitlines()
          if listed != [str(new_test)]:
              raise SystemExit(f'expected renamed Xray test to be the intended untracked product file, got {listed!r}')
          PY

      - name: Refresh SOURCE-SHA256SUMS for final product tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          transient = '.github/workflows/zz-xray-2699-strict-verify.yml'
          tracked = subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p not in {'SOURCE-SHA256SUMS', transient, 'tests/test_sg_gateway_02208_xmux_xray26728.py'} and not p.startswith('baseline-compare/')]
          tracked.append('tests/test_sg_gateway_02208_xmux_xray2699.py')
          rows = []
          for p in sorted(set(tracked)):
              path = Path(p)
              if not path.is_file():
                  raise SystemExit(f'missing file while hashing: {p}')
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {p}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

      - name: Commit clean verified Xray 26.9.9 product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 4189823+github-actions[bot]@users.noreply.github.com
          git add app/routing/runtime.py app/web/templates/_xray_xmux_settings.html install.sh release-manifest.json tests/test_fix30_routing_ip_family.py tests/test_preview31_xray_updates.py tests/test_sg_gateway_02208_xmux_xray2699.py SOURCE-SHA256SUMS
          git rm tests/test_sg_gateway_02208_xmux_xray26728.py
          git rm .github/workflows/zz-xray-2699-strict-verify.yml
          git commit -m "fix: complete Xray 26.9.9 compatibility contract"
          git push origin HEAD:feature/02208-xray-26-9-9