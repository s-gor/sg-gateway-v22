name: Strict Xray 26.9.9 verification

on:
  push:
    branches:
      - feature/02208-xray-26-9-9

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout exact Xray candidate payload
        run: git checkout --detach 3565ec5978be251d1f7fb41d68ef9c595ba050ef

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify exact bundled archive SHA256
        shell: bash
        run: |
          set -euo pipefail
          grep '  vendor/cores/Xray-linux-64.zip$' SOURCE-SHA256SUMS | sha256sum -c -
          cd vendor/cores
          grep '  Xray-linux-64.zip$' SHA256SUMS | sha256sum -c -

      - name: Verify executable reports Xray 26.9.9
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/xray-2699-strict
          mkdir -p /tmp/xray-2699-strict
          unzip -q vendor/cores/Xray-linux-64.zip -d /tmp/xray-2699-strict
          test -x /tmp/xray-2699-strict/xray
          actual="$(/tmp/xray-2699-strict/xray version | head -n1 | awk '{print $2}' | sed 's/^v//')"
          test "$actual" = '26.9.9'

      - name: Run Xray 26.9.9 contract tests without fallback
        run: python -m pytest -q tests/test_sg_gateway_v22_xray_2699_contract.py

      - name: Run complete candidate suite and capture failures
        shell: bash
        run: |
          set +e
          python -m pytest -q tests 2>&1 | tee /tmp/candidate.log
          echo "${PIPESTATUS[0]}" > /tmp/candidate.status
          grep '^FAILED ' /tmp/candidate.log | sed 's/ - .*//' | sort -u > /tmp/candidate.failed || true
          exit 0

      - name: Checkout exact baseline snapshot
        run: git checkout --detach d58c3785832fc3442af3408e7c2f3b2372ad76a9

      - name: Run complete baseline suite in identical environment
        shell: bash
        run: |
          set +e
          python -m pytest -q tests 2>&1 | tee /tmp/baseline.log
          echo "${PIPESTATUS[0]}" > /tmp/baseline.status
          grep '^FAILED ' /tmp/baseline.log | sed 's/ - .*//' | sort -u > /tmp/baseline.failed || true
          exit 0

      - name: Compare candidate failures against baseline
        shell: bash
        run: |
          set -euo pipefail
          comm -13 /tmp/baseline.failed /tmp/candidate.failed > /tmp/new.failures
          comm -23 /tmp/baseline.failed /tmp/candidate.failed > /tmp/resolved.failures
          echo '=== NEW FAILURES IN CANDIDATE ==='
          cat /tmp/new.failures
          echo '=== BASELINE FAILURES RESOLVED IN CANDIDATE ==='
          cat /tmp/resolved.failures
          test ! -s /tmp/new.failures

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-2699-baseline-comparison
          path: |
            /tmp/candidate.log
            /tmp/candidate.status
            /tmp/candidate.failed
            /tmp/baseline.log
            /tmp/baseline.status
            /tmp/baseline.failed
            /tmp/new.failures
            /tmp/resolved.failures
          if-no-files-found: error
