name: DEV 02206 Runtime + DATA Verify Once

on:
  push:
    branches: [dev-02206]
    paths:
      - .github/workflows/dev-02206-runtime-data-verify-once.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dev-02206
        uses: actions/checkout@v4
        with:
          ref: dev-02206
          fetch-depth: 0

      - name: Absorb integrity refresh
        run: |
          sleep 20
          git fetch origin dev-02206
          git reset --hard origin/dev-02206

      - name: Enforce development isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          install = Path('deploy/install-from-github.sh').read_text(encoding='utf-8')
          panel = Path('app/maintenance/panel_updates.py').read_text(encoding='utf-8')
          assert 'dev-02206' in install
          assert 'SG_GATEWAY_ALLOW_DEVELOPMENT' in install
          assert 'dev-02206' in panel
          PY

      - name: Verify source integrity
        run: |
          python3 -B - <<'PY'
          import hashlib, re, subprocess
          from pathlib import Path
          expected = {}
          for raw in Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              match = re.fullmatch(r'([0-9a-f]{64})  (.+)', raw)
              assert match is not None, raw
              digest, path = match.groups()
              assert path not in expected, path
              expected[path] = digest
          tracked = set(subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines())
          tracked.discard('SOURCE-SHA256SUMS')
          assert tracked == set(expected), (sorted(tracked-set(expected)), sorted(set(expected)-tracked))
          for path in sorted(tracked):
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected[path], path
          print(f'Source integrity OK: {len(tracked)} files')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Python syntax including hostd
        run: |
          python -B - <<'PY'
          from pathlib import Path
          files = list(Path('app').rglob('*.py')) + list(Path('hostd').rglob('*.py')) + list(Path('engines').rglob('*.py')) + list(Path('tests').rglob('*.py'))
          for path in files:
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          print(f'syntax ok: {len(files)} files')
          PY

      - name: Runtime and DATA focused tests
        run: python -m pytest -q tests/test_sg_gateway_v22_runtime_contract_data_backup.py

      - name: Full regression suite
        run: python -m pytest tests

      - name: Release manifest baseline
        run: |
          python -B -c "import json,pathlib; m=json.loads(pathlib.Path('release-manifest.json').read_text(encoding='utf-8')); v=pathlib.Path('VERSION').read_text(encoding='utf-8').strip(); assert m['version']==v; assert m['source_integrity']['mode']=='git-blob-sha256'; assert m['safe_update']['preserve_local_assets'] is True; print('manifest baseline ok')"

      - name: Build and verify FULL package
        run: |
          command -v zip
          command -v unzip
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-DEV-02206-RUNTIME-DATA-VERIFY-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only

      - name: Record successful verification and remove one-shot workflow
        run: |
          printf '\n# CI verified: Runtime Contract + portable DATA backup hardening.\n' >> tests/test_sg_gateway_v22_runtime_contract_data_backup.py
          git rm .github/workflows/dev-02206-runtime-data-verify-once.yml
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in tracked) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify runtime contracts and portable DATA backups"
          git push origin HEAD:dev-02206
