name: Release 0.1.0-022.06 Stable

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-02206-stable.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-02206-stable
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAG: v0.1.0-022.06
      TITLE: SG-Gateway 0.1.0-022.06
      RUN_NAME: SG-Gateway-0.1.0-022.06-FULL.run

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4

      - name: Verify stable identity
        run: |
          test "$(cat VERSION)" = "0.1.0-022.06"
          test "$(cat BUILD-ID)" = "MAIN-02206-STABLE"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("release-manifest.json").read_text(encoding="utf-8"))
          assert manifest["version"] == "0.1.0-022.06"
          assert manifest["build"] == "MAIN-02206-STABLE"
          assert manifest["status"] == "STABLE"
          assert manifest["channel"] == "stable-02206"
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run complete test suite
        run: python -m pytest tests

      - name: Verify source integrity
        run: |
          python3 -B - <<'PY'
          import hashlib
          import re
          import subprocess
          from pathlib import Path

          expected = {}
          for line_no, raw in enumerate(Path("SOURCE-SHA256SUMS").read_text(encoding="utf-8").splitlines(), 1):
              if not raw.strip():
                  continue
              match = re.fullmatch(r"([0-9a-f]{64})  (.+)", raw)
              if match is None:
                  raise SystemExit(f"invalid SOURCE-SHA256SUMS line {line_no}: {raw!r}")
              digest, file_path = match.groups()
              if file_path in expected:
                  raise SystemExit(f"duplicate checksum path: {file_path}")
              expected[file_path] = digest

          tracked = set(
              subprocess.check_output(
                  ["git", "ls-files"],
                  text=True,
                  encoding="utf-8",
              ).splitlines()
          )
          tracked.discard("SOURCE-SHA256SUMS")

          if tracked != set(expected):
              raise SystemExit(
                  f"checksum inventory mismatch: missing={sorted(tracked-set(expected))} "
                  f"extra={sorted(set(expected)-tracked)}"
              )

          for file_path in sorted(tracked):
              proc = subprocess.Popen(
                  ["git", "show", f"HEAD:{file_path}"],
                  stdout=subprocess.PIPE,
              )
              assert proc.stdout is not None
              digest = hashlib.sha256()
              while True:
                  chunk = proc.stdout.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
              rc = proc.wait()
              if rc != 0:
                  raise SystemExit(f"git show failed for {file_path}: rc={rc}")
              actual = digest.hexdigest()
              if actual != expected[file_path]:
                  raise SystemExit(f"source hash mismatch: {file_path}")

          print(f"Git-blob source integrity OK: {len(tracked)} files")
          PY

      - name: Build and verify FULL release
        run: |
          mkdir -p dist
          bash build-run.sh "dist/$RUN_NAME"
          bash "dist/$RUN_NAME" --verify-only
          (cd dist && sha256sum -c "${RUN_NAME%.run}-SHA256.txt")

      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file PUBLICATION-02206.md \
              --latest
            gh release upload "$TAG" --clobber \
              "dist/$RUN_NAME" \
              "dist/${RUN_NAME%.run}-TRANSFER.zip" \
              "dist/${RUN_NAME%.run}-SHA256.txt"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file PUBLICATION-02206.md \
              --latest \
              "dist/$RUN_NAME" \
              "dist/${RUN_NAME%.run}-TRANSFER.zip" \
              "dist/${RUN_NAME%.run}-SHA256.txt"
          fi
