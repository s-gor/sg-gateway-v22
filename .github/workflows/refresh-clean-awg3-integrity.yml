name: Refresh clean-install fix integrity

on:
  push:
    branches:
      - test/clean-install-awg3

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/clean-install-awg3
          fetch-depth: 1

      - name: Refresh checksums and remove one-shot workflow
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          workflow = Path('.github/workflows/refresh-clean-awg3-integrity.yml')
          workflow.unlink()
          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [path for path in tracked if path not in {'SOURCE-SHA256SUMS', str(workflow)}]
          rows = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in tracked]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh clean-install AWG3 source integrity"
          git push origin HEAD:test/clean-install-awg3
