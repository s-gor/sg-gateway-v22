name: Mihomo full-width rail fix

on:
  push:
    branches:
      - tmp/02208-unify-connections-inner-rails-v3
    paths:
      - tools/apply_mihomo_full_width_once.py
      - .github/workflows/zz-mihomo-full-width-rail.yml
      - tests/test_sg_gateway_v22_awg31_naiveproxy_compact_ui_02208.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/02208-unify-connections-inner-rails-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply Mihomo rail fix
        run: python tools/apply_mihomo_full_width_once.py
      - name: Remove helper files
        run: git rm tools/apply_mihomo_full_width_once.py .github/workflows/zz-mihomo-full-width-rail.yml
      - name: Refresh source integrity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          rows=[]
          for path in sorted(tracked):
              rows.append(f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
      - name: Focused tests
        run: python -m pytest -q tests/test_sg_gateway_v22_awg31_naiveproxy_compact_ui_02208.py tests/test_health.py
      - name: Commit verified result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/web/static/sg-ui-connections-v22-08.css tests/test_sg_gateway_v22_awg31_naiveproxy_compact_ui_02208.py SOURCE-SHA256SUMS
          git commit -m 'fix: keep Mihomo listeners full width in unified shell'
          git push origin HEAD:tmp/02208-unify-connections-inner-rails-v3
