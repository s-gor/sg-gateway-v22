name: Temporary AWG31 finalizer

on:
  push:
    branches:
      - fix/02208-awg31-ui-installer-cleanup

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/02208-awg31-ui-installer-cleanup
          fetch-depth: 0

      - name: Restore normal CI and remove temporary workflow
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm .github/workflows/tmp-awg31-finalize.yml

      - name: Regenerate final source inventory
        run: |
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          rows = []
          for path in tracked:
              rows.append(f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f'final inventory: {len(rows)} files')
          PY

      - name: Commit final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml SOURCE-SHA256SUMS
          git commit -m "ci: finalize AWG31-only cleanup tree"
          git push origin HEAD:fix/02208-awg31-ui-installer-cleanup
