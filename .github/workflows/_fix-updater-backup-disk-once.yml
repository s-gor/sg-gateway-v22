name: One-shot updater safety backup disk guard

on:
  push:
    branches: [fix30-ipv6-dual-stack]
    paths: [.github/workflows/_fix-updater-backup-disk-once.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix30-ipv6-dual-stack
          fetch-depth: 0
      - name: Patch updater and contract test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          updater_path = Path('deploy/update-from-github.sh')
          test_path = Path('tests/test_sg_gateway_02112_light_update_fix9.py')
          text = updater_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one updater marker, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'BACKUP_ROOT="/root/sg-gateway-update-safety"\nPANEL_SERVICE="sg-gateway.service"',
              'BACKUP_ROOT="/root/sg-gateway-update-safety"\n'
              'BACKUP_KEEP="${SG_GATEWAY_UPDATE_BACKUP_KEEP:-2}"\n'
              'BACKUP_HEADROOM_MB="${SG_GATEWAY_UPDATE_BACKUP_HEADROOM_MB:-256}"\n'
              'PANEL_SERVICE="sg-gateway.service"',
          )

          cleanup_marker = '''cleanup() {
            if [[ -n "$TEMP_DIR" && -d "$TEMP_DIR" ]]; then
              rm -rf "$TEMP_DIR"
            fi
          }
          '''
          helper_block = cleanup_marker + r'''

          # SG_GATEWAY_02205_SAFETY_BACKUP_DISK_GUARD_V1
          validate_backup_policy() {
            [[ "$BACKUP_KEEP" =~ ^[0-9]+$ ]] || fail "SG_GATEWAY_UPDATE_BACKUP_KEEP must be an integer"
            (( BACKUP_KEEP >= 1 )) || fail "SG_GATEWAY_UPDATE_BACKUP_KEEP must be at least 1"
            [[ "$BACKUP_HEADROOM_MB" =~ ^[0-9]+$ ]] || fail "SG_GATEWAY_UPDATE_BACKUP_HEADROOM_MB must be a non-negative integer"
          }

          backup_is_complete() {
            local dir="$1"
            [[ -d "$dir" ]] || return 1
            [[ -f "$dir/state.tar" && -f "$dir/existing-paths.txt" && -f "$dir/service-state.tsv" ]] || return 1
            tar -tf "$dir/state.tar" >/dev/null 2>&1
          }

          cleanup_incomplete_safety_backups() {
            local dir
            [[ -d "$BACKUP_ROOT" ]] || return 0
            while IFS= read -r dir; do
              [[ -n "$dir" ]] || continue
              [[ -n "$BACKUP_DIR" && "$dir" == "$BACKUP_DIR" ]] && continue
              if ! backup_is_complete "$dir"; then
                printf '[SG-Gateway Update] Removing incomplete Safety Backup: %s\n' "$(basename "$dir")"
                rm -rf -- "$dir"
              fi
            done < <(find "$BACKUP_ROOT" -mindepth 1 -maxdepth 1 -type d -name '*-before-update' -print 2>/dev/null | sort)
          }

          prune_safety_backups() {
            local keep="$1" kept=0 dir
            [[ "$keep" =~ ^[0-9]+$ ]] || return 1
            [[ -d "$BACKUP_ROOT" ]] || return 0
            while IFS= read -r dir; do
              [[ -n "$dir" ]] || continue
              backup_is_complete "$dir" || continue
              if (( kept < keep )); then
                ((kept += 1))
                continue
              fi
              printf '[SG-Gateway Update] Pruning old Safety Backup: %s\n' "$(basename "$dir")"
              rm -rf -- "$dir" || return 1
            done < <(find "$BACKUP_ROOT" -mindepth 1 -maxdepth 1 -type d -name '*-before-update' -print 2>/dev/null | sort -r)
          }

          remove_current_incomplete_backup() {
            (( BACKUP_READY == 0 )) || return 0
            [[ -n "$BACKUP_DIR" && -d "$BACKUP_DIR" ]] || return 0
            case "$BACKUP_DIR" in
              "$BACKUP_ROOT"/*-before-update)
                printf '[SG-Gateway Update] Removing failed partial Safety Backup: %s\n' "$(basename "$BACKUP_DIR")" >&2
                rm -rf -- "$BACKUP_DIR"
                ;;
              *)
                printf '[SG-Gateway Update] Refusing unsafe partial-backup cleanup path: %s\n' "$BACKUP_DIR" >&2
                return 1
                ;;
            esac
          }

          ensure_safety_backup_space() {
            local probe_env="$BACKUP_DIR/space-preflight-https.env"
            local probe_paths="$BACKUP_DIR/space-preflight-protected.txt"
            local candidate kept_path covered size_kb available_kb
            local payload_kb=0
            local candidates=()
            local unique=()
            local filtered=()

            https_state > "$probe_env"
            protected_runtime_paths "$probe_env" "$probe_paths"

            candidates+=(
              "$PREFIX"
              "$CONFIG_DIR"
              "$DATA_DIR"
              /etc/letsencrypt
              "$AWG3_CONFIG"
              "$AWG3_UNIT"
              /etc/nginx/nginx.conf
              /etc/nginx/sites-available/sg-gateway
              /etc/nginx/sites-enabled/sg-gateway
              /etc/nginx/stream-conf.d/sg-gateway-443.conf
              /etc/systemd/system/sg-gateway.service
              /etc/systemd/system/sg-hostd.service
            )
            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] && candidates+=("$candidate")
            done < "$probe_paths"

            for candidate in "${candidates[@]}"; do
              [[ "$candidate" == /* ]] || continue
              candidate="${candidate%/}"
              [[ -e "$candidate" || -L "$candidate" ]] || continue
              covered=0
              for kept_path in "${unique[@]}"; do
                if [[ "$candidate" == "$kept_path" || "$candidate" == "$kept_path/"* ]]; then
                  covered=1
                  break
                fi
              done
              (( covered == 1 )) && continue
              filtered=()
              for kept_path in "${unique[@]}"; do
                [[ "$kept_path" == "$candidate/"* ]] && continue
                filtered+=("$kept_path")
              done
              unique=("${filtered[@]}" "$candidate")
            done

            for candidate in "${unique[@]}"; do
              size_kb="$(du -sk --apparent-size -- "$candidate" 2>/dev/null | awk 'NR==1 {print $1}')"
              [[ "$size_kb" =~ ^[0-9]+$ ]] || fail "cannot estimate Safety Backup size for $candidate"
              ((payload_kb += size_kb))
            done

            available_kb="$(df -Pk "$BACKUP_ROOT" | awk 'NR==2 {print $4}')"
            [[ "$available_kb" =~ ^[0-9]+$ ]] || fail "cannot determine free disk space for Safety Backup"

            local headroom_kb=$(( BACKUP_HEADROOM_MB * 1024 ))
            local required_kb=$(( payload_kb + headroom_kb ))
            local payload_mb=$(( (payload_kb + 1023) / 1024 ))
            local available_mb=$(( available_kb / 1024 ))
            local required_mb=$(( (required_kb + 1023) / 1024 ))

            printf '[SG-Gateway Update] Safety Backup disk preflight: payload ~%s MiB; free %s MiB; required with reserve %s MiB.\n' \
              "$payload_mb" "$available_mb" "$required_mb"
            (( available_kb >= required_kb )) || \
              fail "not enough free disk space for Safety Backup: need about ${required_mb} MiB, free ${available_mb} MiB"

            rm -f -- "$probe_env" "$probe_paths"
          }
          '''
          replace_once(cleanup_marker, helper_block)

          replace_once(
              '''create_safety_backup() {
            mkdir -p "$BACKUP_ROOT"
            chmod 0700 "$BACKUP_ROOT"
            BACKUP_DIR="$BACKUP_ROOT/$(date -u +%Y%m%d-%H%M%S)-before-update"
            mkdir -p "$BACKUP_DIR"
            chmod 0700 "$BACKUP_DIR"

            capture_service_states "$BACKUP_DIR/service-state.tsv"
          ''',
              '''create_safety_backup() {
            mkdir -p "$BACKUP_ROOT"
            chmod 0700 "$BACKUP_ROOT"

            cleanup_incomplete_safety_backups
            local pre_keep=1
            if (( BACKUP_KEEP > 1 )); then
              pre_keep=$(( BACKUP_KEEP - 1 ))
            fi
            prune_safety_backups "$pre_keep"

            BACKUP_DIR="$BACKUP_ROOT/$(date -u +%Y%m%d-%H%M%S)-before-update"
            mkdir -p "$BACKUP_DIR"
            chmod 0700 "$BACKUP_DIR"

            # Refuse the update before stopping services when the rollback archive
            # cannot fit on disk. The reserve also covers tar metadata and update work.
            ensure_safety_backup_space

            capture_service_states "$BACKUP_DIR/service-state.tsv"
          ''',
          )

          replace_once(
              '''  local unique=() item
            declare -A seen=()
            for item in "${existing[@]}"; do
              [[ -n "$item" ]] || continue
              [[ -n "${seen[$item]+x}" ]] && continue
              seen[$item]=1
              unique+=("$item")
            done
            existing=("${unique[@]}")
          ''',
              '''  local unique=() filtered=() item kept_path covered
            for item in "${existing[@]}"; do
              item="${item#/}"
              item="${item%/}"
              [[ -n "$item" ]] || continue
              covered=0
              for kept_path in "${unique[@]}"; do
                if [[ "$item" == "$kept_path" || "$item" == "$kept_path/"* ]]; then
                  covered=1
                  break
                fi
              done
              (( covered == 1 )) && continue
              filtered=()
              for kept_path in "${unique[@]}"; do
                [[ "$kept_path" == "$item/"* ]] && continue
                filtered+=("$kept_path")
              done
              unique=("${filtered[@]}" "$item")
            done
            existing=("${unique[@]}")
          ''',
          )

          replace_once(
              '''  if (( UPDATE_FINISHED == 0 )); then
              if (( BACKUP_READY == 1 )); then
                rollback_update || true
              elif (( SERVICES_STOPPED == 1 )); then
                systemctl start "$HOSTD_SERVICE" >/dev/null 2>&1 || true
                systemctl start "$PANEL_SERVICE" >/dev/null 2>&1 || true
              fi
            fi
            cleanup
          ''',
              '''  if (( UPDATE_FINISHED == 0 )); then
              if (( BACKUP_READY == 1 )); then
                rollback_update || true
              elif (( SERVICES_STOPPED == 1 )); then
                systemctl start "$HOSTD_SERVICE" >/dev/null 2>&1 || true
                systemctl start "$PANEL_SERVICE" >/dev/null 2>&1 || true
              fi
            fi
            if (( BACKUP_READY == 0 )); then
              remove_current_incomplete_backup || true
            fi
            cleanup
          ''',
          )

          replace_once(
              '''  [[ -f "$PREFIX/VERSION" && -f "$CONFIG_DIR/runtime.env" && -f "$CONFIG_DIR/sg-gateway.env" ]] || {
              fail "SG-Gateway is not installed. Use the Clean Install command instead."
            }

            local command
            for command in curl tar gzip python3 sha256sum systemctl; do
          ''',
              '''  [[ -f "$PREFIX/VERSION" && -f "$CONFIG_DIR/runtime.env" && -f "$CONFIG_DIR/sg-gateway.env" ]] || {
              fail "SG-Gateway is not installed. Use the Clean Install command instead."
            }

            validate_backup_policy

            local command
            for command in curl tar gzip python3 sha256sum systemctl du df find sort; do
          ''',
          )

          replace_once(
              '''  run_stage 6 "Проверка HTTPS, Clients, Nginx и runtime" verify_final
            bind_panel_update_state

            UPDATE_FINISHED=1
          ''',
              '''  run_stage 6 "Проверка HTTPS, Clients, Nginx и runtime" verify_final
            bind_panel_update_state

            if ! prune_safety_backups "$BACKUP_KEEP"; then
              printf '%s[SG-Gateway Update] WARNING:%s old Safety Backup retention cleanup failed; update itself is already verified.\n' \
                "$YELLOW" "$RESET" >&2
            fi

            UPDATE_FINISHED=1
          ''',
          )

          updater_path.write_text(text, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          test_append = r'''

          def test_safety_backup_disk_guard_retention_and_failed_archive_cleanup() -> None:
              text = _text(UPDATER)
              assert "SG_GATEWAY_02205_SAFETY_BACKUP_DISK_GUARD_V1" in text
              assert 'SG_GATEWAY_UPDATE_BACKUP_KEEP:-2' in text
              assert 'SG_GATEWAY_UPDATE_BACKUP_HEADROOM_MB:-256' in text
              assert "cleanup_incomplete_safety_backups()" in text
              assert "prune_safety_backups()" in text
              assert "ensure_safety_backup_space()" in text
              assert "remove_current_incomplete_backup()" in text
              assert "du -sk --apparent-size" in text
              assert 'df -Pk "$BACKUP_ROOT"' in text
              assert "not enough free disk space for Safety Backup" in text
              assert 'remove_current_incomplete_backup || true' in text
              assert 'prune_safety_backups "$BACKUP_KEEP"' in text
              create = text[text.index("create_safety_backup() {"):text.index("\nrollback_update() {")]
              assert create.index("ensure_safety_backup_space") < create.index('systemctl stop "$PANEL_SERVICE" "$HOSTD_SERVICE"')
              assert '[[ "$item" == "$kept_path" || "$item" == "$kept_path/"* ]]' in create
          '''
          if 'test_safety_backup_disk_guard_retention_and_failed_archive_cleanup' in tests:
              raise SystemExit('backup guard test already exists unexpectedly')
          test_path.write_text(tests.rstrip() + test_append + '\n', encoding='utf-8')
          PY

          bash -n deploy/update-from-github.sh
          python3 -m py_compile tests/test_sg_gateway_02112_light_update_fix9.py

      - name: Refresh source integrity and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/_fix-updater-backup-disk-once.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          excluded = {
              'SOURCE-SHA256SUMS',
              '.github/workflows/_fix-updater-backup-disk-once.yml',
          }
          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          rows = []
          for rel in sorted(p for p in tracked if p not in excluded and Path(p).exists()):
              digest = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              rows.append(f'{digest}  {rel}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f'refreshed {len(rows)} source hashes')
          PY

          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Updater: guard Safety Backup disk usage"
          git push origin HEAD:fix30-ipv6-dual-stack
