name: TDD main NaiveProxy channel
on:
  push:
    branches: [fix/02208-main-naive-repair-channel]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_naiveproxy_update_channel_02207.py
