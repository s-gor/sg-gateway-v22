name: TDD main NaiveProxy channel
on:
  push:
    branches: [fix/02208-main-naive-repair-channel]
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply minimal production fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('deploy/install-naiveproxy.sh')
          text = path.read_text(encoding='utf-8')
          old = '[[ "$UPDATE_BRANCH" == "stable-02208" || "$UPDATE_BRANCH" == release/02208-* || "$UPDATE_BRANCH" == feature/02208-* || "$UPDATE_BRANCH" == fix/02208-* ]]'
          new = '[[ "$UPDATE_BRANCH" == "main" || "$UPDATE_BRANCH" == "stable-02208" || "$UPDATE_BRANCH" == release/02208-* || "$UPDATE_BRANCH" == feature/02208-* || "$UPDATE_BRANCH" == fix/02208-* ]]'
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - run: python -m pip install pytest
      - name: Verify focused regression is GREEN
        run: python -m pytest -q tests/test_naiveproxy_update_channel_02207.py
      - name: Refresh integrity manifest and commit final hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tdd-main-naive-channel.yml
          git add deploy/install-naiveproxy.sh tests/test_naiveproxy_update_channel_02207.py
          tmp="$(mktemp)"
          git ls-files -z | while IFS= read -r -d '' f; do
            [ "$f" = "SOURCE-SHA256SUMS" ] && continue
            digest="$(sha256sum "$f" | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$f"
          done | LC_ALL=C sort -k2 > "$tmp"
          mv "$tmp" SOURCE-SHA256SUMS
          git add SOURCE-SHA256SUMS
          git commit -m 'fix: allow NaiveProxy repair from main channel'
          git push origin HEAD:fix/02208-main-naive-repair-channel
