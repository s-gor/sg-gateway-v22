name: AWG31 compatible subscription snapshot

on:
  push:
    branches:
      - feature/02208-compatible-subscription-awg31-from-good-snapshot

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-compatible-subscription-awg31-from-good-snapshot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Focused subscription tests
        run: python -m pytest -q tests/test_sg_gateway_v22_sg_subscription_base64_body.py tests/test_sg_gateway_v22_sg_subscription_compat_text.py tests/test_sg_gateway_v22_sg_subscription_http.py
      - name: Refresh SOURCE-SHA256SUMS
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p not in {'SOURCE-SHA256SUMS', '.github/workflows/zz-awg31-compatible-subscription-snapshot.yml'}]
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(tracked)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/zz-awg31-compatible-subscription-snapshot.yml
      - name: Commit verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE-SHA256SUMS
          git commit -m "chore: finalize AWG31 compatible subscription snapshot"
          git push origin HEAD:feature/02208-compatible-subscription-awg31-from-good-snapshot
