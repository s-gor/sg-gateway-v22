name: Fix 22.08 release source-integrity verification

on:
  push:
    branches:
      - release/02208-rc
    paths:
      - .github/workflows/zz-fix-02208-release-integrity.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the known failure signature exists
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/release-02208-stable.yml').read_text(encoding='utf-8')
          needle = '            sha256sum "$f"\n'
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'expected one mutable working-tree checksum line, found {count}')
          print('reproduced release integrity defect: working-tree sha256sum is present')
          PY

      - name: Switch release integrity verification to committed git blobs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/release-02208-stable.yml')
          text = path.read_text(encoding='utf-8')
          old = '            sha256sum "$f"\n'
          new = '            digest="$(git show "HEAD:$f" | sha256sum | cut -d\x27 \x27 -f1)"\n            printf \x27%s  %s\\n\x27 "$digest" "$f"\n'
          if text.count(old) != 1:
              raise SystemExit('release integrity checksum line changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Refresh SOURCE-SHA256SUMS for the workflow change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [item.decode("utf-8") for item in raw.split(b"\0") if item]
          rows = []
          for item in paths:
              if item == "SOURCE-SHA256SUMS":
                  continue
              rows.append(f"{hashlib.sha256(Path(item).read_bytes()).hexdigest()}  {item}\n")
          Path("SOURCE-SHA256SUMS").write_text("".join(rows), encoding="utf-8")
          print(f"refreshed SOURCE-SHA256SUMS: {len(rows)} files")
          PY

      - name: Commit release verification fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release-02208-stable.yml SOURCE-SHA256SUMS
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: verify 22.08 release integrity from git blobs"

      - name: Verify committed source snapshot with release algorithm
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          git ls-files -z | while IFS= read -r -d '' f; do
            [ "$f" = "SOURCE-SHA256SUMS" ] && continue
            digest="$(git show "HEAD:$f" | sha256sum | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$f"
          done | LC_ALL=C sort -k2 > "$tmp"
          diff -u SOURCE-SHA256SUMS "$tmp"
          echo "committed git-blob source integrity verified"

      - name: Push fixed main
        shell: bash
        run: git push origin HEAD:main

      - name: Remove transient workflow from RC branch
        shell: bash
        run: |
          git fetch origin release/02208-rc
          git checkout -B release/02208-rc origin/release/02208-rc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-fix-02208-release-integrity.yml
          git commit -m "ci: remove transient 22.08 release-integrity fixer"
          git push origin HEAD:release/02208-rc
