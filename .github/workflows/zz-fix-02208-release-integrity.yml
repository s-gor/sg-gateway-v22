name: Finish 22.08 release source-integrity snapshot

on:
  push:
    branches:
      - release/02208-rc
    paths:
      - .github/workflows/zz-fix-02208-release-integrity.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm release workflow uses committed git blobs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/release-02208-stable.yml').read_text(encoding='utf-8')
          assert 'digest="$(git show "HEAD:$f" | sha256sum' in text
          assert '            sha256sum "$f"\n' not in text
          print('release workflow git-blob verification confirmed')
          PY

      - name: Refresh SOURCE-SHA256SUMS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [item.decode("utf-8") for item in raw.split(b"\0") if item]
          rows = []
          for item in paths:
              if item == "SOURCE-SHA256SUMS":
                  continue
              rows.append(f"{hashlib.sha256(Path(item).read_bytes()).hexdigest()}  {item}\n")
          Path("SOURCE-SHA256SUMS").write_text("".join(rows), encoding="utf-8")
          print(f"refreshed SOURCE-SHA256SUMS: {len(rows)} files")
          PY

      - name: Commit refreshed source snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git diff --cached --check
          git diff --cached --stat
          git commit -m "release: refresh 22.08 source integrity snapshot"

      - name: Verify committed source snapshot with release algorithm
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          git ls-files -z | while IFS= read -r -d '' f; do
            [ "$f" = "SOURCE-SHA256SUMS" ] && continue
            digest="$(git show "HEAD:$f" | sha256sum | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$f"
          done | LC_ALL=C sort -k2 > "$tmp"
          diff -u SOURCE-SHA256SUMS "$tmp"
          echo "committed git-blob source integrity verified"

      - name: Push refreshed main
        shell: bash
        run: git push origin HEAD:main

      - name: Remove transient workflow from RC branch
        shell: bash
        run: |
          git fetch origin release/02208-rc
          git checkout -B release/02208-rc origin/release/02208-rc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-fix-02208-release-integrity.yml
          git commit -m "ci: remove transient 22.08 release-integrity fixer"
          git push origin HEAD:release/02208-rc
