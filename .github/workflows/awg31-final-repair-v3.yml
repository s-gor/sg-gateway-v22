name: AWG31 Final Repair V3

on:
  push:
    branches: [dev-02206]
    paths:
      - .github/workflows/awg31-final-repair-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-02206
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Apply corrected repair script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/awg31-final-repair.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'

          block_start = code.index("target = '''    for name, value in VALID_PARAMETERS.items():")
          block_end_marker = "text = text.replace(target, replacement, 1)\n"
          block_end = code.index(block_end_marker, block_start) + len(block_end_marker)
          code = code[:block_start] + code[block_end:]

          peer_block_start = code.index("old = '''    assert (root / \"etc/amnezia/amneziawg/awg31/peers/device-11.conf\").is_file()")
          peer_block_end_marker = "write(stage3a, text.replace(old, new, 1))\n"
          peer_block_end = code.index(peer_block_end_marker, peer_block_start) + len(peer_block_end_marker)
          code = code[:peer_block_start] + code[peer_block_end:]

          Path('/tmp/awg31-repair.py').write_text(code, encoding='utf-8')
          compile(code, '/tmp/awg31-repair.py', 'exec')
          PY
          python3 /tmp/awg31-repair.py
      - name: Run targeted tests
        run: |
          python -m pytest \
            tests/test_sg_gateway_0217_clients_onboarding.py \
            tests/test_sg_gateway_v22_clients_devices_ux.py \
            tests/test_sg_gateway_v22_awg31_foreground_service.py \
            tests/test_sg_gateway_v22_awg31_header_ranges.py \
            tests/test_sg_gateway_v22_awg31_stage1_core.py \
            tests/test_sg_gateway_v22_awg31_stage2_api_ui.py \
            tests/test_sg_gateway_v22_awg31_stage3a_install_update.py \
            tests/test_sg_gateway_v22_awg31_update_transaction.py
      - name: Run full test suite
        run: python -m pytest tests
      - name: Commit verified code repair
        run: |
          git restore -- data/sg-gateway.sqlite data/system-activity.json
          git clean -fd
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [path for path in tracked if path != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in tracked]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app hostd tests SOURCE-SHA256SUMS
          git commit -m "fix: complete verified AWG 3.1 integration"
          git push origin HEAD:dev-02206

# trigger 3
