name: "022.08 remove legacy main"

on:
  push:
    branches:
      - release/02208-rc

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/02208-rc
          fetch-depth: 0

      - name: Diagnose remaining backup identity duplicates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -c 'from pathlib import Path; p=Path("install.sh"); s=p.read_text(encoding="utf-8"); start=s.index("legacy_main_02208() {"); end=s.index("\nNAIVEPROXY_VERSION=", start); s=s[:start]+s[end+1:]; p.write_text(s, encoding="utf-8", newline="\n")'
          echo "Remaining before-sg-gateway-02208 occurrences after legacy-main removal:"
          grep -n -C 3 'before-sg-gateway-02208' install.sh
          exit 1
