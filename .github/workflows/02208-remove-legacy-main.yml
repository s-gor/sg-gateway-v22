name: "022.08 remove legacy installer code"

on:
  push:
    branches:
      - release/02208-rc

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/02208-rc
          fetch-depth: 0

      - name: Remove dead legacy installer code
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import re
          from pathlib import Path

          p = Path("install.sh")
          s = p.read_text(encoding="utf-8")

          # Remove the dead 10-stage entrypoint. Only the final 24-stage main remains.
          start = s.index("legacy_main_02208() {")
          end = s.index("\nNAIVEPROXY_VERSION=", start)
          s = s[:start] + s[end + 1:]

          # Remove the old pre-NaiveProxy backup implementation. The later
          # canonical create_backup() owns AWG31, NaiveProxy and Clients fingerprint.
          first = s.index("create_backup() {")
          canonical = s.index("create_backup() {", first + 1)
          old_end = s.index("\n\nstage_backup_and_prepare() {", first)
          assert first < old_end < canonical
          old_backup = s[first:old_end]
          assert "sg-gateway-naiveproxy.service" not in old_backup
          assert "sg-gateway-awg31.service" not in old_backup
          s = s[:first] + s[old_end + 2:]

          assert "legacy_main_02208()" not in s
          assert s.count("main() {") == 1, s.count("main() {")
          assert s.count("create_backup() {") == 1, s.count("create_backup() {")
          assert s.count("before-sg-gateway-02208") == 2, s.count("before-sg-gateway-02208")
          assert "TOTAL_STAGES=24" in s

          main = s[s.index("main() {"):]
          numbers = [int(v) for v in re.findall(
              r"\b(?:run_stage|run_interactive_stage)\s+(\d+)\s+", main
          )]
          assert numbers == list(range(1, 25)), numbers
          assert 'run_stage 11 "NaiveProxy runtime" stage_naiveproxy_runtime' in main
          awg31 = 'run_stage 19 "Независимый профиль AWG31" run_awg31_stage3a_migration'
          clients = 'run_stage 20 "Применение Xray и клиентов" stage9_apply_runtime'
          assert main.index(awg31) < main.index(clients)

          backup_start = s.index("create_backup() {")
          backup_end = s.index("\n\nrestore_backup() {", backup_start)
          canonical_backup = s[backup_start:backup_end]
          assert "sg-gateway-naiveproxy.service" in canonical_backup
          assert "sg-gateway-awg31.service" in canonical_backup
          assert "client-identities-before.sha256" in canonical_backup

          p.write_text(s, encoding="utf-8", newline="\n")
          PY

          git rm .github/workflows/02208-remove-legacy-main.yml
          bash -n install.sh

          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = sorted(
              p for p in subprocess.check_output(
                  ["git", "ls-files"], text=True, encoding="utf-8"
              ).splitlines()
              if p != "SOURCE-SHA256SUMS"
          )
          rows = [
              f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}"
              for p in tracked
          ]
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"regenerated SOURCE-SHA256SUMS: {len(rows)} tracked files")
          PY

          git add install.sh SOURCE-SHA256SUMS
          git diff --cached --check
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "refactor: remove dead legacy installer code"
          git push origin HEAD:release/02208-rc
