name: "022.08 remove legacy main"

on:
  push:
    branches:
      - release/02208-rc

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/02208-rc
          fetch-depth: 0

      - name: Remove dead legacy main and refresh source inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -c 'from pathlib import Path; p=Path("install.sh"); s=p.read_text(encoding="utf-8"); start=s.index("legacy_main_02208() {"); end=s.index("\nNAIVEPROXY_VERSION=", start); s=s[:start]+s[end+1:]; assert "legacy_main_02208()" not in s; assert s.count("main() {")==1; assert s.count("before-sg-gateway-02208")==2, s.count("before-sg-gateway-02208"); p.write_text(s, encoding="utf-8", newline="\n")'
          git rm .github/workflows/02208-remove-legacy-main.yml
          bash -n install.sh
          python3 -c 'import hashlib, subprocess; from pathlib import Path; tracked=sorted(p for p in subprocess.check_output(["git","ls-files"], text=True, encoding="utf-8").splitlines() if p != "SOURCE-SHA256SUMS"); Path("SOURCE-SHA256SUMS").write_text("\n".join(f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in tracked)+"\n", encoding="utf-8"); print(f"regenerated SOURCE-SHA256SUMS: {len(tracked)} tracked files")'
          git add install.sh SOURCE-SHA256SUMS
          git diff --cached --check
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "refactor: remove dead legacy installer main"
          git push origin HEAD:release/02208-rc
