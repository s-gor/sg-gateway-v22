name: Temporary Connections shell and tail polish

on:
  push:
    branches:
      - fix/02207-connections-shell-tail-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/02207-connections-shell-tail-polish

      - name: Apply minimal CSS and refresh source integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/web/static/sg-connections-unified-v1.css')
          css = path.read_text(encoding='utf-8')

          old_xray = '''body.page-connections .cnv1-engine-xray .xps2-panel {
            display: grid;
            gap: var(--sgui-section-gap);
          }'''
          new_xray = '''body.page-connections .cnv1-engine-xray .xps2-panel {
            display: grid;
            gap: var(--sgui-section-gap);
            margin-bottom: 0;
          }'''
          if css.count(old_xray) != 1:
              raise SystemExit('unexpected Xray panel contract')
          css = css.replace(old_xray, new_xray)

          old_xmux = '''body.page-connections #xray-xmux.xmux1-wrap {
            margin-top: 0;
            margin-inline: calc(var(--sgui-card-padding) * 2);
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
          }'''
          new_xmux = '''body.page-connections #xray-xmux.xmux1-wrap {
            margin-top: 0;
            margin-inline: calc(var(--sgui-card-padding) * 2);
            padding: 0;
            border: 0;
            background: var(--sg-panel);
            box-shadow: none;
          }'''
          if css.count(old_xmux) != 1:
              raise SystemExit('unexpected XMUX wrapper contract')
          css = css.replace(old_xmux, new_xmux)
          path.write_text(css, encoding='utf-8')
          PY

          git rm .github/workflows/tmp-connections-shell-tail-apply.yml

          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          raw = subprocess.check_output(['git', 'ls-files', '-z'])
          paths = [item.decode('utf-8') for item in raw.split(b'\0') if item]
          lines = []
          for name in paths:
              if name == 'SOURCE-SHA256SUMS':
                  continue
              digest = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              lines.append(f'{digest}  {name}\n')
          Path('SOURCE-SHA256SUMS').write_text(''.join(lines), encoding='utf-8')
          PY

          git add app/web/static/sg-connections-unified-v1.css SOURCE-SHA256SUMS
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style: match XMUX shell and trim Xray tail'
          git push origin HEAD:fix/02207-connections-shell-tail-polish
