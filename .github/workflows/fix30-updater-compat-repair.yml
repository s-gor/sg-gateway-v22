name: Fix30 updater compatibility repair

on:
  push:
    branches: [fix30-ipv6-dual-stack]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep legacy asset contract and AWG3 preservation together
        run: |
          python3 - <<'PY'
          from pathlib import Path

          updater = Path('deploy/update-from-github.sh')
          text = updater.read_text(encoding='utf-8')
          old = '      ".venv"|"assets"|"awg3") continue ;;\n'
          new = '      ".venv"|"awg3") continue ;;\n      "assets") continue ;;\n'
          if old not in text:
              raise SystemExit('updater preservation case anchor not found')
          updater.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_update_runtime_preservation_contract.py')
          body = test.read_text(encoding='utf-8')
          old_test = "    assert '\".venv\"|\"assets\"|\"awg3\"' in deploy\n"
          new_test = "    assert '\".venv\"|\"awg3\"' in deploy\n    assert '\"assets\") continue ;;' in deploy\n"
          if old_test not in body:
              raise SystemExit('new regression test anchor not found')
          test.write_text(body.replace(old_test, new_test, 1), encoding='utf-8')
          PY

      - name: Validate both old and new updater contracts
        run: |
          bash -n deploy/update-from-github.sh
          python3 -m pip install -q 'pytest>=8,<9'
          python3 -m pytest -q \
            tests/test_sg_gateway_02112_final_cumulative_cleanup_r5.py \
            tests/test_fix30_awg3_update_preservation.py \
            tests/test_update_runtime_preservation_contract.py

      - name: Remove one-shot workflow and refresh source integrity
        run: |
          git rm .github/workflows/fix30-updater-compat-repair.yml
          git add deploy/update-from-github.sh tests/test_update_runtime_preservation_contract.py
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}" for name in sorted(tracked)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS

      - name: Commit repair
        run: |
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Fix30: preserve legacy asset updater contract with AWG3"
          git push origin HEAD:fix30-ipv6-dual-stack
