name: One-shot Hysteria UI cleanup v2

on:
  push:
    branches:
      - fix30-ipv6-dual-stack
    paths:
      - .github/workflows/_cleanup-hysteria-ui-once-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix30-ipv6-dual-stack
          fetch-depth: 0

      - name: Remove Hysteria display-only clutter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          template_path = Path('app/web/templates/connections.html')
          template = template_path.read_text(encoding='utf-8')

          path_block = (
              "                  {% if profile.id == 'hysteria2' %}\n"
              "                  <div class=\"xps2-profile-meta\">\n"
              "                    {% if not profile.path %}<span>Path · —</span>{% endif %}\n"
              "                  </div>\n"
              "                  {% endif %}\n"
          )
          if template.count(path_block) != 1:
              raise SystemExit('Hysteria Path marker mismatch')
          template = template.replace(path_block, '')

          version_block = (
              "                    <span class=\"xps2-salamander-version {{ 'ready' if xray_profiles.hysteria2_obfs.version_ready else 'blocked' }}\">\n"
              "                      Salamander ≥ {{ xray_profiles.hysteria2_obfs.salamander_minimum_version }} · Gecko ≥ {{ xray_profiles.hysteria2_obfs.gecko_minimum_version }}\n"
              "                    </span>\n"
          )
          if template.count(version_block) != 1:
              raise SystemExit('Hysteria version badge marker mismatch')
          template = template.replace(version_block, '')

          warning_line = "                  <p class=\"xps2-salamander-warning\">Смена Off / Salamander / Gecko или замена пароля меняет Hysteria2-профили. Ссылки, QR и subscription обновляются после успешного применения Xray.</p>\n"
          if template.count(warning_line) != 1:
              raise SystemExit('Hysteria warning marker mismatch')
          template = template.replace(warning_line, '')

          template_path.write_text(template, encoding='utf-8')

          test_path = Path('tests/test_hysteria2_salamander_v016.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_hysteria2_compact_ui_hides_display_only_metadata():'
          if marker in tests:
              raise SystemExit('Hysteria compact UI regression test already exists')
          extra_test = (
              "\n\n\ndef test_hysteria2_compact_ui_hides_display_only_metadata():\n"
              "    template = (ROOT / \"app/web/templates/connections.html\").read_text(encoding=\"utf-8\")\n"
              "    assert \"Path · —\" not in template\n"
              "    assert \"xps2-salamander-version\" not in template\n"
              "    assert \"xps2-salamander-warning\" not in template\n"
              "    assert \"Смена Off / Salamander / Gecko или замена пароля\" not in template\n"
              "    assert \"Gecko · рекомендуется\" in template\n"
              "    assert \"Сгенерировать новый\" in template\n"
          )
          test_path.write_text(tests.rstrip() + extra_test, encoding='utf-8')
          PY

      - name: Refresh integrity and commit
        shell: bash
        run: |
          rm -f .github/workflows/_cleanup-hysteria-ui-once-v2.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          skip = {'SOURCE-SHA256SUMS', '.github/workflows/_cleanup-hysteria-ui-once-v2.yml'}
          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          rows = []
          for path in tracked:
              if path in skip:
                  continue
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f'tracked file missing: {path}')
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {path}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' '.github/workflows/_cleanup-hysteria-ui-once-v2.yml' 'SOURCE-SHA256SUMS' 'app/web/templates/connections.html' 'tests/test_hysteria2_salamander_v016.py' | sort)"
          test "$changed" = "$expected"

          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "UI: simplify Hysteria 2 controls"
          git push origin HEAD:fix30-ipv6-dual-stack
