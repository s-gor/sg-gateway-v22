name: Temporary Connections v2 source integrity refresh

on:
  push:
    branches:
      - fix/02207-connections-visual-unification-v2

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/02207-connections-visual-unification-v2

      - name: Rebuild source integrity from final tracked tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/tmp-connections-v2-source-integrity.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [item.decode("utf-8") for item in raw.split(b"\0") if item]
          lines = []
          for name in paths:
              if name == "SOURCE-SHA256SUMS":
                  continue
              digest = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}\n")
          Path("SOURCE-SHA256SUMS").write_text("".join(lines), encoding="utf-8")
          PY
          git add SOURCE-SHA256SUMS
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: refresh Connections v2 source integrity"
          git push origin HEAD:fix/02207-connections-visual-unification-v2
