name: Publish SG-Gateway 0.1.0-022.08 final tag

on:
  push:
    branches:
      - release/02208-rc
    paths:
      - .github/workflows/zz-publish-02208-final-tag.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish exact promoted tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.0-022.08-final"
          TARGET="814149114fe2d849193262360649d8d11c3ee14f"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            ACTUAL="$(git rev-list -n 1 "${TAG}")"
            test "${ACTUAL}" = "${TARGET}"
            echo "${TAG} already points to ${TARGET}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${TARGET}" -m "SG-Gateway 0.1.0-022.08 final"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Remove transient workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-publish-02208-final-tag.yml
          git commit -m "ci: remove transient 22.08 tag publisher"
          git push origin HEAD:release/02208-rc
