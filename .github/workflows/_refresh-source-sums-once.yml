name: One-shot source integrity refresh

on:
  push:
    branches:
      - fix30-ipv6-dual-stack

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix30-ipv6-dual-stack
          fetch-depth: 1

      - name: Refresh checksums and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_refresh-source-sums-once.yml
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ["git", "ls-files"],
              text=True,
              encoding="utf-8",
          ).splitlines()

          rows = []
          for path in sorted(paths):
              if path == "SOURCE-SHA256SUMS":
                  continue
              file_path = Path(path)
              if not file_path.is_file():
                  continue
              digest = hashlib.sha256(file_path.read_bytes()).hexdigest()
              rows.append(f"{digest}  {path}")

          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n",
              encoding="utf-8",
          )
          print(f"refreshed {len(rows)} source hashes")
          PY
          git add SOURCE-SHA256SUMS
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Integrity: refresh XMUX compact UI hashes"
          git push origin HEAD:fix30-ipv6-dual-stack
