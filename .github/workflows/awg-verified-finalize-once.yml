name: AWG verified finalizer (one shot)

on:
  push:
    branches:
      - dev-02206
    paths:
      - .github/workflows/awg-verified-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    if: startsWith(github.event.head_commit.message, 'chore: stage verified AWG finalizer')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: dev-02206
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Unpack verified patchers
        run: |
          cat .github/awg-finalizer-payload/part-* | base64 -d > /tmp/awg-finalizer-payload.tar.gz
          tar -xzf /tmp/awg-finalizer-payload.tar.gz

      - name: Apply and verify tested server state
        run: python scripts/_awg_verified_finalizer.py

      - name: Validate generated diff
        run: |
          git diff --check
          git status --short

      - name: Remove one-shot tooling
        run: |
          rm -rf .github/awg-finalizer-payload
          rm -f \
            .github/workflows/awg-verified-finalize-once.yml \
            scripts/_awg_initial_verified_patcher.py \
            scripts/_awg31_v31_verified_patcher.py \
            scripts/_awg_verified_finalizer.py

      - name: Commit verified production state
        run: |
          git config user.name "SG-Gateway Verified Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No final changes produced" >&2; exit 1; }
          git commit -m "fix: finalize verified AWG 3.1 clean-install stack"
          git push origin HEAD:dev-02206
