name: TEMP 22.08 System stage 5 rerun2

on:
  push:
    branches: [tmp/02208-system-stage5-run]
    paths: [.github/workflows/tmp-02208-system-stage5-rerun2.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Prepare exact Stage 4 base
        run: |
          cp tools/tmp_02208_system_stage5.py /tmp/stage5.py
          cp tools/tmp_02208_system_stage5_fix.py /tmp/stage5fix.py
          cp tools/tmp_02208_system_stage5_fix2.py /tmp/stage5fix2.py
          git fetch --no-tags --depth=1 origin 51a6b8037351b8c9ef0fc9630cfb23fc1200287c
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "51a6b8037351b8c9ef0fc9630cfb23fc1200287c"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Confirm RED System contracts
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('stage5','/tmp/stage5.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          mod.write_tests()
          PY
          if python -m pytest -q tests/test_sg_gateway_v22_system_contract_02208.py; then
            echo 'Expected System 22.08 structural contract to fail before migration' >&2
            exit 1
          fi
          if python -m pytest -q tests/test_sg_gateway_v22_system_geometry_02208.py; then
            echo 'Expected System 22.08 geometry to fail before migration' >&2
            exit 1
          fi
      - name: Apply System 22.08 migration
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('stage5','/tmp/stage5.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          mod.migrate()
          fixspec=importlib.util.spec_from_file_location('stage5fix','/tmp/stage5fix.py')
          fixmod=importlib.util.module_from_spec(fixspec); fixspec.loader.exec_module(fixmod)
          fixmod.fix_visual_css()
          fixspec2=importlib.util.spec_from_file_location('stage5fix2','/tmp/stage5fix2.py')
          fixmod2=importlib.util.module_from_spec(fixspec2); fixspec2.loader.exec_module(fixmod2)
          fixmod2.fix_heading_actions_css()
          PY
          git add -A
      - name: Focused GREEN
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_v22_system_contract_02208.py \
            tests/test_sg_gateway_v22_system_geometry_02208.py \
            tests/test_sg_gateway_v22_ui_function_contract_02208.py \
            tests/test_sg_gateway_v22_ui_architecture_02208.py \
            tests/test_sg_gateway_v22_security_geometry_02208.py \
            tests/test_sg_gateway_v22_routing_geometry_02208.py \
            tests/test_sg_gateway_v22_clients_geometry_02208.py \
            tests/test_sg_gateway_v22_connections_geometry_02208.py
      - name: Refresh source integrity
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked=sorted(p for p in subprocess.check_output(['git','ls-files'], text=True).splitlines() if p != 'SOURCE-SHA256SUMS')
          rows=[]
          for path in tracked:
              rows.append(f"{hashlib.sha256(subprocess.check_output(['git','show',f':{path}'])).hexdigest()}  {path}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
      - name: Full pytest
        run: python -m pytest tests -q
      - name: Create clean commit
        run: |
          git config user.name 'Ser.Gor'
          git config user.email '293675787+s-gor@users.noreply.github.com'
          git commit -m 'refactor: migrate System to 22.08 UI rails'
      - name: Verify committed source integrity
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          expected={}
          for line in Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines():
              if line.strip():
                  digest,path=line.split('  ',1); expected[path]=digest
          tracked=sorted(p for p in subprocess.check_output(['git','ls-files'], text=True).splitlines() if p != 'SOURCE-SHA256SUMS')
          assert sorted(expected) == tracked
          for path in tracked:
              assert hashlib.sha256(subprocess.check_output(['git','show',f'HEAD:{path}'])).hexdigest() == expected[path], path
          print(f'Source integrity verified for {len(tracked)} tracked files')
          PY
      - name: FULL package verify
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only
      - name: Publish GREEN candidate
        run: git push --force origin HEAD:refs/heads/feature/02208-system-stage5-green
