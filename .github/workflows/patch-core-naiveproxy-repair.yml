name: Patch core NaiveProxy repair

on:
  push:
    branches: [fix/02208-clients-keys-dormant-restore]
    paths:
      - .github/workflows/patch-core-naiveproxy-repair.yml
      - .github/patch_core_naiveproxy_repair.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02208-clients-keys-dormant-restore
          fetch-depth: 0
      - name: Patch, test, checksum and commit
        run: python3 .github/patch_core_naiveproxy_repair.py
