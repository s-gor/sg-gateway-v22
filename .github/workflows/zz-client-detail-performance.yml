name: Temporary Client Detail Performance Verifier

on:
  push:
    branches: [feature/02208-performance-clients]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-performance-clients
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Write RED contract
        run: |
          cat > tests/test_client_detail_performance_02208.py <<'PY'
          import json
          from types import SimpleNamespace

          from app.clients.repository import Client, ClientDeployment, Device


          def test_access_cards_reuse_supplied_xray_overview(monkeypatch):
              from app.clients import access

              client = Client(1, "client", True, None, "missing", "applied")
              device = Device(2, 1, "main", True, None, True, "now")
              deployment = ClientDeployment(
                  engine="xray",
                  status="applied",
                  engine_object_id=None,
                  config_json=json.dumps({"profiles": ["reality_tcp", "xhttp_reality"]}),
                  device_id=2,
              )
              state = {
                  "profiles": [
                      SimpleNamespace(id="reality_tcp", enabled=True, ready=True, mode="", title="Reality", port=443),
                      SimpleNamespace(id="xhttp_reality", enabled=True, ready=True, mode="stream-one", title="XHTTP", port=8444),
                  ]
              }
              calls = {"ready": 0, "build": 0}

              monkeypatch.setattr(access, "_deployment_map", lambda *_: {"xray": deployment})
              monkeypatch.setattr(access, "xray_profiles_overview", lambda: (_ for _ in ()).throw(AssertionError("overview recalculated")))

              def ready(*args, **kwargs):
                  calls["ready"] += 1
                  assert kwargs.get("xray_state") is state
                  return True

              def build(*args, **kwargs):
                  calls["build"] += 1
                  assert kwargs.get("xray_state") is state
                  return SimpleNamespace(body="vless://test")

              monkeypatch.setattr(access, "protocol_ready", ready)
              monkeypatch.setattr(access, "build_xray_profile_link", build)

              cards = access.build_access_cards(client, device, xray_state=state)

              assert [card.kind for card in cards] == ["xray-reality-tcp", "xray-xhttp-reality"]
              assert calls == {"ready": 2, "build": 2}


          def test_exports_can_reuse_supplied_xray_overview(monkeypatch):
              from app.clients import exports

              state = {"profiles": [SimpleNamespace(id="reality_tcp", enabled=True, ready=True)]}
              monkeypatch.setattr(exports, "xray_profiles_overview", lambda: (_ for _ in ()).throw(AssertionError("overview recalculated")))
              returned_state, profile = exports._xray_profile("reality_tcp", state)
              assert returned_state is state
              assert profile is state["profiles"][0]
          PY
      - name: Prove RED
        run: |
          set +e
          python -m pytest -q tests/test_client_detail_performance_02208.py
          rc=$?
          set -e
          test "$rc" -ne 0
      - name: Implement request state reuse
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/clients/exports.py')
          s = p.read_text(encoding='utf-8')
          old = '''def _xray_profile(profile_id: str):\n    state = xray_profiles_overview()\n    return state, next(\n        (item for item in state["profiles"] if item.id == profile_id),\n        None,\n    )\n'''
          new = '''def _xray_profile(profile_id: str, xray_state: dict | None = None):\n    state = xray_state if xray_state is not None else xray_profiles_overview()\n    return state, next(\n        (item for item in state["profiles"] if item.id == profile_id),\n        None,\n    )\n'''
          if old not in s:
              raise SystemExit('xray profile helper block missing')
          s = s.replace(old, new, 1)
          old_sig = '''def build_xray_profile_link(\n    client: Client,\n    profile_id: str,\n    device: Device | None = None,\n) -> ClientExport:\n'''
          new_sig = '''def build_xray_profile_link(\n    client: Client,\n    profile_id: str,\n    device: Device | None = None,\n    *,\n    xray_state: dict | None = None,\n) -> ClientExport:\n'''
          if old_sig not in s:
              raise SystemExit('build xray signature missing')
          s = s.replace(old_sig, new_sig, 1)
          s = s.replace('    state, profile = _xray_profile(profile_id)\n', '    state, profile = _xray_profile(profile_id, xray_state)\n', 1)
          old_ready_sig = '''def protocol_ready(\n    client: Client,\n    kind: str,\n    device: Device | None = None,\n) -> bool:\n'''
          new_ready_sig = '''def protocol_ready(\n    client: Client,\n    kind: str,\n    device: Device | None = None,\n    *,\n    xray_state: dict | None = None,\n) -> bool:\n'''
          if old_ready_sig not in s:
              raise SystemExit('protocol ready signature missing')
          s = s.replace(old_ready_sig, new_ready_sig, 1)
          needle = '        _, profile = _xray_profile(profile_id)\n'
          if needle not in s:
              raise SystemExit('protocol xray lookup missing')
          s = s.replace(needle, '        _, profile = _xray_profile(profile_id, xray_state)\n', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/clients/access.py')
          s = p.read_text(encoding='utf-8')
          old_sig = '''def build_access_cards(\n    client: Client,\n    device: Device | None = None,\n) -> list[AccessCard]:\n'''
          new_sig = '''def build_access_cards(\n    client: Client,\n    device: Device | None = None,\n    *,\n    xray_state: dict | None = None,\n) -> list[AccessCard]:\n'''
          if old_sig not in s:
              raise SystemExit('access cards signature missing')
          s = s.replace(old_sig, new_sig, 1)
          s = s.replace('            state = xray_profiles_overview()\n', '            state = xray_state if xray_state is not None else xray_profiles_overview()\n', 1)
          s = s.replace('protocol_ready(client, kind, device)\n', 'protocol_ready(client, kind, device, xray_state=state)\n', 1)
          s = s.replace('build_xray_profile_link(client, profile_id, device).body\n', 'build_xray_profile_link(client, profile_id, device, xray_state=state).body\n', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('app/main.py')
          s = p.read_text(encoding='utf-8')
          old = '''        devices = list_devices(client_id)\n        device_views = [\n            {\n                "device": device,\n                "access_cards": build_access_cards(client, device),\n                "protocol_tokens": device_access_tokens(device.id),\n            }\n            for device in devices\n        ]\n'''
          new = '''        devices = list_devices(client_id)\n        xray_state = xray_profiles_overview()\n        device_views = [\n            {\n                "device": device,\n                "access_cards": build_access_cards(client, device, xray_state=xray_state),\n                "protocol_tokens": device_access_tokens(device.id),\n            }\n            for device in devices\n        ]\n'''
          if old not in s:
              raise SystemExit('client detail device block missing')
          s = s.replace(old, new, 1)
          old_render = '            xray_profiles=xray_profiles_overview(),\n            tls=security_tls_overview(),\n'
          if old_render not in s:
              raise SystemExit('client detail xray render block missing')
          # replace only the occurrence after client_detail block
          marker = '    def client_detail(client_id: int):\n'
          before, after = s.split(marker, 1)
          after = after.replace(old_render, '            xray_profiles=xray_state,\n            tls=security_tls_overview(),\n', 1)
          p.write_text(before + marker + after, encoding='utf-8')
          PY
      - name: Prove GREEN
        run: |
          python -m pytest -q tests/test_client_detail_performance_02208.py
          python -m pytest -q tests/test_client_access.py tests/test_client_exports.py tests/test_sg_gateway_v22_xray_2699_contract.py
      - name: Commit verified change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/clients/access.py app/clients/exports.py app/main.py tests/test_client_detail_performance_02208.py
          git rm .github/workflows/zz-client-detail-performance.yml
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          files = [p for p in files if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(files)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git commit -m 'perf: reuse Xray state in client detail'
          git push origin HEAD:feature/02208-performance-clients
