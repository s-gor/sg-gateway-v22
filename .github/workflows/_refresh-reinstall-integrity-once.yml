name: One-shot refresh reinstall integrity

on:
  push:
    branches:
      - test/reinstall-after-full-uninstall
    paths:
      - .github/workflows/_refresh-reinstall-integrity-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/reinstall-after-full-uninstall
          fetch-depth: 0

      - name: Remove temporary workflows and refresh integrity
        run: |
          rm -f \
            .github/workflows/_promote-reinstall-smoke-once.yml \
            .github/workflows/_refresh-reinstall-integrity-once.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          skip = {
              "SOURCE-SHA256SUMS",
              ".github/workflows/_promote-reinstall-smoke-once.yml",
              ".github/workflows/_refresh-reinstall-integrity-once.yml",
          }
          rows = []
          for rel in subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines():
              if rel in skip:
                  continue
              path = Path(rel)
              if not path.is_file():
                  raise SystemExit(f"tracked file missing: {rel}")
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}")
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n", encoding="utf-8", newline="\n"
          )
          PY

          git diff --check
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh reinstall contract integrity"
          git push origin HEAD:test/reinstall-after-full-uninstall
