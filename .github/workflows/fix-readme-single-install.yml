name: Remove duplicate README commands

on:
  push:
    branches: [fix/readme-single-install-command]
    paths:
      - .github/workflows/fix-readme-single-install.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readme-single-install-command
          fetch-depth: 0

      - name: Keep one public command set
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          install_note = """## Установка

Используйте единственную актуальную команду **Clean Install** в разделе [«Быстрые команды»](#быстрые-команды) выше.

"""
          readme, count = re.subn(
              r"## Установка\n\n.*?(?=## Первые шаги\n)",
              install_note,
              readme,
              count=1,
              flags=re.S,
          )
          assert count == 1, f"installation block replacements: {count}"

          maintenance_note = """## Обновление и полное удаление

Актуальные команды **Update** и **Full Uninstall** находятся в разделе [«Быстрые команды»](#быстрые-команды) выше. Не используйте Clean Install для обновления уже установленного сервера.

"""
          readme, count = re.subn(
              r"## Обновление\n\n.*?(?=## Документация\n)",
              maintenance_note,
              readme,
              count=1,
              flags=re.S,
          )
          assert count == 1, f"update/uninstall block replacements: {count}"
          readme_path.write_text(readme, encoding="utf-8")

          test_path = Path("tests/test_sg_gateway_v22_02206_stable_release.py")
          test_text = test_path.read_text(encoding="utf-8")
          needle = '    assert "stable-02206/deploy/uninstall-from-github.sh" in readme\n'
          addition = needle + (
              '    assert readme.count(f"{PINNED_INSTALL_SHA}/deploy/install-from-github.sh") == 1\n'
              '    assert readme.count("stable-02206/deploy/update-from-github.sh") == 1\n'
              '    assert readme.count("stable-02206/deploy/uninstall-from-github.sh") == 1\n'
              '    assert "sg-gateway-v22/main/deploy/install-from-github.sh" not in readme\n'
              '    assert "sg-gateway-v22/main/deploy/update-from-github.sh" not in readme\n'
              '    assert "sg-gateway-v22/main/deploy/full-uninstall-ubuntu.sh" not in readme\n'
          )
          assert test_text.count(needle) == 1
          test_path.write_text(test_text.replace(needle, addition), encoding="utf-8")
          PY

      - name: Remove helper and refresh checksums
        run: |
          git rm .github/workflows/fix-readme-single-install.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines()
          files = [path for path in files if path != "SOURCE-SHA256SUMS"]
          rows = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in sorted(files)]
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tests/test_sg_gateway_v22_02206_stable_release.py SOURCE-SHA256SUMS
          git commit -m "docs: keep one public command set"
          git push origin HEAD:fix/readme-single-install-command
