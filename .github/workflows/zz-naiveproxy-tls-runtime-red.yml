name: "RED NaiveProxy TLS runtime contract"

on:
  push:
    branches:
      - "fix/02208-naiveproxy-tls-runtime-contract"

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_naiveproxy_tls_runtime_contract_02208.py
