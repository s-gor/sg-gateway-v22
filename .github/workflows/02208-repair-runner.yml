name: "022.08 repair runner"

on:
  push:
    branches:
      - release/02208-rc

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/02208-rc
          fetch-depth: 0

      - name: Execute prepared repair block
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/02208-repair-runner.yml
          python3 -c 'from pathlib import Path; p=Path(".github/workflows/02208-final-contract-repair.yml").read_text(encoding="utf-8"); marker="        run: |\n"; start=p.index(marker)+len(marker); end=p.index("\n      - name: Commit repaired final contracts", start); lines=p[start:end].splitlines(); out="\n".join((line[10:] if line.startswith("          ") else line) for line in lines)+"\n"; Path("/tmp/02208-final-repair.sh").write_text(out, encoding="utf-8")'
          bash -n /tmp/02208-final-repair.sh
          bash /tmp/02208-final-repair.sh
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git diff --cached --check
          git commit -m "fix: align final 22.08 contracts"
          git push origin HEAD:release/02208-rc
