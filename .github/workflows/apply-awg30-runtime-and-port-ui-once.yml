name: Apply AWG3.0 runtime and port UI fix once

# Retry after correcting the legacy AWG3 installer test contract.
on:
  push:
    branches: [fix/02206-awg3-runtime-and-system-port-ui]
    paths:
      - .github/workflows/apply-awg30-runtime-and-port-ui-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/02206-awg3-runtime-and-system-port-ui
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify regression tests fail before production change
        run: |
          set +e
          python -m pytest -q tests/test_sg_gateway_v22_awg30_clean_install_and_port_ui.py > /tmp/red.log 2>&1
          rc=$?
          cat /tmp/red.log
          set -e
          test "$rc" -ne 0
          grep -q 'test_clean_installers_pin_independent_awg30_runtime_assets' /tmp/red.log
          grep -q 'test_connections_hide_core_xray_ports_but_keep_fingerprint_selector' /tmp/red.log

      - name: Apply minimal production changes
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ("install.sh", "deploy/install-core.sh"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              replacements = {
                  'AWG3_TOOLS_VERSION="3.1.20260812"': 'AWG3_TOOLS_VERSION="3.0.20260805"',
                  'AWG3_TOOLS_VENDOR_FILE="amneziawg-tools-3.1.20260812.tar.gz"': 'AWG3_TOOLS_VENDOR_FILE="amneziawg-tools-3.0.20260805.tar.gz"',
                  'AWG3_GO_VENDOR_FILE="amneziawg-go-linux-amd64-v3.1.20260814"': 'AWG3_GO_VENDOR_FILE="amneziawg-go-linux-amd64-v3.0.0"',
              }
              for old, new in replacements.items():
                  if text.count(old) != 1:
                      raise SystemExit(f"expected exactly one anchor in {filename}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")

          template_path = Path("app/web/templates/connections.html")
          template = template_path.read_text(encoding="utf-8")
          loop_start = template.index("{% for profile in xray_profiles.profiles %}")
          port_start = template.index(
              '                <label class="xps2-field-port">', loop_start
          )
          port_end_marker = '                </label>'
          port_end = template.index(port_end_marker, port_start) + len(port_end_marker)
          block = template[port_start:port_end]
          guard = "                {% if profile.id not in ['reality_tcp', 'xhttp_reality'] %}\n"
          close = "\n                {% endif %}"
          template = template[:port_start] + guard + block + close + template[port_end:]
          template_path.write_text(template, encoding="utf-8", newline="\n")
          PY

      - name: Verify targeted behavior
        run: |
          bash -n install.sh deploy/install-core.sh
          python -m pytest -q \
            tests/test_sg_gateway_v22_awg30_clean_install_and_port_ui.py \
            tests/test_sg_gateway_v22_awg3_runtime_repair.py \
            tests/test_sg_gateway_v22_awg3_dual_contract.py \
            tests/test_sg_gateway_v22_awg31_preserve_existing_awg3.py \
            tests/test_sg_gateway_v22_awg31_vendor_runtime.py \
            tests/test_sg_gateway_v22_02206_installer_readiness.py \
            tests/test_xray_profile_flow_v23.py \
            tests/test_sg_gateway_v22_xray_fingerprint.py

      - name: Remove one-time workflow and refresh source integrity
        run: |
          git rm .github/workflows/apply-awg30-runtime-and-port-ui-once.yml
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          tracked = [path for path in tracked if path != "SOURCE-SHA256SUMS"]
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(
                  f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
                  for path in tracked
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit completed fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore AWG3.0 clean install and hide system ports"
          git push origin HEAD:fix/02206-awg3-runtime-and-system-port-ui
