name: Hide AWG31 internal UI

on:
  push:
    branches:
      - feature/02208-compatible-subscription-awg31-from-good-snapshot

permissions:
  contents: write

jobs:
  ui-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-compatible-subscription-awg31-from-good-snapshot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: RED - awg31.internal must not be user-visible
        id: red
        continue-on-error: true
        run: python -m pytest -q tests/test_sg_gateway_v22_hide_awg31_internal_ui.py
      - name: Require expected RED
        shell: bash
        run: |
          if [ "${{ steps.red.outcome }}" != "failure" ]; then
            echo "Expected RED did not fail"
            exit 1
          fi
          grep -RIn --exclude='*.pyc' 'awg31\.internal' app/web/templates app/web/static || true
      - name: GREEN - remove only literal user-facing hostname
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for root in (Path('app/web/templates'), Path('app/web/static')):
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file():
                      continue
                  s = p.read_text(encoding='utf-8', errors='ignore')
                  if 'awg31.internal' not in s:
                      continue
                  # UI-only cleanup: remove the literal display token, preserve surrounding server labels.
                  s = s.replace(' · awg31.internal', '')
                  s = s.replace('awg31.internal · ', '')
                  s = s.replace('awg31.internal', '')
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Verify GREEN and focused UI regressions
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q \
            tests/test_sg_gateway_v22_hide_awg31_internal_ui.py \
            tests/test_sg_gateway_v22_client_protocol_edit_cleanup.py
      - name: Refresh SOURCE-SHA256SUMS
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          transient = '.github/workflows/zz-hide-awg31-internal-ui.yml'
          tracked = subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p not in {'SOURCE-SHA256SUMS', transient}]
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(tracked)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/zz-hide-awg31-internal-ui.yml
      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/web/templates app/web/static tests/test_sg_gateway_v22_hide_awg31_internal_ui.py SOURCE-SHA256SUMS
          git add -u .github/workflows/zz-hide-awg31-internal-ui.yml
          git commit -m "ui: hide internal AWG31 hostname"
          git push origin HEAD:feature/02208-compatible-subscription-awg31-from-good-snapshot
