name: Apply Connections density polish

on:
  push:
    branches:
      - verify/02207-connections-density-polish-1af92b8

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/02207-connections-density-polish
          fetch-depth: 0

      - name: Apply approved Connections-only geometry changes
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path

          css_path = Path('app/web/static/sg-connections-unified-v1.css')
          css = css_path.read_text(encoding='utf-8')

          old = '''body.page-connections #xray-xmux .xmux1-wrap {
  margin-top: 0;
}
'''
          new = '''body.page-connections #xray-xmux.xmux1-wrap {
  margin-top: 0;
  padding-inline: var(--sgui-card-padding);
}
'''
          if old not in css:
              raise SystemExit('XMUX wrapper contract not found')
          css = css.replace(old, new, 1)

          awg_anchor = '''/* -------------------------------------------------------------------------- */
/* AmneziaWG                                                                   */
/* -------------------------------------------------------------------------- */

body.page-connections .awgd-grid {
'''
          awg_replacement = '''/* -------------------------------------------------------------------------- */
/* AmneziaWG                                                                   */
/* -------------------------------------------------------------------------- */

body.page-connections .awgd-shell > .cnv1-engine-head {
  border-bottom: 0;
}

body.page-connections .awgd-grid {
'''
          if awg_anchor not in css:
              raise SystemExit('AWG geometry anchor not found')
          css = css.replace(awg_anchor, awg_replacement, 1)

          mihomo_anchor = '''/* -------------------------------------------------------------------------- */
/* Mihomo / sing-box                                                           */
/* -------------------------------------------------------------------------- */

body.page-connections .mhv2-form,
'''
          mihomo_replacement = '''/* -------------------------------------------------------------------------- */
/* Mihomo / sing-box                                                           */
/* -------------------------------------------------------------------------- */

body.page-connections #mihomo {
  row-gap: var(--sgui-grid-gap);
}

body.page-connections #mihomo .mhv2-compact-meta,
body.page-connections #mihomo .mhv2-runtime-note {
  margin: 0;
}

body.page-connections .mhv2-form,
'''
          if mihomo_anchor not in css:
              raise SystemExit('Mihomo geometry anchor not found')
          css = css.replace(mihomo_anchor, mihomo_replacement, 1)

          mobile_anchor = '''@media (max-width: 650px) {
  body.page-connections :is(
'''
          mobile_replacement = '''@media (max-width: 650px) {
  body.page-connections #xray-xmux.xmux1-wrap {
    padding-inline: 0;
  }

  body.page-connections :is(
'''
          if mobile_anchor not in css:
              raise SystemExit('mobile geometry anchor not found')
          css = css.replace(mobile_anchor, mobile_replacement, 1)
          css_path.write_text(css, encoding='utf-8', newline='\n')

          template_path = Path('app/web/templates/connections.html')
          template = template_path.read_text(encoding='utf-8')
          footer = '''  <footer class="cnv1-page-footer">
    <span>AWG2: {{ awg_public_host }}:{{ awg_settings.port }}</span>
    <span>AWG3: {{ awg3_public_host }}:{{ awg3_settings.port }}</span>
    <span>Xray Reality: {{ xray_public_host }}:{{ xray_settings.port }}</span>
    <span>Mihomo: {{ mihomo_public_host }} · {{ mihomo.listener_active }}/{{ mihomo.listener_total }}</span>
  </footer>
'''
          if footer not in template:
              raise SystemExit('stale Connections footer not found')
          template = template.replace(footer, '', 1)
          template_path.write_text(template, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff -- app/web/static/sg-connections-unified-v1.css app/web/templates/connections.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run focused UI contracts
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_v22_connections_density_polish.py \
            tests/test_sg_gateway_v22_connections_unified_ui.py \
            tests/test_ui_connections_visual_v1.py \
            tests/test_connections_layout_v24.py

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree data/sg-gateway.sqlite data/system-activity.json 2>/dev/null || true
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/web/static/sg-connections-unified-v1.css app/web/templates/connections.html
          git commit -m 'style: compact Connections layout geometry'
          git push origin HEAD:fix/02207-connections-density-polish
