name: Finalize 022.08 Release Contract Integrity

on:
  push:
    branches: [main]
    paths:
      - "tests/test_sg_gateway_v22_release_02208.py"
      - ".github/workflows/zz-finalize-02208-release.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate exact source integrity and self-remove
        shell: bash
        run: |
          set -euo pipefail
          self=".github/workflows/zz-finalize-02208-release.yml"
          tmp="$(mktemp)"
          git ls-files -z | while IFS= read -r -d '' f; do
            [ "$f" = "SOURCE-SHA256SUMS" ] && continue
            [ "$f" = "$self" ] && continue
            digest="$(git show "HEAD:$f" | sha256sum | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$f"
          done | LC_ALL=C sort -k2 > "$tmp"
          mv "$tmp" SOURCE-SHA256SUMS
          git rm "$self"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "chore: finalize 022.08 release contract integrity"
          git push origin HEAD:main
