name: Scratch finalize AWG primary marker fix

on:
  push:
    branches:
      - scratch/02206-hide-primary-awg-autogen

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove scratch workflow and regenerate source integrity
        run: |
          git rm .github/workflows/_scratch-hide-primary-autogen.yml
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = sorted(set(subprocess.check_output(["git", "ls-files"], text=True).splitlines()) - {"SOURCE-SHA256SUMS"})
          rows = []
          for path in tracked:
              proc = subprocess.Popen(["git", "show", f"HEAD:{path}"], stdout=subprocess.PIPE)
              assert proc.stdout is not None
              digest = hashlib.sha256()
              while True:
                  chunk = proc.stdout.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
              if proc.wait() != 0:
                  raise SystemExit(f"git show failed: {path}")
              rows.append(f"{digest.hexdigest()}  {path}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"regenerated {len(rows)} source hashes")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify focused subscription contracts
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_v22_sg_subscription_compat_text.py \
            tests/test_sg_gateway_v22_subscription_device_name.py \
            tests/test_sg_gateway_v22_sg_subscription_schema.py \
            tests/test_sg_gateway_v22_sg_subscription_base64_body.py

      - name: Verify complete suite
        run: python -m pytest tests

      - name: Verify regenerated source integrity
        run: |
          python3 -B - <<'PY'
          import hashlib
          import re
          import subprocess
          from pathlib import Path

          expected = {}
          for line_no, raw in enumerate(Path("SOURCE-SHA256SUMS").read_text(encoding="utf-8").splitlines(), 1):
              match = re.fullmatch(r"([0-9a-f]{64})  (.+)", raw)
              if match is None:
                  raise SystemExit(f"invalid line {line_no}: {raw!r}")
              digest, path = match.groups()
              if path in expected:
                  raise SystemExit(f"duplicate path: {path}")
              expected[path] = digest

          tracked = set(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          tracked.discard("SOURCE-SHA256SUMS")
          if tracked != set(expected):
              raise SystemExit(f"inventory mismatch: missing={sorted(tracked-set(expected))} extra={sorted(set(expected)-tracked)}")

          for path in sorted(tracked):
              proc = subprocess.Popen(["git", "show", f"HEAD:{path}"], stdout=subprocess.PIPE)
              assert proc.stdout is not None
              digest = hashlib.sha256()
              while True:
                  chunk = proc.stdout.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
              if proc.wait() != 0:
                  raise SystemExit(f"git show failed: {path}")
              if digest.hexdigest() != expected[path]:
                  raise SystemExit(f"source hash mismatch: {path}")
          print(f"source integrity OK: {len(tracked)} files")
          PY

      - name: Commit exact finalized tree locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "test: finalize AWG primary marker contract"
          test -z "$(git status --porcelain)"

      - name: Build and verify FULL package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only

      - name: Publish finalized candidate
        run: git push origin HEAD:scratch/02206-hide-primary-awg-autogen
