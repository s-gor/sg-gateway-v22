name: Apply AWG shared DNS UI

on:
  push:
    branches: [feature/awg-shared-dns-ui]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/awg-shared-dns-ui
          fetch-depth: 1
      - name: Apply patch
        run: python3 scripts/apply-awg-shared-dns-ui.py
      - name: Verify targeted tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/test_sg_gateway_v22_awg_shared_dns.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/connections/awg31.py app/web/templates/connections.html app/web/templates/_awg31_panel.html app/web/static/sg-awg-dual-v1.css
          git commit -m "fix: share one DNS setting across AWG profiles"
          git push origin HEAD:feature/awg-shared-dns-ui
