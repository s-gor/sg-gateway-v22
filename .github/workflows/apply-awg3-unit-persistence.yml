name: Apply AWG3 updater persistence patch

on:
  push:
    branches:
      - fix/awg3-unit-update-persistence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/awg3-unit-update-persistence
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Patch updater and remove one-shot workflow
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          path = Path("deploy/update-from-github-core.sh")
          text = path.read_text(encoding="utf-8")

          old = '    "$AWG3_CONFIG" "$AWG3_UNIT" "$AWG3_ROOT" \\\n'
          new = '    "$AWG3_CONFIG" "$AWG3_ROOT" \\\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected one protected AWG3 unit entry, found {text.count(old)}")
          text = text.replace(old, new, 1)

          anchor = '  find "$PREFIX/deploy" -maxdepth 1 -type f -name \'*.sh\' -exec chmod 0755 {} + 2>/dev/null || true\n'
          addition = anchor + (
              '\n'
              '  # The AWG3 config and userspace binaries remain preserved, but the systemd\n'
              '  # unit is managed source and must follow the deployed release. The previous\n'
              '  # unit is already inside Safety Backup and rollback restores it atomically.\n'
              '  [[ -f "$PREFIX/deploy/sg-gateway-awg3.service" ]] || \\\n'
              '    fail "deployed AWG3 systemd unit is missing"\n'
              '  install -m 0644 "$PREFIX/deploy/sg-gateway-awg3.service" "$AWG3_UNIT"\n'
              '  systemctl daemon-reload\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one deploy chmod anchor, found {text.count(anchor)}")
          text = text.replace(anchor, addition, 1)

          anchor = '  verify_runtime_states_unchanged "$BACKUP_DIR/service-state.tsv"\n'
          addition = (
              '  cmp -s "$PREFIX/deploy/sg-gateway-awg3.service" "$AWG3_UNIT" || \\\n'
              '    fail "installed AWG3 systemd unit does not match deployed source"\n\n'
              + anchor
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one runtime verification anchor, found {text.count(anchor)}")
          text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/apply-awg3-unit-persistence.yml")
          workflow.unlink()

          tracked = subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines()
          tracked = [item for item in tracked if item not in {"SOURCE-SHA256SUMS", str(workflow)}]
          rows = [f"{hashlib.sha256(Path(item).read_bytes()).hexdigest()}  {item}" for item in tracked]
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

          bash -n deploy/update-from-github-core.sh
          python -m pytest tests/test_fix30_awg3_update_preservation.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: deploy current AWG3 unit during updates"
          git push origin HEAD:fix/awg3-unit-update-persistence
