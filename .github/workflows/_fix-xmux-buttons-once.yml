name: One-shot XMUX visible buttons

on:
  push:
    branches:
      - fix30-ipv6-dual-stack
    paths:
      - .github/workflows/_fix-xmux-buttons-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix30-ipv6-dual-stack
          fetch-depth: 0

      - name: Apply XMUX UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          partial_path = Path('app/web/templates/_xray_xmux_settings.html')
          partial = partial_path.read_text(encoding='utf-8')

          mode_pattern = re.compile(
              r'#xray-xmux \.xmux1-modes \{.*?'
              r'#xray-xmux \.xmux1-mode input:focus-visible \+ span \{.*?\n\}\n',
              re.S,
          )
          mode_css = '''#xray-xmux .xmux1-modes {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
          }

          #xray-xmux .xmux1-mode {
            min-width: 0;
            cursor: pointer;
          }

          #xray-xmux .xmux1-mode > span {
            display: flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border: 1px solid var(--sg-line, rgba(120, 145, 135, .35));
            border-radius: 10px;
            background: color-mix(in srgb, var(--sg-panel, #f5f3ed) 82%, transparent);
            box-shadow: 0 1px 2px rgba(10, 18, 15, .06);
            text-align: center;
            transition: border-color .16s ease, background .16s ease, box-shadow .16s ease, transform .16s ease;
          }

          #xray-xmux .xmux1-mode:hover > span {
            border-color: color-mix(in srgb, var(--sg-green, #4f8f75) 52%, var(--sg-line, rgba(120, 145, 135, .35)));
            background: color-mix(in srgb, var(--sg-green, #4f8f75) 7%, var(--sg-panel, #f5f3ed));
          }

          #xray-xmux .xmux1-mode:active > span {
            transform: translateY(1px);
          }

          #xray-xmux .xmux1-mode strong {
            font-size: 13.5px;
            line-height: 1.2;
          }

          #xray-xmux .xmux1-mode small {
            display: none;
          }

          #xray-xmux .xmux1-mode input:checked + span {
            border-color: color-mix(in srgb, var(--sg-green, #4f8f75) 78%, var(--sg-line, rgba(120, 145, 135, .35)));
            background: color-mix(in srgb, var(--sg-green, #4f8f75) 16%, var(--sg-panel, #f5f3ed));
            box-shadow:
              inset 0 0 0 1px color-mix(in srgb, var(--sg-green, #4f8f75) 28%, transparent),
              0 2px 6px rgba(10, 18, 15, .08);
          }

          #xray-xmux .xmux1-mode input:focus-visible + span {
            outline: 2px solid color-mix(in srgb, var(--sg-green, #4f8f75) 64%, transparent);
            outline-offset: 2px;
          }
          '''
          partial, count = mode_pattern.subn(mode_css, partial, count=1)
          if count != 1:
              raise SystemExit('XMUX mode CSS marker mismatch')

          contract_pattern = re.compile(
              r'#xray-xmux \.xmux1-contract \{.*?'
              r'#xray-xmux \.xmux1-contract small \{\n  display: none;\n\}\n\n',
              re.S,
          )
          partial, count = contract_pattern.subn('', partial, count=1)
          if count != 1:
              raise SystemExit('dead XMUX contract CSS marker mismatch')

          dead_media = '''  #xray-xmux .xmux1-contract > div {
            min-height: 52px;
            padding: 7px 10px;
          }

          '''
          if partial.count(dead_media) != 1:
              raise SystemExit('dead XMUX contract media marker mismatch')
          partial = partial.replace(dead_media, '')

          old_details = '      <details class="xmux1-extra" data-xmux-extra {% if xmux_mode == \'expert\' %}open{% endif %}>\n'
          new_details = '      <details class="xmux1-extra" data-xmux-extra>\n'
          if partial.count(old_details) != 1:
              raise SystemExit('XMUX details-open marker mismatch')
          partial = partial.replace(old_details, new_details)
          partial_path.write_text(partial, encoding='utf-8')

          js_path = Path('app/web/static/sg-xmux-settings-v1.js')
          js = js_path.read_text(encoding='utf-8')
          sync_pattern = re.compile(
              r'      const sync = \(\) => \{.*?      \};\n\n',
              re.S,
          )
          js, count = sync_pattern.subn('      if (details) details.open = false;\n\n', js, count=1)
          if count != 1:
              raise SystemExit('XMUX JS auto-open marker mismatch')
          old_change = '''        input.addEventListener('change', () => {
            sync();
            showModeDetails(input.value);
          });
          '''
          new_change = '''        input.addEventListener('change', () => {
            showModeDetails(input.value);
          });
          '''
          if js.count(old_change) != 1:
              raise SystemExit('XMUX JS change marker mismatch')
          js = js.replace(old_change, new_change)
          if js.count('      sync();\n') != 1:
              raise SystemExit('XMUX JS trailing sync marker mismatch')
          js = js.replace('      sync();\n', '')
          js_path.write_text(js, encoding='utf-8')

          test_path = Path('tests/test_sg_gateway_02204_xmux_sgpanel_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_xmux_modes_render_as_visible_buttons_and_manual_extra_starts_closed() -> None:'
          if marker in tests:
              raise SystemExit('XMUX visible-button regression test already exists')
          tests = tests.rstrip() + '''\n\n\ndef test_xmux_modes_render_as_visible_buttons_and_manual_extra_starts_closed() -> None:
              partial = (ROOT / "app/web/templates/_xray_xmux_settings.html").read_text(encoding="utf-8")
              js = (ROOT / "app/web/static/sg-xmux-settings-v1.js").read_text(encoding="utf-8")

              assert "#xray-xmux .xmux1-mode > span {" in partial
              assert "border: 1px solid var(--sg-line" in partial
              assert "#xray-xmux .xmux1-mode:hover > span {" in partial
              assert "#xray-xmux .xmux1-mode input:checked + span {" in partial
              assert '<details class="xmux1-extra" data-xmux-extra>' in partial
              assert "{% if xmux_mode == 'expert' %}open{% endif %}" not in partial
              assert "details.open = true" not in js
              assert "if (details) details.open = false;" in js
          \n'''
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Refresh integrity and commit
        shell: bash
        run: |
          rm -f .github/workflows/_fix-xmux-buttons-once.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          skip = {'SOURCE-SHA256SUMS', '.github/workflows/_fix-xmux-buttons-once.yml'}
          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          rows = []
          for path in tracked:
              if path in skip:
                  continue
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f'tracked file missing: {path}')
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {path}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' '.github/workflows/_fix-xmux-buttons-once.yml' 'SOURCE-SHA256SUMS' 'app/web/static/sg-xmux-settings-v1.js' 'app/web/templates/_xray_xmux_settings.html' 'tests/test_sg_gateway_02204_xmux_sgpanel_contract.py' | sort)"
          test "$changed" = "$expected"

          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "UI: make XMUX modes visible buttons"
          git push origin HEAD:fix30-ipv6-dual-stack
