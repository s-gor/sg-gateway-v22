name: TEMP 22.08 Clients stage 2

on:
  push:
    branches: [tmp/02208-clients-stage2-run]
    paths: [.github/workflows/tmp-02208-clients-stage2.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Prepare clean base and runner
        run: |
          cp tools/tmp_02208_clients_stage2.py /tmp/stage2.py
          git checkout --detach HEAD^^
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Confirm RED geometry contract
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('stage2','/tmp/stage2.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          mod.write_tests()
          PY
          if python -m pytest -q tests/test_sg_gateway_v22_clients_geometry_02208.py; then
            echo 'Expected Clients geometry contract to fail before migration' >&2
            exit 1
          fi
      - name: Apply Clients 22.08 migration
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('stage2','/tmp/stage2.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          mod.migrate_clients(); mod.migrate_detail(); mod.migrate_dialogs(); mod.migrate_base(); mod.write_css()
          PY
          git add -A
      - name: Focused GREEN
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_v22_clients_contract_02208.py \
            tests/test_sg_gateway_v22_clients_geometry_02208.py \
            tests/test_sg_gateway_v22_ui_function_contract_02208.py \
            tests/test_sg_gateway_v22_ui_architecture_02208.py
      - name: Refresh source integrity
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked=sorted(p for p in subprocess.check_output(['git','ls-files'], text=True).splitlines() if p != 'SOURCE-SHA256SUMS')
          rows=[]
          for path in tracked:
              rows.append(f"{hashlib.sha256(subprocess.check_output(['git','show',f':{path}'])).hexdigest()}  {path}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
      - name: Full pytest
        run: python -m pytest tests -q
      - name: Create clean commit
        run: |
          git config user.name 'Ser.Gor'
          git config user.email '293675787+s-gor@users.noreply.github.com'
          git commit -m 'refactor: migrate Clients to 22.08 UI rails'
      - name: Verify committed source integrity
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          expected={}
          for line in Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines():
              if line.strip():
                  digest,path=line.split('  ',1); expected[path]=digest
          tracked=sorted(p for p in subprocess.check_output(['git','ls-files'], text=True).splitlines() if p != 'SOURCE-SHA256SUMS')
          assert sorted(expected) == tracked
          for path in tracked:
              assert hashlib.sha256(subprocess.check_output(['git','show',f'HEAD:{path}'])).hexdigest() == expected[path], path
          print(f'Source integrity verified for {len(tracked)} tracked files')
          PY
      - name: FULL package verify
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only
      - name: Publish GREEN candidate
        run: git push origin HEAD:refs/heads/feature/02208-clients-stage2-green
