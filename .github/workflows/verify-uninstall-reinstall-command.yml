name: Fix uninstall reinstall command

on:
  push:
    branches: [fix/uninstall-reinstall-command-pinned]
    paths:
      - .github/workflows/verify-uninstall-reinstall-command.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uninstall-reinstall-command-pinned
          fetch-depth: 0

      - name: Replace stale reinstall command
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("deploy/full-uninstall-ubuntu.sh")
          body = path.read_text(encoding="utf-8")
          old = "curl -4 -fsSL https://raw.githubusercontent.com/s-gor/sg-gateway-v22/stable-02206/deploy/install-from-github.sh | sudo env SG_GATEWAY_GITHUB_BRANCH=stable-02206 bash"
          sha = "2e96ea97992509f8ff2fdce8b8d23aa0dc5a1dff"
          new = f"curl -4 -fsSL https://raw.githubusercontent.com/s-gor/sg-gateway-v22/{sha}/deploy/install-from-github.sh | sudo env SG_GATEWAY_GITHUB_BRANCH=stable-02206 SG_GATEWAY_SOURCE_COMMIT={sha} bash"
          assert body.count(old) == 1, f"stale command occurrences: {body.count(old)}"
          path.write_text(body.replace(old, new), encoding="utf-8")
          PY

      - name: Install focused test dependency
        run: python3 -m pip install pytest

      - name: Verify focused contract
        run: python3 -m pytest -q tests/test_sg_gateway_v22_reinstall_after_full_uninstall.py

      - name: Remove helper and refresh checksums
        run: |
          git rm .github/workflows/verify-uninstall-reinstall-command.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines()
          files = [path for path in files if path != "SOURCE-SHA256SUMS"]
          rows = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in sorted(files)]
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/full-uninstall-ubuntu.sh tests/test_sg_gateway_v22_reinstall_after_full_uninstall.py SOURCE-SHA256SUMS
          git commit -m "fix: print pinned reinstall command after uninstall"
          git push origin HEAD:fix/uninstall-reinstall-command-pinned
