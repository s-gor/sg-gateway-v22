name: RED Connections order

on:
  push:
    branches: [release/02208-rc]

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_connections_layout_v24.py::test_connections_keeps_restored_order_with_naiveproxy_before_note
