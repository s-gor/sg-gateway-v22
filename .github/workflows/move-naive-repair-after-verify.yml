name: Move NaiveProxy repair after verification

on:
  push:
    branches: [fix/02208-clients-keys-dormant-restore]
    paths: [.github/workflows/move-naive-repair-after-verify.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02208-clients-keys-dormant-restore
          fetch-depth: 0
      - name: Patch ordering, syntax-check, checksum and commit
        run: python3 .github/patch_move_naive_repair_after_verify.py
