name: Feature AWG3 Runtime Repair Verify

on:
  push:
    branches: [feature-dev02206-awg3-repair-20260819]
    paths:
      - scripts/feature-awg3-runtime-repair.py
      - .github/workflows/feature-awg3-runtime-repair-verify.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-dev02206-awg3-repair-20260819
          fetch-depth: 0

      - name: Apply feature and create clean snapshot
        run: |
          python3 scripts/feature-awg3-runtime-repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/feature-awg3-runtime-repair.py
          git rm .github/workflows/feature-awg3-runtime-repair-verify.yml
          chmod 0755 deploy/repair-awg3-runtime.sh
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked=subprocess.check_output(['git','ls-files'],text=True,encoding='utf-8').splitlines()
          tracked=[p for p in tracked if p!='SOURCE-SHA256SUMS']
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in tracked)+'\n',encoding='utf-8')
          PY
          git add -A
          git commit -m "Add safe AWG3 runtime repair workflow"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -r requirements-dev.txt >/dev/null

      - id: shell
        continue-on-error: true
        run: bash -n deploy/repair-awg3-runtime.sh

      - id: syntax
        continue-on-error: true
        run: |
          python -B - <<'PY'
          from pathlib import Path
          files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('engines').rglob('*.py'))+list(Path('tests').rglob('*.py'))
          for p in files: compile(p.read_text(encoding='utf-8'),str(p),'exec')
          print(f'syntax ok: {len(files)}')
          PY

      - id: focused
        continue-on-error: true
        run: python -m pytest -q tests/test_sg_gateway_v22_awg3_runtime_repair.py tests/test_sg_gateway_v22_runtime_contract_data_backup.py

      - id: full
        continue-on-error: true
        run: python -m pytest tests

      - id: package
        continue-on-error: true
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-DEV-02206-AWG3-REPAIR-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only

      - name: Persist feature report and push snapshot
        if: always()
        env:
          SHELL: ${{ steps.shell.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          FULL: ${{ steps.full.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
        run: |
          printf 'AWG3 runtime repair feature verify\nshell=%s\nsyntax=%s\nfocused_tests=%s\nfull_tests=%s\nfull_package=%s\n' "$SHELL" "$SYNTAX" "$FOCUSED" "$FULL" "$PACKAGE" > FEATURE-AWG3-REPAIR-VERIFY.txt
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked=subprocess.check_output(['git','ls-files'],text=True,encoding='utf-8').splitlines()
          tracked=[p for p in tracked if p!='SOURCE-SHA256SUMS']
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in tracked)+'\n',encoding='utf-8')
          PY
          git add -A
          git commit -m "Record AWG3 runtime repair feature verification"
          git push origin HEAD:feature-dev02206-awg3-repair-20260819
          test "$SHELL" = success
          test "$SYNTAX" = success
          test "$FOCUSED" = success
          test "$FULL" = success
          test "$PACKAGE" = success
