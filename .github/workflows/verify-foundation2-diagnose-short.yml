name: Diagnose Foundation 2 Short

on:
  push:
    branches: [verify-dev02206-foundation2-20260819]
    paths:
      - .github/workflows/verify-foundation2-diagnose-short.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-dev02206-foundation2-20260819
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -r requirements-dev.txt >/dev/null
      - name: Capture concise first failure
        shell: bash
        run: |
          set +e
          python -m pytest tests -x -q --tb=line > /tmp/short.log 2>&1
          RC=$?
          set -e
          { echo "exit_code=$RC"; cat /tmp/short.log; } > VERIFY-FOUNDATION2-FAILURE-SHORT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERIFY-FOUNDATION2-FAILURE-SHORT.txt
          git commit -m "Record concise foundation failure"
          git push origin HEAD:verify-dev02206-foundation2-20260819
          exit "$RC"
