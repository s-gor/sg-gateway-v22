name: "RED build-run self verify"

on:
  push:
    branches:
      - "fix/02208-build-run-self-verify"

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_build_run_self_verify_02208.py
