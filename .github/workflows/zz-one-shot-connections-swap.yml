name: One-shot Connections tail swap

on:
  push:
    branches: [release/02208-rc]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Move NaiveProxy before note
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/web/templates/connections.html')
          text = path.read_text(encoding='utf-8')
          include = '  {% include "_naiveproxy_panel.html" %}\n\n'
          note = '  <section class="cnv1-note-panel sg-ljd-card sg-ui-card">\n'
          assert text.count(include) == 1
          assert text.count(note) == 1
          text = text.replace(include, '', 1)
          text = text.replace(note, include + note, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused Connections contract
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_connections_layout_v24.py
      - name: Refresh source manifest and clean temporary workflows
        run: |
          git rm .github/workflows/zz-red-connections-order.yml
          git rm .github/workflows/zz-one-shot-connections-swap.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          root = Path('.')
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          paths = [p for p in paths if p != 'SOURCE-SHA256SUMS']
          lines = []
          for path in paths:
              data = (root / path).read_bytes()
              lines.append(f"{hashlib.sha256(data).hexdigest()}  {path}")
          (root / 'SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git add app/web/templates/connections.html tests/test_connections_layout_v24.py SOURCE-SHA256SUMS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: place NaiveProxy before Connections note'
          git push
