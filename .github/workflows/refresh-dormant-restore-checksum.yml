name: Refresh dormant restore checksum

on:
  push:
    branches:
      - fix/02208-clients-keys-dormant-restore
    paths:
      - .github/workflows/refresh-dormant-restore-checksum.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02208-clients-keys-dormant-restore
          fetch-depth: 0
      - name: Refresh tracked source checksums and remove helper
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/refresh-dormant-restore-checksum.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          rows = []
          for name in sorted(paths):
              if name == "SOURCE-SHA256SUMS":
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          git add SOURCE-SHA256SUMS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: refresh source integrity for NaiveProxy TLS restore"
          git push origin HEAD:fix/02208-clients-keys-dormant-restore
