name: "Verify NaiveProxy 22.08 clean reinstall v2"

on:
  push:
    branches:
      - "feature/02208-naiveproxy-clean-reinstall-v2"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install -q pytest
      - name: Verify unchanged 24-stage installer and NaiveProxy cleanup
        run: |
          bash -n deploy/full-uninstall-ubuntu.sh
          python -m pytest -q \
            tests/test_naiveproxy_full_uninstall_02207.py \
            tests/test_installer_02208_master_24_stages.py
      - name: Refresh source integrity and remove temporary workflow
        run: |
          git rm .github/workflows/zz-naiveproxy-02208-clean-reinstall-v2.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          root = Path('.')
          paths = [p for p in subprocess.check_output(['git','ls-files'], text=True).splitlines() if p != 'SOURCE-SHA256SUMS']
          Path('SOURCE-SHA256SUMS').write_text(''.join(f"{hashlib.sha256((root/p).read_bytes()).hexdigest()}  {p}\n" for p in paths), encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh NaiveProxy clean-uninstall integrity"
          git push
