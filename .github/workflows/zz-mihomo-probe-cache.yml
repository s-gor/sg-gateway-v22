name: Temporary Mihomo Probe Cache Verifier

on:
  push:
    branches: [feature/02208-performance-clients]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-performance-clients
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Write RED contracts
        run: |
          cat > tests/test_mihomo_probe_cache_02208.py <<'PY'
          from types import SimpleNamespace


          def test_mihomo_systemctl_and_version_probes_are_short_cached(monkeypatch, tmp_path):
              from app.mihomo import service

              calls = []
              binary = tmp_path / "mihomo"
              binary.write_text("x", encoding="utf-8")
              monkeypatch.setattr(service, "MIHOMO_BINARY", binary)

              def fake_run(args, **kwargs):
                  calls.append(tuple(str(x) for x in args))
                  if args[-1] == "-v":
                      return SimpleNamespace(returncode=0, stdout="Mihomo Meta v1.19.29\n", stderr="")
                  return SimpleNamespace(returncode=0, stdout="", stderr="")

              monkeypatch.setattr(service.subprocess, "run", fake_run)
              assert service._service_active() is True
              assert service._service_active() is True
              assert service._service_enabled() is True
              assert service._service_enabled() is True
              assert service._version() == "Mihomo Meta v1.19.29"
              assert service._version() == "Mihomo Meta v1.19.29"
              assert len(calls) == 3


          def test_mihomo_hostd_status_is_short_cached(monkeypatch):
              from app.mihomo import service

              calls = 0

              def fake_hostd(*args, **kwargs):
                  nonlocal calls
                  calls += 1
                  return SimpleNamespace(status="ok", payload={
                      "runtime_source": "hostd",
                      "protocols": {
                          "mieru": {"active": True, "port": 2099, "transport": "TCP"},
                          "anytls": {"active": False, "port": 8443},
                          "tuic": {"active": False, "port": 10443},
                      },
                  })

              monkeypatch.setattr(service, "run_hostd_command", fake_hostd)
              settings = {
                  "mieru_enabled": True, "mieru_port": 2099, "mieru_transport": "TCP",
                  "anytls_enabled": False, "anytls_port": 8443,
                  "tuic_enabled": False, "tuic_port": 10443,
              }
              first = service._hostd_live_snapshot(settings)
              second = service._hostd_live_snapshot(settings)
              assert first is not None and second is not None
              assert first[1] == {"mieru"}
              assert second[1] == {"mieru"}
              assert calls == 1
          PY
      - name: Prove RED
        run: |
          set +e
          python -m pytest -q tests/test_mihomo_probe_cache_02208.py
          rc=$?
          set -e
          test "$rc" -ne 0
      - name: Implement bounded caches
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/mihomo/service.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import subprocess\n', 'import subprocess\nimport time\n', 1)
          marker = 'class MihomoError(RuntimeError):\n    pass\n\n\n'
          cache = '''_MIHOMO_SERVICE_TTL_SECONDS = 2.0\n_MIHOMO_VERSION_TTL_SECONDS = 10.0\n_MIHOMO_HOSTD_TTL_SECONDS = 2.0\n_MIHOMO_PROBE_CACHE: dict[tuple[str, str], tuple[float, object]] = {}\n\n\ndef _probe_get(kind: str, key: str, ttl: float):\n    item = _MIHOMO_PROBE_CACHE.get((kind, key))\n    if item is None:\n        return None\n    updated_at, value = item\n    if time.monotonic() - updated_at >= ttl:\n        return None\n    return value\n\n\ndef _probe_put(kind: str, key: str, value):\n    _MIHOMO_PROBE_CACHE[(kind, key)] = (time.monotonic(), value)\n    return value\n\n\ndef _clear_probe_cache() -> None:\n    _MIHOMO_PROBE_CACHE.clear()\n\n\n'''
          if marker not in s:
              raise SystemExit('Mihomo insertion marker missing')
          s = s.replace(marker, marker + cache, 1)
          old = '''def _service_active() -> bool:\n    return (\n        subprocess.run(\n            ["systemctl", "is-active", "--quiet", "mihomo.service"],\n            capture_output=True,\n            check=False,\n        ).returncode\n        == 0\n    )\n\n\ndef _service_enabled() -> bool:\n    return (\n        subprocess.run(\n            ["systemctl", "is-enabled", "--quiet", "mihomo.service"],\n            capture_output=True,\n            check=False,\n        ).returncode\n        == 0\n    )\n\n\ndef _version() -> str:\n    if not MIHOMO_BINARY.is_file():\n        return "Не установлен"\n    result = subprocess.run(\n        [str(MIHOMO_BINARY), "-v"],\n        capture_output=True,\n        text=True,\n        timeout=10,\n        check=False,\n    )\n    first = (result.stdout or result.stderr).strip().splitlines()\n    return first[0] if first else "Неизвестно"\n'''
          new = '''def _service_active() -> bool:\n    cached = _probe_get("service", "active", _MIHOMO_SERVICE_TTL_SECONDS)\n    if isinstance(cached, bool):\n        return cached\n    value = (subprocess.run(["systemctl", "is-active", "--quiet", "mihomo.service"], capture_output=True, check=False).returncode == 0)\n    return bool(_probe_put("service", "active", value))\n\n\ndef _service_enabled() -> bool:\n    cached = _probe_get("service", "enabled", _MIHOMO_SERVICE_TTL_SECONDS)\n    if isinstance(cached, bool):\n        return cached\n    value = (subprocess.run(["systemctl", "is-enabled", "--quiet", "mihomo.service"], capture_output=True, check=False).returncode == 0)\n    return bool(_probe_put("service", "enabled", value))\n\n\ndef _version() -> str:\n    cached = _probe_get("version", str(MIHOMO_BINARY), _MIHOMO_VERSION_TTL_SECONDS)\n    if isinstance(cached, str):\n        return cached\n    if not MIHOMO_BINARY.is_file():\n        return str(_probe_put("version", str(MIHOMO_BINARY), "Не установлен"))\n    result = subprocess.run([str(MIHOMO_BINARY), "-v"], capture_output=True, text=True, timeout=10, check=False)\n    first = (result.stdout or result.stderr).strip().splitlines()\n    value = first[0] if first else "Неизвестно"\n    return str(_probe_put("version", str(MIHOMO_BINARY), value))\n'''
          if old not in s:
              raise SystemExit('Mihomo service/version block missing')
          s = s.replace(old, new, 1)
          old_hostd = '''def _hostd_live_snapshot(\n    settings: dict[str, Any],\n) -> tuple[dict[str, Any], set[str], str] | None:\n    """Read safe runtime truth from privileged HostD.\n\n    The web panel intentionally runs as the unprivileged sg-gateway user and\n    cannot read root-only Mihomo/sing-box configs containing client secrets.\n    HostD returns only listener state, ports and non-secret transport metadata.\n    """\n\n    result = run_hostd_command("mihomo.status", timeout=5)\n    if result.status != "ok":\n        return None\n    payload = result.payload if isinstance(result.payload, dict) else {}\n'''
          new_hostd = '''def _hostd_live_snapshot(\n    settings: dict[str, Any],\n) -> tuple[dict[str, Any], set[str], str] | None:\n    """Read safe runtime truth from privileged HostD."""\n\n    payload = _probe_get("hostd", "mihomo.status", _MIHOMO_HOSTD_TTL_SECONDS)\n    if not isinstance(payload, dict):\n        result = run_hostd_command("mihomo.status", timeout=5)\n        if result.status != "ok":\n            return None\n        payload = result.payload if isinstance(result.payload, dict) else {}\n        _probe_put("hostd", "mihomo.status", dict(payload))\n'''
          if old_hostd not in s:
              raise SystemExit('Mihomo hostd block missing')
          s = s.replace(old_hostd, new_hostd, 1)
          s = s.replace('def apply_candidate() -> dict[str, Any]:\n    build_candidate()\n', 'def apply_candidate() -> dict[str, Any]:\n    build_candidate()\n    _clear_probe_cache()\n', 1)
          s = s.replace('def rollback_latest() -> dict[str, Any]:\n    payload = _run_helper("rollback")\n', 'def rollback_latest() -> dict[str, Any]:\n    _clear_probe_cache()\n    payload = _run_helper("rollback")\n', 1)
          s = s.replace('def restart_service() -> dict[str, Any]:\n    payload = _run_helper("restart")\n', 'def restart_service() -> dict[str, Any]:\n    _clear_probe_cache()\n    payload = _run_helper("restart")\n', 1)
          s = s.replace('def test_candidate() -> dict[str, Any]:\n    build_candidate()\n', 'def test_candidate() -> dict[str, Any]:\n    build_candidate()\n    _clear_probe_cache()\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Prove GREEN strictly
        run: |
          python -m pytest -q tests/test_mihomo_probe_cache_02208.py
          python -m pytest -q tests/test_mihomo_state_sandbox_02207.py tests/test_mihomo_021.py --tb=short
          python -B -m py_compile app/mihomo/service.py
      - name: Commit verified change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/mihomo/service.py tests/test_mihomo_probe_cache_02208.py
          git rm .github/workflows/zz-mihomo-probe-cache.yml
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          files = [p for p in files if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(files)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git commit -m 'perf: cache Mihomo runtime probes'
          git push origin HEAD:feature/02208-performance-clients
