name: Apply dashboard memory attribution patch

on:
  push:
    branches:
      - feature/dashboard-memory-attribution

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dashboard-memory-attribution
          fetch-depth: 0

      - name: Patch memory attribution
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          path = Path("app/main.py")
          source = path.read_text(encoding="utf-8")
          marker = "\n\ndef _resource_state(percent: int) -> tuple[str, str]:\n"
          helper = base64.b64decode(
              ""
          ).decode("utf-8")
          old_call = '    panel_rss = _process_rss(("python", "waitress"))\n'
          new_call = '    panel_rss = _sg_gateway_process_rss()\n'

          if "def _sg_gateway_process_rss(" not in source:
              if marker not in source:
                  raise SystemExit("resource-state insertion marker not found")
              source = source.replace(marker, helper + marker, 1)

          if old_call in source:
              source = source.replace(old_call, new_call, 1)
          elif new_call not in source:
              raise SystemExit("dashboard panel RSS call not found")

          path.write_text(source, encoding="utf-8")
          PY

          rm -f .github/workflows/patch-dashboard-memory-attribution.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py .github/workflows/patch-dashboard-memory-attribution.yml
          git commit -m "fix: scope dashboard memory to SG-Gateway processes"
          git push origin HEAD:feature/dashboard-memory-attribution
