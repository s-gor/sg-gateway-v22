name: Integrate AWG3 Runtime Repair Once

on:
  push:
    branches: [dev-02206]
    paths:
      - .github/workflows/orchestrate-feature-awg3-repair-once.yml

permissions:
  contents: write
  statuses: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - id: checkout
        name: Checkout current dev-02206
        uses: actions/checkout@v4
        with:
          ref: dev-02206
          fetch-depth: 0

      - id: lock
        name: Lock dev branch and frozen production refs
        run: |
          set -Eeuo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          test "$(git branch --show-current)" = "dev-02206"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "56df9a7b4fe509282e37374dd6ef3bccdc1b1100"
          test "$(git ls-remote origin refs/heads/stable-02204 | cut -f1)" = "56df9a7b4fe509282e37374dd6ef3bccdc1b1100"

      - id: apply
        name: Apply AWG3 integration and clean temporary files
        run: |
          set -Eeuo pipefail
          python3 scripts/dev-02206-awg3-repair-integrate.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/main.py")
          body = path.read_text(encoding="utf-8")
          old = "\n".join([
              '        elif (',
              '            kind in {"full_backup_restore", "awg3_runtime_repair", "panel_update_channel"}',
              '            or kind.startswith("xray_update_")',
              '            or kind.startswith("core_update_")',
              '        ):',
              '            active = "maintenance"',
              '',
          ])
          new = "\n".join([
              '        elif kind == "full_backup_restore":',
              '            active = "maintenance"',
              '        elif (',
              '            kind in {"awg3_runtime_repair", "panel_update_channel"}',
              '            or kind.startswith("xray_update_")',
              '            or kind.startswith("core_update_")',
              '        ):',
              '            active = "maintenance"',
              '',
          ])
          if old in body:
              body = body.replace(old, new, 1)
          elif not (
              'kind == "full_backup_restore"' in body
              and '"awg3_runtime_repair", "panel_update_channel"' in body
              and 'kind.startswith("core_update_")' in body
          ):
              raise SystemExit("operation-job maintenance compatibility anchor not found")
          path.write_text(body, encoding="utf-8", newline="\n")
          PY

          chmod 0755 deploy/repair-awg3-runtime.sh
          rm -f scripts/dev-02206-awg3-repair-integrate.py
          rm -f .github/workflows/orchestrate-feature-awg3-repair-once.yml
          git add -A

          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          tracked = [p for p in tracked if p != "SOURCE-SHA256SUMS"]
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in tracked]
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          git add SOURCE-SHA256SUMS
          git diff --cached --check

      - id: integrity
        name: Verify candidate source integrity
        run: |
          python3 -B - <<'PY'
          import hashlib
          import re
          import subprocess
          from pathlib import Path

          expected = {}
          for line_no, raw in enumerate(Path("SOURCE-SHA256SUMS").read_text(encoding="utf-8").splitlines(), 1):
              if not raw.strip():
                  continue
              match = re.fullmatch(r"([0-9a-f]{64})  (.+)", raw)
              if match is None:
                  raise SystemExit(f"invalid SOURCE-SHA256SUMS line {line_no}: {raw!r}")
              digest, path = match.groups()
              if path in expected:
                  raise SystemExit(f"duplicate checksum path: {path}")
              expected[path] = digest
          tracked = set(subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines())
          tracked.discard("SOURCE-SHA256SUMS")
          if tracked != set(expected):
              raise SystemExit(
                  f"checksum inventory mismatch: missing={sorted(tracked-set(expected))} extra={sorted(set(expected)-tracked)}"
              )
          for path in sorted(tracked):
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != expected[path]:
                  raise SystemExit(f"source hash mismatch: {path}")
          print(f"Source integrity OK: {len(tracked)} files")
          PY

      - id: setup
        name: Set up Python and dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: deps
        name: Install test dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -r requirements-dev.txt >/dev/null

      - id: syntax
        name: Shell and Python syntax
        run: |
          set -Eeuo pipefail
          bash -n deploy/repair-awg3-runtime.sh
          python -B - <<'PY'
          from pathlib import Path
          files = (
              list(Path("app").rglob("*.py"))
              + list(Path("hostd").rglob("*.py"))
              + list(Path("engines").rglob("*.py"))
              + list(Path("tests").rglob("*.py"))
          )
          for path in files:
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          print(f"Python syntax OK: {len(files)} files")
          PY

      - id: focused
        name: Focused AWG3 and frozen regression suite
        run: |
          python -m pytest \
            tests/test_sg_gateway_v22_awg3_runtime_repair.py \
            tests/test_sg_gateway_v22_runtime_contract_data_backup.py \
            tests/test_sg_gateway_v22_02206_hardening.py \
            tests/test_sg_gateway_v22_production_entrypoint_v4.py \
            tests/test_sg_gateway_v22_router_subscription.py \
            tests/test_sg_gateway_v22_sg_subscription_dual_ui.py \
            tests/test_sg_gateway_02111_backup_domain_release.py

      - id: full
        name: Full pytest
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests 2>&1 | tee /tmp/sg-awg3-full-pytest.log

      - name: Publish exact full-suite failure
        if: steps.full.outcome == 'failure'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          lines = Path("/tmp/sg-awg3-full-pytest.log").read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()
          markers = [line.strip() for line in lines if line.strip().startswith("FAILED ")]
          if not markers:
              markers = ["full pytest failed without FAILED summary"]
          for index, marker in enumerate(markers[:12], 1):
              clean = re.sub(r"[^A-Za-z0-9_.:/=+() -]+", "?", marker)[:68]
              payload = json.dumps({
                  "state": "failure",
                  "context": f"dev-02206/fullfail-{index:02d}-{clean}"[:100],
                  "description": marker[:140],
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(marker, response.status)
          PY

      - id: candidate
        if: steps.full.outcome == 'success'
        name: Commit tested candidate locally
        run: |
          set -Eeuo pipefail
          git fetch origin dev-02206
          test "$(git rev-parse origin/dev-02206)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "56df9a7b4fe509282e37374dd6ef3bccdc1b1100"
          test "$(git ls-remote origin refs/heads/stable-02204 | cut -f1)" = "56df9a7b4fe509282e37374dd6ef3bccdc1b1100"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add safe AWG3 runtime repair"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - id: package
        if: steps.full.outcome == 'success' && steps.candidate.outcome == 'success'
        name: Build and verify FULL package from candidate HEAD
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-DEV-02206-AWG3-REPAIR-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only

      - id: push
        if: steps.full.outcome == 'success' && steps.package.outcome == 'success'
        name: Push verified integration to dev-02206
        run: |
          set -Eeuo pipefail
          git fetch origin dev-02206
          test "$(git rev-parse origin/dev-02206)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "56df9a7b4fe509282e37374dd6ef3bccdc1b1100"
          test "$(git ls-remote origin refs/heads/stable-02204 | cut -f1)" = "56df9a7b4fe509282e37374dd6ef3bccdc1b1100"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git push origin HEAD:dev-02206

      - name: Publish AWG3 gate diagnostics
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          LOCK: ${{ steps.lock.outcome }}
          APPLY: ${{ steps.apply.outcome }}
          INTEGRITY: ${{ steps.integrity.outcome }}
          SETUP: ${{ steps.setup.outcome }}
          DEPS: ${{ steps.deps.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          FULL: ${{ steps.full.outcome }}
          CANDIDATE: ${{ steps.candidate.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          PUSH: ${{ steps.push.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          stages = (
              "checkout", "lock", "apply", "integrity", "setup", "deps",
              "syntax", "focused", "full", "candidate", "package", "push",
          )
          for stage in stages:
              outcome = os.environ.get(stage.upper(), "skipped")
              state = {
                  "success": "success",
                  "failure": "failure",
                  "cancelled": "error",
                  "skipped": "error",
              }.get(outcome, "error")
              payload = json.dumps({
                  "state": state,
                  "context": f"dev-02206/awg3-{stage}",
                  "description": f"AWG3 integration gate: {outcome}",
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/statuses/{sha}",
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(stage, outcome, response.status)
          PY
