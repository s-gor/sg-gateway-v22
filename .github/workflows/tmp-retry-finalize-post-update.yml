name: tmp-retry-finalize-post-update

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  retry:
    if: github.head_ref == 'fix-update-production-wsgi-02204e'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-update-production-wsgi-02204e
          fetch-depth: 0
      - name: Reuse finalizer and commit clean result
        shell: bash
        run: |
          set -Eeuo pipefail
          awk '
            /^        run: \|$/ { inside=1; next }
            inside && /^      - / { exit }
            inside { sub(/^          /, ""); print }
          ' .github/workflows/tmp-finalize-post-update-regression.yml > /tmp/finalize.sh
          bash /tmp/finalize.sh || true

          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          auth = Path('tests/test_auth.py')
          auth.write_text(auth.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8', newline='\n')

          retry = Path('.github/workflows/tmp-retry-finalize-post-update.yml')
          if retry.exists():
              subprocess.run(['git', 'rm', str(retry)], check=True)

          paths = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          rows = []
          for path in paths:
              if path == 'SOURCE-SHA256SUMS':
                  continue
              file = Path(path)
              if file.is_file():
                  rows.append(f"{hashlib.sha256(file.read_bytes()).hexdigest()}  {path}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
          PY

          bash -n deploy/update-from-github.sh
          python3 -m compileall -q app tests
          git add -A
          git diff --cached --check
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Fix post-update WSGI migration and stale login redirect'
          git push origin HEAD:fix-update-production-wsgi-02204e
