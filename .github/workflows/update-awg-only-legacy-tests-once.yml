name: Update AWG-only legacy tests once

on:
  push:
    branches:
      - fix/02206-awg-only-subscription-contract

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update obsolete sgclient assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          simple = Path("tests/test_clients_simple_hotfix1.py")
          onboarding = Path("tests/test_sg_gateway_0217_clients_onboarding.py")

          simple_text = simple.read_text(encoding="utf-8")
          old = '    assert \'type="hidden" name="protocols" value="sgclient"\' in template\n'
          new = (
              '    assert \'type="hidden" name="protocols" value="sgclient"\' not in template\n'
              '    assert "SG_AWG_ONLY_NOTICE_V1_ADD_DEVICE" in template\n'
          )
          if old not in simple_text:
              raise SystemExit("test_clients_simple_hotfix1.py: obsolete assertion not found")
          simple_text = simple_text.replace(old, new, 1)
          simple.write_text(simple_text, encoding="utf-8", newline="\n")

          onboarding_text = onboarding.read_text(encoding="utf-8")
          old = '    assert form.count(\'value="sgclient"\') == 1\n'
          new = (
              '    assert form.count(\'value="sgclient"\') == 0\n'
              '    assert "SG_AWG_ONLY_NOTICE_V1_CREATE_CLIENT" in form\n'
              '    main = (ROOT / "app/main.py").read_text(encoding="utf-8")\n'
              '    assert main.count("_prepare_client_protocols(request.form.getlist") == 4\n'
          )
          if old not in onboarding_text:
              raise SystemExit("test_sg_gateway_0217_clients_onboarding.py: obsolete assertion not found")
          onboarding_text = onboarding_text.replace(old, new, 1)
          onboarding.write_text(onboarding_text, encoding="utf-8", newline="\n")
          PY

      - name: Install dependencies and run affected tests
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt
          python3 -m pytest -q \
            tests/test_clients_simple_hotfix1.py \
            tests/test_sg_gateway_0217_clients_onboarding.py \
            tests/test_sg_gateway_v22_awg_only_subscription_contract.py \
            tests/test_sg_gateway_v22_client_device_dialog_final.py \
            tests/test_sg_gateway_v22_clients_devices_ux.py

      - name: Refresh integrity and commit
        env:
          BRANCH_NAME: fix/02206-awg-only-subscription-contract
        run: |
          git rm .github/workflows/update-awg-only-legacy-tests-once.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          tracked = [path for path in tracked if path != "SOURCE-SHA256SUMS"]
          rows = [
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
              for path in tracked
          ]
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n", encoding="utf-8", newline="\n"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests SOURCE-SHA256SUMS
          git commit -m "test: replace forced sgclient legacy assertions"
          git push origin "HEAD:${BRANCH_NAME}"
