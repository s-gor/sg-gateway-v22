name: Diagnose Foundation 2 Full Suite

on:
  push:
    branches: [verify-dev02206-foundation2-20260819]
    paths:
      - .github/workflows/verify-foundation2-diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-dev02206-foundation2-20260819
          fetch-depth: 0
      - name: Remove workflow from test snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-foundation2-diagnose.yml
          git commit -m "Prepare full suite diagnostic snapshot"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -r requirements-dev.txt >/dev/null
      - name: Capture first failure
        shell: bash
        run: |
          set +e
          python -m pytest tests -x -vv > /tmp/full.log 2>&1
          RC=$?
          set -e
          { echo "exit_code=$RC"; tail -n 320 /tmp/full.log; } > VERIFY-FOUNDATION2-FAILURE.txt
          git add VERIFY-FOUNDATION2-FAILURE.txt
          git commit -m "Record isolated foundation full suite failure"
          git push origin HEAD:verify-dev02206-foundation2-20260819
          exit "$RC"
