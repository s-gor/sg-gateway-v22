name: Patch NaiveProxy core update preservation

on:
  push:
    branches:
      - fix/02208-clients-keys-dormant-restore
    paths:
      - .github/workflows/patch-naiveproxy-core-update-preservation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02208-clients-keys-dormant-restore
          fetch-depth: 0
      - name: Patch core updater, refresh checksums and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/patch-naiveproxy-core-update-preservation.yml
          python3 - <<'PY'
          from pathlib import Path

          path = Path('deploy/update-from-github-core.sh')
          body = path.read_text(encoding='utf-8')

          def once(old: str, new: str) -> None:
              global body
              count = body.count(old)
              if count != 1:
                  raise SystemExit(f'expected one core updater match, got {count}: {old[:100]!r}')
              body = body.replace(old, new, 1)

          once(
              'AWG3_ROOT="$PREFIX/awg3"\nLETSENCRYPT_DIR=',
              'AWG3_ROOT="$PREFIX/awg3"\nNAIVE_SERVICE="sg-gateway-naiveproxy.service"\nNAIVE_ROOT="$PREFIX/naiveproxy"\nLETSENCRYPT_DIR=',
          )
          once(
              '    nginx.service xray.service mihomo.service sg-gateway-awg.service "$AWG3_SERVICE" "$AWG31_SERVICE" \\\n    sg-gateway-singbox.service "$HOSTD_SERVICE" "$PANEL_SERVICE"; do',
              '    nginx.service xray.service mihomo.service sg-gateway-awg.service "$AWG3_SERVICE" "$AWG31_SERVICE" \\\n    sg-gateway-singbox.service "$NAIVE_SERVICE" "$HOSTD_SERVICE" "$PANEL_SERVICE"; do',
          )
          once(
              '    "$AWG31_CONFIG" "$AWG31_STATE" "$AWG31_UNIT" "$PREFIX/awg31" \\\n    -- "$cert" "$key" <<\'PYPROTECTED\'',
              '    "$AWG31_CONFIG" "$AWG31_STATE" "$AWG31_UNIT" "$PREFIX/awg31" "$NAIVE_ROOT" \\\n    -- "$cert" "$key" <<\'PYPROTECTED\'',
          )
          once(
              '    /hostd/sg_hostd/ \\\n    /deploy/ \\',
              '    /hostd/sg_hostd/ \\\n    /hostd/systemd/ \\\n    /deploy/ \\',
          )
          once(
              '      ".venv"|"awg3") continue ;;',
              '      ".venv"|"awg3"|"naiveproxy") continue ;;',
          )

          prune = '\\( -path "$PREFIX/.venv" -o -path "$PREFIX/assets" -o -path "$AWG3_ROOT" \\) -prune -o \\\n'
          replacement = '\\( -path "$PREFIX/.venv" -o -path "$PREFIX/assets" -o -path "$AWG3_ROOT" -o -path "$NAIVE_ROOT" \\) -prune -o \\\n'
          count = body.count(prune)
          if count != 3:
              raise SystemExit(f'expected three core ownership prune matches, got {count}')
          body = body.replace(prune, replacement)

          path.write_text(body, encoding='utf-8', newline='\n')
          PY

          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          rows = []
          for name in sorted(paths):
              if name == 'SOURCE-SHA256SUMS':
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              rows.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

          git add deploy/update-from-github-core.sh tests/test_update_preserves_naiveproxy_runtime_02208.py SOURCE-SHA256SUMS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: preserve NaiveProxy runtime in core updater"
          git push origin HEAD:fix/02208-clients-keys-dormant-restore
