name: Refresh source integrity temporary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh inventory and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-source-integrity-temp.yml
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          paths = [path for path in paths if path != "SOURCE-SHA256SUMS"]
          rows = []
          for path in paths:
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              rows.append(f"{digest}  {path}")
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n", encoding="utf-8", newline="\n"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "Refresh QR label source integrity"
          git push origin HEAD:main
