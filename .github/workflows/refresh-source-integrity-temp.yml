name: TEMP refresh source integrity

on:
  push:
    branches:
      - fix/02208-clients-keys-dormant-restore

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02208-clients-keys-dormant-restore
          fetch-depth: 0
      - name: Regenerate integrity inventory and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          TEMP_WORKFLOW='.github/workflows/refresh-source-integrity-temp.yml'
          rm -f "$TEMP_WORKFLOW"
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          target = Path('SOURCE-SHA256SUMS')
          rows = []
          for raw in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              if raw in {'SOURCE-SHA256SUMS', '.github/workflows/refresh-source-integrity-temp.yml'}:
                  continue
              path = Path(raw)
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append(f'{digest}  {raw}')
          target.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f'refreshed {len(rows)} tracked files')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A SOURCE-SHA256SUMS "$TEMP_WORKFLOW"
          git commit -m 'chore: refresh source integrity for dormant restore'
          git push origin HEAD:fix/02208-clients-keys-dormant-restore
