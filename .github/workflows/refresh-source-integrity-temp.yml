name: Refresh source integrity temp

on:
  push:
    branches:
      - fix/02208-clients-keys-dormant-restore

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02208-clients-keys-dormant-restore
          fetch-depth: 0
      - name: Refresh and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-source-integrity-temp.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          excluded = {
              'SOURCE-SHA256SUMS',
              '.github/workflows/refresh-source-integrity-temp.yml',
          }
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          rows = []
          for name in sorted(tracked):
              if name in excluded:
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh source integrity for NaiveProxy dormant restore test'
          git push origin HEAD:fix/02208-clients-keys-dormant-restore
