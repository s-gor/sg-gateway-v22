name: dev-v22 Full Backup fix runner

on:
  push:
    branches: [dev-v22]
    paths:
      - .github/workflows/dev-v22-backup-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev-v22
        uses: actions/checkout@v4
        with:
          ref: dev-v22
          fetch-depth: 0

      - name: Guard expected baseline
        run: |
          test "$(cat VERSION)" = "0.1.0-021.12"
          test "$(git branch --show-current)" = "dev-v22"
          git diff --exit-code

      - name: Apply Full Backup verifier and unlimited upload fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{path}: anchor missing: {label}")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: anchor is not unique: {label}: {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          Path("app/maintenance/full_backups.py").write_text(textwrap.dedent('''\
          from __future__ import annotations

          import os
          from dataclasses import dataclass
          from datetime import datetime, timezone
          from pathlib import Path

          from app.config import load_config


          FULL_BACKUP_SUFFIX = ".sgbackup"
          RESTORE_UPLOAD_NAME = "restore-upload.sgbackup"
          VERIFY_UPLOAD_NAME = "verify-upload.sgbackup"
          _TRANSIENT_UPLOAD_NAMES = {RESTORE_UPLOAD_NAME, VERIFY_UPLOAD_NAME}


          @dataclass(frozen=True)
          class FullBackupInfo:
              name: str
              path: Path
              size_bytes: int
              created_at: str


          def get_full_backup_dir() -> Path:
              directory = load_config().data_dir / "backups" / "full"
              directory.mkdir(parents=True, exist_ok=True)
              return directory


          def _valid_name(name: str) -> bool:
              return bool(name) and "/" not in name and "\\\\" not in name and ".." not in name and name.endswith(FULL_BACKUP_SUFFIX)


          def _info(path: Path) -> FullBackupInfo:
              stat = path.stat()
              return FullBackupInfo(
                  name=path.name,
                  path=path,
                  size_bytes=stat.st_size,
                  created_at=datetime.fromtimestamp(stat.st_mtime, timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
              )


          def list_full_backups() -> list[FullBackupInfo]:
              directory = get_full_backup_dir()
              paths = [
                  path
                  for path in directory.glob("SG-Gateway-FULL-*.sgbackup")
                  if path.is_file() and path.name not in _TRANSIENT_UPLOAD_NAMES
              ]
              return sorted((_info(path) for path in paths), key=lambda item: item.name, reverse=True)


          def get_full_backup(name: str) -> FullBackupInfo | None:
              if not _valid_name(name):
                  return None
              path = get_full_backup_dir() / name
              if not path.is_file() or path.name in _TRANSIENT_UPLOAD_NAMES:
                  return None
              return _info(path)


          def _stage_uploaded_full_backup(file_storage, destination_name: str) -> Path:
              if destination_name not in _TRANSIENT_UPLOAD_NAMES:
                  raise ValueError("Недопустимое имя временного backup")

              original = str(getattr(file_storage, "filename", "") or "").strip()
              if not original.lower().endswith(FULL_BACKUP_SUFFIX):
                  raise ValueError("Нужен файл SG-Gateway с расширением .sgbackup")

              directory = get_full_backup_dir()
              destination = directory / destination_name
              temporary = directory / f".{destination_name}.tmp"
              temporary.unlink(missing_ok=True)

              total = 0
              with temporary.open("wb") as handle:
                  while True:
                      chunk = file_storage.stream.read(1024 * 1024)
                      if not chunk:
                          break
                      total += len(chunk)
                      handle.write(chunk)
                  handle.flush()
                  os.fsync(handle.fileno())

              if total < 128:
                  temporary.unlink(missing_ok=True)
                  raise ValueError("Файл backup пустой или повреждён")

              os.chmod(temporary, 0o600)
              os.replace(temporary, destination)
              return destination


          def stage_uploaded_full_backup(file_storage) -> Path:
              return _stage_uploaded_full_backup(file_storage, RESTORE_UPLOAD_NAME)


          def stage_uploaded_full_backup_for_verification(file_storage) -> Path:
              return _stage_uploaded_full_backup(file_storage, VERIFY_UPLOAD_NAME)
          '''), encoding="utf-8", newline="\n")

          Path("hostd/sg_hostd/full_backup_verify_runtime.py").write_text(textwrap.dedent('''\
          from __future__ import annotations

          import sqlite3
          import tempfile
          from pathlib import Path

          from sg_hostd import full_backup_runtime as full_backup


          VERIFY_UPLOAD_NAME = "verify-upload.sgbackup"


          def _verify_archive(archive: Path) -> dict:
              with tempfile.TemporaryDirectory(prefix="verify-", dir=full_backup._work_dir()) as temp_name:
                  temp = Path(temp_name)
                  manifest = full_backup._extract_archive(archive, temp)
                  payload = temp / "payload"
                  db_path = payload / full_backup._data_dir().relative_to("/") / "sg-gateway.sqlite"
                  if not db_path.is_file():
                      raise RuntimeError("Backup does not contain the SG-Gateway database")

                  database_size = db_path.stat().st_size
                  database = sqlite3.connect(f"file:{db_path}?mode=ro", uri=True, timeout=15)
                  try:
                      row = database.execute("PRAGMA integrity_check").fetchone()
                      if not row or str(row[0]).lower() != "ok":
                          raise RuntimeError("Uploaded SQLite database is damaged")
                      table_count = int(
                          database.execute(
                              "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
                          ).fetchone()[0]
                      )
                  finally:
                      database.close()

                  if table_count <= 0:
                      raise RuntimeError("SG-Gateway database contains no application tables")

                  return {
                      "verified": True,
                      "format": str(manifest.get("format") or ""),
                      "format_version": int(manifest.get("format_version") or 0),
                      "source_version": str(manifest.get("source_version") or "unknown"),
                      "created_at": str(manifest.get("created_at") or ""),
                      "size_bytes": archive.stat().st_size,
                      "sha256": full_backup._sha256(archive),
                      "database_size_bytes": database_size,
                      "database_tables": table_count,
                      "contains_letsencrypt": bool(manifest.get("contains_letsencrypt")),
                      "contains_letsencrypt_certificates": bool(manifest.get("contains_letsencrypt_certificates")),
                      "certificate_domains": list(manifest.get("certificate_domains") or []),
                      "components": len(list(manifest.get("components") or [])),
                      "checks": {
                          "gzip_tar": "ok",
                          "safe_paths": "ok",
                          "manifest": "ok",
                          "sqlite_integrity": "ok",
                      },
                  }


          def verify_uploaded_full_backup() -> dict:
              """Validate an uploaded .sgbackup without modifying live server state."""
              full_backup._ensure_dirs()
              archive = full_backup._backup_dir() / VERIFY_UPLOAD_NAME
              if not archive.is_file():
                  raise RuntimeError("Uploaded .sgbackup file for verification not found")

              try:
                  return _verify_archive(archive)
              finally:
                  archive.unlink(missing_ok=True)
          '''), encoding="utf-8", newline="\n")

          Path("hostd/sg_hostd/app.py").write_text(textwrap.dedent('''\
          from __future__ import annotations

          from flask import Flask, jsonify

          from sg_hostd.commands import execute_command, list_allowed_commands
          from sg_hostd.full_backup_verify_runtime import verify_uploaded_full_backup


          FULL_BACKUP_VERIFY_COMMAND = "backup.full.verify"


          def create_app() -> Flask:
              app = Flask(__name__)

              @app.get("/health")
              def health():
                  return jsonify({"service": "sg-hostd", "status": "ok"})

              @app.get("/commands")
              def commands():
                  allowed = sorted(set(list_allowed_commands()) | {FULL_BACKUP_VERIFY_COMMAND})
                  return jsonify({"commands": allowed})

              @app.post("/commands/<path:command>")
              def run_command(command: str):
                  if command == FULL_BACKUP_VERIFY_COMMAND:
                      try:
                          payload = verify_uploaded_full_backup()
                          return jsonify({
                              "command": command,
                              "status": "ok",
                              "message": "Full backup verification passed",
                              "payload": payload,
                          }), 200
                      except Exception as exc:
                          return jsonify({
                              "command": command,
                              "status": "error",
                              "message": f"Full backup verification failed: {exc}",
                              "payload": {},
                          }), 403

                  result = execute_command(command)
                  status_code = 200 if result.status != "error" else 403
                  return jsonify(
                      {
                          "command": result.command,
                          "status": result.status,
                          "message": result.message,
                          "payload": result.payload,
                      }
                  ), status_code

              return app


          app = create_app()
          '''), encoding="utf-8", newline="\n")

          replace_once(
              "app/main.py",
              '''from app.maintenance.full_backups import (\n    get_full_backup,\n    list_full_backups,\n    stage_uploaded_full_backup,\n)''',
              '''from app.maintenance.full_backups import (\n    get_full_backup,\n    list_full_backups,\n    stage_uploaded_full_backup,\n    stage_uploaded_full_backup_for_verification,\n)''',
              "Full Backup imports",
          )
          replace_once(
              "app/main.py",
              "from app.maintenance.operations import list_operations",
              "from app.maintenance.operations import list_operations, log_operation",
              "operations import",
          )

          old_route = '''    @app.post("/maintenance/full-backups/restore")\n    def restore_full_backup_route():\n        upload = request.files.get("backup")\n        if upload is None or not str(upload.filename or "").strip():\n            flash("Выберите файл .sgbackup", "error")\n            return redirect(url_for("maintenance", tab="backups"))\n        try:\n            stage_uploaded_full_backup(upload)\n        except ValueError as exc:\n            flash(str(exc), "error")\n            return redirect(url_for("maintenance", tab="backups"))\n\n        result = run_hostd_command("backup.full.restore.start", timeout=20)\n        if result.status != "ok":\n            flash(result.message or "Полный restore не запущен", "error")\n            return redirect(url_for("maintenance", tab="backups"))\n        return redirect(\n            url_for(\n                "operation_job",\n                job_id=str(result.payload.get("job_id") or ""),\n            )\n        )'''

          new_route = '''    @app.post("/maintenance/full-backups/restore")\n    def restore_full_backup_route():\n        upload = request.files.get("backup")\n        original_name = str(getattr(upload, "filename", "") or "").strip() if upload is not None else ""\n        if upload is None or not original_name:\n            flash("Выберите файл .sgbackup", "error")\n            return redirect(url_for("maintenance", tab="backups"))\n\n        verify_only = request.form.get("backup_action", "").strip().lower() == "verify"\n        staged = None\n        try:\n            if verify_only:\n                staged = stage_uploaded_full_backup_for_verification(upload)\n            else:\n                stage_uploaded_full_backup(upload)\n        except ValueError as exc:\n            if verify_only:\n                log_operation("backup.full.verify", f"backup:{original_name}", str(exc), status="error")\n            flash(str(exc), "error")\n            return redirect(url_for("maintenance", tab="backups"))\n\n        if verify_only:\n            try:\n                result = run_hostd_command("backup.full.verify", timeout=180)\n            except Exception as exc:\n                message = f"Проверка backup не выполнена: {exc}"\n                log_operation("backup.full.verify", f"backup:{original_name}", message, status="error")\n                flash(message, "error")\n                return redirect(url_for("maintenance", tab="backups"))\n            finally:\n                if staged is not None:\n                    staged.unlink(missing_ok=True)\n\n            if result.status != "ok":\n                message = result.message or "Backup не прошёл проверку"\n                log_operation("backup.full.verify", f"backup:{original_name}", message, status="error")\n                flash(f"Backup НЕ прошёл проверку: {message}", "error")\n                return redirect(url_for("maintenance", tab="backups"))\n\n            payload = result.payload or {}\n            sha256 = str(payload.get("sha256") or "")\n            source_version = str(payload.get("source_version") or "unknown")\n            created_at = str(payload.get("created_at") or "не указано")\n            tables = int(payload.get("database_tables") or 0)\n            database_size = _format_bytes(payload.get("database_size_bytes") or 0)\n            certificates = "есть" if payload.get("contains_letsencrypt_certificates") else "нет"\n            message = (\n                f"Backup исправен: {original_name}. "\n                f"SG-Gateway {source_version}; создан {created_at}; "\n                f"SQLite: OK, таблиц {tables}, {database_size}; "\n                f"сертификаты: {certificates}; SHA-256: {sha256}. "\n                "Восстановление не выполнялось."\n            )\n            log_operation("backup.full.verify", f"backup:{original_name}", message)\n            flash(message, "success")\n            return redirect(url_for("maintenance", tab="backups"))\n\n        result = run_hostd_command("backup.full.restore.start", timeout=20)\n        if result.status != "ok":\n            flash(result.message or "Полный restore не запущен", "error")\n            return redirect(url_for("maintenance", tab="backups"))\n        return redirect(\n            url_for(\n                "operation_job",\n                job_id=str(result.payload.get("job_id") or ""),\n            )\n        )'''
          replace_once("app/main.py", old_route, new_route, "Full Backup restore route")

          replace_once(
              "app/web/templates/maintenance.html",
              "  'backup.restore': 'Восстановлена резервная копия',\n",
              "  'backup.restore': 'Восстановлена резервная копия',\n  'backup.full.verify': 'Проверен полный backup',\n",
              "operation title",
          )
          replace_once(
              "app/web/templates/maintenance.html",
              '<small data-sg-full-file-meta>Нажмите, чтобы выбрать файл · максимум 512 MiB</small>',
              '<small data-sg-full-file-meta>Нажмите, чтобы выбрать файл · размер не ограничен</small>',
              "upload size hint",
          )
          replace_once(
              "app/web/templates/maintenance.html",
              '''          <div class="sg-full-restore-actions">\n            <span class="sg-full-restore-note">Перед восстановлением автоматически создаётся страховочный Full Backup.</span>\n            <button class="button mtv2-restore sg-full-restore-button" type="submit" disabled data-sg-full-restore-button>\n              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v6h6"/></svg>\n              <span>Восстановить сервер</span>\n            </button>\n          </div>''',
              '''          <div class="sg-full-restore-actions">\n            <span class="sg-full-restore-note">Проверка ничего не меняет. Перед восстановлением автоматически создаётся страховочный Full Backup.</span>\n            <button class="button sg-full-restore-button sg-full-verify-button" type="submit"\n                    name="backup_action" value="verify" disabled data-sg-full-verify-button>\n              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>\n              <span>Проверить backup</span>\n            </button>\n            <button class="button mtv2-restore sg-full-restore-button" type="submit" disabled data-sg-full-restore-button>\n              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v6h6"/></svg>\n              <span>Восстановить сервер</span>\n            </button>\n          </div>''',
              "verify and restore actions",
          )
          replace_once(
              "app/web/templates/maintenance.html",
              '''      const restoreButton = form.querySelector("[data-sg-full-restore-button]");\n      if (!input || !fileName || !fileMeta || !restoreButton) return;\n\n      const reset = () => {''',
              '''      const restoreButton = form.querySelector("[data-sg-full-restore-button]");\n      const verifyButton = form.querySelector("[data-sg-full-verify-button]");\n      if (!input || !fileName || !fileMeta || !restoreButton || !verifyButton) return;\n\n      verifyButton.addEventListener("click", () => {\n        form.dataset.sgConfirmBypass = "1";\n        window.setTimeout(() => {\n          if (form.dataset.sgConfirmBypass === "1") delete form.dataset.sgConfirmBypass;\n        }, 0);\n      });\n\n      const reset = () => {''',
              "verify JS selector and confirmation bypass",
          )
          replace_once(
              "app/web/templates/maintenance.html",
              '''        fileMeta.textContent = "Нажмите, чтобы выбрать файл · максимум 512 MiB";\n        restoreButton.disabled = true;''',
              '''        fileMeta.textContent = "Нажмите, чтобы выбрать файл · размер не ограничен";\n        restoreButton.disabled = true;\n        verifyButton.disabled = true;''',
              "upload reset",
          )
          replace_once(
              "app/web/templates/maintenance.html",
              '''        fileMeta.textContent = `${formatBytes(file.size)} · готов к восстановлению`;\n        restoreButton.disabled = false;''',
              '''        fileMeta.textContent = `${formatBytes(file.size)} · готов к проверке / восстановлению`;\n        restoreButton.disabled = false;\n        verifyButton.disabled = false;''',
              "upload selected state",
          )

          for path in ("install.sh", "deploy/configure-panel-access.sh"):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count("client_max_body_size 1024m;")
              if count < 1:
                  raise SystemExit(f"{path}: expected Full Backup 1024m directive not found")
              p.write_text(text.replace("client_max_body_size 1024m;", "client_max_body_size 0;"), encoding="utf-8", newline="\n")

          runtime_path = Path("hostd/sg_hostd/full_backup_runtime.py")
          runtime_text = runtime_path.read_text(encoding="utf-8")
          start = runtime_text.index("def _ensure_full_restore_upload_nginx() -> None:\n")
          end = runtime_text.index("\n\ndef _probe(\n", start)
          new_helper = '''def _ensure_full_restore_upload_nginx() -> None:\n    # Full Backup uploads are intentionally unlimited at nginx level.\n    # The natural limit is available disk space; the Python stager streams to disk.\n    path = Path("/etc/nginx/sites-available/sg-gateway")\n    if not path.is_file():\n        return\n    body = path.read_text(encoding="utf-8")\n    endpoint = "/maintenance/full-backups/restore"\n    pattern = re.compile(\n        rf"(?ms)^    location = {re.escape(endpoint)} \\{{\\n.*?^    \\}}\\n"\n    )\n    matches = list(pattern.finditer(body))\n    if len(matches) > 1:\n        raise RuntimeError(f"Nginx Full Restore proxy location is ambiguous: {len(matches)}")\n\n    if matches:\n        match = matches[0]\n        block = match.group(0)\n        directive = re.compile(r"(?m)^        client_max_body_size\\s+[^;]+;$")\n        if directive.search(block):\n            normalized = directive.sub("        client_max_body_size 0;", block, count=1)\n        else:\n            normalized = block.replace(\n                f"    location = {endpoint} {{\\n",\n                f"    location = {endpoint} {{\\n        client_max_body_size 0;\\n",\n                1,\n            )\n        if normalized != block:\n            body = body[:match.start()] + normalized + body[match.end():]\n            path.write_text(body, encoding="utf-8", newline="\\n")\n        return\n\n    matches = list(re.finditer(\n        r"(?m)^    location / \\{\\n        proxy_pass http://127\\.0\\.0\\.1:(\\d+);\\n",\n        body,\n    ))\n    if len(matches) != 1:\n        raise RuntimeError(f"Nginx Full Restore proxy location is ambiguous: {len(matches)}")\n    match = matches[0]\n    port = match.group(1)\n    block = (\n        "    location = /maintenance/full-backups/restore {\\n"\n        "        client_max_body_size 0;\\n"\n        "        client_body_timeout 300s;\\n"\n        f"        proxy_pass http://127.0.0.1:{port};\\n"\n        "        proxy_http_version 1.1;\\n"\n        "        proxy_set_header Host $host;\\n"\n        "        proxy_set_header X-Real-IP $remote_addr;\\n"\n        "        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\\n"\n        "        proxy_set_header X-Forwarded-Proto https;\\n"\n        "        proxy_read_timeout 300s;\\n"\n        "        proxy_send_timeout 300s;\\n"\n        "    }\\n"\n    )\n    path.write_text(body[:match.start()] + block + body[match.start():], encoding="utf-8", newline="\\n")'''
          runtime_path.write_text(runtime_text[:start] + new_helper + runtime_text[end:], encoding="utf-8", newline="\n")

          Path("tests/test_sg_gateway_v22_full_backup_verify.py").write_text(textwrap.dedent('''\
          from __future__ import annotations

          import io
          import json
          import sqlite3
          import tarfile
          from pathlib import Path

          import pytest

          from sg_hostd import full_backup_runtime as full_backup
          from sg_hostd.full_backup_verify_runtime import VERIFY_UPLOAD_NAME, verify_uploaded_full_backup


          def _patch_paths(monkeypatch: pytest.MonkeyPatch, tmp_path: Path) -> tuple[Path, Path, Path]:
              data_dir = tmp_path / "data"
              backup_dir = data_dir / "backups" / "full"
              work_dir = data_dir / "full-backup-work"
              backup_dir.mkdir(parents=True)
              work_dir.mkdir(parents=True)
              monkeypatch.setattr(full_backup, "_data_dir", lambda: data_dir)
              monkeypatch.setattr(full_backup, "_backup_dir", lambda: backup_dir)
              monkeypatch.setattr(full_backup, "_work_dir", lambda: work_dir)
              monkeypatch.setattr(full_backup, "_ensure_dirs", lambda: None)
              return data_dir, backup_dir, work_dir


          def _valid_database(path: Path) -> None:
              connection = sqlite3.connect(path)
              try:
                  connection.execute("CREATE TABLE clients (id INTEGER PRIMARY KEY, name TEXT NOT NULL)")
                  connection.execute("INSERT INTO clients(name) VALUES ('test')")
                  connection.commit()
              finally:
                  connection.close()


          def _write_valid_archive(archive: Path, data_dir: Path) -> None:
              source_db = archive.parent / "source.sqlite"
              _valid_database(source_db)
              manifest = {
                  "format": full_backup.FORMAT,
                  "format_version": full_backup.FORMAT_VERSION,
                  "created_at": "2026-08-15T20:00:00+00:00",
                  "source_version": "0.1.0-021.12",
                  "contains_private_keys": True,
                  "contains_letsencrypt": True,
                  "contains_letsencrypt_certificates": True,
                  "certificate_domains": ["example.test"],
                  "components": [str(data_dir / "sg-gateway.sqlite")],
              }
              manifest_bytes = (json.dumps(manifest) + "\\n").encode("utf-8")
              manifest_info = tarfile.TarInfo("manifest.json")
              manifest_info.size = len(manifest_bytes)
              db_arcname = f"payload/{data_dir.relative_to('/')}/sg-gateway.sqlite"
              with tarfile.open(archive, "w:gz") as tar:
                  tar.addfile(manifest_info, io.BytesIO(manifest_bytes))
                  tar.add(source_db, arcname=db_arcname, recursive=False)


          def test_full_backup_verify_accepts_restore_compatible_archive(monkeypatch, tmp_path):
              data_dir, backup_dir, _ = _patch_paths(monkeypatch, tmp_path)
              archive = backup_dir / VERIFY_UPLOAD_NAME
              _write_valid_archive(archive, data_dir)
              payload = verify_uploaded_full_backup()
              assert payload["verified"] is True
              assert payload["format"] == full_backup.FORMAT
              assert payload["format_version"] == full_backup.FORMAT_VERSION
              assert payload["source_version"] == "0.1.0-021.12"
              assert payload["database_tables"] == 1
              assert payload["checks"] == {
                  "gzip_tar": "ok",
                  "safe_paths": "ok",
                  "manifest": "ok",
                  "sqlite_integrity": "ok",
              }
              assert len(payload["sha256"]) == 64
              assert not archive.exists()
              assert not (data_dir / "sg-gateway.sqlite").exists()


          def test_full_backup_verify_rejects_broken_archive_and_cleans_upload(monkeypatch, tmp_path):
              _, backup_dir, _ = _patch_paths(monkeypatch, tmp_path)
              archive = backup_dir / VERIFY_UPLOAD_NAME
              archive.write_bytes(b"not a gzip tar archive")
              with pytest.raises((tarfile.TarError, OSError, RuntimeError)):
                  verify_uploaded_full_backup()
              assert not archive.exists()


          def test_full_backup_verify_rejects_archive_without_database(monkeypatch, tmp_path):
              data_dir, backup_dir, _ = _patch_paths(monkeypatch, tmp_path)
              archive = backup_dir / VERIFY_UPLOAD_NAME
              manifest = {
                  "format": full_backup.FORMAT,
                  "format_version": full_backup.FORMAT_VERSION,
                  "created_at": "2026-08-15T20:00:00+00:00",
                  "source_version": "0.1.0-021.12",
                  "components": [],
              }
              raw = (json.dumps(manifest) + "\\n").encode("utf-8")
              info = tarfile.TarInfo("manifest.json")
              info.size = len(raw)
              with tarfile.open(archive, "w:gz") as tar:
                  tar.addfile(info, io.BytesIO(raw))
              with pytest.raises(RuntimeError, match="database"):
                  verify_uploaded_full_backup()
              assert not archive.exists()
              assert not (data_dir / "sg-gateway.sqlite").exists()
          '''), encoding="utf-8", newline="\n")

          Path("tests/test_sg_gateway_v22_full_backup_upload_unlimited.py").write_text(textwrap.dedent('''\
          from pathlib import Path


          def test_python_full_backup_stager_has_no_artificial_size_cap():
              text = Path("app/maintenance/full_backups.py").read_text(encoding="utf-8")
              assert "MAX_UPLOAD_BYTES" not in text
              assert "512 MiB" not in text
              assert "stage_uploaded_full_backup_for_verification" in text


          def test_full_backup_nginx_generators_disable_request_size_limit():
              for name in (
                  "install.sh",
                  "deploy/configure-panel-access.sh",
                  "hostd/sg_hostd/full_backup_runtime.py",
              ):
                  text = Path(name).read_text(encoding="utf-8")
                  assert "client_max_body_size 1024m;" not in text, name
                  assert "client_max_body_size 0;" in text, name


          def test_verify_ui_uses_same_restore_upload_path_without_size_warning():
              text = Path("app/web/templates/maintenance.html").read_text(encoding="utf-8")
              assert "url_for('restore_full_backup_route')" in text
              assert 'name="backup_action" value="verify"' in text
              assert "data-sg-full-verify-button" in text
              assert "готов к проверке / восстановлению" in text
              assert "максимум 512 MiB" not in text
              assert "размер не ограничен" in text
              assert 'form.dataset.sgConfirmBypass = "1"' in text


          def test_panel_route_dispatches_verify_before_restore_job():
              text = Path("app/main.py").read_text(encoding="utf-8")
              assert 'request.form.get("backup_action", "").strip().lower() == "verify"' in text
              assert 'run_hostd_command("backup.full.verify", timeout=180)' in text
              assert 'run_hostd_command("backup.full.restore.start", timeout=20)' in text
              assert text.index('run_hostd_command("backup.full.verify", timeout=180)') < text.index('run_hostd_command("backup.full.restore.start", timeout=20)')
          '''), encoding="utf-8", newline="\n")
          PY

      - name: Check no old Full Backup size cap remains
        run: |
          if grep -RsnE 'MAX_UPLOAD_BYTES|максимум 512 MiB|client_max_body_size 1024m;' app hostd deploy install.sh; then
            echo 'Old Full Backup upload cap remains' >&2
            exit 1
          fi

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python3 -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'syntax ok: {len(files)} files')"

      - name: Run Full Backup tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/hostd
        run: |
          python3 -m pytest -q tests/test_sg_gateway_v22_full_backup_verify.py tests/test_sg_gateway_v22_full_backup_upload_unlimited.py

      - name: Run full repository tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/hostd
        run: python3 -m pytest -q tests

      - name: Rebuild source integrity manifest
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          temporary_workflow = ".github/workflows/dev-v22-backup-fix.yml"
          tracked = subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines()
          tracked = [p for p in tracked if p not in {"SOURCE-SHA256SUMS", temporary_workflow}]
          rows = []
          for path in sorted(tracked):
              rows.append(f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8", newline="\n")
          print(f"SOURCE-SHA256SUMS rebuilt for {len(rows)} permanent tracked files")
          PY

      - name: Commit tested fix
        run: |
          git config user.name "SG-Gateway Fix Runner"
          git config user.email "actions@users.noreply.github.com"
          git add app hostd deploy install.sh tests SOURCE-SHA256SUMS
          git diff --cached --stat
          git commit -m "Fix 01: verify Full Backup and remove upload size limit"
          git push origin HEAD:dev-v22
