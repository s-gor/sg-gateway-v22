name: Export Python Wheelhouse

on:
  push:
    branches:
      - feature/awg31-independent-profile

permissions:
  contents: read
  statuses: write

jobs:
  wheelhouse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download pinned-compatible dependencies
        run: |
          python -m pip install --upgrade pip
          mkdir -p /tmp/wheelhouse
          python -m pip download --dest /tmp/wheelhouse -r requirements-dev.txt
          ls -lh /tmp/wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: sg-gateway-python313-wheelhouse
          path: /tmp/wheelhouse
          retention-days: 1
          if-no-files-found: error
