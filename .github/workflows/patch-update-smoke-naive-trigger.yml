name: Patch update smoke Naive trigger
on:
  push:
    branches: [fix/02208-update-smoke-naive-trigger]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch trigger and refresh checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/update-idle-awg3-smoke.yml')
          text = p.read_text(encoding='utf-8')
          needle = '      - deploy/update-from-github.sh\n'
          assert text.count(needle) == 2
          text = text.replace(needle, needle + '      - deploy/install-naiveproxy.sh\n')
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-update-smoke-naive-trigger.yml
          git add .github/workflows/update-idle-awg3-smoke.yml
          tmp="$(mktemp)"
          git ls-files -z | while IFS= read -r -d '' f; do
            [ "$f" = "SOURCE-SHA256SUMS" ] && continue
            digest="$(sha256sum "$f" | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$f"
          done | LC_ALL=C sort -k2 > "$tmp"
          mv "$tmp" SOURCE-SHA256SUMS
          git add SOURCE-SHA256SUMS
          git commit -m 'ci: cover NaiveProxy installer in update smoke'
          git push origin HEAD:fix/02208-update-smoke-naive-trigger
