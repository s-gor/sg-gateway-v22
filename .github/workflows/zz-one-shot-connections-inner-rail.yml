name: One-shot Connections inner rail finalize

on:
  push:
    branches:
      - release/02208-rc

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Verify complete Connections layout contract
        run: python -m pytest -q tests/test_connections_layout_v24.py
      - name: Refresh source manifest and remove temporary workflows
        run: |
          git rm .github/workflows/zz-red-connections-inner-rail.yml
          git rm .github/workflows/zz-one-shot-connections-inner-rail.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          root = Path('.')
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          paths = [p for p in paths if p != 'SOURCE-SHA256SUMS']
          lines = []
          for path in paths:
              data = (root / path).read_bytes()
              lines.append(f"{hashlib.sha256(data).hexdigest()}  {path}")
          (root / 'SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git add app/web/static/sg-ui-connections-v22-08.css tests/test_connections_layout_v24.py SOURCE-SHA256SUMS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align AWG and Mihomo inner rails with NaiveProxy'
          git push
