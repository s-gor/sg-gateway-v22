name: TEMP UI cleanup source integrity v2

on:
  push:
    branches:
      - feature/02208-ui-cleanup-final

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'sg-gateway-integrity-bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/02208-ui-cleanup-final
          fetch-depth: 0

      - name: Remove temporary workflow and regenerate source integrity
        run: |
          git rm .github/workflows/_temp-ui-cleanup-source-integrity-v2.yml
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = sorted(
              path for path in subprocess.check_output(
                  ["git", "ls-files"], text=True, encoding="utf-8"
              ).splitlines()
              if path != "SOURCE-SHA256SUMS"
          )
          rows = []
          for path in tracked:
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              rows.append(f"{digest}  {path}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"regenerated {len(rows)} entries")
          PY

      - name: Commit final integrity inventory
        run: |
          git config user.name "sg-gateway-integrity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "chore: refresh UI cleanup source integrity"
          git push origin HEAD:feature/02208-ui-cleanup-final
