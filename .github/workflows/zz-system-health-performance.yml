name: Temporary System Health Performance Verifier

on:
  push:
    branches: [feature/02208-performance-clients]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-performance-clients
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Write RED contract
        run: |
          cat > tests/test_system_health_performance_02208.py <<'PY'
          from types import SimpleNamespace


          def test_system_context_collects_health_only_once(monkeypatch):
              import app.main as main

              calls = 0

              def fake_checks():
                  nonlocal calls
                  calls += 1
                  return [SimpleNamespace(status="warning")]

              monkeypatch.setattr(main, "collect_health_checks", fake_checks)
              monkeypatch.setattr(main, "health_summary", lambda: (_ for _ in ()).throw(AssertionError("system context must derive summary from collected checks")))
              monkeypatch.setattr(main, "list_connections", lambda: [])
              monkeypatch.setattr(main, "_dashboard_resources", lambda: {})
              monkeypatch.setattr(main, "count_clients", lambda: 0)
              monkeypatch.setattr(main, "list_backups", lambda: [])
              monkeypatch.setattr(main, "get_release_manifest", lambda: {})
              monkeypatch.setattr(main, "get_version", lambda: "test")

              result = main._sg_gateway_system_context()

              assert calls == 1
              assert result["report"]["health"] == "warning"
              assert len(result["health_checks"]) == 1
          PY
      - name: Prove RED
        run: |
          set +e
          python -m pytest -q tests/test_system_health_performance_02208.py
          rc=$?
          set -e
          test "$rc" -ne 0
      - name: Implement one-pass System health
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/main.py')
          s = p.read_text(encoding='utf-8')
          old = '''def _system_page_report() -> dict:\n    from datetime import datetime, timezone\n\n    return {\n        "generated_at": datetime.now(timezone.utc).isoformat(),\n        "health": health_summary(),\n        "version": get_version(),\n    }\n\n\ndef _sg_gateway_system_context() -> dict:\n    connections = list_connections()\n    return {\n        "report": _system_page_report(),\n        "health_checks": collect_health_checks(),\n        "resources": _dashboard_resources(),\n        "connections": connections,\n        "client_total": count_clients(),\n        "backup_total": len(list_backups()),\n        "release": get_release_manifest(),\n    }\n'''
          new = '''def _health_summary_from_checks(checks) -> str:\n    statuses = {str(getattr(check, "status", "warning")) for check in checks}\n    if "error" in statuses:\n        return "error"\n    if "warning" in statuses:\n        return "warning"\n    return "ok"\n\n\ndef _system_page_report(health_checks) -> dict:\n    from datetime import datetime, timezone\n\n    return {\n        "generated_at": datetime.now(timezone.utc).isoformat(),\n        "health": _health_summary_from_checks(health_checks),\n        "version": get_version(),\n    }\n\n\ndef _sg_gateway_system_context() -> dict:\n    connections = list_connections()\n    health_checks = collect_health_checks()\n    return {\n        "report": _system_page_report(health_checks),\n        "health_checks": health_checks,\n        "resources": _dashboard_resources(),\n        "connections": connections,\n        "client_total": count_clients(),\n        "backup_total": len(list_backups()),\n        "release": get_release_manifest(),\n    }\n'''
          if old not in s:
              raise SystemExit('system health context block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Prove GREEN
        run: |
          python -m pytest -q tests/test_system_health_performance_02208.py tests/test_other_pages_performance_02208.py tests/test_page_runtime_performance_02208.py
      - name: Commit verified change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py tests/test_system_health_performance_02208.py
          git rm .github/workflows/zz-system-health-performance.yml
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          files = [p for p in files if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(files)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git commit -m 'perf: avoid duplicate system health scan'
          git push origin HEAD:feature/02208-performance-clients
