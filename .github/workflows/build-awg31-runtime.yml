name: Build AWG 3.1 Runtime

on:
  push:
    branches:
      - build-awg31-runtime-20260824

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SG-Gateway
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libmnl-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Package Python test dependencies
        run: |
          python -m pip install --target "$RUNNER_TEMP/python-deps" -r requirements-dev.txt
          tar -C "$RUNNER_TEMP/python-deps" -czf "$RUNNER_TEMP/python-deps-py313.tar.gz" .

      - name: Build pinned AWG 3.1 artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/awg31-build"
          out="$RUNNER_TEMP/awg31-artifacts"
          mkdir -p "$work" "$out"
          git clone --depth 1 --branch v3.1.20260814 https://github.com/amnezia-vpn/amneziawg-go.git "$work/amneziawg-go"
          make -C "$work/amneziawg-go" amneziawg-go
          install -m 0755 "$work/amneziawg-go/amneziawg-go" "$out/amneziawg-go-linux-amd64-v3.1.20260814"
          git clone --depth 1 --branch v3.1.20260812 https://github.com/amnezia-vpn/amneziawg-tools.git "$work/amneziawg-tools-3.1.20260812"
          make -C "$work/amneziawg-tools-3.1.20260812/src" PLATFORM=linux -j"$(nproc)"
          "$work/amneziawg-tools-3.1.20260812/src/wg" --version
          tar --exclude=.git -C "$work" -czf "$out/amneziawg-tools-3.1.20260812.tar.gz" amneziawg-tools-3.1.20260812
          "$out/amneziawg-go-linux-amd64-v3.1.20260814" --version || true
          (cd "$out" && sha256sum amneziawg-tools-3.1.20260812.tar.gz amneziawg-go-linux-amd64-v3.1.20260814 > SHA256SUMS)

      - name: Package current dev-02206 source
        run: |
          git fetch --depth=1 origin dev-02206
          git archive --format=tar.gz --output "$RUNNER_TEMP/dev-02206-source.tar.gz" origin/dev-02206

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awg31-build-bundle
          path: |
            ${{ runner.temp }}/awg31-artifacts/*
            ${{ runner.temp }}/dev-02206-source.tar.gz
            ${{ runner.temp }}/python-deps-py313.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Publish build status
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          state = 'success' if os.environ.get('JOB_STATUS') == 'success' else 'failure'
          payload = json.dumps({'state': state, 'context': 'awg31-runtime/build', 'description': 'AWG 3.1 artifacts + Python deps', 'target_url': f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}', data=payload, method='POST', headers={'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}", 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status, state, sha)
          PY
