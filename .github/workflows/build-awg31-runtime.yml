name: Align AWG 3.1 Recovery Pin Test

on:
  push:
    branches: [build-awg31-runtime-20260824]

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish aligned test and source integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .github/scripts/align_awg31_pin.py /tmp/align_awg31_pin.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin dev-02206
            git checkout -B dev-02206 origin/dev-02206
            python3 /tmp/align_awg31_pin.py
            git add tests/test_sg_gateway_v22_awg3_runtime_repair.py SOURCE-SHA256SUMS
            if git diff --cached --quiet; then
              echo "No alignment change required"
              exit 0
            fi
            git commit -m "test: align AWG 3.1 recovery pin"
            if git push origin HEAD:dev-02206; then
              exit 0
            fi
            echo "Concurrent update detected; retrying ($attempt/3)" >&2
          done

          echo "Unable to publish recovery pin alignment after retries" >&2
          exit 1
