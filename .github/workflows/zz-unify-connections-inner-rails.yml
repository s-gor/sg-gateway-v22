name: Unify Connections inner rails

on:
  push:
    branches:
      - tmp/02208-unify-connections-inner-rails-v2
    paths:
      - tools/apply_connections_inner_rails_once.py
      - .github/workflows/zz-unify-connections-inner-rails.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/02208-unify-connections-inner-rails-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply alignment
        run: python tools/apply_connections_inner_rails_once.py
      - name: Remove helper files
        run: git rm tools/apply_connections_inner_rails_once.py .github/workflows/zz-unify-connections-inner-rails.yml
      - name: Refresh source integrity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          rows=[]
          for path in sorted(tracked):
              rows.append(f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
      - name: Focused tests
        run: python -m pytest -q tests/test_sg_gateway_v22_awg31_naiveproxy_compact_ui_02208.py tests/test_health.py
      - name: Commit verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ui: unify Connections inner rail geometry"
          git push origin HEAD:tmp/02208-unify-connections-inner-rails-v2
