name: Hide internal server identity address

on:
  push:
    branches:
      - feature/02208-compatible-subscription-awg31-from-good-snapshot

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-compatible-subscription-awg31-from-good-snapshot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: RED - global shell must not render internal address
        id: red
        continue-on-error: true
        run: python -m pytest -q tests/test_sg_gateway_v22_hide_awg31_internal_ui.py
      - name: Require expected RED
        shell: bash
        run: |
          if [ "${{ steps.red.outcome }}" != "failure" ]; then
            echo "Expected RED did not fail"
            exit 1
          fi
          grep -n 'server_identity.address' app/web/templates/base.html
      - name: GREEN - remove address from shared shell only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/web/templates/base.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<div class="sg-brand-note">SG-Gateway · {{ server_identity.address }}</div>', '<div class="sg-brand-note">SG-Gateway</div>')
          s = s.replace('          <span>{{ server_identity.address }}</span>\n', '')
          if 'server_identity.address' in s:
              raise SystemExit('Unexpected remaining server_identity.address in base.html')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify GREEN
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q \
            tests/test_sg_gateway_v22_hide_awg31_internal_ui.py \
            tests/test_sg_gateway_v22_client_protocol_edit_cleanup.py
      - name: Refresh SOURCE-SHA256SUMS
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          transient = '.github/workflows/zz-hide-server-identity-address.yml'
          tracked = subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p not in {'SOURCE-SHA256SUMS', transient}]
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(tracked)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/zz-hide-server-identity-address.yml
      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ui: hide internal server address from shell"
          git push origin HEAD:feature/02208-compatible-subscription-awg31-from-good-snapshot
