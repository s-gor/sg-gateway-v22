name: Finalize Reality Release Commands

on:
  push:
    branches:
      - fix/02208-reality-release-commands

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update public Clean Install source and source manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          old="dfe760756636f675934a4f085f7ddd35f336d4a7"
          new="d87663737746b91237098342f9c6c1d37856c88c"
          sed -i "s/${old}/${new}/g" README.md PUBLICATION-02208.md deploy/GITHUB-COMMANDS.md
          git rm .github/workflows/zz-finalize-reality-release-commands.yml
          tmp="$(mktemp)"
          git add README.md PUBLICATION-02208.md deploy/GITHUB-COMMANDS.md
          git ls-files -z | while IFS= read -r -d '' f; do
            [ "$f" = "SOURCE-SHA256SUMS" ] && continue
            digest="$(git show ":$f" | sha256sum | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$f"
          done | LC_ALL=C sort -k2 > "$tmp"
          mv "$tmp" SOURCE-SHA256SUMS
          git add SOURCE-SHA256SUMS
          git commit -m "docs: pin 22.08 Clean Install to Reality restore hotfix"
          git push origin HEAD:fix/02208-reality-release-commands
