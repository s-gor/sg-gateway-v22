name: Refresh AWG source integrity

on:
  push:
    branches:
      - fix/awg-export-readiness
    paths:
      - .github/workflows/refresh-awg-source-integrity.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/awg-export-readiness
          fetch-depth: 0

      - name: Refresh and verify source inventory
        run: |
          git rm -- .github/workflows/refresh-awg-source-integrity.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          tracked = [path for path in tracked if path != "SOURCE-SHA256SUMS"]
          rows = [
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
              for path in tracked
          ]
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n", encoding="utf-8"
          )

          expected = dict(row.split("  ", 1) for row in rows)
          assert set(expected) == set(tracked)
          for path, digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest
          print(f"Source integrity refreshed: {len(tracked)} files")
          PY
          git diff --check

      - name: Commit refreshed inventory
        run: |
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "chore: refresh source integrity"
          git push origin HEAD:fix/awg-export-readiness
