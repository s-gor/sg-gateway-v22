name: Fix30 update runtime preservation repair

on:
  push:
    branches: [fix30-ipv6-dual-stack]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden panel updater preservation contract
        run: python3 .github/scripts/fix30_update_preservation.py

      - name: Validate repair
        run: |
          bash -n deploy/update-from-github.sh
          python3 -m pytest -q tests/test_update_runtime_preservation_contract.py

      - name: Remove one-shot repair files and refresh source integrity
        run: |
          git rm .github/workflows/fix30-update-runtime-preservation.yml .github/scripts/fix30_update_preservation.py
          git add deploy/update-from-github.sh tests/test_update_runtime_preservation_contract.py
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}" for name in sorted(tracked)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS

      - name: Commit repair
        run: |
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Fix30: make panel update non-destructive for TLS and AWG3"
          git push origin HEAD:fix30-ipv6-dual-stack
