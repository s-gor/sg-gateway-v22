name: Clean AWG3.0 PR tree once

on:
  push:
    branches: [fix/02206-awg3-runtime-and-system-port-ui]
    paths:
      - .github/workflows/clean-awg30-pr-tree-once.yml

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02206-awg3-runtime-and-system-port-ui
          fetch-depth: 0

      - name: Restore test-mutated SQLite and verify focused contract
        run: |
          git checkout origin/dev-02206 -- data/sg-gateway.sqlite
          python -m pip install -r requirements-dev.txt >/dev/null
          python -m pytest -q \
            tests/test_sg_gateway_v22_awg30_clean_install_and_port_ui.py \
            tests/test_sg_gateway_v22_awg3_dual_contract.py \
            tests/test_sg_gateway_v22_awg3_runtime_repair.py \
            tests/test_sg_gateway_v22_awg31_preserve_existing_awg3.py \
            tests/test_sg_gateway_v22_xray_fingerprint.py \
            tests/test_xray_profile_flow_v23.py

      - name: Remove workflow and refresh integrity manifest
        run: |
          git rm .github/workflows/clean-awg30-pr-tree-once.yml
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          paths = [path for path in paths if path != "SOURCE-SHA256SUMS"]
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(
                  f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
                  for path in paths
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove test-mutated SQLite from AWG3.0 fix"
          git push origin HEAD:fix/02206-awg3-runtime-and-system-port-ui
