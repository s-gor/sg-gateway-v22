name: Refresh feature source integrity once

on:
  push:
    branches:
      - feature/02206-client-device-dialog-final

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/02206-client-device-dialog-final
          fetch-depth: 0

      - name: Refresh manifest and remove helper
        run: |
          rm -f .github/workflows/refresh-feature-source-integrity-once.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ['git', 'ls-files'], text=True, encoding='utf-8'
          ).splitlines()
          tracked = [
              path for path in tracked
              if path != 'SOURCE-SHA256SUMS' and Path(path).is_file()
          ]
          rows = [
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
              for path in tracked
          ]
          Path('SOURCE-SHA256SUMS').write_text(
              '\n'.join(rows) + '\n', encoding='utf-8'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A SOURCE-SHA256SUMS .github/workflows/refresh-feature-source-integrity-once.yml
          git commit -m "chore: refresh feature source integrity"
          git push origin HEAD:feature/02206-client-device-dialog-final
