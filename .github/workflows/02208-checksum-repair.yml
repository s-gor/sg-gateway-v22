name: 022.08 checksum repair

on:
  push:
    branches:
      - release/02208-rc

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 's-gor/sg-gateway-v22'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 22.08 release branch
        uses: actions/checkout@v4
        with:
          ref: release/02208-rc
          fetch-depth: 0

      - name: Regenerate source integrity inventory and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/02208-checksum-repair.yml
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = sorted(
              path
              for path in subprocess.check_output(
                  ["git", "ls-files"], text=True, encoding="utf-8"
              ).splitlines()
              if path != "SOURCE-SHA256SUMS"
          )
          rows = []
          for path in tracked:
              data = Path(path).read_bytes()
              rows.append(f"{hashlib.sha256(data).hexdigest()}  {path}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"regenerated SOURCE-SHA256SUMS: {len(rows)} tracked files")
          PY
          git add SOURCE-SHA256SUMS
          git diff --cached --check
          git status --short

      - name: Commit repaired inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "ci: refresh 022.08 source checksum inventory"
          git push origin HEAD:release/02208-rc
