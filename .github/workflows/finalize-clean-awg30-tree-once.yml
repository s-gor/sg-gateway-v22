name: Finalize clean AWG3.0 tree once

on:
  push:
    branches: [fix/02206-awg3-runtime-and-system-port-ui]
    paths:
      - .github/workflows/finalize-clean-awg30-tree-once.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02206-awg3-runtime-and-system-port-ui
          fetch-depth: 0

      - name: Restore SQLite as the final content operation
        run: |
          git checkout origin/dev-02206 -- data/sg-gateway.sqlite
          git rm .github/workflows/finalize-clean-awg30-tree-once.yml
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          paths = [path for path in paths if path != "SOURCE-SHA256SUMS"]
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(
                  f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
                  for path in paths
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit final clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize clean AWG3.0 PR tree"
          git push origin HEAD:fix/02206-awg3-runtime-and-system-port-ui
