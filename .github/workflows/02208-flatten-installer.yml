name: 022.08 flatten installer

on:
  push:
    branches:
      - release/02208-rc

permissions:
  contents: write

jobs:
  flatten:
    if: github.repository == 's-gor/sg-gateway-v22'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 22.08 release branch
        uses: actions/checkout@v4
        with:
          ref: release/02208-rc
          fetch-depth: 0

      - name: Flatten installer and refresh source inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          root = Path('.')
          core_path = root / 'deploy/install-core-02208.sh'
          master_path = root / 'install.sh'
          core = core_path.read_text(encoding='utf-8')
          master = master_path.read_text(encoding='utf-8')

          guard = '\nif [[ "${BASH_SOURCE[0]}" == "$0" ]]; then\n  main "$@"\nfi\n'
          assert core.endswith(guard), 'core source-safe guard not found'
          core = core[:-len(guard)].rstrip() + '\n'
          core = core.replace(
              'INSTALLER_BUILD="02208-full-clean-dual-stack"',
              'INSTALLER_BUILD="02208-unified-24stage"',
              1,
          )
          core = core.replace('TOTAL_STAGES=10', 'TOTAL_STAGES=24', 1)

          constants_start = master.index('NAIVEPROXY_VERSION=')
          constants_end = master.index('# First-class rollback ownership.', constants_start)
          naive_constants = master[constants_start:constants_end].strip()

          overrides_start = master.index('create_backup() {')
          main_start = master.index('\nmain() {', overrides_start) + 1
          overrides = master[overrides_start:main_start].strip()
          new_main = master[main_start:].strip()
          assert new_main.endswith('main "$@"'), 'unguarded master entrypoint not found'
          new_main = new_main[:-len('main "$@"')].rstrip() + guard

          managed = '''# NaiveProxy is part of the same transaction as every other 22.08 runtime.
          MANAGED_PATHS+=(
            etc/systemd/system/sg-gateway-naiveproxy.service
            etc/sg-gateway/naiveproxy
            var/lib/sg-gateway/naiveproxy
            opt/sg-gateway/naiveproxy
          )'''

          flat = (
              core.rstrip()
              + '\n\n'
              + naive_constants
              + '\n\n'
              + managed
              + '\n\n'
              + overrides
              + '\n\n'
              + new_main.lstrip()
          )

          flat = flat.replace(
              'local work archive candidate binary_sha256\n',
              'local work archive candidate binary_sha256 candidate_modules\n',
              1,
          )
          flat = flat.replace(
              '  "$candidate" list-modules | grep -qx \'http.handlers.forward_proxy\'\n',
              '  candidate_modules="$("$candidate" list-modules)"\n'
              '  grep -Fx \'http.handlers.forward_proxy\' <<<"$candidate_modules" >/dev/null\n',
              1,
          )
          flat = flat.replace(
              '  "$NAIVEPROXY_PREFIX/bin/caddy" list-modules | grep -qx \'http.handlers.forward_proxy\'\n',
              '  local installed_modules=""\n'
              '  installed_modules="$("$NAIVEPROXY_PREFIX/bin/caddy" list-modules)"\n'
              '  grep -Fx \'http.handlers.forward_proxy\' <<<"$installed_modules" >/dev/null\n',
              1,
          )

          assert 'source "$MASTER_ROOT/deploy/install-core-02208.sh"' not in flat
          assert 'TOTAL_STAGES=24' in flat
          assert 'run_interactive_stage 2 "Определение режима и параметров" stage_prepare_install_context' in flat
          assert 'run_stage 11 "NaiveProxy runtime" stage_naiveproxy_runtime' in flat
          assert '| grep -q' not in flat
          assert flat.endswith(guard)
          master_path.write_text(flat, encoding='utf-8', newline='\n')
          PY

          git rm deploy/install-core-02208.sh
          git rm .github/workflows/02208-flatten-installer.yml

          bash -n install.sh
          ! grep -Fq 'source "$MASTER_ROOT/deploy/install-core-02208.sh"' install.sh
          grep -Fq 'TOTAL_STAGES=24' install.sh
          grep -Fq 'run_stage 11 "NaiveProxy runtime" stage_naiveproxy_runtime' install.sh
          grep -Fq 'if [[ "${BASH_SOURCE[0]}" == "$0" ]]; then' install.sh

          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = sorted(
              path
              for path in subprocess.check_output(
                  ['git', 'ls-files'], text=True, encoding='utf-8'
              ).splitlines()
              if path != 'SOURCE-SHA256SUMS'
          )
          rows = []
          for path in tracked:
              data = Path(path).read_bytes()
              rows.append(f'{hashlib.sha256(data).hexdigest()}  {path}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f'regenerated SOURCE-SHA256SUMS: {len(rows)} tracked files')
          PY

          git add install.sh SOURCE-SHA256SUMS tests/test_connections_layout_v24.py
          git diff --cached --check
          git status --short

      - name: Commit single-layer installer
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: restore single-layer 24-stage installer"
          git push origin HEAD:release/02208-rc
