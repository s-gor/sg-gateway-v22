name: Temporary Other Pages Performance Verifier

on:
  push:
    branches: [feature/02208-performance-clients]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-performance-clients
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Write RED contracts
        run: |
          cat > tests/test_other_pages_performance_02208.py <<'PY'
          from types import SimpleNamespace


          def test_server_identity_reuses_recent_lookup(monkeypatch):
              import app.main as main

              calls = {"connections": 0, "geo": 0}

              def fake_connections():
                  calls["connections"] += 1
                  return []

              def fake_geo(address):
                  calls["geo"] += 1
                  return "fr"

              monkeypatch.setattr(main, "list_connections", fake_connections)
              monkeypatch.setattr(main, "lookup_country_code", fake_geo)
              config = SimpleNamespace(
                  public_address="performance-cache.example.invalid",
                  host="127.0.0.1",
                  country_code="unknown",
                  server_name="Performance test",
              )

              first = main._sg_gateway_server_identity(config)
              second = main._sg_gateway_server_identity(config)

              assert first == second
              assert calls == {"connections": 1, "geo": 1}


          def test_system_context_does_not_build_full_diagnostic_report(monkeypatch):
              import app.main as main

              def forbidden_diagnostic():
                  raise AssertionError("full diagnostics must not run during ordinary System page rendering")

              monkeypatch.setattr(main, "build_diagnostic_report", forbidden_diagnostic)
              monkeypatch.setattr(main, "health_summary", lambda: "ok")
              monkeypatch.setattr(main, "_dashboard_resources", lambda: {})
              monkeypatch.setattr(main, "list_connections", lambda: [])
              monkeypatch.setattr(main, "count_clients", lambda: 7)
              monkeypatch.setattr(main, "list_backups", lambda: [])
              monkeypatch.setattr(main, "get_release_manifest", lambda: {"status": "STABLE"})
              monkeypatch.setattr(main, "get_version", lambda: "0.1.0-test")

              context = main._sg_gateway_system_context()

              assert context["report"]["health"] == "ok"
              assert context["report"]["version"] == "0.1.0-test"
              assert context["report"]["generated_at"]
              assert context["client_total"] == 7
          PY
      - name: Prove RED
        run: |
          set +e
          python -m pytest -q tests/test_other_pages_performance_02208.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'Expected RED but tests passed'
            exit 1
          fi
          echo 'RED confirmed'
      - name: Implement lightweight page context
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/main.py')
          text = path.read_text(encoding='utf-8')

          old_identity = '''def _sg_gateway_server_identity(config) -> dict:\n    address = config.public_address or config.host\n    configured_code = normalize_country_code(getattr(config, "country_code", "unknown"))\n    code = configured_code\n    try:\n        connections = list_connections()\n        selected = connections[0] if connections else None\n        if selected is not None:\n            settings = get_connection_settings(selected.name)\n            address = settings.host or address\n        if code == "unknown":\n            code = lookup_country_code(address)\n    except Exception:\n        pass\n    return {\n        "name": getattr(config, "server_name", "SG-Gateway") or "SG-Gateway",\n        "address": address,\n        "country_code": normalize_country_code(code),\n        "country_name": country_name(code),\n    }\n'''
          new_identity = '''_SERVER_IDENTITY_TTL_SECONDS = 15.0\n_SERVER_IDENTITY_CACHE: dict[str, object] = {\n    "key": None,\n    "updated_at": 0.0,\n    "value": None,\n}\n\n\ndef _sg_gateway_server_identity(config) -> dict:\n    cache_key = (\n        str(getattr(config, "server_name", "") or ""),\n        str(getattr(config, "public_address", "") or ""),\n        str(getattr(config, "host", "") or ""),\n        normalize_country_code(getattr(config, "country_code", "unknown")),\n    )\n    now = time.monotonic()\n    cached_value = _SERVER_IDENTITY_CACHE.get("value")\n    if (\n        _SERVER_IDENTITY_CACHE.get("key") == cache_key\n        and isinstance(cached_value, dict)\n        and now - float(_SERVER_IDENTITY_CACHE.get("updated_at") or 0.0) < _SERVER_IDENTITY_TTL_SECONDS\n    ):\n        return dict(cached_value)\n\n    address = config.public_address or config.host\n    configured_code = normalize_country_code(getattr(config, "country_code", "unknown"))\n    code = configured_code\n    try:\n        connections = list_connections()\n        selected = connections[0] if connections else None\n        if selected is not None:\n            settings = get_connection_settings(selected.name)\n            address = settings.host or address\n        if code == "unknown":\n            code = lookup_country_code(address)\n    except Exception:\n        pass\n    result = {\n        "name": getattr(config, "server_name", "SG-Gateway") or "SG-Gateway",\n        "address": address,\n        "country_code": normalize_country_code(code),\n        "country_name": country_name(code),\n    }\n    _SERVER_IDENTITY_CACHE["key"] = cache_key\n    _SERVER_IDENTITY_CACHE["updated_at"] = now\n    _SERVER_IDENTITY_CACHE["value"] = dict(result)\n    return result\n'''
          if old_identity not in text:
              raise SystemExit('server identity block not found')
          text = text.replace(old_identity, new_identity, 1)

          old_system = '''def _sg_gateway_system_context() -> dict:\n    connections = list_connections()\n    return {\n        "report": build_diagnostic_report(),\n        "health_checks": collect_health_checks(),\n        "resources": _dashboard_resources(),\n        "connections": connections,\n        "client_total": count_clients(),\n        "backup_total": len(list_backups()),\n        "release": get_release_manifest(),\n    }\n'''
          new_system = '''def _system_page_report() -> dict:\n    from datetime import datetime, timezone\n\n    return {\n        "generated_at": datetime.now(timezone.utc).isoformat(),\n        "health": health_summary(),\n        "version": get_version(),\n    }\n\n\ndef _sg_gateway_system_context() -> dict:\n    connections = list_connections()\n    return {\n        "report": _system_page_report(),\n        "health_checks": collect_health_checks(),\n        "resources": _dashboard_resources(),\n        "connections": connections,\n        "client_total": count_clients(),\n        "backup_total": len(list_backups()),\n        "release": get_release_manifest(),\n    }\n'''
          if old_system not in text:
              raise SystemExit('system context block not found')
          text = text.replace(old_system, new_system, 1)
          path.write_text(text, encoding='utf-8')

          template = Path('app/web/templates/system.html')
          html = template.read_text(encoding='utf-8')
          stale = '''{% set hostd_label = {'ok':'Работает', 'warning':'Предупреждение', 'error':'Ошибка'}.get(report.hostd.status, report.hostd.status) %}\n'''
          if stale not in html:
              raise SystemExit('unused hostd template line not found')
          template.write_text(html.replace(stale, '', 1), encoding='utf-8')
          PY
      - name: Prove GREEN
        run: |
          python -m pytest -q tests/test_other_pages_performance_02208.py tests/test_page_runtime_performance_02208.py tests/test_clients_performance_02208.py tests/test_auth.py
          python -m pytest -q tests -k 'system_page or dashboard_resources or server_identity' --tb=short
      - name: Commit verified product change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py app/web/templates/system.html tests/test_other_pages_performance_02208.py
          git rm .github/workflows/zz-other-pages-performance.yml
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          files = [p for p in files if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(files)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git commit -m 'perf: lighten system and global page context'
          git push origin HEAD:feature/02208-performance-clients
