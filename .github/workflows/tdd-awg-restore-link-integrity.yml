name: TDD AWG restore link integrity
on:
  push:
    branches: [fix/02208-awg-restore-link-integrity]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_awg_restore_link_integrity_02208.py
