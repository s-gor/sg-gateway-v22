name: Mihomo hidden metadata checksum refresh

on:
  push:
    branches:
      - fix/02206-remove-mihomo-fixed-metadata
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'chore: refresh Mihomo source checksum' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: >-
          python -m pytest -q
          tests/test_sg_gateway_v22_server_managed_ports.py
          tests/test_sg_gateway_v22_mihomo_panel_cleanup_ui.py
      - name: Refresh tracked source checksum
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          manifest = Path("SOURCE-SHA256SUMS")
          target = "app/web/templates/_mihomo_panel.html"
          digest = sha256(Path(target).read_bytes()).hexdigest()
          lines = manifest.read_text(encoding="utf-8").splitlines()
          matches = [i for i, line in enumerate(lines) if line.endswith("  " + target)]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one checksum entry for {target}, found {len(matches)}")
          lines[matches[0]] = f"{digest}  {target}"
          manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"{digest}  {target}")
          PY
          git diff --check
          git diff -- SOURCE-SHA256SUMS
      - name: Commit checksum
        run: |
          git config user.name "Ser.Gor"
          git config user.email "293675787+s-gor@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh Mihomo source checksum"
          git push
