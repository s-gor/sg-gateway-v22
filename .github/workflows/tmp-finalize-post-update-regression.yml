name: tmp-finalize-post-update-regression

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix-update-production-wsgi-02204e'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-update-production-wsgi-02204e
          fetch-depth: 0
      - name: Finalize clean fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git show origin/main:app/version.py > app/version.py
          git show origin/main:tests/test_sg_gateway_v22_production_entrypoint_v4.py > tests/test_sg_gateway_v22_production_entrypoint_v4.py
          rm -f app/production_compat.py

          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('app/main.py')
          main = main_path.read_text(encoding='utf-8')
          old = 'from pathlib import Path\nfrom flask import Flask, Response, abort, flash, jsonify, redirect, render_template, request, send_file, url_for\n'
          new = 'from pathlib import Path\nfrom urllib.parse import urlsplit\nfrom flask import Flask, Response, abort, flash, jsonify, redirect, render_template, request, send_file, url_for\n'
          if old not in main:
              raise SystemExit('main import anchor not found')
          main = main.replace(old, new, 1)

          anchor = '''def country_name(code: str | None) -> str:\n    return COUNTRY_NAMES.get(normalize_country_code(code), COUNTRY_NAMES["unknown"])\n\n\n'''
          helper = '''def country_name(code: str | None) -> str:\n    return COUNTRY_NAMES.get(normalize_country_code(code), COUNTRY_NAMES["unknown"])\n\n\ndef _safe_login_next(value: str | None) -> str:\n    target = str(value or "/").strip() or "/"\n    parsed = urlsplit(target)\n    if parsed.scheme or parsed.netloc or not target.startswith("/") or target.startswith("//"):\n        return "/"\n\n    stale_client = re.fullmatch(r"/clients/(\\d+)", parsed.path)\n    if stale_client and get_client(int(stale_client.group(1))) is None:\n        return "/clients"\n    return target\n\n\n'''
          if anchor not in main:
              raise SystemExit('country_name anchor not found')
          main = main.replace(anchor, helper, 1)

          old = '''    @app.post("/login")\n    def login_post():\n        next_url = request.form.get("next") or "/"\n        if verify_password(request.form.get("password", "")):\n            login_user()\n            return redirect(next_url)\n        return render_template("login.html", error=True, next_url=next_url), 401\n'''
          new = '''    @app.post("/login")\n    def login_post():\n        next_url = _safe_login_next(request.form.get("next"))\n        if verify_password(request.form.get("password", "")):\n            login_user()\n            return redirect(next_url)\n        return render_template("login.html", error=True, next_url=next_url), 401\n'''
          if old not in main:
              raise SystemExit('login_post anchor not found')
          main = main.replace(old, new, 1)
          main_path.write_text(main, encoding='utf-8', newline='\n')

          updater_path = Path('deploy/update-from-github.sh')
          text = updater_path.read_text(encoding='utf-8')
          old = 'PANEL_SERVICE="sg-gateway.service"\nHOSTD_SERVICE="sg-hostd.service"\n'
          new = 'PANEL_SERVICE="sg-gateway.service"\nPANEL_PRODUCTION_WSGI="app.production:app"\nHOSTD_SERVICE="sg-hostd.service"\n'
          if old not in text:
              raise SystemExit('updater service anchor not found')
          text = text.replace(old, new, 1)

          old = '''panel_wsgi_target() {\n  local raw\n  raw="$(systemctl show -p ExecStart --value "$PANEL_SERVICE" 2>/dev/null || true)"\n  python3 - "$raw" <<'PYWSGITARGET'\nimport re\nimport sys\n\nraw = sys.argv[1]\nitems = re.findall(\n    r"(?<![A-Za-z0-9_.])([A-Za-z_]\\w*(?:\\.[A-Za-z_]\\w*)*:[A-Za-z_]\\w*)(?![A-Za-z0-9_])",\n    raw,\n)\nprint(items[-1] if items else "app.production:app")\nPYWSGITARGET\n}\n'''
          new = '''installed_panel_wsgi_target() {\n  local raw\n  raw="$(systemctl show -p ExecStart --value "$PANEL_SERVICE" 2>/dev/null || true)"\n  python3 - "$raw" <<'PYWSGITARGET'\nimport re\nimport sys\n\nraw = sys.argv[1]\nitems = re.findall(\n    r"(?<![A-Za-z0-9_.])([A-Za-z_]\\w*(?:\\.[A-Za-z_]\\w*)*:[A-Za-z_]\\w*)(?![A-Za-z0-9_])",\n    raw,\n)\nprint(items[-1] if items else "")\nPYWSGITARGET\n}\n\npanel_wsgi_target() {\n  printf '%s\\n' "$PANEL_PRODUCTION_WSGI"\n}\n\n# SG_GATEWAY_02204E_UPDATE_PRODUCTION_WSGI_FIX1\nmigrate_panel_wsgi_service() {\n  local unit="/etc/systemd/system/sg-gateway.service"\n  local current after\n  [[ -f "$unit" ]] || fail "panel systemd unit is missing: $unit"\n\n  current="$(installed_panel_wsgi_target)"\n  if [[ "$current" == "$PANEL_PRODUCTION_WSGI" ]]; then\n    printf '[SG-Gateway Update] Panel WSGI target: %s (already current).\\n' "$current"\n    return 0\n  fi\n  [[ -n "$current" ]] || fail "cannot determine installed panel WSGI target"\n\n  python3 - "$unit" "$PANEL_PRODUCTION_WSGI" <<'PYMIGRATEWSGI'\nimport re\nimport sys\nfrom pathlib import Path\n\npath = Path(sys.argv[1])\ntarget = sys.argv[2]\nbody = path.read_text(encoding="utf-8")\nlines = body.splitlines(keepends=True)\npattern = re.compile(\n    r"(?<![A-Za-z0-9_.])([A-Za-z_]\\w*(?:\\.[A-Za-z_]\\w*)*:[A-Za-z_]\\w*)(?![A-Za-z0-9_])"\n)\nhits = []\nfor index, line in enumerate(lines):\n    if not line.startswith("ExecStart="):\n        continue\n    matches = list(pattern.finditer(line))\n    if len(matches) == 1:\n        hits.append((index, matches[0]))\nif len(hits) != 1:\n    raise SystemExit(f"expected exactly one WSGI target in ExecStart, found {len(hits)}")\nindex, match = hits[0]\nline = lines[index]\nlines[index] = line[:match.start()] + target + line[match.end():]\npath.write_text("".join(lines), encoding="utf-8", newline="")\nPYMIGRATEWSGI\n\n  systemctl daemon-reload\n  after="$(installed_panel_wsgi_target)"\n  [[ "$after" == "$PANEL_PRODUCTION_WSGI" ]] || \\\n    fail "panel WSGI migration failed: expected $PANEL_PRODUCTION_WSGI, got ${after:-unknown}"\n  printf '[SG-Gateway Update] Panel WSGI migrated: %s -> %s\\n' "$current" "$after"\n}\n'''
          if old not in text:
              raise SystemExit('updater WSGI anchor not found')
          text = text.replace(old, new, 1)

          old = '''module = importlib.import_module(module_name)\ngetattr(module, object_name)\nprint(f"Panel WSGI import: OK ({target}) with isolated data/log")\n'''
          new = '''module = importlib.import_module(module_name)\napplication = getattr(module, object_name)\nif target == "app.production:app":\n    with application.test_request_context("/"):\n        context = {}\n        for processor in application.template_context_processors[None]:\n            context.update(processor())\n    required = (\n        "sg_subscription_universal_url",\n        "sg_subscription_native_url",\n        "router_subscription_url",\n        "openwrt_subscription_url",\n        "keenetic_subscription_url",\n    )\n    missing = [name for name in required if not callable(context.get(name))]\n    if missing:\n        raise SystemExit(\n            "production WSGI is missing required template context: " + ", ".join(missing)\n        )\n    print("Production template context: OK")\nprint(f"Panel WSGI import: OK ({target}) with isolated data/log")\n'''
          if old not in text:
              raise SystemExit('deployed WSGI validation anchor not found')
          text = text.replace(old, new, 1)

          old = '''  runuser -u sg-gateway -- "$PREFIX/.venv/bin/python" -c \\\n    'import flask, jinja2, waitress; print("Python runtime: OK")'\n}\n\nrestart_panel() {\n'''
          new = '''  runuser -u sg-gateway -- "$PREFIX/.venv/bin/python" -c \\\n    'import flask, jinja2, waitress; print("Python runtime: OK")'\n\n  migrate_panel_wsgi_service\n}\n\nrestart_panel() {\n'''
          if old not in text:
              raise SystemExit('deploy_source migration hook anchor not found')
          text = text.replace(old, new, 1)

          old = '''  systemctl is-active --quiet "$HOSTD_SERVICE"\n  systemctl is-active --quiet "$PANEL_SERVICE"\n  systemctl is-active --quiet nginx.service\n}\n'''
          new = '''  systemctl is-active --quiet "$HOSTD_SERVICE"\n  systemctl is-active --quiet "$PANEL_SERVICE"\n  systemctl is-active --quiet nginx.service\n  [[ "$(installed_panel_wsgi_target)" == "$PANEL_PRODUCTION_WSGI" ]] || \\\n    fail "panel service is not running the production WSGI entrypoint"\n}\n'''
          if old not in text:
              raise SystemExit('verify_final WSGI anchor not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              'run_stage 3 "Обновление только исходников SG-Gateway" deploy_source "$SOURCE_DIR"',
              'run_stage 3 "Обновление исходников SG-Gateway + WSGI migration" deploy_source "$SOURCE_DIR"',
              1,
          )
          updater_path.write_text(text, encoding='utf-8', newline='\n')

          test_path = Path('tests/test_sg_gateway_v22_clean_install_production_wsgi.py')
          test = test_path.read_text(encoding='utf-8')
          addition = '''\n\ndef test_update_migrates_historical_panel_wsgi_to_production() -> None:\n    updater = (ROOT / "deploy/update-from-github.sh").read_text(encoding="utf-8")\n    assert 'PANEL_PRODUCTION_WSGI="app.production:app"' in updater\n    assert "installed_panel_wsgi_target()" in updater\n    assert "migrate_panel_wsgi_service()" in updater\n    assert 'local unit="/etc/systemd/system/sg-gateway.service"' in updater\n    assert "systemctl daemon-reload" in updater\n    deploy = updater[updater.index("deploy_source() {"):updater.index("restart_panel() {")]\n    assert "migrate_panel_wsgi_service" in deploy\n    assert '[[ "$(installed_panel_wsgi_target)" == "$PANEL_PRODUCTION_WSGI" ]]' in updater\n    for helper in (\n        "sg_subscription_universal_url",\n        "sg_subscription_native_url",\n        "router_subscription_url",\n        "openwrt_subscription_url",\n        "keenetic_subscription_url",\n    ):\n        assert f'"{helper}"' in updater\n'''
          if 'def test_update_migrates_historical_panel_wsgi_to_production' not in test:
              test_path.write_text(test.rstrip() + addition + '\n', encoding='utf-8', newline='\n')

          login_test = Path('tests/test_auth.py')
          auth = login_test.read_text(encoding='utf-8')
          addition = '''\n\ndef test_safe_login_next_rejects_external_and_missing_client(monkeypatch):\n    import app.main as main\n\n    monkeypatch.setattr(main, "get_client", lambda client_id: None if client_id == 999999 else object())\n    assert main._safe_login_next("https://example.invalid/path") == "/"\n    assert main._safe_login_next("//example.invalid/path") == "/"\n    assert main._safe_login_next("/clients/999999") == "/clients"\n    assert main._safe_login_next("/clients/2") == "/clients/2"\n    assert main._safe_login_next("/maintenance?tab=updates") == "/maintenance?tab=updates"\n'''
          if 'def test_safe_login_next_rejects_external_and_missing_client' not in auth:
              login_test.write_text(auth.rstrip() + addition + '\n', encoding='utf-8', newline='\n')
          PY

          git rm .github/workflows/tmp-finalize-post-update-regression.yml

          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          rows = []
          for path in paths:
              if path == 'SOURCE-SHA256SUMS':
                  continue
              file = Path(path)
              if not file.is_file():
                  continue
              rows.append(f"{hashlib.sha256(file.read_bytes()).hexdigest()}  {path}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
          PY

          bash -n deploy/update-from-github.sh
          python3 -m compileall -q app tests
          git add -A
          git diff --cached --check
          git config user.name 'SG-Gateway CI'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Fix post-update WSGI migration and stale login redirect'
          git push origin HEAD:fix-update-production-wsgi-02204e
