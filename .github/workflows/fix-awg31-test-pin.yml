name: Fix AWG 3.1 Test Pin

on:
  push:
    branches:
      - fix-awg31-test-pin-20260825

permissions:
  contents: write
  statuses: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout current dev-02206
        run: |
          git fetch origin dev-02206
          git checkout -B dev-02206 origin/dev-02206

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Update test pin and source integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import hashlib
          import re
          import subprocess
          from pathlib import Path

          repair = Path('deploy/repair-awg3-runtime.sh').read_text(encoding='utf-8')
          match = re.search(r'^VENDOR_COMMIT="([0-9a-f]{40})"$', repair, re.MULTILINE)
          if match is None:
              raise SystemExit('AWG3 VENDOR_COMMIT not found')
          commit = match.group(1)

          test_path = Path('tests/test_sg_gateway_v22_awg3_runtime_repair.py')
          text = test_path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'assert \'VENDOR_COMMIT="[0-9a-f]{40}"\' in body',
              f'assert \'VENDOR_COMMIT="{commit}"\' in body',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('unable to update AWG3 recovery test pin')
          test_path.write_text(updated, encoding='utf-8')

          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [path for path in tracked if path != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in tracked]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

          python -m pytest tests/test_sg_gateway_v22_awg3_runtime_repair.py
          python -m pytest tests

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_sg_gateway_v22_awg3_runtime_repair.py SOURCE-SHA256SUMS
          git commit -m "test: align AWG 3.1 recovery pin"

          REMOTE_SHA="$(git ls-remote origin refs/heads/dev-02206 | awk '{print $1}')"
          test "$REMOTE_SHA" = "$BASE_SHA"
          git push origin HEAD:dev-02206
          echo "DEV_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish helper status
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          state = 'success' if os.environ.get('JOB_STATUS') == 'success' else 'failure'
          payload = json.dumps({
              'state': state,
              'context': 'awg31-test-pin/fix',
              'description': 'align AWG 3.1 recovery pin and source integrity',
              'target_url': f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode('utf-8')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status, state, sha)
          PY
