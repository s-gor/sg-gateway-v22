name: Temporary Connections final grid apply

on:
  push:
    branches:
      - fix/02207-connections-final-grid-align

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/02207-connections-final-grid-align

      - name: Apply geometry and refresh source integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/tmp-connections-final-grid-apply.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          css_path = Path("app/web/static/sg-connections-unified-v1.css")
          css = css_path.read_text(encoding="utf-8")

          replacements = [
              (
                  "body.page-connections #xray-xmux.xmux1-wrap {\n  margin-top: 0;\n  padding: 0;",
                  "body.page-connections #xray-xmux.xmux1-wrap {\n  margin-top: 0;\n  margin-inline: calc(var(--sgui-card-padding) * 2);\n  padding: 0;",
              ),
              (
                  "body.page-connections #mihomo .mhv2-compact-meta {\n  margin-top: 0;",
                  "body.page-connections #mihomo .mhv2-compact-meta {\n  margin-inline: calc(var(--sgui-card-padding) * 2);\n  margin-top: 0;",
              ),
              (
                  "body.page-connections #mihomo .mhv2-form {\n  margin-top: 0;",
                  "body.page-connections #mihomo .mhv2-form {\n  margin-inline: var(--sgui-card-padding);\n  margin-top: 0;",
              ),
              (
                  "body.page-connections .xps2-naiveproxy-card {\n  border-radius: var(--sgui-radius-card);\n}\n\nbody.page-connections .xps2-naiveproxy-meta {",
                  "body.page-connections .xps2-naiveproxy-card {\n  min-height: 104px;\n  align-items: center;\n  padding-block: var(--sgui-card-padding);\n  border-radius: var(--sgui-radius-card);\n}\n\nbody.page-connections .xps2-naiveproxy-copy {\n  display: grid;\n  align-content: center;\n}\n\nbody.page-connections .xps2-naiveproxy-meta {",
              ),
              (
                  "@media (max-width: 650px) {\n  body.page-connections #xray-xmux.xmux1-wrap {\n    padding: 0;",
                  "@media (max-width: 650px) {\n  body.page-connections #xray-xmux.xmux1-wrap {\n    margin-inline: 0;\n    padding: 0;",
              ),
              (
                  "  body.page-connections #mihomo .mhv2-runtime-note {\n    margin-bottom: var(--sgui-nested-padding);\n  }",
                  "  body.page-connections #mihomo .mhv2-compact-meta {\n    margin-inline: var(--sgui-nested-padding);\n  }\n\n  body.page-connections #mihomo .mhv2-runtime-note {\n    margin-bottom: var(--sgui-nested-padding);\n  }",
              ),
          ]

          for old, new in replacements:
              if css.count(old) != 1:
                  raise SystemExit(f"expected exactly one CSS match for: {old!r}; got {css.count(old)}")
              css = css.replace(old, new, 1)
          css_path.write_text(css, encoding="utf-8")

          density_path = Path("tests/test_sg_gateway_v22_connections_density_polish.py")
          density = density_path.read_text(encoding="utf-8")
          old = 'assert "body.page-connections #xray-xmux.xmux1-wrap {\\n    padding: 0;" in css'
          new = 'assert "body.page-connections #xray-xmux.xmux1-wrap {\\n    margin-inline: 0;\\n    padding: 0;" in css'
          if density.count(old) != 1:
              raise SystemExit(f"expected one density-test match; got {density.count(old)}")
          density_path.write_text(density.replace(old, new, 1), encoding="utf-8")

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [item.decode("utf-8") for item in raw.split(b"\0") if item]
          lines = []
          for name in paths:
              if name in {"SOURCE-SHA256SUMS", ".github/workflows/tmp-connections-final-grid-apply.yml"}:
                  continue
              digest = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}\n")
          Path("SOURCE-SHA256SUMS").write_text("".join(lines), encoding="utf-8")
          PY
          git add app/web/static/sg-connections-unified-v1.css \
                  tests/test_sg_gateway_v22_connections_density_polish.py \
                  SOURCE-SHA256SUMS
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: align final Connections grid geometry"
          git push origin HEAD:fix/02207-connections-final-grid-align
