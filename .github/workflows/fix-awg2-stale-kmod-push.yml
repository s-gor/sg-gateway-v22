name: Direct AWG2 stale-kmod repair

on:
  push:
    branches: [fix-awg2-stale-kmod-clean-install]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-awg2-stale-kmod-clean-install
          fetch-depth: 0

      - name: Patch installer, updater guard, uninstall and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          installer = Path('install.sh')
          text = installer.read_text(encoding='utf-8')

          old_ready = '''amneziawg_runtime_ready() {
            command -v awg >/dev/null 2>&1 || return 1
            awg --version >/dev/null 2>&1 || return 1
            modinfo amneziawg >/dev/null 2>&1 || return 1
            return 0
          }
          '''
          new_ready = '''amneziawg_runtime_ready() {
            command -v awg >/dev/null 2>&1 || return 1
            local tools_version="" module_version="" loaded_version=""
            tools_version="$(awg --version 2>/dev/null || true)"
            module_version="$(modinfo -F version amneziawg 2>/dev/null || true)"
            loaded_version="$(cat /sys/module/amneziawg/version 2>/dev/null || true)"
            [[ "$tools_version" == *"v1."* ]] || return 1
            [[ "$module_version" =~ ^1\\. ]] || return 1
            [[ -z "$loaded_version" || "$loaded_version" =~ ^1\\. ]] || return 1
            return 0
          }
          '''
          if old_ready not in text:
              raise SystemExit('amneziawg_runtime_ready anchor not found')
          text = text.replace(old_ready, new_ready, 1)

          old_block = '''  echo "AmneziaWG kernel module ${AMNEZIAWG_KMOD_VERSION}: DKMS из локального source"
            local dkms_existing=""
            dkms_existing="$(dkms status -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" 2>/dev/null || true)"
            if [[ -n "$dkms_existing" ]]; then
              dkms remove -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" --all || true
            fi
            # DKMS can leave this directory behind even when `dkms status` is empty.
            # Removing only our pinned module/version makes repeated clean installs idempotent.
            rm -rf "/var/lib/dkms/amneziawg/${AMNEZIAWG_DKMS_VERSION}"
            rm -rf "/usr/src/amneziawg-${AMNEZIAWG_DKMS_VERSION}"
            make -C "$kmod_src/src" dkms-install PREFIX=/usr
            dkms add -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"
            dkms build -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"
            dkms install -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"
            modprobe amneziawg
            modinfo amneziawg
            rm -rf "$temp"
          '''
          new_block = '''  echo "AmneziaWG kernel module ${AMNEZIAWG_KMOD_VERSION}: DKMS из локального source"

            # A failed/experimental AWG3 installation can leave a 3.x module file
            # after DKMS bookkeeping has disappeared.  DKMS then reports our 1.0.0
            # package as already installed and silently keeps that incompatible
            # module.  Frozen AWG2 userspace later fails with EINVAL on setconf.
            systemctl stop sg-gateway-awg.service sg-gateway-awg3.service >/dev/null 2>&1 || true
            ip link delete awg0 >/dev/null 2>&1 || true
            ip link delete awg3 >/dev/null 2>&1 || true
            modprobe -r amneziawg >/dev/null 2>&1 || true
            if grep -q '^amneziawg ' /proc/modules 2>/dev/null; then
              echo "AmneziaWG kernel module is still loaded; refusing to reuse an unknown runtime" >&2
              rm -rf "$temp"
              return 1
            fi

            local dkms_existing=""
            dkms_existing="$(dkms status -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" 2>/dev/null || true)"
            if [[ -n "$dkms_existing" ]]; then
              dkms remove -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" --all || true
            fi
            rm -rf "/var/lib/dkms/amneziawg/${AMNEZIAWG_DKMS_VERSION}"
            rm -rf "/usr/src/amneziawg-${AMNEZIAWG_DKMS_VERSION}"
            find "/lib/modules/$(uname -r)" -type f \\
              \\( -name 'amneziawg.ko' -o -name 'amneziawg.ko.*' \\) \\
              -path '*/updates/dkms/*' -delete
            depmod -a

            make -C "$kmod_src/src" dkms-install PREFIX=/usr
            dkms add -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"
            dkms build -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION"
            dkms install -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" --force
            depmod -a
            modprobe amneziawg

            local module_version="" loaded_version=""
            module_version="$(modinfo -F version amneziawg 2>/dev/null || true)"
            loaded_version="$(cat /sys/module/amneziawg/version 2>/dev/null || true)"
            if [[ ! "$module_version" =~ ^1\\. ]] || [[ -n "$loaded_version" && ! "$loaded_version" =~ ^1\\. ]]; then
              echo "AmneziaWG 2 kernel mismatch: expected frozen 1.x; file=${module_version:-unknown}, loaded=${loaded_version:-unknown}" >&2
              rm -rf "$temp"
              return 1
            fi
            modinfo amneziawg
            rm -rf "$temp"
          '''
          if old_block not in text:
              raise SystemExit('installer AWG2 install block anchor not found')
          text = text.replace(old_block, new_block, 1)
          installer.write_text(text, encoding='utf-8')

          uninstall = Path('deploy/full-uninstall-ubuntu.sh')
          body = uninstall.read_text(encoding='utf-8')
          anchor = '''  apt-get -o Dpkg::Use-Pty=0 purge -y amneziawg amneziawg-dkms amneziawg-tools >/dev/null 2>&1 || true
            rm -f /usr/bin/awg /usr/bin/awg-quick
          '''
          replacement = '''  apt-get -o Dpkg::Use-Pty=0 purge -y amneziawg amneziawg-dkms amneziawg-tools >/dev/null 2>&1 || true

            # DKMS can lose its state while leaving a compiled SG module behind.
            # Remove orphaned amneziawg modules from every installed kernel so a
            # later Clean Install cannot accidentally reuse an AWG3/experimental ko.
            find /lib/modules -type f \\
              \\( -name 'amneziawg.ko' -o -name 'amneziawg.ko.*' \\) \\
              -path '*/updates/dkms/*' -delete

            rm -f /usr/bin/awg /usr/bin/awg-quick
          '''
          if anchor not in body:
              raise SystemExit('full uninstall AWG purge anchor not found')
          uninstall.write_text(body.replace(anchor, replacement, 1), encoding='utf-8')

          test = Path('tests/test_sg_gateway_021_vendored_five_engines.py')
          body = test.read_text(encoding='utf-8')
          pattern = re.compile(
              r'def test_dkms_reinstall_cleans_only_pinned_stale_state\(\):\n.*?(?=\n\ndef test_stage7_accepts_runtime_conflict_without_hiding_route_failures)',
              re.S,
          )
          replacement = '''def test_dkms_reinstall_cleans_stale_module_and_forces_frozen_awg2():
              installer = read("install.sh")
              assert 'ip link delete awg0' in installer
              assert 'ip link delete awg3' in installer
              assert 'modprobe -r amneziawg' in installer
              assert "grep -q '^amneziawg ' /proc/modules" in installer
              assert 'dkms remove -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" --all' in installer
              assert 'rm -rf "/var/lib/dkms/amneziawg/${AMNEZIAWG_DKMS_VERSION}"' in installer
              assert 'rm -rf "/usr/src/amneziawg-${AMNEZIAWG_DKMS_VERSION}"' in installer
              assert 'find "/lib/modules/$(uname -r)" -type f' in installer
              assert "-path '*/updates/dkms/*' -delete" in installer
              assert 'dkms install -m amneziawg -v "$AMNEZIAWG_DKMS_VERSION" --force' in installer
              assert 'modinfo -F version amneziawg' in installer
              assert '/sys/module/amneziawg/version' in installer
              assert '[[ "$module_version" =~ ^1\\\\. ]]' in installer


          def test_update_preserves_only_real_awg2_runtime():
              installer = read("install.sh")
              ready = installer[installer.index("amneziawg_runtime_ready() {"):installer.index("install_amneziawg_from_vendor() {")]
              assert 'tools_version="$(awg --version' in ready
              assert 'module_version="$(modinfo -F version amneziawg' in ready
              assert '/sys/module/amneziawg/version' in ready
              assert '[[ "$tools_version" == *"v1."* ]]' in ready
              assert '[[ "$module_version" =~ ^1\\\\. ]]' in ready


          def test_full_uninstall_removes_orphaned_awg_dkms_module_files():
              uninstall = read("deploy/full-uninstall-ubuntu.sh")
              assert 'dkms remove -m amneziawg -v 1.0.0 --all' in uninstall
              assert 'find /lib/modules -type f' in uninstall
              assert "-path '*/updates/dkms/*' -delete" in uninstall
              assert uninstall.index('find /lib/modules -type f') < uninstall.index('depmod -a')
          '''
          body2, count = pattern.subn(replacement.rstrip(), body, count=1)
          if count != 1:
              raise SystemExit(f'AWG regression test block replacement count={count}')
          test.write_text(body2, encoding='utf-8')
          PY

      - name: Validate targeted repair
        run: |
          bash -n install.sh
          bash -n deploy/full-uninstall-ubuntu.sh
          python3 -m pip install -q 'pytest>=8,<9'
          python3 -m pytest -q tests/test_sg_gateway_021_vendored_five_engines.py

      - name: Remove temporary workflows and refresh source inventory
        run: |
          rm -f .github/workflows/fix-awg2-stale-kmod.yml
          rm -f .github/workflows/fix-awg2-stale-kmod-push.yml
          git add -A
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}" for name in sorted(tracked)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS

      - name: Commit repaired branch
        run: |
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Fix stale AWG3 kernel module reuse in Clean Install"
          git push origin HEAD:fix-awg2-stale-kmod-clean-install
