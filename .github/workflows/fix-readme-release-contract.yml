name: Align README release contract

on:
  push:
    branches: [fix/readme-02206-forum]
    paths:
      - .github/workflows/fix-readme-release-contract.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readme-02206-forum
          fetch-depth: 0

      - name: Remove release publisher and update contract
        run: |
          rm -f .github/workflows/release-02206-stable.yml
          cat > tests/test_sg_gateway_v22_02206_stable_release.py <<'PY'
          import json
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          PINNED_INSTALL_SHA = "2e96ea97992509f8ff2fdce8b8d23aa0dc5a1dff"


          def test_02206_stable_identity_and_channel():
              manifest = json.loads((ROOT / "release-manifest.json").read_text(encoding="utf-8"))
              assert (ROOT / "VERSION").read_text(encoding="utf-8").strip() == "0.1.0-022.06"
              assert (ROOT / "BUILD-ID").read_text(encoding="utf-8").strip() == "MAIN-02206-STABLE"
              assert manifest["version"] == "0.1.0-022.06"
              assert manifest["build"] == "MAIN-02206-STABLE"
              assert manifest["status"] == "STABLE"
              assert manifest["channel"] == "stable-02206"
              assert manifest["maintenance_updates"]["panel"]["channel"] == "stable-02206"


          def test_02206_publication_contract_is_complete_without_github_release():
              publication = (ROOT / "PUBLICATION-02206.md").read_text(encoding="utf-8")
              for marker in (
                  "AWG 2.0",
                  "AWG 3.0",
                  "AWG 3.1",
                  "Full Backup/Restore",
                  "Clean Install",
                  "Full Uninstall",
                  "stable-02206",
              ):
                  assert marker in publication
              assert "v0.1.0-022.06-final" not in publication
              assert not (ROOT / ".github" / "workflows" / "release-02206-stable.yml").exists()


          def test_02206_readme_exposes_verified_stable_commands():
              readme = (ROOT / "README.md").read_text(encoding="utf-8")
              assert "0.1.0-022.06 STABLE" in readme
              assert f"{PINNED_INSTALL_SHA}/deploy/install-from-github.sh" in readme
              assert f"SG_GATEWAY_SOURCE_COMMIT={PINNED_INSTALL_SHA}" in readme
              assert "stable-02206/deploy/update-from-github.sh" in readme
              assert "stable-02206/deploy/uninstall-from-github.sh" in readme
          PY

      - name: Remove helper and refresh source checksums
        run: |
          git rm .github/workflows/fix-readme-release-contract.yml
          git rm .github/workflows/release-02206-stable.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines()
          files = [p for p in files if p != "SOURCE-SHA256SUMS"]
          lines = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in sorted(files)]
          Path("SOURCE-SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit contract correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_sg_gateway_v22_02206_stable_release.py SOURCE-SHA256SUMS
          git commit -m "test: align 022.06 publication contract"
          git push origin HEAD:fix/readme-02206-forum
