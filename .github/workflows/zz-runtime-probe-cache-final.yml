name: Finalize Runtime Probe Cache

on:
  push:
    branches: [feature/02208-performance-clients]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-performance-clients
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Replay already RED-proven test and implementation steps
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/zz-runtime-probe-cache.yml').read_text(encoding='utf-8').splitlines()

          def extract(step_name: str, target: str) -> None:
              marker = f'      - name: {step_name}'
              start = source.index(marker)
              run_line = start + 1
              while run_line < len(source) and source[run_line].strip() != 'run: |':
                  run_line += 1
              if run_line >= len(source):
                  raise SystemExit(f'run block missing: {step_name}')
              body = []
              for line in source[run_line + 1:]:
                  if line.startswith('      - name:'):
                      break
                  body.append(line[10:] if line.startswith('          ') else line)
              Path(target).write_text('\n'.join(body) + '\n', encoding='utf-8')

          extract('Write RED contracts', '/tmp/write-tests.sh')
          extract('Implement bounded probe caches', '/tmp/implement.sh')
          PY
          bash /tmp/write-tests.sh
          bash /tmp/implement.sh
      - name: Verify focused contracts
        run: |
          python -m pytest -q tests/test_runtime_probe_cache_02208.py
          python -m pytest -q tests/test_page_runtime_performance_02208.py tests/test_preview31_xray_updates.py tests/test_sg_gateway_v22_xray_2699_contract.py
      - name: Commit exact verified product tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/xray/profiles.py app/security/tls.py tests/test_runtime_probe_cache_02208.py
          git rm .github/workflows/zz-runtime-probe-cache.yml .github/workflows/zz-runtime-probe-cache-final.yml
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          files = [p for p in files if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(files)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git commit -m 'perf: cache short-lived runtime probes'
          git push origin HEAD:feature/02208-performance-clients
