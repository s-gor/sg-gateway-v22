name: Refresh source integrity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore canonical CI and refresh SOURCE-SHA256SUMS
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          paths = sorted(path for path in paths if path != "SOURCE-SHA256SUMS")
          rows = []
          for path in paths:
              rows.append(f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}")
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n", encoding="utf-8", newline="\n"
          )
          print(f"refreshed source integrity for {len(paths)} tracked files")
          PY

      - name: Commit refreshed integrity
        run: |
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/ci.yml SOURCE-SHA256SUMS
          if git diff --cached --quiet; then
            echo "No integrity changes"
            exit 0
          fi
          git commit -m "Refresh update job log and card isolation integrity"
          git push origin HEAD:${{ github.head_ref }}
