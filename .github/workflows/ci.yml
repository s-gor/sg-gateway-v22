name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate exact Git-blob source inventory
        run: |
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines()
          paths = [path for path in paths if path != "SOURCE-SHA256SUMS"]
          rows = []
          for path in sorted(paths):
              data = subprocess.check_output(["git", "show", f"HEAD:{path}"])
              rows.append(f"{hashlib.sha256(data).hexdigest()}  {path}")
          Path("/tmp/SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"generated {len(rows)} source hashes")
          PY

      - name: Upload generated source inventory
        uses: actions/upload-artifact@v4
        with:
          name: generated-source-sha256sums
          path: /tmp/SOURCE-SHA256SUMS
          if-no-files-found: error
