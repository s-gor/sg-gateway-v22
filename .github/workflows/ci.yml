name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-final-source-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Build inventory for final normal CI
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          final_ci_digest = "3fc374961676d0446c8457baf83011000097934c70bea07e36762c09cc6dbd9b"
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          tracked = [path for path in tracked if path != "SOURCE-SHA256SUMS"]
          rows = []
          for path in sorted(tracked):
              if path == ".github/workflows/ci.yml":
                  digest = final_ci_digest
              else:
                  data = subprocess.check_output(["git", "show", f"HEAD:{path}"])
                  digest = hashlib.sha256(data).hexdigest()
              rows.append(f"{digest}  {path}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Commit final inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          if git diff --cached --quiet; then
            echo "SOURCE-SHA256SUMS already final"
            exit 0
          fi
          git commit -m "chore: refresh final source integrity inventory"
          git push origin HEAD:${{ github.head_ref }}
