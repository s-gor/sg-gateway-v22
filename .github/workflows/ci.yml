name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-awg31-only-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch retired AWG runtime coupling and Stage3A tests
        run: |
          python3 -B - <<'PY'
          from pathlib import Path

          path = Path('hostd/sg_hostd/client_runtime.py')
          body = path.read_text(encoding='utf-8')
          old = '''    public_address = runtime.get("SG_GATEWAY_PUBLIC_ADDRESS", "").strip()
    awg_server_public = secrets.get("SG_GATEWAY_AWG_PUBLIC_KEY", "").strip()
    xray_public = secrets.get("SG_GATEWAY_XRAY_PUBLIC_KEY", "").strip()
    xray_short_id = secrets.get("SG_GATEWAY_XRAY_SHORT_ID", "").strip()
    awg_obfuscation = _awg_obfuscation(secrets)

    awg_settings = get_connection_settings("amneziawg")
    awg_server_identity = awg_server_public or str(
        awg_settings.config.get("server_public_key") or ""
    ).strip()
    awg_ipv6_network = (
        _awg_ipv6_network(awg_server_identity)
        if awg_server_identity and _dual_stack_enabled(runtime)
        else None
    )
    xray_settings = get_connection_settings("xray")
'''
          new = '''    public_address = runtime.get("SG_GATEWAY_PUBLIC_ADDRESS", "").strip()
    xray_public = secrets.get("SG_GATEWAY_XRAY_PUBLIC_KEY", "").strip()
    xray_short_id = secrets.get("SG_GATEWAY_XRAY_SHORT_ID", "").strip()
    xray_settings = get_connection_settings("xray")
'''
          if body.count(old) != 1:
              raise SystemExit(f'client_runtime prelude match count={body.count(old)}')
          body = body.replace(old, new, 1)
          body = body.replace("WHERE dc.engine IN ('amneziawg', 'xray')", "WHERE dc.engine = 'xray'", 1)
          path.write_text(body, encoding='utf-8', newline='\n')

          path = Path('tests/test_sg_gateway_v22_awg31_stage3a_install_update.py')
          body = path.read_text(encoding='utf-8')
          body = body.replace('    AWG3_GO_SHA256,\n    AWG3_TOOLS_SHA256,\n', '')
          body = body.replace('    assert ("systemctl", "try-restart", "sg-gateway-awg3.service") in fake.commands\n', '    assert not any("sg-gateway-awg3.service" in command for command in fake.commands)\n')
          old_test = '''def test_runtime_sources_are_sha_verified_and_awg3_30_is_separate(provisioned) -> None:
    root, _, _, _, _, _, _ = provisioned
    vendor = root / "opt/sg-gateway/vendor/cores"
    assert _sha256(vendor / "amneziawg-tools-3.1.20260812.tar.gz") == AWG31_TOOLS_SHA256
    assert _sha256(vendor / "amneziawg-go-linux-amd64-v3.1.20260814") == AWG31_GO_SHA256
    assert _sha256(vendor / "amneziawg-tools-3.0.20260805.tar.gz") == AWG3_TOOLS_SHA256
    assert _sha256(vendor / "amneziawg-go-linux-amd64-v3.0.0") == AWG3_GO_SHA256
    awg31_version = os.popen(str(root / "opt/sg-gateway/awg31/bin/awg") + " --version").read()
    awg3_version = os.popen(str(root / "opt/sg-gateway/awg3/bin/awg") + " --version").read()
    assert "3.1.20260812" in awg31_version
    assert "3.0.20260805" in awg3_version
    assert (root / "opt/sg-gateway/awg31").resolve() != (root / "opt/sg-gateway/awg3").resolve()
'''
          new_test = '''def test_runtime_sources_are_sha_verified_and_only_awg31_is_installed(provisioned) -> None:
    root, _, _, _, _, _, _ = provisioned
    vendor = root / "opt/sg-gateway/vendor/cores"
    assert _sha256(vendor / "amneziawg-tools-3.1.20260812.tar.gz") == AWG31_TOOLS_SHA256
    assert _sha256(vendor / "amneziawg-go-linux-amd64-v3.1.20260814") == AWG31_GO_SHA256
    awg31_version = os.popen(str(root / "opt/sg-gateway/awg31/bin/awg") + " --version").read()
    assert "3.1.20260812" in awg31_version
    assert not (root / "opt/sg-gateway/awg3").exists()
'''
          if body.count(old_test) != 1:
              raise SystemExit(f'Stage3A runtime test match count={body.count(old_test)}')
          body = body.replace(old_test, new_test, 1)
          body = body.replace('    assert fake.commands.count(("systemctl", "try-restart", "sg-gateway-awg3.service")) == 1\n', '    assert not any("sg-gateway-awg3.service" in command for command in fake.commands)\n')
          path.write_text(body, encoding='utf-8', newline='\n')
          PY

      - name: Restore normal CI
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Regenerate source integrity inventory
        run: |
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          Path('SOURCE-SHA256SUMS').write_text(
              ''.join(f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}\n" for p in tracked),
              encoding='utf-8'
          )
          print(f'inventory regenerated: {len(tracked)}')
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hostd/sg_hostd/client_runtime.py tests/test_sg_gateway_v22_awg31_stage3a_install_update.py .github/workflows/ci.yml SOURCE-SHA256SUMS
          git commit -m "fix: decouple Xray apply from retired AWG2 runtime"
          git push origin HEAD:${{ github.head_ref }}
