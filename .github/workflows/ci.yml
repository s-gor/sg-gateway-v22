name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-awg31-cleanup-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore normal CI from main
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Regenerate source integrity inventory from working tree
        run: |
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          tracked = [p for p in tracked if p != "SOURCE-SHA256SUMS"]
          rows = []
          for path in tracked:
              data = Path(path).read_bytes()
              rows.append(f"{hashlib.sha256(data).hexdigest()}  {path}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"source inventory regenerated: {len(rows)} files")
          PY

      - name: Commit restored CI and inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml SOURCE-SHA256SUMS
          git commit -m "ci: correct final source integrity inventory"
          git push origin HEAD:${{ github.head_ref }}
