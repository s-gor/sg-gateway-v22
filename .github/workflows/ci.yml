name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-awg31-only-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair applicator
        run: python3 tools/repair_awg31_cleanup_applicator.py

      - name: Apply cleanup
        run: python3 tools/apply_awg31_only_cleanup.py

      - name: Remove one-shot applicators
        run: rm -f tools/apply_awg31_only_cleanup.py tools/repair_awg31_cleanup_applicator.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finish AWG31-only UI and clean-install cleanup"
          git push origin HEAD:${{ github.head_ref }}
