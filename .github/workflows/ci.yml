name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-source-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Rebuild exact SOURCE-SHA256SUMS
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          tracked = [path for path in tracked if path != "SOURCE-SHA256SUMS"]
          rows = []
          for path in sorted(tracked):
              data = subprocess.check_output(["git", "show", f"HEAD:{path}"])
              rows.append(f"{hashlib.sha256(data).hexdigest()}  {path}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Commit refreshed inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          if git diff --cached --quiet; then
            echo "SOURCE-SHA256SUMS already current"
            exit 0
          fi
          git commit -m "chore: refresh source integrity inventory"
          git push origin HEAD:${{ github.head_ref }}
