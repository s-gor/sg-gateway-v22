name: CI

on:
  pull_request:
    branches: [main]

jobs:
  retired-awg-picker-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify retired AWG pickers are hidden
        run: |
          python3 - <<'PY'
          import runpy
          ns = runpy.run_path("tests/test_retired_awg2_awg3_02208.py")
          ns["test_retired_awg_profiles_are_absent_from_active_protocol_pickers"]()
          PY
