name: Temporary Page Performance RED
on:
  push:
    branches: [feature/02208-performance-clients]
permissions:
  contents: write
jobs:
  red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-performance-clients
          fetch-depth: 0
      - name: Run new tests expecting RED
        id: red
        continue-on-error: true
        run: |
          python -m pip install -q -r requirements.txt pytest
          pytest -q tests/test_other_pages_performance_02208.py
      - name: Require RED then remove verifier
        run: |
          test '${{ steps.red.outcome }}' = 'failure'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-page-performance-red.yml
          git commit -m 'test: confirm remaining page performance red'
          git push origin HEAD:feature/02208-performance-clients
