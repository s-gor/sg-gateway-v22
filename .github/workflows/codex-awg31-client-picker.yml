name: Apply AWG31 client picker fix

on:
  push:
    branches: [codex/awg31-client-picker]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply explicit AWG31 picker integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {actual}: {old!r}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'app/clients/repository.py',
              '    "amneziawg",\n    "amneziawg3",\n    "xray",',
              '    "amneziawg",\n    "amneziawg3",\n    "amneziawg31",\n    "xray",',
          )
          replace(
              'app/clients/repository.py',
              '            "amneziawg,amneziawg3,xray_reality_tcp,xray_xhttp_reality,"',
              '            "amneziawg,amneziawg3,amneziawg31,xray_reality_tcp,xray_xhttp_reality,"',
          )
          replace(
              'app/clients/repository.py',
              '    for engine in [*engines, "amneziawg31"]:',
              '    for engine in engines:',
              expected=2,
          )
          replace(
              'app/clients/repository.py',
              '    wanted = set(engines) | {"amneziawg31"}',
              '    wanted = set(engines)',
          )

          old_clients = '''      <label class="cv10-protocol {{ 'is-locked' if awg3_runtime.known and not awg3_runtime.ready else '' }}">
        <input type="checkbox" name="protocols" value="amneziawg3" {% if awg3_runtime.known and not awg3_runtime.ready %}disabled{% endif %}>
        <span><strong>AmneziaWG 3</strong><small>{{ 'AWG3 runtime требует восстановления в Maintenance' if awg3_runtime.known and not awg3_runtime.ready else 'AWG3 userspace · отдельная конфигурация и QR' }}</small></span>
      </label>
'''
          new_clients = '''      <label class="cv10-protocol {{ 'is-locked' if awg3_runtime.known and not awg3_runtime.ready else '' }}">
        <input type="checkbox" name="protocols" value="amneziawg3" {% if awg3_runtime.known and not awg3_runtime.ready %}disabled{% endif %}>
        <span><strong>AmneziaWG 3.0</strong><small>{{ 'AWG 3.0 runtime требует восстановления в Maintenance' if awg3_runtime.known and not awg3_runtime.ready else 'AWG 3.0 userspace · отдельная конфигурация и QR' }}</small></span>
      </label>
      <label class="cv10-protocol">
        <input type="checkbox" name="protocols" value="amneziawg31">
        <span><strong>AmneziaWG 3.1</strong><small>AWG 3.1 userspace · отдельная конфигурация</small></span>
      </label>
'''
          replace('app/web/templates/clients.html', old_clients, new_clients)

          old_detail = '''        <label class="dv16-protocol">
          <input type="checkbox" name="protocols" value="amneziawg3">
          <span><strong>AmneziaWG 3</strong><small>AWG3 userspace · отдельная конфигурация и QR</small></span>
        </label>
'''
          new_detail = '''        <label class="dv16-protocol">
          <input type="checkbox" name="protocols" value="amneziawg3">
          <span><strong>AmneziaWG 3.0</strong><small>AWG 3.0 userspace · отдельная конфигурация и QR</small></span>
        </label>
        <label class="dv16-protocol">
          <input type="checkbox" name="protocols" value="amneziawg31">
          <span><strong>AmneziaWG 3.1</strong><small>AWG 3.1 userspace · отдельная конфигурация</small></span>
        </label>
'''
          replace('app/web/templates/client_detail.html', old_detail, new_detail)

          old_primary = '''      {% set awg3_selected = 'amneziawg3' in primary_tokens %}
      <label class="dv16-protocol {{ 'is-locked' if awg3_runtime.known and not awg3_runtime.ready and not awg3_selected else '' }}">
        <input type="checkbox" name="protocols" value="amneziawg3" {% if awg3_selected %}checked{% endif %} {% if awg3_runtime.known and not awg3_runtime.ready and not awg3_selected %}disabled{% endif %}>
        <span><strong>AmneziaWG 3</strong><small>{% if awg3_selected %}Подключён — существующие credentials сохраняются{% elif awg3_runtime.known and not awg3_runtime.ready %}Runtime требует восстановления в Maintenance{% else %}AWG3 userspace · конфигурация и QR{% endif %}</small></span>
      </label>
'''
          new_primary = '''      {% set awg3_selected = 'amneziawg3' in primary_tokens %}
      <label class="dv16-protocol {{ 'is-locked' if awg3_runtime.known and not awg3_runtime.ready and not awg3_selected else '' }}">
        <input type="checkbox" name="protocols" value="amneziawg3" {% if awg3_selected %}checked{% endif %} {% if awg3_runtime.known and not awg3_runtime.ready and not awg3_selected %}disabled{% endif %}>
        <span><strong>AmneziaWG 3.0</strong><small>{% if awg3_selected %}Подключён — существующие credentials сохраняются{% elif awg3_runtime.known and not awg3_runtime.ready %}Runtime требует восстановления в Maintenance{% else %}AWG 3.0 userspace · конфигурация и QR{% endif %}</small></span>
      </label>
      {% set awg31_selected = 'amneziawg31' in primary_tokens %}
      <label class="dv16-protocol">
        <input type="checkbox" name="protocols" value="amneziawg31" {% if awg31_selected %}checked{% endif %}>
        <span><strong>AmneziaWG 3.1</strong><small>{{ 'Подключён — существующие credentials сохраняются' if awg31_selected else 'AWG 3.1 userspace · конфигурация' }}</small></span>
      </label>
'''
          replace('app/web/templates/_client_edit_dialogs.html', old_primary, new_primary)

          old_device = '''      {% set device_awg3_selected = 'amneziawg3' in selected_tokens %}
      <label class="dv16-protocol {{ 'is-locked' if awg3_runtime.known and not awg3_runtime.ready and not device_awg3_selected else '' }}">
        <input type="checkbox" name="protocols" value="amneziawg3" {% if device_awg3_selected %}checked{% endif %} {% if awg3_runtime.known and not awg3_runtime.ready and not device_awg3_selected %}disabled{% endif %}>
        <span><strong>AmneziaWG 3</strong><small>{% if device_awg3_selected %}Подключён — существующие credentials сохраняются{% elif awg3_runtime.known and not awg3_runtime.ready %}Runtime требует восстановления в Maintenance{% else %}AWG3 userspace · конфигурация и QR{% endif %}</small></span>
      </label>
'''
          new_device = '''      {% set device_awg3_selected = 'amneziawg3' in selected_tokens %}
      <label class="dv16-protocol {{ 'is-locked' if awg3_runtime.known and not awg3_runtime.ready and not device_awg3_selected else '' }}">
        <input type="checkbox" name="protocols" value="amneziawg3" {% if device_awg3_selected %}checked{% endif %} {% if awg3_runtime.known and not awg3_runtime.ready and not device_awg3_selected %}disabled{% endif %}>
        <span><strong>AmneziaWG 3.0</strong><small>{% if device_awg3_selected %}Подключён — существующие credentials сохраняются{% elif awg3_runtime.known and not awg3_runtime.ready %}Runtime требует восстановления в Maintenance{% else %}AWG 3.0 userspace · конфигурация и QR{% endif %}</small></span>
      </label>
      {% set device_awg31_selected = 'amneziawg31' in selected_tokens %}
      <label class="dv16-protocol">
        <input type="checkbox" name="protocols" value="amneziawg31" {% if device_awg31_selected %}checked{% endif %}>
        <span><strong>AmneziaWG 3.1</strong><small>{{ 'Подключён — существующие credentials сохраняются' if device_awg31_selected else 'AWG 3.1 userspace · конфигурация' }}</small></span>
      </label>
'''
          replace('app/web/templates/_client_edit_dialogs.html', old_device, new_device)

          replace(
              'app/web/static/sg-device-collapse-v1.js',
              "    'amneziawg3',\n    'mihomo',",
              "    'amneziawg3',\n    'amneziawg31',\n    'mihomo',",
          )
          replace(
              'app/web/static/sg-device-collapse-v1.js',
              "    setLabelTitle(byValue.get('amneziawg3'), 'AmneziaWG 3.1');",
              "    setLabelTitle(byValue.get('amneziawg3'), 'AmneziaWG 3.0');\n    setLabelTitle(byValue.get('amneziawg31'), 'AmneziaWG 3.1');",
          )
          replace(
              'app/web/static/sg-device-collapse-v1.js',
              "      setAvailableNote(byValue.get('amneziawg3'), 'UDP 586 · userspace-конфигурация и QR');",
              "      setAvailableNote(byValue.get('amneziawg3'), 'UDP 586 · userspace-конфигурация и QR');\n      setAvailableNote(byValue.get('amneziawg31'), 'UDP 587 · userspace-конфигурация');",
          )

          replace(
              'tests/test_sg_gateway_v22_clients_devices_ux.py',
              "def test_protocol_picker_is_unified_for_current_eight_protocols_only() -> None:",
              "def test_protocol_picker_distinguishes_awg30_and_awg31() -> None:",
          )
          replace(
              'tests/test_sg_gateway_v22_clients_devices_ux.py',
              "'amneziawg','amneziawg3','mihomo'",
              "'amneziawg','amneziawg3','amneziawg31','mihomo'",
          )
          replace(
              'tests/test_sg_gateway_v22_clients_devices_ux.py',
              "    assert \"setLabelTitle(byValue.get('amneziawg3'), 'AmneziaWG 3.1')\" in body\n    assert \"setAvailableNote(byValue.get('amneziawg3'), 'UDP 586 · userspace-конфигурация и QR')\" in body",
              "    assert \"setLabelTitle(byValue.get('amneziawg3'), 'AmneziaWG 3.0')\" in body\n    assert \"setLabelTitle(byValue.get('amneziawg31'), 'AmneziaWG 3.1')\" in body\n    assert \"setAvailableNote(byValue.get('amneziawg3'), 'UDP 586 · userspace-конфигурация и QR')\" in body\n    assert \"setAvailableNote(byValue.get('amneziawg31'), 'UDP 587 · userspace-конфигурация')\" in body",
          )

          stage2 = Path('tests/test_sg_gateway_v22_awg31_stage2_api_ui.py')
          text = stage2.read_text(encoding='utf-8')
          old = '"amneziawg,amneziawg3"'
          if text.count(old) != 4:
              raise SystemExit(f'stage2 create-client fixtures: expected 4, found {text.count(old)}')
          stage2.write_text(text.replace(old, '"amneziawg,amneziawg3,amneziawg31"'), encoding='utf-8')
          PY

      - name: Commit candidate before tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "fix: expose AWG31 in client protocol pickers"

      - name: Run picker and AWG31 regressions
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_v22_awg31_client_picker.py \
            tests/test_sg_gateway_v22_clients_devices_ux.py \
            tests/test_sg_gateway_v22_awg31_stage2_api_ui.py

      - name: Run full test suite
        run: python -m pytest -q tests

      - name: Remove helper and refresh source integrity
        run: |
          git reset --hard HEAD
          git rm .github/workflows/codex-awg31-client-picker.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [path for path in tracked if path != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in tracked]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git commit -m "chore: refresh AWG31 picker source integrity"
          git push origin HEAD:codex/awg31-client-picker
