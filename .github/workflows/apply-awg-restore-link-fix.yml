name: Apply AWG restore link integrity fix
on:
  push:
    branches: [fix/02208-awg-restore-link-integrity]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch readiness gates, test, checksum and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/clients/access.py')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '            status = _status(client, device, awg)\n':
                  '            ready = protocol_ready(client, "amneziawg", device)\n            status = _status(client, device, awg, ready=ready)\n',
              '            status = _status(client, device, awg3)\n':
                  '            ready = protocol_ready(client, "amneziawg3", device)\n            status = _status(client, device, awg3, ready=ready)\n',
              '            status = _status(client, device, awg31)\n':
                  '            ready = protocol_ready(client, "amneziawg31", device)\n            status = _status(client, device, awg31, ready=ready)\n',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('app/clients/exports.py')
          text = p.read_text(encoding='utf-8')
          old = '''    try:\n        config = json.loads(deployment.config_json)\n    except (TypeError, ValueError, json.JSONDecodeError):\n        return False\n    return bool(\n        isinstance(config, dict)\n        and _awg_export_config_ready(engine, config)\n    )\n'''
          new = '''    try:\n        config = json.loads(deployment.config_json)\n    except (TypeError, ValueError, json.JSONDecodeError):\n        return False\n    if not (\n        isinstance(config, dict)\n        and _awg_export_config_ready(engine, config)\n    ):\n        return False\n\n    # AWG31 backups intentionally preserve the full client config. On a new\n    # destination that means the restored row may still contain the source\n    # server public key while its durable client private key is perfectly\n    # valid. Never export that stale server binding: keep it dormant until\n    # the destination runtime repairs config_json with its current server key.\n    if engine == "amneziawg31":\n        try:\n            current = get_awg31_settings()\n        except Exception:\n            return False\n        current_key = str(current.server_public_key or "").strip()\n        restored_key = str(config.get("server_public_key") or "").strip()\n        if not current.enabled or not current_key or restored_key != current_key:\n            return False\n\n    return True\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''    builder = builders.get(kind)\n    if builder is None:\n        return ClientExport("", "text/plain; charset=utf-8", "")\n    return builder(client, device)\n'''
          new = '''    builder = builders.get(kind)\n    if builder is None:\n        return ClientExport("", "text/plain; charset=utf-8", "")\n    if kind in {"amneziawg", "amneziawg3", "amneziawg31", "amneziawg31-uri"}:\n        if not protocol_ready(client, kind, device):\n            return ClientExport("", "text/plain; charset=utf-8", "")\n    return builder(client, device)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

          python -m pip install -r requirements.txt pytest
          python -m pytest -q \
            tests/test_awg_restore_link_integrity_02208.py \
            tests/test_clients_keys_dormant_restore_02208.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/clients/access.py app/clients/exports.py tests/test_awg_restore_link_integrity_02208.py
          tmp="$(mktemp)"
          git ls-files -z | while IFS= read -r -d '' f; do
            [ "$f" = "SOURCE-SHA256SUMS" ] && continue
            [ "$f" = ".github/workflows/tdd-awg-restore-link-integrity.yml" ] && continue
            [ "$f" = ".github/workflows/apply-awg-restore-link-fix.yml" ] && continue
            digest="$(sha256sum "$f" | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$f"
          done | LC_ALL=C sort -k2 > "$tmp"
          mv "$tmp" SOURCE-SHA256SUMS
          git add SOURCE-SHA256SUMS
          git commit -m 'fix: keep restored AWG exports dormant until repaired'
          git push origin HEAD:fix/02208-awg-restore-link-integrity
