name: Verify clean server-port fix once

on:
  push:
    branches:
      - fix/02206-lock-server-ports

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02206-lock-server-ports
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Restore production fixture before verification
        run: git checkout c7b03e5828b508b4f58696d5cac3614709fd965a -- data/system-activity.json
      - name: Run focused contracts
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_v22_server_managed_ports.py \
            tests/test_sg_gateway_v22_awg30_clean_install_and_port_ui.py \
            tests/test_connections_layout_v24.py \
            tests/test_ui_connections_visual_v1.py \
            tests/test_sg_gateway_v22_xray_fingerprint.py \
            tests/test_xray_profile_flow_v23.py
      - name: Run full repository tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Remove test side effects and refresh source integrity
        run: |
          git checkout c7b03e5828b508b4f58696d5cac3614709fd965a -- data/system-activity.json
          git rm .github/workflows/port-lock-cleanup.yml
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = sorted(
              path
              for path in subprocess.check_output(
                  ["git", "ls-files"], text=True, encoding="utf-8"
              ).splitlines()
              if path != "SOURCE-SHA256SUMS" and Path(path).is_file()
          )
          Path("SOURCE-SHA256SUMS").write_text(
              "".join(
                  f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}\n"
                  for path in paths
              ),
              encoding="utf-8",
          )
          PY
          source_tests=$(git ls-files 'tests/*source*integrity*.py')
          if [ -n "$source_tests" ]; then python -m pytest -q $source_tests; fi
          python -m compileall -q app
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: remove server-port verification side effects"
          git push origin HEAD:fix/02206-lock-server-ports
