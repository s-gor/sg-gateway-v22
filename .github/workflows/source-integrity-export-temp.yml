name: TEMP source integrity export

on:
  pull_request:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate exact final manifest
        run: |
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          excluded = {
              "SOURCE-SHA256SUMS",
              ".github/workflows/source-integrity-export-temp.yml",
          }
          tracked = sorted(
              path
              for path in subprocess.check_output(
                  ["git", "ls-files"], text=True, encoding="utf-8"
              ).splitlines()
              if path not in excluded
          )
          rows = []
          for path in tracked:
              data = subprocess.check_output(["git", "show", f"HEAD:{path}"])
              rows.append(f"{hashlib.sha256(data).hexdigest()}  {path}")
          Path("SOURCE-SHA256SUMS.generated").write_text(
              "\n".join(rows) + "\n", encoding="utf-8"
          )
          print(f"generated {len(rows)} checksum rows")
          PY
      - name: Upload generated manifest
        uses: actions/upload-artifact@v4
        with:
          name: source-integrity-final
          path: SOURCE-SHA256SUMS.generated
          if-no-files-found: error
