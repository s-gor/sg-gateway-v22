name: DEV 02206 Guard

on:
  push:
    branches: [dev-02206]
  pull_request:
    branches: [dev-02206]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce development channel isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          install = Path('deploy/install-from-github.sh').read_text(encoding='utf-8')
          panel = Path('app/maintenance/panel_updates.py').read_text(encoding='utf-8')
          assert 'dev-02206' in install, 'dev installer is not pinned to dev-02206'
          assert 'SG_GATEWAY_ALLOW_DEVELOPMENT' in install, 'dev installer lacks explicit opt-in guard'
          assert 'dev-02206' in panel, 'panel update channel is not pinned to dev-02206'
          PY

      - name: Refresh source integrity for dev branch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          rows = []
          for path in tracked:
              rows.append(f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          if git diff --quiet -- SOURCE-SHA256SUMS; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "Refresh dev-02206 source integrity"
          git push origin HEAD:dev-02206

      - name: Verify source integrity
        run: |
          python3 -B - <<'PY'
          import hashlib
          import re
          import subprocess
          from pathlib import Path

          expected = {}
          for line_no, raw in enumerate(Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines(), 1):
              if not raw.strip():
                  continue
              match = re.fullmatch(r'([0-9a-f]{64})  (.+)', raw)
              if match is None:
                  raise SystemExit(f'invalid SOURCE-SHA256SUMS line {line_no}: {raw!r}')
              digest, path = match.groups()
              if path in expected:
                  raise SystemExit(f'duplicate checksum path: {path}')
              expected[path] = digest

          tracked = set(subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines())
          tracked.discard('SOURCE-SHA256SUMS')
          if tracked != set(expected):
              raise SystemExit(f'checksum inventory mismatch: missing={sorted(tracked-set(expected))} extra={sorted(set(expected)-tracked)}')
          for path in sorted(tracked):
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != expected[path]:
                  raise SystemExit(f'source hash mismatch: {path}')
          print(f'Source integrity OK: {len(tracked)} files')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Python syntax
        run: |
          python -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('engines').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'syntax ok: {len(files)} files')"

      - name: Check release manifest baseline
        run: |
          python -B -c "import json, pathlib; manifest=json.loads(pathlib.Path('release-manifest.json').read_text(encoding='utf-8')); version=pathlib.Path('VERSION').read_text(encoding='utf-8').strip(); assert manifest['version']==version; assert manifest['source_integrity']['mode']=='git-blob-sha256'; assert manifest['safe_update']['preserve_local_assets'] is True; print('manifest baseline ok')"

      - name: Run panel tests
        run: python -m pytest tests

      - name: Build and verify current FULL package
        run: |
          command -v zip
          command -v unzip
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-DEV-02206-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only
