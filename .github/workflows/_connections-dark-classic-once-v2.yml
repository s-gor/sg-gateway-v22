name: One-shot classic dark Connections theme v2

on:
  push:
    branches:
      - fix30-ipv6-dual-stack
    paths:
      - .github/workflows/_connections-dark-classic-once-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix30-ipv6-dual-stack
          fetch-depth: 0

      - name: Apply dark-only Connections styling
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          old_workflow = Path('.github/workflows/_connections-dark-classic-once.yml').read_text(encoding='utf-8')
          start = "css_path.write_text(r'''"
          end = "''', encoding='utf-8')"
          if old_workflow.count(start) != 1 or old_workflow.count(end) < 1:
              raise SystemExit('embedded CSS markers not found')
          css = old_workflow.split(start, 1)[1].split(end, 1)[0]
          css_path = Path('app/web/static/sg-connections-dark-classic-v1.css')
          if css_path.exists():
              raise SystemExit('dark classic stylesheet already exists')
          css_path.write_text(css, encoding='utf-8')

          base_path = Path('app/web/templates/base.html')
          base = base_path.read_text(encoding='utf-8')
          anchor = "  <link rel=\"stylesheet\" href=\"{{ url_for('static', filename='sg-controls-final-v1.css') }}\">\n"
          link = "  {% if active_page|default('') == 'connections' %}<link rel=\"stylesheet\" href=\"{{ url_for('static', filename='sg-connections-dark-classic-v1.css') }}?v={{ app_version }}-connections-dark-classic-v1\">{% endif %}\n"
          if base.count(anchor) != 1:
              raise SystemExit('base stylesheet anchor mismatch')
          if 'sg-connections-dark-classic-v1.css' in base:
              raise SystemExit('dark classic stylesheet link already present')
          base_path.write_text(base.replace(anchor, anchor + link), encoding='utf-8')

          test_path = Path('tests/test_ui_connections_visual_v1.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_connections_dark_classic_theme_is_scoped_and_loaded_last():'
          if marker in tests:
              raise SystemExit('dark classic regression test already exists')
          test_b64 = ''
          extra = base64.b64decode(test_b64).decode('utf-8')
          test_path.write_text(tests.rstrip() + extra + '\n', encoding='utf-8')
          PY

      - name: Refresh integrity and commit
        shell: bash
        run: |
          rm -f .github/workflows/_connections-dark-classic-once.yml
          rm -f .github/workflows/_connections-dark-classic-once-v2.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          skip = {
              'SOURCE-SHA256SUMS',
              '.github/workflows/_connections-dark-classic-once.yml',
              '.github/workflows/_connections-dark-classic-once-v2.yml',
          }
          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          rows = []
          for path in tracked:
              if path in skip:
                  continue
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f'tracked file missing: {path}')
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {path}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' '.github/workflows/_connections-dark-classic-once.yml' '.github/workflows/_connections-dark-classic-once-v2.yml' 'SOURCE-SHA256SUMS' 'app/web/static/sg-connections-dark-classic-v1.css' 'app/web/templates/base.html' 'tests/test_ui_connections_visual_v1.py' | sort)"
          test "$changed" = "$expected"

          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "UI: restore classic blue dark Connections style"
          git push origin HEAD:fix30-ipv6-dual-stack
