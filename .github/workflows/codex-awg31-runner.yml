name: Run AWG31 picker patch

on:
  push:
    branches:
      - codex/awg31-client-picker

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Execute reviewed patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/codex-awg31-client-picker.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(body), 'awg31-picker-patch', 'exec'), {})
          PY

      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "fix: expose AWG31 in client protocol pickers"

      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_v22_awg31_client_picker.py \
            tests/test_sg_gateway_v22_clients_devices_ux.py \
            tests/test_sg_gateway_v22_awg31_stage2_api_ui.py

      - name: Run full suite
        run: python -m pytest -q tests

      - name: Finalize branch
        run: |
          git reset --hard HEAD
          git rm \
            .github/workflows/codex-awg31-client-picker.yml \
            .github/workflows/codex-awg31-runner.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [path for path in tracked if path != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in tracked]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git commit -m "chore: refresh AWG31 picker source integrity"
          git push origin HEAD:codex/awg31-client-picker
