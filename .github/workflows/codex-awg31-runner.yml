name: Run AWG31 picker patch

on:
  push:
    branches:
      - codex/awg31-client-picker

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 's-gor'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply explicit AWG31 picker integration
        run: python3 scripts/codex_awg31_picker_patch.py

      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f AWG31-PATCH-ERROR.txt AWG31-TEST-ERROR.txt || true
          git add app tests
          git diff --check --cached
          git commit -m "fix: expose AWG31 in client protocol pickers"

      - name: Run focused regressions
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_sg_gateway_v22_awg31_client_picker.py \
            tests/test_sg_gateway_v22_clients_devices_ux.py \
            tests/test_sg_gateway_v22_awg31_stage2_api_ui.py \
            2>&1 | tee AWG31-TEST-ERROR.txt

      - name: Publish focused-test diagnostic
        if: steps.focused.outcome == 'failure'
        run: |
          git add AWG31-TEST-ERROR.txt
          git commit -m "diagnostic: record AWG31 picker test failure"
          git push origin HEAD:codex/awg31-client-picker

      - name: Stop after focused-test failure
        if: steps.focused.outcome == 'failure'
        run: exit 1

      - name: Run full suite
        id: full
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee AWG31-TEST-ERROR.txt

      - name: Publish full-test diagnostic
        if: steps.full.outcome == 'failure'
        run: |
          git add AWG31-TEST-ERROR.txt
          git commit -m "diagnostic: record AWG31 full-suite failure"
          git push origin HEAD:codex/awg31-client-picker

      - name: Stop after full-test failure
        if: steps.full.outcome == 'failure'
        run: exit 1

      - name: Finalize branch
        run: |
          git reset --hard HEAD
          git rm \
            .github/workflows/codex-awg31-client-picker.yml \
            .github/workflows/codex-awg31-runner.yml \
            scripts/codex_awg31_picker_patch.py
          rm -f AWG31-TEST-ERROR.txt
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [path for path in tracked if path != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in tracked]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git diff --check --cached
          git commit -m "chore: refresh AWG31 picker source integrity"
          git push origin HEAD:codex/awg31-client-picker
