name: Verify AWG31 client picker

on:
  push:
    branches:
      - codex/awg31-client-picker

permissions:
  contents: write

jobs:
  verify:
    if: github.actor == 's-gor'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Align legacy tests with explicit AWG31 selection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          stage1 = Path('tests/test_sg_gateway_v22_awg31_stage1_core.py')
          text = stage1.read_text(encoding='utf-8')
          old = '"amneziawg,amneziawg3"'
          if text.count(old) != 4:
              raise SystemExit(f'stage1 expected 4 implicit AWG31 fixtures, found {text.count(old)}')
          stage1.write_text(
              text.replace(old, '"amneziawg,amneziawg3,amneziawg31"'),
              encoding='utf-8',
          )

          dual = Path('tests/test_sg_gateway_v22_awg3_dual_contract.py')
          text = dual.read_text(encoding='utf-8')
          old = 'repository.create_client("Dual AWG", "amneziawg,amneziawg3")'
          if text.count(old) != 1:
              raise SystemExit('dual AWG fixture not found exactly once')
          text = text.replace(
              old,
              'repository.create_client("Dual AWG", "amneziawg,amneziawg3,amneziawg31")',
          )
          text = text.replace(
              '    assert "\'amneziawg3\'" in body\n    assert "AmneziaWG 3.1" in body',
              '    assert "\'amneziawg3\'" in body\n    assert "\'amneziawg31\'" in body\n    assert "AmneziaWG 3.0" in body\n    assert "AmneziaWG 3.1" in body',
          )
          dual.write_text(text, encoding='utf-8')
          PY

      - name: Commit corrected contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f AWG31-TEST-ERROR.txt AWG31-PATCH-ERROR.txt || true
          git add tests
          git diff --check --cached
          git commit -m "test: require explicit AWG31 client selection"

      - name: Run focused regressions
        run: |
          PYTHONPATH=.:hostd python -m pytest -q \
            tests/test_sg_gateway_v22_awg31_client_picker.py \
            tests/test_sg_gateway_v22_clients_devices_ux.py \
            tests/test_sg_gateway_v22_awg31_stage1_core.py \
            tests/test_sg_gateway_v22_awg31_stage2_api_ui.py \
            tests/test_sg_gateway_v22_awg3_dual_contract.py

      - name: Run full suite
        run: PYTHONPATH=.:hostd python -m pytest -q tests

      - name: Finalize branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/codex-awg31-client-picker.yml \
            .github/workflows/codex-awg31-runner.yml \
            scripts/codex_awg31_picker_patch.py \
            AWG31-TEST-ERROR.txt \
            AWG31-PATCH-ERROR.txt || true
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [path for path in tracked if path != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in tracked]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git diff --check --cached
          git commit -m "chore: finalize AWG31 picker integration"
          git push origin HEAD:codex/awg31-client-picker
