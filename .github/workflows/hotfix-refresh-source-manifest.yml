name: Hotfix refresh source manifest

on:
  push:
    branches:
      - hotfix/02208-xray-export-ready-signature

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate SOURCE-SHA256SUMS and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-refresh-source-manifest.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = [
              p for p in subprocess.check_output(["git", "ls-files"], text=True).splitlines()
              if p != "SOURCE-SHA256SUMS"
          ]
          rows = []
          for path in sorted(paths):
              data = Path(path).read_bytes()
              rows.append(f"{hashlib.sha256(data).hexdigest()}  {path}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          git add SOURCE-SHA256SUMS
          git commit -m "chore: refresh source checksum manifest"
          git push origin HEAD:hotfix/02208-xray-export-ready-signature
