name: One-shot promote reinstall smoke workflow

on:
  push:
    branches:
      - test/reinstall-after-full-uninstall
    paths:
      - .github/workflows/_promote-reinstall-smoke-once.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/reinstall-after-full-uninstall
          fetch-depth: 0

      - name: Promote workflow triggers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/reinstall-after-full-uninstall-smoke.yml")
          body = path.read_text(encoding="utf-8")
          old = """on:
  push:
    branches:
      - test/reinstall-after-full-uninstall
"""
          new = """on:
  workflow_dispatch:
  push:
    branches:
      - dev-02206
"""
          if body.count(old) != 1:
              raise SystemExit("temporary branch trigger not found exactly once")
          path.write_text(body.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Refresh source integrity and commit
        run: |
          rm -f .github/workflows/_promote-reinstall-smoke-once.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          skip = {
              "SOURCE-SHA256SUMS",
              ".github/workflows/_promote-reinstall-smoke-once.yml",
          }
          rows = []
          for rel in subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines():
              if rel in skip:
                  continue
              path = Path(rel)
              if not path.is_file():
                  raise SystemExit(f"tracked file missing: {rel}")
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}")
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n", encoding="utf-8", newline="\n"
          )
          PY

          git diff --check
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test: make reinstall-after-uninstall acceptance permanent"
          git push origin HEAD:test/reinstall-after-full-uninstall
