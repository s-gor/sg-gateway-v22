name: 02208 final verification and cleanup

on:
  push:
    branches:
      - feature/02208-xmux-26728

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Remove one-shot development helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/02208-stage-xray.yml
          git rm tools/apply_02208_xmux_26728.py

      - name: Verify official vendored Xray 26.7.28
        shell: bash
        run: |
          set -euo pipefail
          echo '8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40  vendor/cores/Xray-linux-64.zip' | sha256sum -c -
          (cd vendor/cores && sha256sum -c SHA256SUMS)
          rm -rf /tmp/xray-26728
          mkdir -p /tmp/xray-26728
          unzip -q vendor/cores/Xray-linux-64.zip -d /tmp/xray-26728
          chmod +x /tmp/xray-26728/xray
          /tmp/xray-26728/xray version | tee /tmp/xray-version.txt
          grep -F 'Xray 26.7.28' /tmp/xray-version.txt

      - name: Check Python syntax
        run: |
          python -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('engines').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'syntax ok: {len(files)} files')"

      - name: Focused XMUX and Xray tests
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_02208_xmux_xray26728.py \
            tests/test_sg_gateway_02204_xmux_sgpanel_contract.py \
            tests/test_sg_gateway_021_xmux_rf.py \
            tests/test_sg_gateway_v22_xmux_integration.py \
            tests/test_preview31_xray_updates.py \
            tests/test_sg_gateway_021_vendored_five_engines.py

      - name: Full regression suite
        run: python -m pytest -q

      - name: Discard test mutations and refresh final source inventory
        shell: bash
        run: |
          set -euo pipefail
          echo 'Tracked changes left by tests before restore:'
          git status --short || true
          # The two intended helper deletions are already staged in the index.
          # Restore every worktree file from that index so tests cannot leak
          # mutations (notably data/sg-gateway.sqlite) into the release commit.
          git restore --worktree .
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          paths = subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines()
          paths = sorted(path for path in paths if path != "SOURCE-SHA256SUMS")
          rows = []
          for path in paths:
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              rows.append(f"{digest}  {path}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"SOURCE-SHA256SUMS refreshed after tests: {len(rows)} tracked files")
          PY

      - name: Commit final candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finalize XMUX 26.7.28 candidate'
          echo "Final local candidate: $(git rev-parse HEAD)"

      - name: Verify committed git-blob source integrity
        run: |
          python -B - <<'PY'
          import hashlib
          import re
          import subprocess
          from pathlib import Path

          rows = Path("SOURCE-SHA256SUMS").read_text(encoding="utf-8").splitlines()
          expected = {}
          for line_no, raw in enumerate(rows, 1):
              if not raw.strip():
                  continue
              match = re.fullmatch(r"([0-9a-f]{64})  (.+)", raw)
              if match is None:
                  raise SystemExit(f"invalid SOURCE-SHA256SUMS line {line_no}: {raw!r}")
              digest, path = match.groups()
              if path in expected:
                  raise SystemExit(f"duplicate checksum path: {path}")
              expected[path] = digest

          tracked = set(subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines())
          tracked.discard("SOURCE-SHA256SUMS")
          missing = sorted(tracked - set(expected))
          extra = sorted(set(expected) - tracked)
          if missing or extra:
              raise SystemExit(f"source inventory mismatch: missing={missing} extra={extra}")

          for path in sorted(tracked):
              content = subprocess.check_output(["git", "show", f"HEAD:{path}"])
              actual = hashlib.sha256(content).hexdigest()
              if actual != expected[path]:
                  raise SystemExit(f"source hash mismatch: {path}: {expected[path]} != {actual}")
          print(f"Git-blob source integrity ok: {len(tracked)} tracked files verified")
          PY
          test -z "$(git status --porcelain)"

      - name: Build and verify FULL package from committed HEAD
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-02208-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only

      - name: Push verified final candidate
        run: git push origin HEAD:feature/02208-xmux-26728
