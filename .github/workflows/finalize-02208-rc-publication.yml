name: Finalize 022.08 RC publication metadata

on:
  push:
    branches:
      - automation/02208-rc-publication

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: release/02208-rc
          fetch-depth: 0

      - name: Checkout publication helper
        uses: actions/checkout@v4
        with:
          ref: automation/02208-rc-publication
          path: .automation
          fetch-depth: 1

      - name: Pin public 22.08 commands to verified exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 .automation/tools/finalize_02208_rc.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PUBLICATION-02208.md deploy/GITHUB-COMMANDS.md tests/test_sg_gateway_v22_public_github_commands.py
          git commit -m "docs: publish 0.1.0-022.08 stable commands"
          git push origin HEAD:release/02208-rc
