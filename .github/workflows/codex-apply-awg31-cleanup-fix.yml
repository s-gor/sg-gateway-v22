name: Apply AWG31 cleanup fix

on:
  push:
    branches: [codex/sg-gateway-awg31-cleanup-fix]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sg-gateway-awg31-cleanup-fix
          fetch-depth: 0
      - name: Apply and test
        run: |
          python3 scripts/_codex_apply_awg31_cleanup_fix.py
          bash -n install.sh deploy/install-core.sh deploy/full-uninstall-ubuntu.sh
          python -m pip install -q pytest
          python -m pytest tests/test_sg_gateway_v22_awg31_clean_install_order_cleanup.py
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          excluded = {
              'SOURCE-SHA256SUMS',
              '.github/workflows/codex-apply-awg31-cleanup-fix.yml',
              'scripts/_codex_apply_awg31_cleanup_fix.py',
          }
          tracked = [
              path for path in subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
              if path not in excluded
          ]
          rows = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in tracked]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          Path('.github/workflows/codex-apply-awg31-cleanup-fix.yml').unlink()
          Path('scripts/_codex_apply_awg31_cleanup_fix.py').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: order AWG31 provisioning and finalize cleanup"
          git push origin HEAD:codex/sg-gateway-awg31-cleanup-fix
