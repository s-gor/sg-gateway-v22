name: Refresh hotfix checksums

on:
  push:
    branches:
      - hotfix/02208-xray-recovery-upgrade

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/02208-xray-recovery-upgrade
          fetch-depth: 0
      - name: Regenerate and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-hotfix-checksums.yml
          tmp="$(mktemp)"
          git ls-files -z | while IFS= read -r -d '' f; do
            [ "$f" = "SOURCE-SHA256SUMS" ] && continue
            [ "$f" = ".github/workflows/refresh-hotfix-checksums.yml" ] && continue
            digest="$(sha256sum "$f" | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$f"
          done | LC_ALL=C sort -k2 > "$tmp"
          mv "$tmp" SOURCE-SHA256SUMS
          git add SOURCE-SHA256SUMS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: refresh hotfix source checksums"
          git push origin HEAD:hotfix/02208-xray-recovery-upgrade
