name: Refresh final 22.08 source snapshot

on:
  push:
    branches:
      - release/02208-rc
    paths:
      - .github/workflows/zz-refresh-02208-final-source.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm final release trigger and git-blob verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/release-02208-stable.yml').read_text(encoding='utf-8')
          assert '- "SOURCE-SHA256SUMS"' in text
          assert 'digest="$(git show "HEAD:$f" | sha256sum' in text
          print('final release trigger contract confirmed')
          PY

      - name: Refresh SOURCE-SHA256SUMS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          raw = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [item.decode("utf-8") for item in raw.split(b"\0") if item]
          rows = []
          for item in paths:
              if item == "SOURCE-SHA256SUMS":
                  continue
              rows.append(f"{hashlib.sha256(Path(item).read_bytes()).hexdigest()}  {item}\n")
          Path("SOURCE-SHA256SUMS").write_text("".join(rows), encoding="utf-8")
          print(f"refreshed SOURCE-SHA256SUMS: {len(rows)} files")
          PY

      - name: Commit and verify final source snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git diff --cached --check
          git commit -m "release: finalize 22.08 source integrity snapshot"
          tmp="$(mktemp)"
          git ls-files -z | while IFS= read -r -d '' f; do
            [ "$f" = "SOURCE-SHA256SUMS" ] && continue
            digest="$(git show "HEAD:$f" | sha256sum | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$f"
          done | LC_ALL=C sort -k2 > "$tmp"
          diff -u SOURCE-SHA256SUMS "$tmp"
          echo "final committed git-blob source integrity verified"

      - name: Push final main snapshot
        shell: bash
        run: git push origin HEAD:main

      - name: Remove transient workflow
        shell: bash
        run: |
          git fetch origin release/02208-rc
          git checkout -B release/02208-rc origin/release/02208-rc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-refresh-02208-final-source.yml
          git commit -m "ci: remove transient 22.08 source refresher"
          git push origin HEAD:release/02208-rc
