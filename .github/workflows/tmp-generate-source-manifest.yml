name: TEMP generate source manifest

on:
  push:
    branches:
      - feature/02208-drop-awg2-awg3

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate exact manifest for final tree
        shell: bash
        run: |
          set -euo pipefail
          temp='.github/workflows/tmp-generate-source-manifest.yml'
          : > /tmp/SOURCE-SHA256SUMS
          while IFS= read -r path; do
            [[ "$path" == 'SOURCE-SHA256SUMS' || "$path" == "$temp" ]] && continue
            printf '%s  %s\n' "$(git show "HEAD:$path" | sha256sum | awk '{print $1}')" "$path" >> /tmp/SOURCE-SHA256SUMS
          done < <(git ls-files | LC_ALL=C sort)
          wc -l /tmp/SOURCE-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: exact-source-manifest
          path: /tmp/SOURCE-SHA256SUMS
          if-no-files-found: error
