name: One-shot finalize canonical reinstall command

on:
  push:
    branches:
      - test/reinstall-after-full-uninstall
    paths:
      - .github/workflows/_reinstall-command-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/reinstall-after-full-uninstall
          fetch-depth: 0

      - name: Add canonical reinstall command
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("deploy/full-uninstall-ubuntu.sh")
          body = path.read_text(encoding="utf-8")
          marker = "Для повторной установки SG-Gateway выполните:"
          command = (
              "curl -fsSL "
              "https://raw.githubusercontent.com/s-gor/sg-gateway-v22/dev-02206/"
              "deploy/install-from-github.sh | sudo env "
              "SG_GATEWAY_ALLOW_DEVELOPMENT=1 "
              "SG_GATEWAY_GITHUB_BRANCH=dev-02206 bash"
          )
          if marker in body or command in body:
              raise SystemExit("canonical reinstall command already present")

          anchor = "printf '[SG-Gateway] Журнал: %s\\n' \"$UNINSTALL_LOG\"\n"
          replacement = (
              anchor
              + "printf '\\n[SG-Gateway] Для повторной установки SG-Gateway выполните:\\n'\n"
              + f"printf '%s\\n' '{command}'\n"
          )
          if body.count(anchor) != 1:
              raise SystemExit("uninstaller final output anchor not found exactly once")
          body = body.replace(anchor, replacement, 1)
          path.write_text(body, encoding="utf-8", newline="\n")
          PY

      - name: Refresh source integrity and commit
        run: |
          rm -f .github/workflows/_reinstall-command-finalize-once.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          skip = {
              "SOURCE-SHA256SUMS",
              ".github/workflows/_reinstall-command-finalize-once.yml",
          }
          rows = []
          for rel in subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines():
              if rel in skip:
                  continue
              path = Path(rel)
              if not path.is_file():
                  raise SystemExit(f"tracked file missing: {rel}")
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}")
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n", encoding="utf-8", newline="\n"
          )
          PY

          git diff --check
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: publish canonical reinstall command"
          git push origin HEAD:test/reinstall-after-full-uninstall
