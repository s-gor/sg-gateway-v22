name: Verify Clients Performance Against Exact Base

on:
  push:
    branches:
      - feature/02208-performance-clients

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: feature/02208-performance-clients
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Make health RED contract independent of candidate-only cache internals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_page_runtime_performance_02208.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    health._HEALTH_SUMMARY_CACHE["updated_at"] = 0.0\n'
              '    health._HEALTH_SUMMARY_CACHE["value"] = None\n\n',
              '',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Candidate focused contracts are GREEN
        run: |
          python -m pytest -q \
            tests/test_clients_performance_02208.py \
            tests/test_page_runtime_performance_02208.py \
            tests/test_client_access.py \
            tests/test_client_exports.py \
            tests/test_auth.py

      - name: Prove performance contracts are RED on exact base
        run: |
          git worktree add --detach /tmp/sg-base 48de09b391bf0f82634b156580c79d8a81f3b082
          cp tests/test_clients_performance_02208.py /tmp/sg-base/tests/
          cp tests/test_page_runtime_performance_02208.py /tmp/sg-base/tests/
          set +e
          (
            cd /tmp/sg-base
            python -m pytest -q \
              tests/test_clients_performance_02208.py \
              tests/test_page_runtime_performance_02208.py
          )
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Performance contracts unexpectedly pass on exact base"
            exit 1
          fi
          echo "RED confirmed on exact base"

      - name: Prepare isolated candidate and baseline suites
        run: |
          git worktree add --detach /tmp/sg-candidate HEAD
          cp tests/test_clients_performance_02208.py /tmp/sg-candidate/tests/
          cp tests/test_page_runtime_performance_02208.py /tmp/sg-candidate/tests/
          cat > /tmp/run_suite.py <<'PY'
          import json
          import pathlib
          import pytest
          import sys

          output = pathlib.Path(sys.argv[1])

          class Failures:
              def __init__(self):
                  self.failed = set()

              def pytest_runtest_logreport(self, report):
                  if report.failed:
                      self.failed.add(report.nodeid)

              def pytest_collectreport(self, report):
                  if report.failed:
                      self.failed.add(getattr(report, 'nodeid', str(report.fspath)))

          collector = Failures()
          rc = pytest.main(['tests', '-q', '--tb=no'], plugins=[collector])
          output.write_text(
              json.dumps({'rc': rc, 'failures': sorted(collector.failed)}, indent=2),
              encoding='utf-8',
          )
          print(f'suite rc={rc} failures={len(collector.failed)} -> {output}')
          PY

      - name: Run isolated candidate full suite
        run: |
          cd /tmp/sg-candidate
          python /tmp/run_suite.py /tmp/candidate-suite.json

      - name: Run isolated exact-base full suite
        run: |
          cd /tmp/sg-base
          python /tmp/run_suite.py /tmp/base-suite.json

      - name: Require zero new failures versus exact base
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          candidate = json.loads(Path('/tmp/candidate-suite.json').read_text())
          base = json.loads(Path('/tmp/base-suite.json').read_text())
          c = set(candidate['failures'])
          b = set(base['failures'])
          new = sorted(c - b)
          resolved = sorted(b - c)
          print(f"base failures: {len(b)}")
          print(f"candidate failures: {len(c)}")
          print(f"resolved baseline failures: {len(resolved)}")
          if new:
              print('NEW FAILURES:')
              for item in new:
                  print(item)
              raise SystemExit(f'{len(new)} new failure(s) versus exact base')
          print('zero new failures versus exact base')
          PY

      - name: Remove temporary verifier and refresh source inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_page_runtime_performance_02208.py
          git rm .github/workflows/zz-clients-performance-final.yml
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          files = [p for p in files if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(files)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git diff --cached --name-only

      - name: Commit exact verified final state
        run: |
          git commit -m "test: harden clients performance contracts"
          git push origin HEAD:feature/02208-performance-clients
