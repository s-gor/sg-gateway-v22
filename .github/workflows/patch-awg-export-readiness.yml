name: Apply AWG export readiness implementation

on:
  push:
    branches:
      - fix/awg-export-readiness
    paths:
      - .github/workflows/patch-awg-export-readiness.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/awg-export-readiness
          fetch-depth: 0

      - name: Patch export readiness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/clients/exports.py")
          text = path.read_text(encoding="utf-8")
          old = '''def is_export_ready(
              client: Client,
              engine: str,
              device: Device | None = None,
          ) -> bool:
              resolved = _resolve_device(client, device)
              deployment = _deployments(client, device).get(engine)
              return bool(
                  client.enabled
                  and (resolved is None or resolved.enabled)
                  and deployment is not None
                  and deployment.status == "applied"
              )
          '''
          new = '''_AWG_EXPORT_REQUIRED_FIELDS: dict[str, tuple[str, ...]] = {
              "amneziawg": (
                  "private_key",
                  "address",
                  "server_public_key",
                  "endpoint",
                  "jc",
                  "jmin",
                  "jmax",
                  "s1",
                  "s2",
                  "h1",
                  "h2",
                  "h3",
                  "h4",
              ),
              "amneziawg3": (
                  "private_key",
                  "address",
                  "server_public_key",
                  "endpoint",
                  "jc",
                  "jmin",
                  "jmax",
                  "s1",
                  "s2",
                  "s3",
                  "s4",
                  "h1",
                  "h2",
                  "h3",
                  "h4",
                  "header_protection_key",
                  "content_padding_addition",
                  "rekey_after_time",
                  "rekey_timeout",
                  "reject_after_time",
                  "keepalive_timeout",
                  "max_handshake_attempts",
              ),
              "amneziawg31": (
                  "private_key",
                  "address",
                  "server_public_key",
                  "endpoint",
                  "header_protection_key",
                  "jc",
                  "jmin",
                  "jmax",
                  "s1",
                  "s2",
                  "s3",
                  "s4",
                  "h1",
                  "h2",
                  "h3",
                  "h4",
                  "contentpaddingaddition",
                  "rekeyaftertime",
                  "rekeytimeout",
                  "rejectaftertime",
                  "keepalivetimeout",
                  "maxhandshakeattempts",
                  "randomtrailers",
                  "disablecookies",
              ),
          }


          def _export_config_value_present(config: dict, name: str) -> bool:
              if name not in config or config[name] is None:
                  return False
              value = config[name]
              return not isinstance(value, str) or bool(value.strip())


          def _awg_export_config_ready(engine: str, config: dict) -> bool:
              required = _AWG_EXPORT_REQUIRED_FIELDS.get(engine)
              if required is None:
                  return True
              return all(
                  _export_config_value_present(config, name)
                  for name in required
              )


          def is_export_ready(
              client: Client,
              engine: str,
              device: Device | None = None,
          ) -> bool:
              resolved = _resolve_device(client, device)
              deployment = _deployments(client, device).get(engine)
              if not (
                  client.enabled
                  and (resolved is None or resolved.enabled)
                  and deployment is not None
                  and deployment.status == "applied"
              ):
                  return False

              if engine not in _AWG_EXPORT_REQUIRED_FIELDS:
                  return True
              if not deployment.config_json:
                  return False
              try:
                  config = json.loads(deployment.config_json)
              except (TypeError, ValueError, json.JSONDecodeError):
                  return False
              return bool(
                  isinstance(config, dict)
                  and _awg_export_config_ready(engine, config)
              )
          '''
          if text.count(old) != 1:
              raise SystemExit("is_export_ready source block changed unexpectedly")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY

      - name: Verify focused contract
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m pytest tests/test_awg_export_readiness.py
          python3 -m py_compile app/clients/exports.py
          git diff --check

      - name: Commit implementation and remove temporary workflow
        run: |
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -- .github/workflows/patch-awg-export-readiness.yml
          git add app/clients/exports.py
          git commit -m "fix: validate AWG export readiness"
          git push origin HEAD:fix/awg-export-readiness
