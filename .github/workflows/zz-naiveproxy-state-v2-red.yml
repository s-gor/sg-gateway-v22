name: "Fix retained NaiveProxy state ownership"

on:
  push:
    branches:
      - "fix/02208-naiveproxy-state-ownership-v2"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply recursive ownership repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("install.sh")
          text = p.read_text(encoding="utf-8")
          old = (
              '  install -d -o sg-naiveproxy -g sg-naiveproxy -m 0700 \\\n'
              '    "$NAIVEPROXY_STATE/xdg-data" "$NAIVEPROXY_STATE/xdg-config"\n\n'
              '  chmod o+x "$CONFIG_DIR"\n'
          )
          new = (
              '  install -d -o sg-naiveproxy -g sg-naiveproxy -m 0700 \\\n'
              '    "$NAIVEPROXY_STATE/xdg-data" "$NAIVEPROXY_STATE/xdg-config"\n'
              '  # Retained Caddy/XDG files were also caught by the generic recursive DATA_DIR chown.\n'
              '  # Reclaim the complete private subtree, not only its top-level directories.\n'
              '  chown -R sg-naiveproxy:sg-naiveproxy "$NAIVEPROXY_STATE"\n\n'
              '  chmod o+x "$CONFIG_DIR"\n'
          )
          if old not in text:
              raise SystemExit("stage 13 recursive ownership anchor not found")
          text = text.replace(old, new, 1)
          old_verify = '  done\n\n  local installed_modules=""\n'
          new_verify = (
              '  done\n\n'
              '  local foreign_state=""\n'
              '  foreign_state="$(find "$NAIVEPROXY_STATE" -xdev \\\n'
              '    \\( ! -user sg-naiveproxy -o ! -group sg-naiveproxy \\) -print -quit)"\n'
              '  [[ -z "$foreign_state" ]] || {\n'
              '    echo "NaiveProxy retained state has wrong owner/group: $foreign_state" >&2\n'
              '    return 1\n'
              '  }\n\n'
              '  local installed_modules=""\n'
          )
          verify_start = text.index("verify_naiveproxy_install_contract() {")
          idx = text.index(old_verify, verify_start)
          text = text[:idx] + text[idx:].replace(old_verify, new_verify, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary workflow and refresh source checksums
        run: |
          git rm .github/workflows/zz-naiveproxy-state-v2-red.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines()
          tracked = sorted(path for path in tracked if path != "SOURCE-SHA256SUMS")
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in tracked) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create candidate commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reclaim retained NaiveProxy state recursively"

      - name: Verify regression, 24 stages and shell syntax
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_naiveproxy_native_state_ownership_02208.py
          bash -n install.sh

      - name: Verify exact source integrity
        run: |
          python3 - <<'PY'
          import hashlib, re, subprocess
          from pathlib import Path
          expected = {}
          for raw in Path("SOURCE-SHA256SUMS").read_text(encoding="utf-8").splitlines():
              if raw.strip():
                  m = re.fullmatch(r"([0-9a-f]{64})  (.+)", raw)
                  assert m, raw
                  expected[m.group(2)] = m.group(1)
          tracked = set(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          tracked.discard("SOURCE-SHA256SUMS")
          assert set(expected) == tracked
          for path in sorted(tracked):
              data = subprocess.check_output(["git", "show", f"HEAD:{path}"])
              assert hashlib.sha256(data).hexdigest() == expected[path], path
          print(f"source integrity ok: {len(tracked)} files")
          PY

      - name: Build and self-verify FULL package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-NAIVE-OWNERSHIP-FIX2.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only

      - name: Publish verified candidate
        run: git push origin HEAD:fix/02208-naiveproxy-state-ownership-v2
