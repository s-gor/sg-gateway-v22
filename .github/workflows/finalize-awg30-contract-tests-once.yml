name: Finalize AWG3.0 contract tests once

on:
  push:
    branches: [fix/02206-awg3-runtime-and-system-port-ui]
    paths:
      - .github/workflows/finalize-awg30-contract-tests-once.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02206-awg3-runtime-and-system-port-ui
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify corrected contracts
        run: |
          python -m pip install -r requirements-dev.txt >/dev/null
          python -m pytest -q \
            tests/test_sg_gateway_021_vendored_five_engines.py \
            tests/test_sg_gateway_v22_optional_warp_install.py \
            tests/test_sg_gateway_v22_awg30_clean_install_and_port_ui.py \
            tests/test_sg_gateway_v22_awg3_dual_contract.py

      - name: Restore tracked database and refresh integrity
        run: |
          git checkout origin/dev-02206 -- data/sg-gateway.sqlite
          git rm .github/workflows/finalize-awg30-contract-tests-once.yml
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          paths = [path for path in paths if path != "SOURCE-SHA256SUMS"]
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(
                  f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
                  for path in paths
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit final contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align remaining contracts with AWG3.0 runtime"
          git push origin HEAD:fix/02206-awg3-runtime-and-system-port-ui
