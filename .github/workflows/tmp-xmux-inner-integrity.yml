name: Temporary XMUX inner alignment integrity

on:
  push:
    branches:
      - fix/02207-xmux-inner-align

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02207-xmux-inner-align
          fetch-depth: 0
      - name: Rebuild source integrity from clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-xmux-inner-integrity.yml
          tmp="$(mktemp)"
          while IFS= read -r -d '' file; do
            [[ "$file" == "SOURCE-SHA256SUMS" ]] && continue
            sha256sum "$file"
          done < <(git ls-files -z) | LC_ALL=C sort -k2 > "$tmp"
          mv "$tmp" SOURCE-SHA256SUMS
          git add SOURCE-SHA256SUMS
          git commit -m 'chore: refresh XMUX inner alignment source integrity'
          git push origin HEAD:fix/02207-xmux-inner-align
