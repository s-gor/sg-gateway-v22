name: Patch AnyTLS TUIC export readiness

on:
  push:
    branches:
      - fix/02208-clients-keys-dormant-restore
    paths:
      - .github/scripts/patch_anytls_tuic_export_readiness.py
      - .github/workflows/patch-anytls-tuic-export-readiness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02208-clients-keys-dormant-restore
      - name: Apply focused patch
        run: |
          python3 .github/scripts/patch_anytls_tuic_export_readiness.py
          python3 -m py_compile app/clients/exports.py tests/test_clients_keys_dormant_restore_02208.py
          git add app/clients/exports.py tests/test_clients_keys_dormant_restore_02208.py SOURCE-SHA256SUMS
          git rm .github/scripts/patch_anytls_tuic_export_readiness.py .github/workflows/patch-anytls-tuic-export-readiness.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: restore AnyTLS and TUIC export readiness'
          git push origin HEAD:fix/02208-clients-keys-dormant-restore
