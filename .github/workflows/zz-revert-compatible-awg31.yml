name: Revert compatible AWG31 experiment

on:
  push:
    branches:
      - feature/02208-compatible-subscription-awg31-from-good-snapshot

permissions:
  contents: write

jobs:
  revert-cleanly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-compatible-subscription-awg31-from-good-snapshot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove only AWG31 from simple compatible subscription
        shell: bash
        run: |
          set -euo pipefail
          git checkout 0d859278f6a3df90081892f4b0ad9811a0d8b80b -- app/clients/sg_subscription.py
          python - <<'PY'
          from pathlib import Path
          p = Path('app/clients/sg_subscription.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    "amneziawg31",\n', '', 1)
          start = s.index('\ndef _ready_awg31_config_lines(document: dict) -> list[str]:')
          end = s.index('\ndef build_compatible_subscription_body(client: Client) -> str:', start)
          s = s[:start] + '\n' + s[end:]
          s = s.replace('    lines.extend(_ready_awg31_config_lines(document))\n', '')
          s = s.replace('    """Return the exact nine-profile SG Client-compatible Base64 transport."""', '    """Return the URI-only compatible Base64 subscription transport."""')
          p.write_text(s, encoding='utf-8')
          PY
          git checkout 7d9b064a9f967c54a89f6a6a9641ccbca6b0b13d -- tests/test_sg_gateway_v22_sg_subscription_base64_body.py
          git rm -f tests/test_sg_gateway_v22_compatible_subscription_exact9.py
      - name: Subscription regressions
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q \
            tests/test_sg_gateway_v22_sg_subscription_base64_body.py \
            tests/test_sg_gateway_v22_sg_subscription_compat_text.py \
            tests/test_sg_gateway_v22_sg_subscription_http.py \
            tests/test_sg_gateway_v22_client_protocol_edit_cleanup.py
      - name: Refresh SOURCE-SHA256SUMS
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          transient = '.github/workflows/zz-revert-compatible-awg31.yml'
          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p not in {'SOURCE-SHA256SUMS', transient}]
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(tracked)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/zz-revert-compatible-awg31.yml
      - name: Commit clean revert
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/clients/sg_subscription.py tests/test_sg_gateway_v22_sg_subscription_base64_body.py SOURCE-SHA256SUMS
          git add -u tests/test_sg_gateway_v22_compatible_subscription_exact9.py .github/workflows/zz-revert-compatible-awg31.yml
          git commit -m "revert: remove AWG31 from simple compatible subscription"
          git push origin HEAD:feature/02208-compatible-subscription-awg31-from-good-snapshot
