name: DEV 02206 Foundation Final Verify Once

on:
  push:
    branches: [dev-02206]
    paths:
      - .github/workflows/dev-02206-foundation-final-verify-once.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-02206
          fetch-depth: 0
      - name: Absorb integrity refresh
        run: |
          sleep 20
          git fetch origin dev-02206
          git reset --hard origin/dev-02206
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -r requirements-dev.txt >/dev/null
      - id: integrity
        continue-on-error: true
        run: |
          python3 -B - <<'PY'
          import hashlib, re, subprocess
          from pathlib import Path
          expected = {}
          for raw in Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines():
              if not raw.strip(): continue
              m = re.fullmatch(r'([0-9a-f]{64})  (.+)', raw); assert m, raw
              expected[m.group(2)] = m.group(1)
          tracked=set(subprocess.check_output(['git','ls-files'],text=True,encoding='utf-8').splitlines()); tracked.discard('SOURCE-SHA256SUMS')
          assert tracked == set(expected)
          for p in tracked: assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==expected[p], p
          PY
      - id: focused
        continue-on-error: true
        run: python -m pytest -q tests/test_sg_gateway_v22_runtime_contract_data_backup.py
      - id: full
        continue-on-error: true
        run: python -m pytest tests
      - id: package
        continue-on-error: true
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-DEV-02206-FOUNDATION-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only
      - name: Persist final report
        if: always()
        env:
          INTEGRITY: ${{ steps.integrity.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          FULL: ${{ steps.full.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
        run: |
          printf 'DEV 02206 foundation final verify\nintegrity=%s\nfocused_tests=%s\nfull_tests=%s\nfull_package=%s\n' "$INTEGRITY" "$FOCUSED" "$FULL" "$PACKAGE" > DEV-02206-FOUNDATION-VERIFY.txt
          git rm .github/workflows/dev-02206-foundation-final-verify-once.yml
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked=subprocess.check_output(['git','ls-files'],text=True,encoding='utf-8').splitlines(); tracked=[p for p in tracked if p!='SOURCE-SHA256SUMS']
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in tracked)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record dev-02206 foundation verification"
          git push origin HEAD:dev-02206
          test "$INTEGRITY" = success
          test "$FOCUSED" = success
          test "$FULL" = success
          test "$PACKAGE" = success
