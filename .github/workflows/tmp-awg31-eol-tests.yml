name: Finalize AWG31 EOL alignment

on:
  push:
    branches:
      - fix/02208-awg31-ui-installer-cleanup

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02208-awg31-ui-installer-cleanup
          fetch-depth: 0

      - name: Remove temporary workflow and rebuild source inventory
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/tmp-awg31-eol-tests.yml
          git add -A
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines()
          rows = []
          for path in sorted(paths):
              if path == "SOURCE-SHA256SUMS":
                  continue
              data = Path(path).read_bytes()
              rows.append(f"{hashlib.sha256(data).hexdigest()}  {path}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8", newline="\n")
          print(f"rebuilt SOURCE-SHA256SUMS for {len(rows)} files")
          PY
          git add SOURCE-SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: finalize AWG31-only contracts and source inventory"
          git push origin HEAD:fix/02208-awg31-ui-installer-cleanup
