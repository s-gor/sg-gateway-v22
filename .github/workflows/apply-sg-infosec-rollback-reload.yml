name: Apply SG InfoSec rollback reload

on:
  push:
    branches:
      - feature/sg-infosec-security-ui-v2
    paths:
      - tools/apply_sg_infosec_rollback_reload.py
      - .github/workflows/apply-sg-infosec-rollback-reload.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Apply exact rollback reload transformation
        run: python tools/apply_sg_infosec_rollback_reload.py
      - name: Verify updater contract and syntax
        run: |
          python -m pytest -q tests/test_sg_infosec_management_update_contract.py
          bash -n deploy/update-from-github-core.sh
      - name: Commit transformed updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/update-from-github-core.sh
          git diff --cached --check
          git commit -m "fix: reload SG InfoSec role state after rollback"
          git push origin HEAD:feature/sg-infosec-security-ui-v2
