name: Locate client picker markers
on:
  push:
    paths:
      - '.github/workflows/zz-locate-client-picker-markers.yml'
jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate picker markers
        run: |
          set -o pipefail
          grep -RniE 'SG_PROTOCOL_ORDER_END|cv10-protocol|dv16-protocol-list' app/web app/naiveproxy tests | head -400
          exit 1
