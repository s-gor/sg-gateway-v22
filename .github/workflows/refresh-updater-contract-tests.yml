name: Refresh updater contract tests

on:
  push:
    branches:
      - fix/02208-clients-keys-dormant-restore
    paths:
      - .github/workflows/refresh-updater-contract-tests.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02208-clients-keys-dormant-restore
          fetch-depth: 0
      - name: Refresh assertions and source checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/refresh-updater-contract-tests.yml
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('tests/test_fix30_awg3_update_preservation.py'),
              Path('tests/test_sg_gateway_v22_awg3_runtime_repair.py'),
          ]
          old = '\".venv\"|\"awg3\") continue ;;'
          new = '\".venv\"|\"awg3\"|\"naiveproxy\") continue ;;'
          total = 0
          for path in files:
              body = path.read_text(encoding='utf-8')
              count = body.count(old)
              total += count
              body = body.replace(old, new)
              path.write_text(body, encoding='utf-8', newline='\n')
          if total != 4:
              raise SystemExit(f'expected 4 stale updater assertions, found {total}')
          PY

          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          rows = []
          for name in sorted(subprocess.check_output(['git', 'ls-files'], text=True).splitlines()):
              if name == 'SOURCE-SHA256SUMS':
                  continue
              path = Path(name)
              if path.is_file():
                  rows.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

          git add SOURCE-SHA256SUMS tests/test_fix30_awg3_update_preservation.py tests/test_sg_gateway_v22_awg3_runtime_repair.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: accept NaiveProxy as preserved updater runtime"
          git push origin HEAD:fix/02208-clients-keys-dormant-restore
