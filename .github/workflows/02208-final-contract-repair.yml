name: 022.08 final contract repair

on:
  push:
    branches:
      - release/02208-rc

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 's-gor/sg-gateway-v22'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 22.08 release branch
        uses: actions/checkout@v4
        with:
          ref: release/02208-rc
          fetch-depth: 0

      - name: Repair final contracts and refresh source inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          root = Path('.')

          # 1. Restore every legacy Connections byte from the accepted 22.08
          # baseline, then append exactly one native NaiveProxy include at the
          # bottom of the page. Removing this insertion must reproduce the
          # baseline Git blob byte-for-byte.
          baseline = subprocess.check_output([
              'git', 'show',
              '8f7481cb9ddf87f40c4fa260142ccebaca7844b2:app/web/templates/connections.html'
          ])
          marker = b'\n</section>\n{% endblock %}\n'
          idx = baseline.rfind(marker)
          assert idx >= 0, 'final Connections closing marker not found'
          insertion = b'\n  {% include "_naiveproxy_panel.html" %}\n'
          assert insertion not in baseline
          connections = baseline[:idx] + insertion + baseline[idx:]
          Path('app/web/templates/connections.html').write_bytes(connections)

          # 2. Keep one public 24-stage entrypoint. The old 10-stage function
          # body remains as historical helper code only, under a non-main name.
          install = Path('install.sh').read_text(encoding='utf-8')
          assert install.count('main() {') == 2, install.count('main() {')
          install = install.replace('main() {', 'legacy_main_02208() {', 1)
          install = install.replace(
              'INSTALLER_BUILD="02208-unified-24stage"',
              'INSTALLER_BUILD="02208-full-clean-dual-stack"',
              1,
          )
          assert install.count('main() {') == 1
          final_main = install[install.index('main() {'):]
          numbers = [int(v) for v in re.findall(
              r'\b(?:run_stage|run_interactive_stage)\s+(\d+)\s+', final_main
          )]
          assert numbers == list(range(1, 25)), numbers
          assert final_main.index(
              'run_stage 19 "Независимый профиль AWG31" run_awg31_stage3a_migration'
          ) < final_main.index(
              'run_stage 20 "Применение Xray и клиентов" stage9_apply_runtime'
          )
          Path('install.sh').write_text(install, encoding='utf-8', newline='\n')

          # 3. HTTP test: Connections is now a native Jinja include. The mock
          # route deliberately does not render the production template, so the
          # contract must inspect the real template/panel rather than expect an
          # after_response mutation.
          path = Path('tests/test_naiveproxy_http_02207.py')
          text = path.read_text(encoding='utf-8')
          if 'from pathlib import Path\n' not in text:
              text = text.replace(
                  'from __future__ import annotations\n\n',
                  'from __future__ import annotations\n\nfrom pathlib import Path\n',
                  1,
              )
          pattern = re.compile(
              r'def test_connections_renders_compact_card_without_visible_port_control_after_auth\(monkeypatch\):\n.*?(?=\ndef test_protocol_picker_hides_the_configured_port)',
              re.S,
          )
          replacement = '''def test_connections_uses_native_naiveproxy_panel_after_legacy_content(monkeypatch):
              app, _, _, _ = _build_app(monkeypatch)
              client = app.test_client()
              _authenticate(client)

              response = client.get("/connections")
              assert response.status_code == 200

              root = Path(__file__).resolve().parents[1]
              template = (root / "app/web/templates/connections.html").read_text(encoding="utf-8")
              panel = (root / "app/web/templates/_naiveproxy_panel.html").read_text(encoding="utf-8")
              assert template.count('{% include "_naiveproxy_panel.html" %}') == 1
              assert template.index("cnv1-note-panel") < template.index('_naiveproxy_panel.html')
              assert panel.count('id="sg-naiveproxy-settings"') == 1
              assert "data-naive-host" in panel
              assert "data-naive-port" in panel
              assert "data-naive-runtime" in panel
              assert "'/api/naiveproxy/status'" in panel
              assert "'/api/naiveproxy/settings'" in panel

'''
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1, count
          path.write_text(text, encoding='utf-8')

          # 4. Integration test: keep after_request only for the Clients
          # protocol selector; Connections itself is direct Jinja.
          path = Path('tests/test_naiveproxy_integration_02207.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'def test_ui_injects_protocol_and_compact_connections_control\(\):\n.*?(?=\ndef test_first_assignment_prepares_8447_from_security_tls)',
              re.S,
          )
          replacement = '''def test_ui_uses_clients_protocol_hook_and_native_connections_panel():
              root = Path(__file__).parents[1]
              source = (root / "app/naiveproxy/http.py").read_text()
              template = (root / "app/web/templates/connections.html").read_text()
              panel = (root / "app/web/templates/_naiveproxy_panel.html").read_text()

              assert '<input type="checkbox" name="protocols" value="naiveproxy"' in source
              assert "SG_PROTOCOL_ORDER_END" in source
              assert "app.after_request(_inject_naiveproxy_protocol_option)" in source
              assert "_inject_naiveproxy_ui" not in source
              assert template.count('{% include "_naiveproxy_panel.html" %}') == 1
              assert template.index("cnv1-note-panel") < template.index('_naiveproxy_panel.html')
              assert 'id="sg-naiveproxy-settings"' in panel
              assert "data-naive-host" in panel
              assert "data-naive-submit" in panel
              assert "let activePort = 8447;" in panel
              assert "activePort = Number(payload.port || payload.default_port || 8447);" in panel
              assert "'/api/naiveproxy/status'" in panel
              assert "'/api/naiveproxy/settings'" in panel
              assert "JSON.stringify({port: Number(activePort)})" in panel

'''
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1, count
          path.write_text(text, encoding='utf-8')

          # 5. Compact-card test now reads the actual template partial rather
          # than the HTTP module that no longer owns Connections HTML.
          path = Path('tests/test_sg_gateway_v22_compact_protocol_cards_ui_02207.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'NAIVE = ROOT / "app/naiveproxy/http.py"\n',
              'NAIVE = ROOT / "app/web/templates/_naiveproxy_panel.html"\nCONNECTIONS = ROOT / "app/web/templates/connections.html"\n',
              1,
          )
          pattern = re.compile(
              r'def test_naiveproxy_is_compact_bottom_engine_card_without_visible_port_or_runtime_clutter\(\) -> None:\n.*?(?=\ndef test_hysteria2_has_effective_compact_overrides)',
              re.S,
          )
          replacement = '''def test_naiveproxy_is_native_bottom_engine_card() -> None:
              naive = _read(NAIVE)
              connections = _read(CONNECTIONS)

              assert '<article id="sg-naiveproxy-settings"' in naive
              assert "xps2-naiveproxy-card" in naive
              assert "HTTPS FORWARD PROXY · TLS" in naive
              assert "data-naive-host" in naive
              assert "data-naive-port" in naive
              assert "data-naive-runtime" in naive
              assert "data-naive-submit" in naive
              assert "let activePort = 8447;" in naive
              assert "activePort = Number(payload.port || payload.default_port || 8447);" in naive
              assert "body: JSON.stringify({port: Number(activePort)})" in naive
              assert "healthy ? 'Работает' : 'Не настроен'" in naive
              assert connections.count('{% include "_naiveproxy_panel.html" %}') == 1
              assert connections.index("cnv1-note-panel") < connections.index('_naiveproxy_panel.html')

'''
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1, count
          path.write_text(text, encoding='utf-8')

          # 6. AWG31 order test follows the 24-stage master order directly.
          path = Path('tests/test_sg_gateway_v22_awg31_clean_install_order_cleanup.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'@pytest\.mark\.parametrize\("installer", \["install\.sh", "deploy/install-core\.sh"\]\)\ndef test_awg31_stage3a_precedes_first_clean_install_clients_apply\(.*?(?=\ndef _extract_shell_function)',
              re.S,
          )
          replacement = '''def test_awg31_stage3a_precedes_first_clean_install_clients_apply() -> None:
              source = (ROOT / "install.sh").read_text(encoding="utf-8")
              main = source[source.index("main() {"):]
              awg31 = 'run_stage 19 "Независимый профиль AWG31" run_awg31_stage3a_migration'
              clients = 'run_stage 20 "Применение Xray и клиентов" stage9_apply_runtime'
              assert awg31 in main
              assert clients in main
              assert main.index(awg31) < main.index(clients)

'''
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1, count
          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/02208-final-contract-repair.yml

          bash -n install.sh
          python3 -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          # Verify the Connections byte contract before regenerating manifest.
          baseline = subprocess.check_output([
              'git', 'show',
              '8f7481cb9ddf87f40c4fa260142ccebaca7844b2:app/web/templates/connections.html'
          ])
          current = Path('app/web/templates/connections.html').read_bytes()
          insertion = b'\n  {% include "_naiveproxy_panel.html" %}\n'
          assert current.count(insertion) == 1
          assert current.replace(insertion, b'', 1) == baseline

          tracked = sorted(
              path for path in subprocess.check_output(
                  ['git', 'ls-files'], text=True, encoding='utf-8'
              ).splitlines()
              if path != 'SOURCE-SHA256SUMS'
          )
          rows = []
          for path in tracked:
              data = Path(path).read_bytes()
              rows.append(f'{hashlib.sha256(data).hexdigest()}  {path}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f'regenerated SOURCE-SHA256SUMS: {len(rows)} tracked files')
          PY

          git add install.sh app/web/templates/connections.html \
            tests/test_naiveproxy_http_02207.py \
            tests/test_naiveproxy_integration_02207.py \
            tests/test_sg_gateway_v22_compact_protocol_cards_ui_02207.py \
            tests/test_sg_gateway_v22_awg31_clean_install_order_cleanup.py \
            SOURCE-SHA256SUMS
          git diff --cached --check
          git status --short

      - name: Commit repaired final contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: align final 22.08 contracts"
          git push origin HEAD:release/02208-rc
