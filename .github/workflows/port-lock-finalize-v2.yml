name: Verify clean server-managed ports v2

on:
  push:
    branches:
      - fix/02206-lock-server-ports-clean-v2

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prepare clean candidate tree
        run: |
          git checkout c7b03e5828b508b4f58696d5cac3614709fd965a -- data/sg-gateway.sqlite data/system-activity.json
          git rm \
            .github/workflows/port-lock-finalize.yml \
            .github/workflows/port-lock-finalize-v2.yml
          python -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = sorted(
              path
              for path in subprocess.check_output(["git", "ls-files"], text=True).splitlines()
              if path != "SOURCE-SHA256SUMS"
          )
          rows = [
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
              for path in tracked
          ]
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"SOURCE-SHA256SUMS regenerated for {len(rows)} tracked files")
          PY

      - name: Run focused server-port contracts
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_v22_server_managed_ports.py \
            tests/test_sg_gateway_v22_awg30_clean_install_and_port_ui.py \
            tests/test_connections_layout_v24.py \
            tests/test_ui_connections_visual_v1.py

      - name: Run full repository suite
        run: python -m pytest -q

      - name: Remove test side effects and regenerate integrity inventory
        run: |
          git checkout c7b03e5828b508b4f58696d5cac3614709fd965a -- data/sg-gateway.sqlite data/system-activity.json
          python -B - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = sorted(
              path
              for path in subprocess.check_output(["git", "ls-files"], text=True).splitlines()
              if path != "SOURCE-SHA256SUMS"
          )
          rows = [
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
              for path in tracked
          ]
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(f"SOURCE-SHA256SUMS regenerated for {len(rows)} tracked files")
          PY

      - name: Verify exact final diff and source integrity
        run: |
          python -B - <<'PY'
          import hashlib
          import re
          import subprocess
          from pathlib import Path

          base = "c7b03e5828b508b4f58696d5cac3614709fd965a"
          expected = {
              "SOURCE-SHA256SUMS",
              "app/mihomo/service.py",
              "app/web/static/sg-xray-profiles-v2.css",
              "app/web/templates/_mihomo_panel.html",
              "app/web/templates/connections.html",
              "app/xray/profiles.py",
              "tests/test_connections_layout_v24.py",
              "tests/test_sg_gateway_v22_awg30_clean_install_and_port_ui.py",
              "tests/test_sg_gateway_v22_server_managed_ports.py",
              "tests/test_ui_connections_visual_v1.py",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--name-only", base], text=True).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  "unexpected final diff:\n"
                  f"missing={sorted(expected - actual)}\n"
                  f"extra={sorted(actual - expected)}"
              )

          rows = Path("SOURCE-SHA256SUMS").read_text(encoding="utf-8").splitlines()
          inventory = {}
          for line_no, raw in enumerate(rows, 1):
              match = re.fullmatch(r"([0-9a-f]{64})  (.+)", raw)
              if match is None:
                  raise SystemExit(f"invalid checksum line {line_no}: {raw!r}")
              digest, path = match.groups()
              if path in inventory:
                  raise SystemExit(f"duplicate checksum path: {path}")
              inventory[path] = digest

          tracked = set(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          tracked.discard("SOURCE-SHA256SUMS")
          if set(inventory) != tracked:
              raise SystemExit(
                  f"checksum inventory mismatch: missing={sorted(tracked-set(inventory))} "
                  f"extra={sorted(set(inventory)-tracked)}"
              )
          for path in sorted(tracked):
              actual_digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if inventory[path] != actual_digest:
                  raise SystemExit(f"source hash mismatch: {path}")

          if subprocess.run(["git", "diff", "--quiet", base, "--", "data/sg-gateway.sqlite"]).returncode != 0:
              raise SystemExit("test database differs from stable base")
          print(f"Final diff and {len(tracked)} source hashes verified")
          PY

      - name: Create exact local candidate commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: lock SG-Gateway listener ports"
          echo "Candidate SHA: $(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"

      - name: Build and verify FULL package from exact candidate HEAD
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only
          test -z "$(git status --porcelain)"

      - name: Push verified candidate
        run: git push origin HEAD:fix/02206-lock-server-ports-clean-v2
