name: Temporary Final Vendor Integrity Fix

on:
  push:
    branches:
      - feature/02208-performance-clients
    paths:
      - .github/workflows/zz-final-vendor-integrity-fix.yml

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-performance-clients
          fetch-depth: 0

      - name: Verify repaired vendor manifest
        run: |
          set -euxo pipefail
          cd vendor/cores
          sha256sum -c SHA256SUMS
          unzip -tqq Xray-linux-64.zip
          gzip -t mihomo-linux-amd64-v1.19.29.gz
          tar -tzf sing-box-1.13.14-linux-amd64.tar.gz >/dev/null
          zstd -tq wgcf-cli-linux-64.tar.zstd
          tar -tzf amneziawg-tools-1.0.20260618-2.tar.gz >/dev/null
          tar -tzf amneziawg-linux-kernel-module-1.0.20260329-2.tar.gz >/dev/null
          tar -tzf amneziawg-tools-3.0.20260805.tar.gz >/dev/null
          test -s amneziawg-go-linux-amd64-v3.0.0

      - name: Verify installer syntax
        run: |
          set -euxo pipefail
          bash -n install.sh
          bash -n deploy/install-from-github.sh

      - name: Finalize clean candidate
        id: finalize
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-final-vendor-integrity-fix.yml
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          files = [p for p in files if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(files)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git commit -m 'fix: finalize vendor integrity repair'
          git push origin HEAD:feature/02208-performance-clients
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify exact final GitHub archive
        env:
          TARGET_SHA: ${{ steps.finalize.outputs.sha }}
        run: |
          set -euxo pipefail
          work="$(mktemp -d)"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 2 "https://github.com/s-gor/sg-gateway-v22/archive/${TARGET_SHA}.tar.gz" -o "$work/source.tar.gz"; then
              break
            fi
            sleep 3
          done
          gzip -t "$work/source.tar.gz"
          mkdir "$work/source"
          tar -xzf "$work/source.tar.gz" -C "$work/source" --strip-components=1
          cd "$work/source/vendor/cores"
          sha256sum -c SHA256SUMS
          unzip -tqq Xray-linux-64.zip
          gzip -t mihomo-linux-amd64-v1.19.29.gz
          tar -tzf sing-box-1.13.14-linux-amd64.tar.gz >/dev/null
          zstd -tq wgcf-cli-linux-64.tar.zstd
          tar -tzf amneziawg-tools-1.0.20260618-2.tar.gz >/dev/null
          tar -tzf amneziawg-linux-kernel-module-1.0.20260329-2.tar.gz >/dev/null
          tar -tzf amneziawg-tools-3.0.20260805.tar.gz >/dev/null
          test -s amneziawg-go-linux-amd64-v3.0.0
          echo "FINAL_ARCHIVE_VENDOR_VERIFY=OK"
