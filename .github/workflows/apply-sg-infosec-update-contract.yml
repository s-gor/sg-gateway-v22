name: Apply SG InfoSec update contract

on:
  push:
    branches:
      - feature/sg-infosec-security-ui-v2
    paths:
      - tools/apply_sg_infosec_update_contract.py
      - .github/workflows/apply-sg-infosec-update-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Apply exact updater transformation
        run: python tools/apply_sg_infosec_update_contract.py

      - name: Verify rollback contract
        run: python -m pytest -q tests/test_sg_infosec_management_update_contract.py

      - name: Commit transformed updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/update-from-github-core.sh
          git diff --cached --check
          git commit -m "update: include SG InfoSec bridge in safety rollback"
          git push origin HEAD:feature/sg-infosec-security-ui-v2
