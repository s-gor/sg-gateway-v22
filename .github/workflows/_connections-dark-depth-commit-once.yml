name: One-shot commit Connections dark depth restoration

on:
  push:
    branches:
      - fix30-ipv6-dual-stack
    paths:
      - .github/workflows/_connections-dark-depth-commit-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix30-ipv6-dual-stack
          fetch-depth: 0

      - name: Apply verified depth payload
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          carrier = Path('.github/workflows/_connections-dark-depth-once.yml').read_text(encoding='utf-8')
          css_match = re.search(r'^\s*CSS_B64:\s*(\S+)\s*$', carrier, re.MULTILINE)
          test_match = re.search(r'^\s*TEST_B64:\s*(\S+)\s*$', carrier, re.MULTILINE)
          if not css_match or not test_match:
              raise SystemExit('payload not found')

          css_path = Path('app/web/static/sg-connections-dark-classic-v1.css')
          css = css_path.read_text(encoding='utf-8')
          marker = 'SG-Gateway 022.04 · Connections classic dark depth pass 2'
          if marker in css:
              raise SystemExit('depth pass already present')
          css_extra = base64.b64decode(css_match.group(1)).decode('utf-8')
          css_path.write_text(css.rstrip() + '\n' + css_extra.lstrip() + '\n', encoding='utf-8')

          tests_path = Path('tests/test_ui_connections_visual_v1.py')
          tests = tests_path.read_text(encoding='utf-8')
          test_marker = 'def test_connections_dark_classic_depth_pass_restores_blue_glass_hierarchy():'
          if test_marker in tests:
              raise SystemExit('depth regression test already present')
          test_extra = base64.b64decode(test_match.group(1)).decode('utf-8')
          tests_path.write_text(tests.rstrip() + '\n' + test_extra.lstrip() + '\n', encoding='utf-8')

          final_css = css_path.read_text(encoding='utf-8')
          assert marker in final_css
          assert 'radial-gradient(circle at 100% -12%, rgba(101, 169, 243, .12)' in final_css
          assert 'border-color: #3a6083 !important;' in final_css
          assert 'html[data-theme="light"]' not in final_css
          compile(tests_path.read_text(encoding='utf-8'), str(tests_path), 'exec')
          PY

      - name: Refresh integrity and commit
        shell: bash
        run: |
          rm -f .github/workflows/_connections-dark-depth-once.yml
          rm -f .github/workflows/_connections-dark-depth-commit-once.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          skip = {
              'SOURCE-SHA256SUMS',
              '.github/workflows/_connections-dark-depth-once.yml',
              '.github/workflows/_connections-dark-depth-commit-once.yml',
          }
          tracked = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          rows = []
          for path in tracked:
              if path in skip:
                  continue
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f'tracked file missing: {path}')
              rows.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {path}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

          git diff --check
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "UI: restore blue-glass depth on dark Connections"
          git push origin HEAD:fix30-ipv6-dual-stack
