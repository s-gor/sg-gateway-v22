name: Temporary Reality Restore Regression

on:
  push:
    branches:
      - fix/02208-reality-restore-runtime

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Import and syntax
        env:
          PYTHONPATH: .:hostd
        run: |
          python -B -m py_compile hostd/sg_hostd/clients_keys_reality_restore_patch.py hostd/sg_hostd/__init__.py
          python -c 'import sg_hostd'
      - name: Current 022.08 release contract plus Reality restore regression
        env:
          PYTHONPATH: .:hostd
        run: |
          python -m pytest -q \
            tests/test_auth.py \
            tests/test_awg31_only_cleanup_02208.py \
            tests/test_client_access.py \
            tests/test_client_detail_performance_02208.py \
            tests/test_client_exports.py \
            tests/test_clients_performance_02208.py \
            tests/test_connections_db_performance_02208.py \
            tests/test_installer_02208_master_24_stages.py \
            tests/test_maintenance_performance_02208.py \
            tests/test_mihomo_probe_cache_02208.py \
            tests/test_other_pages_performance_02208.py \
            tests/test_page_runtime_performance_02208.py \
            tests/test_retired_awg2_awg3_02208.py \
            tests/test_runtime_probe_cache_02208.py \
            tests/test_sg_gateway_v22_awg31_stage3a_install_update.py \
            tests/test_sg_gateway_v22_awg31_update_entrypoint.py \
            tests/test_sg_gateway_v22_awg31_update_runtime_staging.py \
            tests/test_sg_gateway_v22_clean_install_awg_label_contract.py \
            tests/test_sg_gateway_v22_clean_install_connections_ui.py \
            tests/test_sg_gateway_v22_clean_install_os_preflight.py \
            tests/test_sg_gateway_v22_clean_install_production_wsgi.py \
            tests/test_sg_gateway_v22_public_github_commands.py \
            tests/test_sg_gateway_v22_release_02208.py \
            tests/test_sg_gateway_v22_release_preparation.py \
            tests/test_sg_gateway_v22_retired_awg_cleanup.py \
            tests/test_update_runtime_preservation_contract.py \
            tests/test_system_health_performance_02208.py \
            tests/test_clients_keys_reality_restore_runtime_02208.py
