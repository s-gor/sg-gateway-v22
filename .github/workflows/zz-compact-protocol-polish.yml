name: Compact protocol polish

on:
  push:
    branches:
      - ui/02208-awg31-naiveproxy-compact
    paths:
      - tools/apply_compact_protocol_polish_once.py
      - .github/workflows/zz-compact-protocol-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/02208-awg31-naiveproxy-compact
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply polish
        run: python tools/apply_compact_protocol_polish_once.py
      - name: Focused tests
        run: python -m pytest -q tests/test_sg_gateway_v22_awg31_naiveproxy_compact_ui_02208.py tests/test_health.py
      - name: Commit verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ui: polish compact AWG31 and NaiveProxy block"
          git push origin HEAD:ui/02208-awg31-naiveproxy-compact
