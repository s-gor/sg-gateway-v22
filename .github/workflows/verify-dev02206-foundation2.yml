name: Verify DEV 02206 Foundation 2

on:
  push:
    branches: [verify-dev02206-foundation2-20260819]
    paths:
      - .github/workflows/verify-dev02206-foundation2.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-dev02206-foundation2-20260819
          fetch-depth: 0

      - name: Build clean verification snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-dev02206-foundation2.yml
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked=subprocess.check_output(['git','ls-files'],text=True,encoding='utf-8').splitlines()
          tracked=[p for p in tracked if p!='SOURCE-SHA256SUMS']
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in tracked)+'\n',encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git commit -m "Prepare clean isolated foundation verification snapshot"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -r requirements-dev.txt >/dev/null

      - id: integrity
        continue-on-error: true
        run: |
          python3 -B - <<'PY'
          import hashlib,re,subprocess
          from pathlib import Path
          expected={}
          for raw in Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines():
              if not raw.strip(): continue
              m=re.fullmatch(r'([0-9a-f]{64})  (.+)',raw); assert m,raw
              expected[m.group(2)]=m.group(1)
          tracked=set(subprocess.check_output(['git','ls-files'],text=True,encoding='utf-8').splitlines()); tracked.discard('SOURCE-SHA256SUMS')
          assert tracked==set(expected),(sorted(tracked-set(expected)),sorted(set(expected)-tracked))
          for p in tracked: assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==expected[p],p
          print(f'integrity ok: {len(tracked)}')
          PY

      - id: syntax
        continue-on-error: true
        run: |
          python -B - <<'PY'
          from pathlib import Path
          files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('engines').rglob('*.py'))+list(Path('tests').rglob('*.py'))
          for p in files: compile(p.read_text(encoding='utf-8'),str(p),'exec')
          print(f'syntax ok: {len(files)}')
          PY

      - id: focused
        continue-on-error: true
        run: python -m pytest -q tests/test_sg_gateway_v22_runtime_contract_data_backup.py

      - id: full
        continue-on-error: true
        run: python -m pytest tests

      - id: package
        continue-on-error: true
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-DEV-02206-FOUNDATION2-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only

      - name: Persist report and logs
        if: always()
        env:
          INTEGRITY: ${{ steps.integrity.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          FULL: ${{ steps.full.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
        run: |
          printf 'foundation2 isolated verify\nintegrity=%s\nsyntax=%s\nfocused_tests=%s\nfull_tests=%s\nfull_package=%s\n' "$INTEGRITY" "$SYNTAX" "$FOCUSED" "$FULL" "$PACKAGE" > VERIFY-FOUNDATION2.txt
          git add VERIFY-FOUNDATION2.txt
          git commit -m "Record clean isolated foundation verification"
          git push origin HEAD:verify-dev02206-foundation2-20260819
          test "$INTEGRITY" = success
          test "$SYNTAX" = success
          test "$FOCUSED" = success
          test "$FULL" = success
          test "$PACKAGE" = success
