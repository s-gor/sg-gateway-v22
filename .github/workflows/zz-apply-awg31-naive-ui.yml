name: Apply AWG31 Naive compact UI

on:
  push:
    branches:
      - ui/02208-awg31-naiveproxy-compact
    paths:
      - tools/apply_awg31_naive_ui_once.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/02208-awg31-naiveproxy-compact
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and verify compact UI
        run: python tools/apply_awg31_naive_ui_once.py
      - name: Commit verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ui: group AWG31 with NaiveProxy"
          git push origin HEAD:ui/02208-awg31-naiveproxy-compact
