name: Temporary Clients Performance Verifier

on:
  push:
    branches:
      - feature/02208-performance-clients

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/02208-performance-clients
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Write RED query-count contract
        run: |
          cat > tests/test_clients_performance_02208.py <<'PY'
          from __future__ import annotations

          import sqlite3

          from app.clients import repository


          class CountingConnection(sqlite3.Connection):
              query_count = 0

              def execute(self, sql, parameters=()):
                  if str(sql).lstrip().upper().startswith("SELECT"):
                      self.query_count += 1
                  return super().execute(sql, parameters)


          def test_list_clients_uses_constant_number_of_selects(monkeypatch):
              connection = sqlite3.connect(":memory:", factory=CountingConnection)
              connection.row_factory = sqlite3.Row
              connection.executescript(
                  """
                  CREATE TABLE clients (
                      id INTEGER PRIMARY KEY,
                      name TEXT NOT NULL,
                      enabled INTEGER NOT NULL,
                      expires_at TEXT
                  );
                  CREATE TABLE devices (
                      id INTEGER PRIMARY KEY,
                      client_id INTEGER NOT NULL,
                      enabled INTEGER NOT NULL
                  );
                  CREATE TABLE device_credentials (
                      id INTEGER PRIMARY KEY,
                      device_id INTEGER NOT NULL,
                      engine TEXT NOT NULL,
                      status TEXT NOT NULL
                  );
                  """
              )
              for client_id in range(1, 26):
                  connection.execute(
                      "INSERT INTO clients(id, name, enabled, expires_at) VALUES (?, ?, 1, NULL)",
                      (client_id, f"client-{client_id}"),
                  )
                  connection.execute(
                      "INSERT INTO devices(id, client_id, enabled) VALUES (?, ?, 1)",
                      (client_id, client_id),
                  )
                  connection.execute(
                      "INSERT INTO device_credentials(id, device_id, engine, status) VALUES (?, ?, 'xray', 'applied')",
                      (client_id, client_id),
                  )
              connection.commit()
              connection.query_count = 0

              monkeypatch.setattr(repository, "init_db", lambda: None)
              monkeypatch.setattr(repository, "connect", lambda: connection)

              clients = repository.list_clients()

              assert len(clients) == 25
              assert clients[0].id == 25
              assert clients[-1].id == 1
              assert all(client.device_count == 1 for client in clients)
              assert all(client.active_device_count == 1 for client in clients)
              assert all(client.xray_status == "applied" for client in clients)
              assert connection.query_count == 3
          PY

      - name: Prove RED on inherited implementation
        run: |
          set +e
          python -m pytest -q tests/test_clients_performance_02208.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected the inherited N+1 implementation to fail the query-count contract"
            exit 1
          fi
          echo "RED confirmed: inherited list_clients() exceeds the constant query budget"

      - name: Replace N+1 list query with batched reads
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/clients/repository.py")
          text = path.read_text(encoding="utf-8")
          old = '''def list_clients() -> list[Client]:
              init_db()
              with connect() as connection:
                  rows = connection.execute(
                      "SELECT id, name, enabled, expires_at FROM clients ORDER BY id DESC"
                  ).fetchall()
                  return [_client_from_row(connection, row) for row in rows]
          '''
          new = '''def list_clients() -> list[Client]:
              init_db()
              with connect() as connection:
                  rows = connection.execute(
                      "SELECT id, name, enabled, expires_at FROM clients ORDER BY id DESC"
                  ).fetchall()
                  device_rows = connection.execute(
                      "SELECT id, client_id, enabled FROM devices ORDER BY client_id, id"
                  ).fetchall()
                  credential_rows = connection.execute(
                      """
                      SELECT d.client_id, dc.engine, dc.status
                      FROM device_credentials dc
                      JOIN devices d ON d.id = dc.device_id
                      ORDER BY d.client_id, dc.engine
                      """
                  ).fetchall()

              devices_by_client: dict[int, list] = {}
              for device in device_rows:
                  devices_by_client.setdefault(int(device["client_id"]), []).append(device)

              credentials_by_client: dict[int, list] = {}
              for credential in credential_rows:
                  credentials_by_client.setdefault(int(credential["client_id"]), []).append(credential)

              clients: list[Client] = []
              for row in rows:
                  client_id = int(row["id"])
                  devices = devices_by_client.get(client_id, [])
                  credentials = credentials_by_client.get(client_id, [])
                  clients.append(
                      Client(
                          id=client_id,
                          name=str(row["name"]),
                          enabled=bool(row["enabled"]),
                          expires_at=row["expires_at"],
                          awg_status=_aggregate_status(credentials, "amneziawg"),
                          awg3_status=_aggregate_status(credentials, "amneziawg3"),
                          xray_status=_aggregate_status(credentials, "xray"),
                          mihomo_status=_aggregate_status(credentials, "mihomo"),
                          anytls_status=_aggregate_status(credentials, "anytls"),
                          tuic_status=_aggregate_status(credentials, "tuic"),
                          sgclient_status=_aggregate_status(credentials, "sgclient"),
                          device_count=len(devices),
                          active_device_count=sum(1 for item in devices if bool(item["enabled"])),
                      )
                  )
              return clients
          '''
          if old not in text:
              raise SystemExit("expected list_clients block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Prove GREEN and run focused client regressions
        run: |
          python -m pytest -q \
            tests/test_clients_performance_02208.py \
            tests/test_client_access.py \
            tests/test_client_exports.py

      - name: Stage exact product change and regenerate source inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/clients/repository.py tests/test_clients_performance_02208.py
          git rm .github/workflows/zz-clients-performance.yml
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          files = [path for path in files if path != "SOURCE-SHA256SUMS"]
          rows = []
          for name in sorted(files):
              data = Path(name).read_bytes()
              rows.append(f"{hashlib.sha256(data).hexdigest()}  {name}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          git add SOURCE-SHA256SUMS
          printf '%s\n' "Changed files:"
          git diff --cached --name-only

      - name: Commit exact verified change
        run: |
          git commit -m "perf: batch client list queries"
          git push origin HEAD:feature/02208-performance-clients
