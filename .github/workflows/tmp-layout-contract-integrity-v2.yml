name: Temporary Layout Contract Integrity V2

on:
  push:
    branches:
      - feature/02207-layout-contract-connections
    paths:
      - .github/workflows/tmp-layout-contract-integrity-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02207-layout-contract-connections
          fetch-depth: 0

      - name: Refresh manifest and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          excluded = {
              'SOURCE-SHA256SUMS',
              '.github/workflows/tmp-layout-contract-integrity-v2.yml',
          }
          raw = subprocess.check_output(['git', 'ls-files', '-z'])
          paths = [p.decode('utf-8') for p in raw.split(b'\0') if p]
          lines = []
          for path in paths:
              if path in excluded:
                  continue
              blob = subprocess.check_output(['git', 'cat-file', 'blob', f'HEAD:{path}'])
              lines.append(f"{hashlib.sha256(blob).hexdigest()}  {path}\n")
          Path('SOURCE-SHA256SUMS').write_text(''.join(lines), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-layout-contract-integrity-v2.yml
          git add SOURCE-SHA256SUMS
          git commit -m "chore: refresh layout contract source integrity"
          git push origin HEAD:feature/02207-layout-contract-connections
