name: Port lock contract

on:
  push:
    branches:
      - fix/02206-lock-server-ports

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run server-managed port contract
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_sg_gateway_v22_server_managed_ports.py
