name: Apply server-managed port contract once

on:
  push:
    branches:
      - fix/02206-lock-server-ports

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02206-lock-server-ports
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply minimal production and contract changes
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Remove one-time workflow and refresh source integrity
        run: |
          git rm .github/workflows/port-lock-diagnostic.yml
          python -c "import hashlib,subprocess; from pathlib import Path; paths=sorted(p for p in subprocess.check_output(['git','ls-files'],text=True,encoding='utf-8').splitlines() if p != 'SOURCE-SHA256SUMS' and Path(p).is_file()); Path('SOURCE-SHA256SUMS').write_text(''.join(f'{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}\n' for p in paths),encoding='utf-8')"
      - name: Run focused port and UI contracts
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_v22_server_managed_ports.py \
            tests/test_sg_gateway_v22_awg30_clean_install_and_port_ui.py \
            tests/test_connections_layout_v24.py \
            tests/test_sg_gateway_v22_xray_fingerprint.py \
            tests/test_xray_profile_flow_v23.py
      - name: Run full repository tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Restore tracked runtime fixture and recheck integrity
        run: |
          git checkout -- data/sg-gateway.sqlite || true
          python -c "import hashlib,subprocess; from pathlib import Path; paths=sorted(p for p in subprocess.check_output(['git','ls-files'],text=True,encoding='utf-8').splitlines() if p != 'SOURCE-SHA256SUMS' and Path(p).is_file()); Path('SOURCE-SHA256SUMS').write_text(''.join(f'{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}\n' for p in paths),encoding='utf-8')"
          source_tests=$(git ls-files 'tests/*source*integrity*.py')
          if [ -n "$source_tests" ]; then python -m pytest -q $source_tests; fi
          python -m compileall -q app
      - name: Commit completed fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make server listener ports read-only"
          git push origin HEAD:fix/02206-lock-server-ports
