name: Documentation and Help focused contract

on:
  push:
    branches: [docs/02206-guide-help]
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest flask
      - run: python -m pytest -q tests/test_sg_gateway_v22_documentation_help.py
