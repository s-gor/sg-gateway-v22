name: TEMP README install path refresh

on:
  push:
    branches: [fix/02208-official-install-path]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02208-official-install-path
      - name: Repair README Clean Install pin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='f709015548de91c631a5daf174194f245f7cce00'
          new='6ec4b31c45bdfd648a8ee0415e588a557614651b'
          p=Path('README.md')
          body=p.read_text(encoding='utf-8')
          if old not in body:
              raise SystemExit('stale README source pin not found')
          body=body.replace(old,new)
          p.write_text(body,encoding='utf-8',newline='\n')
          assert old not in body
          assert body.count(new) >= 2
          PY
      - name: Verify public command contracts
        run: |
          python3 - <<'PY'
          import runpy
          ns=runpy.run_path('tests/test_sg_gateway_v22_clean_install_awg_label_contract.py')
          ns['test_public_clean_install_commands_pin_one_verified_02208_source_commit']()
          ns=runpy.run_path('tests/test_official_install_path_02208.py')
          ns['test_public_clean_install_is_pinned_to_final_verified_source']()
          ns['test_full_uninstall_reinstall_hint_follows_stable_channel_without_stale_sha']()
          print('public install path contracts ok')
          PY
      - name: Remove temporary workflow and refresh checksums
        run: |
          git rm .github/workflows/zz-readme-install-path-refresh.yml
          git add README.md
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked=subprocess.check_output(['git','ls-files'],text=True,encoding='utf-8').splitlines()
          tracked=[p for p in tracked if p!='SOURCE-SHA256SUMS']
          rows=[f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(tracked)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows)+'\n',encoding='utf-8',newline='\n')
          PY
          git add SOURCE-SHA256SUMS
      - name: Verify source integrity
        run: |
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          expected={}
          for raw in Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines():
              d,p=raw.split('  ',1); expected[p]=d
          tracked=set(subprocess.check_output(['git','ls-files'],text=True).splitlines()); tracked.discard('SOURCE-SHA256SUMS')
          assert set(expected)==tracked
          for p in tracked:
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==expected[p],p
          print(f'source integrity ok: {len(tracked)} files')
          PY
      - name: Commit README repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: align README with final 22.08 source'
          git push origin HEAD:fix/02208-official-install-path
