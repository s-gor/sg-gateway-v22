name: Temporary Page Performance GREEN 2
on:
  push:
    branches: [feature/02208-performance-clients]
permissions:
  contents: write
jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-performance-clients
          fetch-depth: 0
      - name: Apply production changes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Client detail: one credentials query for all devices, then request-local reuse.
          p = Path('app/clients/repository.py')
          s = p.read_text()
          old = '''def device_access_tokens(device_id: int) -> list[str]:\n    """Return the exact form tokens currently assigned to one device."""\n    result: list[str] = []\n    reverse_profiles = {value: key for key, value in XRAY_PROFILE_TOKENS.items()}\n    for credential in list_device_credentials(device_id):\n        if credential.engine == "xray":\n            try:\n                payload = json.loads(credential.config_json or "{}")\n            except (TypeError, ValueError, json.JSONDecodeError):\n                payload = {}\n            profiles = payload.get("profiles") if isinstance(payload, dict) else None\n            if not isinstance(profiles, list):\n                profiles = list(DEFAULT_XRAY_PROFILES)\n            for profile in profiles:\n                token = reverse_profiles.get(str(profile))\n                if token and token not in result:\n                    result.append(token)\n            continue\n        if credential.engine in SUPPORTED_ENGINES and credential.engine not in result:\n            result.append(credential.engine)\n    return result\n'''
          new = '''def _request_device_credentials_cache() -> dict[int, list[ClientDeployment]] | None:\n    try:\n        from flask import g, has_request_context\n    except ImportError:\n        return None\n    if not has_request_context():\n        return None\n    cache = getattr(g, "_sg_device_credentials_cache", None)\n    if cache is None:\n        cache = {}\n        setattr(g, "_sg_device_credentials_cache", cache)\n    return cache\n\n\ndef device_deployments_map(client_id: int) -> dict[int, list[ClientDeployment]]:\n    """Load all device credentials for a client in one query and reuse them in this request."""\n    init_db()\n    with connect() as connection:\n        rows = connection.execute(\n            """\n            SELECT d.id AS device_id, dc.engine, dc.status, dc.engine_object_id, dc.config_json\n            FROM devices d\n            LEFT JOIN device_credentials dc ON dc.device_id = d.id\n            WHERE d.client_id = ?\n            ORDER BY d.id, dc.engine\n            """,\n            (client_id,),\n        ).fetchall()\n\n    result: dict[int, list[ClientDeployment]] = {}\n    for row in rows:\n        device_id = int(row["device_id"])\n        bucket = result.setdefault(device_id, [])\n        if row["engine"] is None:\n            continue\n        bucket.append(\n            ClientDeployment(\n                engine=str(row["engine"]),\n                status=str(row["status"]),\n                engine_object_id=row["engine_object_id"],\n                config_json=row["config_json"],\n                device_id=device_id,\n            )\n        )\n    cache = _request_device_credentials_cache()\n    if cache is not None:\n        cache.update(result)\n    return result\n\n\ndef deployment_access_tokens(credentials: list[ClientDeployment]) -> list[str]:\n    """Return form tokens from already-loaded credentials."""\n    result: list[str] = []\n    reverse_profiles = {value: key for key, value in XRAY_PROFILE_TOKENS.items()}\n    for credential in credentials:\n        if credential.engine == "xray":\n            try:\n                payload = json.loads(credential.config_json or "{}")\n            except (TypeError, ValueError, json.JSONDecodeError):\n                payload = {}\n            profiles = payload.get("profiles") if isinstance(payload, dict) else None\n            if not isinstance(profiles, list):\n                profiles = list(DEFAULT_XRAY_PROFILES)\n            for profile in profiles:\n                token = reverse_profiles.get(str(profile))\n                if token and token not in result:\n                    result.append(token)\n            continue\n        if credential.engine in SUPPORTED_ENGINES and credential.engine not in result:\n            result.append(credential.engine)\n    return result\n\n\ndef device_access_tokens(device_id: int) -> list[str]:\n    """Return the exact form tokens currently assigned to one device."""\n    return deployment_access_tokens(list_device_credentials(device_id))\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''def list_device_credentials(device_id: int) -> list[ClientDeployment]:\n    init_db()\n    with connect() as connection:\n        rows = connection.execute(\n            """\n            SELECT engine, status, engine_object_id, config_json\n            FROM device_credentials\n            WHERE device_id = ?\n            ORDER BY engine\n            """,\n            (device_id,),\n        ).fetchall()\n    return [\n        ClientDeployment(\n            engine=str(row["engine"]),\n            status=str(row["status"]),\n            engine_object_id=row["engine_object_id"],\n            config_json=row["config_json"],\n            device_id=device_id,\n        )\n        for row in rows\n    ]\n'''
          new = '''def list_device_credentials(device_id: int) -> list[ClientDeployment]:\n    cache = _request_device_credentials_cache()\n    if cache is not None and device_id in cache:\n        return list(cache[device_id])\n    init_db()\n    with connect() as connection:\n        rows = connection.execute(\n            """\n            SELECT engine, status, engine_object_id, config_json\n            FROM device_credentials\n            WHERE device_id = ?\n            ORDER BY engine\n            """,\n            (device_id,),\n        ).fetchall()\n    result = [\n        ClientDeployment(\n            engine=str(row["engine"]),\n            status=str(row["status"]),\n            engine_object_id=row["engine_object_id"],\n            config_json=row["config_json"],\n            device_id=device_id,\n        )\n        for row in rows\n    ]\n    if cache is not None:\n        cache[device_id] = result\n    return list(result)\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Connections catalogue can reuse settings already loaded by a page.
          p = Path('app/connections/service.py')
          s = p.read_text()
          old = '''def list_connections() -> list[ConnectionSummary]:\n'''
          new = '''def list_connections(*, settings_map=None) -> list[ConnectionSummary]:\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    counts = {str(row["engine"]): int(row["total"]) for row in rows}\n    settings_map = list_connection_settings(("xray", "mihomo", "amneziawg31"))\n\n    xray = _summary("xray", "Xray Reality", counts, settings_map["xray"])\n'''
          new = '''    counts = {str(row["engine"]): int(row["total"]) for row in rows}\n    if settings_map is None:\n        settings_map = list_connection_settings(("xray", "mihomo", "amneziawg31"))\n\n    xray = _summary("xray", "Xray Reality", counts, settings_map["xray"])\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Health: one settings DB read for both connection checks.
          p = Path('app/maintenance/health.py')
          s = p.read_text()
          old = 'from app.connections.settings import get_connection_settings\n'
          new = 'from app.connections.settings import list_connection_settings\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = '''def _connection_checks() -> list[HealthCheck]:\n    checks: list[HealthCheck] = []\n\n    awg31 = get_connection_settings("amneziawg31")\n'''
          new = '''def _connection_checks() -> list[HealthCheck]:\n    checks: list[HealthCheck] = []\n    settings_map = list_connection_settings(("amneziawg31", "xray"))\n\n    awg31 = settings_map["amneziawg31"]\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '    xray = get_connection_settings("xray")\n'
          new = '    xray = settings_map["xray"]\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Page handlers: share one settings snapshot and one client credential snapshot.
          p = Path('app/main.py')
          s = p.read_text()
          old = '''    client_activity_counts,\n    device_access_tokens,\n    create_client,\n'''
          new = '''    client_activity_counts,\n    device_access_tokens,\n    device_deployments_map,\n    deployment_access_tokens,\n    create_client,\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = 'from app.connections.settings import get_connection_settings, update_connection_settings\n'
          new = 'from app.connections.settings import get_connection_settings, list_connection_settings, update_connection_settings\n'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    @app.get("/routing")\n    def routing():\n        return render_template(\n            "routing.html",\n            active_page="routing",\n            connections=list_connections(),\n            awg_settings=get_connection_settings("amneziawg"),\n            xray_settings=get_connection_settings("xray"),\n'''
          new = '''    @app.get("/routing")\n    def routing():\n        settings_map = list_connection_settings(("xray", "mihomo", "amneziawg31", "amneziawg"))\n        return render_template(\n            "routing.html",\n            active_page="routing",\n            connections=list_connections(settings_map=settings_map),\n            awg_settings=settings_map["amneziawg"],\n            xray_settings=settings_map["xray"],\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        devices = list_devices(client_id)\n        xray_state = xray_profiles_overview()\n        device_views = [\n            {\n                "device": device,\n                "access_cards": build_access_cards(client, device, xray_state=xray_state),\n                "protocol_tokens": device_access_tokens(device.id),\n            }\n            for device in devices\n        ]\n'''
          new = '''        devices = list_devices(client_id)\n        deployments_by_device = device_deployments_map(client_id)\n        xray_state = xray_profiles_overview()\n        device_views = [\n            {\n                "device": device,\n                "access_cards": build_access_cards(client, device, xray_state=xray_state),\n                "protocol_tokens": deployment_access_tokens(deployments_by_device.get(device.id, [])),\n            }\n            for device in devices\n        ]\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    @app.get("/connections")\n    def connections():\n        return render_template(\n            "connections.html",\n            active_page="connections",\n            connections=list_connections(),\n            awg_dns=get_shared_awg_dns(),\n            xray_settings=get_connection_settings("xray"),\n'''
          new = '''    @app.get("/connections")\n    def connections():\n        settings_map = list_connection_settings(("xray", "mihomo", "amneziawg31"))\n        return render_template(\n            "connections.html",\n            active_page="connections",\n            connections=list_connections(settings_map=settings_map),\n            awg_dns=get_shared_awg_dns(),\n            xray_settings=settings_map["xray"],\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify second performance block
        env:
          PYTHONPATH: .
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q \
            tests/test_client_detail_performance_02208.py \
            tests/test_connections_db_performance_02208.py \
            tests/test_system_health_performance_02208.py \
            tests/test_other_pages_performance_02208.py
          python -B -m py_compile \
            app/main.py app/clients/repository.py app/connections/service.py app/maintenance/health.py
      - name: Commit and remove verifier
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-page-performance-green2.yml
          git add app/main.py app/clients/repository.py app/connections/service.py app/maintenance/health.py
          git commit -m 'perf: batch page credentials and connection settings'
          git push origin HEAD:feature/02208-performance-clients
