name: Verify final Xray 26.9.9 UI contract

on:
  push:
    branches:
      - feature/02208-xray-26-9-9

permissions:
  contents: write

jobs:
  verify-and-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-xray-26-9-9
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Add stale-version regression assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_sg_gateway_02208_xmux_xray2699.py')
          s = p.read_text(encoding='utf-8')
          needle = '    assert "Xray-core 26.9.9 · закреплено" in partial\n'
          replacement = needle + '    assert "Xray-core 26.7.28" not in partial\n'
          if s.count(needle) != 1:
              raise SystemExit('expected one Xray 26.9.9 UI assertion')
          p.write_text(s.replace(needle, replacement), encoding='utf-8')
          PY

      - name: RED - stale 26.7.28 XMUX text must be detected
        id: red
        continue-on-error: true
        run: python -m pytest -q tests/test_sg_gateway_02208_xmux_xray2699.py::test_02208_ui_has_two_locked_presets_manual_fields_and_raw_json

      - name: Require expected RED
        run: test "${{ steps.red.outcome }}" = "failure"

      - name: Fix stale XMUX dialog version text
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/web/templates/_xray_xmux_settings.html')
          s = p.read_text(encoding='utf-8')
          old = 'Фиксированный актуальный пресет Xray-core 26.7.28:'
          new = 'Фиксированный актуальный пресет Xray-core 26.9.9:'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale XMUX version string, got {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: GREEN - focused Xray 26.9.9 UI and runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_sg_gateway_02208_xmux_xray2699.py \
            tests/test_sg_gateway_v22_xray_2699_contract.py \
            tests/test_fix30_routing_ip_family.py \
            tests/test_preview31_xray_updates.py

      - name: Verify bundled Xray archive and binary
        shell: bash
        run: |
          set -euo pipefail
          grep '  vendor/cores/Xray-linux-64.zip$' SOURCE-SHA256SUMS | sha256sum -c -
          (cd vendor/cores && grep '  Xray-linux-64.zip$' SHA256SUMS | sha256sum -c -)
          rm -rf /tmp/xray-final-ui && mkdir -p /tmp/xray-final-ui
          unzip -q vendor/cores/Xray-linux-64.zip -d /tmp/xray-final-ui
          actual="$(/tmp/xray-final-ui/xray version | head -n1 | awk '{print $2}' | sed 's/^v//')"
          test "$actual" = '26.9.9'

      - name: Require exact intended product diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              'app/web/templates/_xray_xmux_settings.html',
              'tests/test_sg_gateway_02208_xmux_xray2699.py',
          }
          actual = set(subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected product diff: {sorted(actual)}')
          PY

      - name: Refresh SOURCE-SHA256SUMS for final tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          transient = '.github/workflows/zz-xray-2699-ui-contract.yml'
          tracked = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          tracked = [p for p in tracked if p not in {'SOURCE-SHA256SUMS', transient}]
          rows = []
          for p in sorted(tracked):
              path = Path(p)
              if not path.is_file():
                  raise SystemExit(f'missing file while hashing: {p}')
              rows.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {p}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

      - name: Commit verified final UI contract and remove verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 4189823+github-actions[bot]@users.noreply.github.com
          git add app/web/templates/_xray_xmux_settings.html tests/test_sg_gateway_02208_xmux_xray2699.py SOURCE-SHA256SUMS
          git rm .github/workflows/zz-xray-2699-ui-contract.yml
          git commit -m "fix: remove stale Xray 26.7.28 XMUX label"
          git push origin HEAD:feature/02208-xray-26-9-9