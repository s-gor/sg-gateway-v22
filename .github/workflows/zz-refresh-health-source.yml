name: Refresh health source integrity

on:
  push:
    branches: [ui/02208-awg31-naiveproxy-compact]
    paths: [.github/workflows/zz-refresh-health-source.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/02208-awg31-naiveproxy-compact
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify health regression
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_health.py tests/test_sg_gateway_v22_awg31_naiveproxy_compact_ui_02208.py
      - name: Refresh integrity and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-refresh-health-source.yml
          tmp="$(mktemp)"
          git ls-files -z | while IFS= read -r -d '' f; do
            [ "$f" = "SOURCE-SHA256SUMS" ] && continue
            [ "$f" = ".github/workflows/zz-refresh-health-source.yml" ] && continue
            [ -f "$f" ] || continue
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f"
          done | LC_ALL=C sort -k2 > "$tmp"
          mv "$tmp" SOURCE-SHA256SUMS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: refresh health source integrity"
          git push origin HEAD:ui/02208-awg31-naiveproxy-compact
