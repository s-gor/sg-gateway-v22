name: Refine AWG shared DNS

on:
  push:
    branches: [feature/awg-shared-dns-ui]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/awg-shared-dns-ui
          fetch-depth: 1
      - run: python3 scripts/refine-awg-shared-dns.py
      - run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests/test_sg_gateway_v22_awg_shared_dns.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/web/templates/connections.html
          git commit -m "fix: keep shared AWG DNS authoritative"
          git push origin HEAD:feature/awg-shared-dns-ui
