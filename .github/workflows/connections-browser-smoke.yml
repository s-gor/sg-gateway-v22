name: Refresh Connections source checksums

on:
  push:
    branches:
      - feature/02207-connections-ui-unification-red

permissions:
  contents: write

jobs:
  refresh-source-checksums:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verified feature head
        uses: actions/checkout@v4
        with:
          ref: feature/02207-connections-ui-unification
          fetch-depth: 0

      - name: Regenerate SOURCE-SHA256SUMS from clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import subprocess
          from pathlib import Path

          root = Path('.')
          manifest = root / 'SOURCE-SHA256SUMS'
          old = {}
          for line in manifest.read_text(encoding='utf-8').splitlines():
              digest, path = line.split('  ', 1)
              old[path] = digest

          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          paths = [path for path in paths if path and path != 'SOURCE-SHA256SUMS']

          new = {}
          lines = []
          for path in paths:
              digest = hashlib.sha256((root / path).read_bytes()).hexdigest()
              new[path] = digest
              lines.append(f'{digest}  {path}')

          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          changed = sorted(path for path in set(old) | set(new) if old.get(path) != new.get(path))
          expected = [
              'app/web/static/sg-connections-unified-v1.css',
              'tests/test_sg_gateway_v22_connections_unified_ui.py',
          ]
          if changed != expected:
              raise SystemExit(f'unexpected checksum changes: {changed!r}')

          print(f'SOURCE-SHA256SUMS refreshed: {len(lines)} tracked files')
          for path in changed:
              print(f'{new[path]}  {path}')
          PY
          git diff --check
          git diff -- SOURCE-SHA256SUMS

      - name: Commit checksum-only refresh
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -Fx ' M SOURCE-SHA256SUMS'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE-SHA256SUMS
          git commit -m 'chore: refresh final Connections source checksums'
          git push origin HEAD:feature/02207-connections-ui-unification
