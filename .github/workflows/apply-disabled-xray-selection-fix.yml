name: Apply disabled Xray selection fix

on:
  push:
    branches:
      - fix/disabled-xray-profile-selection
    paths:
      - .github/workflows/apply-disabled-xray-selection-fix.yml

permissions:
  contents: write

jobs:
  tdd:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/disabled-xray-profile-selection
          fetch-depth: 0

      - name: Install test dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt

      - name: Confirm RED contract
        run: |
          set +e
          python3 -m pytest -q tests/test_disabled_xray_profile_selection.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the regression contract to fail before implementation"
            exit 1
          fi
          echo "RED confirmed with exit code $status"

      - name: Apply minimal implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path("app/main.py")
          text = main_path.read_text(encoding="utf-8")

          old_prepare = '''def _prepare_client_protocols(values) -> list[str]:
              # Add SG Client only when at least one subscription source is selected.
              protocols: list[str] = []
              for value in values:
                  token = str(value or "").strip().lower()
                  if not token or token == "sgclient" or token in protocols:
                      continue
                  protocols.append(token)

              has_subscription_source = any(
                  token in _CLIENT_SUBSCRIPTION_SOURCES
                  or token == "xray"
                  or token.startswith("xray_")
                  for token in protocols
              )
              if has_subscription_source:
                  protocols.append("sgclient")
              return protocols
          '''
          new_prepare = '''def _prepare_client_protocols(values) -> list[str]:
              # Add SG Client only when at least one subscription source is selected.
              protocols: list[str] = []
              for value in values:
                  token = str(value or "").strip().lower()
                  if not token or token == "sgclient" or token in protocols:
                      continue
                  protocols.append(token)

              selected_xray = [
                  token for token in protocols if token.startswith("xray_")
              ]
              if selected_xray:
                  overview = xray_profiles_overview()
                  profiles = overview.get("profiles")
                  if not isinstance(profiles, list):
                      profiles = []
                  titles: dict[str, str] = {}
                  ready: set[str] = set()
                  for profile in profiles:
                      profile_id = str(getattr(profile, "id", "") or "").strip().lower()
                      if not profile_id:
                          continue
                      token = f"xray_{profile_id}"
                      titles[token] = str(
                          getattr(profile, "title", "") or profile_id
                      ).strip()
                      if bool(getattr(profile, "ready", False)):
                          ready.add(token)

                  unavailable = [token for token in selected_xray if token not in ready]
                  if unavailable:
                      token = unavailable[0]
                      title = titles.get(token, token.removeprefix("xray_"))
                      raise ValueError(
                          f"Xray-профиль «{title}» выключен или не готов на сервере. "
                          "Обновите страницу и выберите доступный профиль."
                      )

              has_subscription_source = any(
                  token in _CLIENT_SUBSCRIPTION_SOURCES
                  or token == "xray"
                  or token.startswith("xray_")
                  for token in protocols
              )
              if has_subscription_source:
                  protocols.append("sgclient")
              return protocols
          '''
          if text.count(old_prepare) != 1:
              raise SystemExit("prepare protocol block changed unexpectedly")
          text = text.replace(old_prepare, new_prepare)

          replacements = [
              (
                  '''    def add_client():
                      protocols = _prepare_client_protocols(request.form.getlist("protocols"))
                      access = ",".join(protocols)
                      try:
                          client_id = create_client(
                  ''',
                  '''    def add_client():
                      try:
                          protocols = _prepare_client_protocols(request.form.getlist("protocols"))
                          access = ",".join(protocols)
                          client_id = create_client(
                  ''',
              ),
              (
                  '''        except Exception as exc:
                      flash(f"Клиент не создан: не удалось подготовить реквизиты доступа. {exc}", "error")
                      return redirect(url_for("clients"))
                  ''',
                  '''        except ValueError as exc:
                      flash(f"Клиент не создан: {exc}", "error")
                      return redirect(url_for("clients"))
                  except Exception as exc:
                      flash(f"Клиент не создан: не удалось подготовить реквизиты доступа. {exc}", "error")
                      return redirect(url_for("clients"))
                  ''',
              ),
              (
                  '''        protocols = _prepare_client_protocols(request.form.getlist("protocols"))
                  try:
                      updated = update_client(
                  ''',
                  '''        try:
                      protocols = _prepare_client_protocols(request.form.getlist("protocols"))
                      updated = update_client(
                  ''',
              ),
              (
                  '''        protocols = _prepare_client_protocols(request.form.getlist("protocols"))
                  try:
                      updated = update_device(
                  ''',
                  '''        try:
                      protocols = _prepare_client_protocols(request.form.getlist("protocols"))
                      updated = update_device(
                  ''',
              ),
              (
                  '''        snapshot = snapshot_client(client_id)
                  protocols = _prepare_client_protocols(request.form.getlist("protocols"))
                  access = ",".join(protocols)
                  try:
                      device_id = create_device(
                  ''',
                  '''        snapshot = snapshot_client(client_id)
                  try:
                      protocols = _prepare_client_protocols(request.form.getlist("protocols"))
                      access = ",".join(protocols)
                      device_id = create_device(
                  ''',
              ),
              (
                  '''        except Exception as exc:
                      flash(f"Доступ не создан: не удалось подготовить отдельные реквизиты. {exc}", "error")
                      return redirect(url_for("client_detail", client_id=client_id))
                  ''',
                  '''        except ValueError as exc:
                      flash(f"Доступ не создан: {exc}", "error")
                      return redirect(url_for("client_detail", client_id=client_id))
                  except Exception as exc:
                      flash(f"Доступ не создан: не удалось подготовить отдельные реквизиты. {exc}", "error")
                      return redirect(url_for("client_detail", client_id=client_id))
                  ''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"main.py route block changed unexpectedly: {old[:70]!r}")
              text = text.replace(old, new)
          main_path.write_text(text, encoding="utf-8", newline="\n")

          template_path = Path("app/web/templates/_client_edit_dialogs.html")
          template = template_path.read_text(encoding="utf-8")
          old_macro = '''    <label class="dv16-protocol {{ 'is-locked' if not profile.ready and not selected else '' }}">
              <input type="checkbox" name="protocols" value="{{ token }}" {% if selected %}checked{% endif %} {% if not profile.ready and not selected %}disabled{% endif %}>
              <span><strong>{{ profile.title }}</strong><small>{% if selected %}Подключён — реквизиты сохранятся{% elif profile.ready %}Доступен для добавления{% elif profile.tls_required %}Нужен HTTPS{% else %}{{ unavailable_note }}{% endif %}</small></span>
            </label>
          '''
          new_macro = '''    <label class="dv16-protocol {{ 'is-locked' if not profile.ready else '' }}">
              <input type="checkbox" name="protocols" value="{{ token }}" {% if selected and profile.ready %}checked{% endif %} {% if not profile.ready %}disabled{% endif %}>
              <span><strong>{{ profile.title }}</strong><small>{% if selected and not profile.ready %}Выключен на сервере — при сохранении будет удалён{% elif selected %}Подключён — реквизиты сохранятся{% elif profile.ready %}Доступен для добавления{% elif profile.tls_required %}Нужен HTTPS{% else %}{{ unavailable_note }}{% endif %}</small></span>
            </label>
          '''
          if template.count(old_macro) != 1:
              raise SystemExit("edit Xray macro changed unexpectedly")
          template_path.write_text(
              template.replace(old_macro, new_macro),
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Verify GREEN contract
        run: |
          python3 -m pytest -q tests/test_disabled_xray_profile_selection.py
          python3 -m py_compile app/main.py
          git diff --check

      - name: Commit implementation and remove temporary workflow
        run: |
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git rm -- .github/workflows/apply-disabled-xray-selection-fix.yml
          git add app/main.py app/web/templates/_client_edit_dialogs.html
          git commit -m "fix: reject unavailable Xray client profiles"
          git push origin HEAD:fix/disabled-xray-profile-selection
