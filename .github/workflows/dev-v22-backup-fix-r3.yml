name: dev-v22 Full Backup final validation R3

on:
  push:
    branches: [dev-v22]
    paths:
      - .github/workflows/dev-v22-backup-fix-r3.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev-v22
        uses: actions/checkout@v4
        with:
          ref: dev-v22
          fetch-depth: 0

      - name: Guard expected state
        run: |
          test "$(cat VERSION)" = "0.1.0-021.12"
          test "$(git branch --show-current)" = "dev-v22"
          for f in \
            .github/workflows/dev-v22-backup-fix.yml \
            .github/workflows/dev-v22-backup-fix-r2.yml \
            .github/workflows/dev-v22-backup-fix-r3.yml; do
            test -f "$f"
          done
          git diff --exit-code

      - name: Apply exact Fix 01 patch body
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/dev-v22-backup-fix.yml').read_text(encoding='utf-8').splitlines()
          target = '      - name: Apply Full Backup verifier and unlimited upload fix'
          start = lines.index(target)
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          body = []
          for line in lines[run_line + 1:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  raise SystemExit(f'unexpected indentation: {line!r}')
          script = '\n'.join(body) + '\n'
          if 'stage_uploaded_full_backup_for_verification' not in script:
              raise SystemExit('Fix 01 body extraction failed')
          Path('/tmp/apply-fix01.sh').write_text(script, encoding='utf-8', newline='\n')
          PY
          bash /tmp/apply-fix01.sh

      - name: Update all inherited upload acceptance contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test_sg_gateway_02111_backup_domain_release.py')
          text = test_path.read_text(encoding='utf-8')
          old = '    assert "client_max_body_size 1024m;" in access\n'
          new = '    assert "client_max_body_size 0;" in access\n'
          if text.count(old) != 1:
              raise SystemExit(f'legacy test 1024m assertion count={text.count(old)}')
          test_path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          build_path = Path('build-run.sh')
          text = build_path.read_text(encoding='utf-8')
          old = '''  grep -Fq 'client_max_body_size 1024m;' "\\$root/install.sh" || fail "В install.sh нет client_max_body_size для Full Restore"\n'''
          new = '''  grep -Fq 'client_max_body_size 0;' "\\$root/install.sh" || fail "В install.sh Full Restore не переведён на unlimited upload"\n'''
          if text.count(old) != 1:
              raise SystemExit(f'build-run 1024m contract count={text.count(old)}')
          build_path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Remove temporary workflows from validated tree
        run: |
          git rm \
            .github/workflows/dev-v22-backup-fix.yml \
            .github/workflows/dev-v22-backup-fix-r2.yml \
            .github/workflows/dev-v22-backup-fix-r3.yml

      - name: Rebuild source integrity manifest
        run: |
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(tracked)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
          print(f'SOURCE-SHA256SUMS rebuilt for {len(rows)} files')
          PY

      - name: Reject old upload caps
        run: |
          if grep -RsnE 'MAX_UPLOAD_BYTES|максимум 512 MiB|client_max_body_size 1024m;' app hostd deploy install.sh build-run.sh; then
            echo 'Old Full Backup upload cap remains' >&2
            exit 1
          fi
          grep -n 'client_max_body_size 0;' install.sh deploy/configure-panel-access.sh hostd/sg_hostd/full_backup_runtime.py build-run.sh

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Syntax and targeted tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/hostd
        run: |
          python3 -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'syntax ok: {len(files)} files')"
          python3 -m pytest -q \
            tests/test_sg_gateway_v22_full_backup_verify.py \
            tests/test_sg_gateway_v22_full_backup_upload_unlimited.py \
            tests/test_sg_gateway_02111_backup_domain_release.py

      - name: Full repository tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/hostd
        run: python3 -m pytest -q tests

      - name: Verify working-tree source integrity
        run: |
          python3 - <<'PY'
          import hashlib, re, subprocess
          from pathlib import Path
          expected = {}
          for line_no, raw in enumerate(Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines(), 1):
              if not raw.strip():
                  continue
              m = re.fullmatch(r'([0-9a-f]{64})  (.+)', raw)
              if m is None:
                  raise SystemExit(f'invalid checksum line {line_no}: {raw!r}')
              digest, path = m.groups()
              if path in expected:
                  raise SystemExit(f'duplicate checksum path: {path}')
              expected[path] = digest
          tracked = set(subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines())
          tracked.discard('SOURCE-SHA256SUMS')
          if set(expected) != tracked:
              raise SystemExit('source inventory mismatch')
          for path in sorted(tracked):
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != expected[path]:
                  raise SystemExit(f'hash mismatch: {path}')
          print(f'working-tree source integrity ok: {len(tracked)} files')
          PY

      - name: Create local validation commit
        run: |
          git config user.name "SG-Gateway Fix Runner"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VALIDATE Fix 01 Full Backup unlimited upload"
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
          echo "VALIDATED_TREE=$(git rev-parse 'HEAD^{tree}')"

      - name: Build and verify committed FULL CLEAN artifact
        run: |
          bash build-run.sh /tmp/SG-Gateway-v22-Fix01-FULL-CLEAN.run
          bash /tmp/SG-Gateway-v22-Fix01-FULL-CLEAN.run --verify-only

      - name: Publish permanent Fix 01 commit
        run: |
          VALIDATED_TREE="$(git rev-parse 'HEAD^{tree}')"
          git reset --soft HEAD^
          git restore --source=HEAD --staged --worktree \
            .github/workflows/dev-v22-backup-fix.yml \
            .github/workflows/dev-v22-backup-fix-r2.yml \
            .github/workflows/dev-v22-backup-fix-r3.yml
          git commit -m "Fix 01: verify Full Backup and remove upload size limit"
          echo "PUBLISHED_INTERMEDIATE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "EXPECTED_FINAL_TREE_AFTER_WORKFLOW_CLEANUP=$VALIDATED_TREE"
          git push origin HEAD:dev-v22
