name: "Apply canonical Connections inner rail"

on:
  push:
    branches:
      - "release/02208-rc"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Apply canonical rail wrappers"
        run: python .github/scripts/zz_apply_connections_inner_rail.py
      - name: "Run Connections layout contracts"
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_connections_layout_v24.py tests/test_sg_gateway_v22_connections_density_polish.py tests/test_sg_gateway_v22_connections_final_grid_align.py tests/test_sg_gateway_v22_connections_semantic_layout_02208.py tests/test_sg_gateway_v22_connections_shell_tail_polish.py tests/test_sg_gateway_v22_connections_unified_ui.py tests/test_sg_gateway_v22_connections_visual_unification_v2.py tests/test_sg_gateway_v22_layout_contract_connections.py tests/test_sg_gateway_v22_xmux_inner_alignment.py
      - name: "Refresh manifest and commit"
        run: |
          git rm .github/workflows/zz-red-canonical-inner-rail.yml
          git rm .github/workflows/zz-apply-canonical-inner-rail.yml
          git rm .github/scripts/zz_apply_connections_inner_rail.py
          python -c 'from pathlib import Path; import hashlib, subprocess; root=Path("."); paths=[p for p in subprocess.check_output(["git","ls-files"], text=True).splitlines() if p != "SOURCE-SHA256SUMS"]; Path("SOURCE-SHA256SUMS").write_text("".join(f"{hashlib.sha256((root/p).read_bytes()).hexdigest()}  {p}\n" for p in paths), encoding="utf-8")'
          git add app/web/templates/connections.html app/web/templates/_mihomo_panel.html app/web/static/sg-ui-connections-v22-08.css tests/test_connections_layout_v24.py SOURCE-SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: use canonical rails for AWG and Mihomo"
          git push
