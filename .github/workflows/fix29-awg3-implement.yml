          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done < <(find app/web/static -type f -name '*.js' -print0)

      - name: Regenerate exact source integrity inventory
        run: |
          git add -A
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          files=subprocess.check_output(['git','ls-files'],text=True,encoding='utf-8').splitlines()
          rows=[]
          for rel in sorted(files):
              if rel == 'SOURCE-SHA256SUMS':
                  continue
              rows.append(f"{hashlib.sha256(Path(rel).read_bytes()).hexdigest()}  {rel}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows)+'\n',encoding='utf-8',newline='\n')
          print(f'SOURCE_INVENTORY={len(rows)}')
          PY
          git add SOURCE-SHA256SUMS
          git diff --cached --check

      - name: Verify vendor and build FULL candidate
        run: |
          (cd vendor/cores && sha256sum -c SHA256SUMS)
          OUT=/tmp/SG-Gateway-0.1.0-021.12-DEV-v22-Fix29-AWG3-DUAL-FULL.run
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only

      - name: Commit and verify exact git-blob integrity
        run: |
          git config user.name 'Ser.Gor'
          git config user.email 'infosec.co.il@gmail.com'
          git commit -m 'Fix 29: add isolated AWG3 userspace alongside frozen AWG2'
          python3 - <<'PY'
          import hashlib,re,subprocess
          from pathlib import Path
          expected={}
          for raw in Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines():
              m=re.fullmatch(r'([0-9a-f]{64})  (.+)',raw)
              assert m, raw
              expected[m.group(2)]=m.group(1)
          tracked=set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          tracked.discard('SOURCE-SHA256SUMS')
          assert tracked == set(expected), (sorted(tracked-set(expected))[:10], sorted(set(expected)-tracked)[:10])
          for path in sorted(tracked):
              data=subprocess.check_output(['git','show',f'HEAD:{path}'])
              actual=hashlib.sha256(data).hexdigest()
              assert actual == expected[path], (path,actual,expected[path])
          print(f'GIT_BLOB_INTEGRITY_OK={len(tracked)}')
          PY
          git push origin HEAD:fix29-awg3-dual
          echo "FIX29_COMMIT=$(git rev-parse HEAD)"
