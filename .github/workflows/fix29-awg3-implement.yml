        "config_json": (
            '{"dns":"1.1.1.1","country_code":"nl","server_public_key":"PLACEHOLDER_AWG3_SERVER_PUBLIC_KEY",'
            '"allowed_ips":"0.0.0.0/0, ::/0","persistent_keepalive":"25-35","generation":3}'
        ),
    },
    "xray": {''')

          # Connection settings enforce both product ports independently.
          replace('app/connections/settings.py',
                  'from app.constants import AMNEZIAWG_UDP_PORT',
                  'from app.constants import AMNEZIAWG3_UDP_PORT, AMNEZIAWG_UDP_PORT')
          replace('app/connections/settings.py',
                  '    clean_port = AMNEZIAWG_UDP_PORT if engine == "amneziawg" else _clean_port(port)',
                  '''    if engine == "amneziawg":
        clean_port = AMNEZIAWG_UDP_PORT
    elif engine == "amneziawg3":
        clean_port = AMNEZIAWG3_UDP_PORT
    else:
        clean_port = _clean_port(port)''')

          # Keep existing Connections indexes 0/1/2 stable; append AWG3 as fourth summary.
