name: Remove duplicate README commands v2

on:
  push:
    branches: [fix/readme-single-install-command-v2]
    paths:
      - .github/workflows/fix-readme-single-install-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readme-single-install-command-v2
          fetch-depth: 0

      - name: Remove only outdated main commands
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          install_url = "https://raw.githubusercontent.com/s-gor/sg-gateway-v22/main/deploy/install-from-github.sh"
          install_pos = readme.index(install_url)
          install_start = readme.rfind("## Установка\n", 0, install_pos)
          install_end = readme.index("## Первые шаги\n", install_pos)
          assert install_start >= 0
          install_note = (
              "## Установка\n\n"
              "Используйте единственную актуальную команду **Clean Install** "
              "в разделе [«Быстрые команды»](#быстрые-команды) выше.\n\n"
          )
          readme = readme[:install_start] + install_note + readme[install_end:]

          update_url = "https://raw.githubusercontent.com/s-gor/sg-gateway-v22/main/deploy/update-from-github.sh"
          update_pos = readme.index(update_url)
          update_start = readme.rfind("## Обновление\n", 0, update_pos)
          docs_start = readme.index("## Документация\n", update_pos)
          assert update_start >= 0
          maintenance_note = (
              "## Обновление и полное удаление\n\n"
              "Актуальные команды **Update** и **Full Uninstall** находятся "
              "в разделе [«Быстрые команды»](#быстрые-команды) выше. "
              "Не используйте Clean Install для обновления уже установленного сервера.\n\n"
          )
          readme = readme[:update_start] + maintenance_note + readme[docs_start:]
          readme_path.write_text(readme, encoding="utf-8")

          test_path = Path("tests/test_sg_gateway_v22_02206_stable_release.py")
          test_text = test_path.read_text(encoding="utf-8")
          needle = '    assert "stable-02206/deploy/uninstall-from-github.sh" in readme\n'
          addition = needle + (
              '    assert readme.count(f"{PINNED_INSTALL_SHA}/deploy/install-from-github.sh") == 1\n'
              '    assert readme.count("stable-02206/deploy/update-from-github.sh") == 1\n'
              '    assert readme.count("stable-02206/deploy/uninstall-from-github.sh") == 1\n'
              '    assert "sg-gateway-v22/main/deploy/install-from-github.sh" not in readme\n'
              '    assert "sg-gateway-v22/main/deploy/update-from-github.sh" not in readme\n'
              '    assert "sg-gateway-v22/main/deploy/full-uninstall-ubuntu.sh" not in readme\n'
          )
          assert test_text.count(needle) == 1
          test_path.write_text(test_text.replace(needle, addition), encoding="utf-8")
          PY

      - name: Remove helper and refresh checksums
        run: |
          git rm .github/workflows/fix-readme-single-install-v2.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines()
          files = [path for path in files if path != "SOURCE-SHA256SUMS"]
          rows = [f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}" for path in sorted(files)]
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tests/test_sg_gateway_v22_02206_stable_release.py SOURCE-SHA256SUMS
          git commit -m "docs: keep one public command set"
          git push origin HEAD:fix/readme-single-install-command-v2
