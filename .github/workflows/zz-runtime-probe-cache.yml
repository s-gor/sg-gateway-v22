name: Temporary Runtime Probe Cache Verifier

on:
  push:
    branches: [feature/02208-performance-clients]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-performance-clients
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Write RED contracts
        run: |
          cat > tests/test_runtime_probe_cache_02208.py <<'PY'
          from types import SimpleNamespace


          def test_xray_os_probes_reuse_recent_results(monkeypatch):
              from app.xray import profiles

              calls = []

              def fake_run(args, **kwargs):
                  calls.append(tuple(args))
                  if args[-1] == "version":
                      return SimpleNamespace(returncode=0, stdout="Xray 26.9.9 test\n", stderr="")
                  return SimpleNamespace(returncode=0, stdout="", stderr="")

              monkeypatch.setattr(profiles.subprocess, "run", fake_run)

              assert profiles._installed_xray_version() == "26.9.9"
              assert profiles._installed_xray_version() == "26.9.9"
              assert profiles._service_active() is True
              assert profiles._service_active() is True
              assert len(calls) == 2


          def test_tls_systemctl_probes_reuse_recent_results(monkeypatch):
              from app.security import tls

              calls = []

              def fake_run(args, **kwargs):
                  calls.append(tuple(args))
                  return SimpleNamespace(returncode=0, stdout="", stderr="")

              monkeypatch.setattr(tls.subprocess, "run", fake_run)

              assert tls._service_active("nginx.service") is True
              assert tls._service_active("nginx.service") is True
              assert tls._service_active("certbot.timer") is True
              assert tls._service_active("certbot.timer") is True
              assert tls._service_enabled("certbot.timer") is True
              assert tls._service_enabled("certbot.timer") is True
              assert len(calls) == 3
          PY
      - name: Prove RED
        run: |
          set +e
          python -m pytest -q tests/test_runtime_probe_cache_02208.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'Expected RED but tests passed'
            exit 1
          fi
          echo 'RED confirmed'
      - name: Implement bounded probe caches
        run: |
          python - <<'PY'
          from pathlib import Path

          xray = Path('app/xray/profiles.py')
          text = xray.read_text(encoding='utf-8')
          text = text.replace('import subprocess\n', 'import subprocess\nimport time\n', 1)
          marker = 'class XrayProfilesError(RuntimeError):\n    pass\n\n\n'
          cache = '''_XRAY_VERSION_PROBE_TTL_SECONDS = 10.0\n_XRAY_SERVICE_PROBE_TTL_SECONDS = 2.0\n_XRAY_VERSION_PROBE_CACHE: dict[str, object] = {"updated_at": 0.0, "value": None}\n_XRAY_SERVICE_PROBE_CACHE: dict[str, object] = {"updated_at": 0.0, "value": None}\n\n\n'''
          if marker not in text:
              raise SystemExit('xray cache insertion marker missing')
          text = text.replace(marker, marker + cache, 1)

          old_version = '''def _installed_xray_version() -> str:\n    for binary in ("/usr/local/bin/xray", "xray"):\n        try:\n            result = subprocess.run(\n                [binary, "version"],\n                capture_output=True,\n                text=True,\n                timeout=4,\n                check=False,\n            )\n        except (OSError, subprocess.SubprocessError):\n            continue\n        first = (result.stdout or result.stderr or "").splitlines()\n        if result.returncode == 0 and first:\n            parts = first[0].split()\n            if len(parts) >= 2:\n                return parts[1].lstrip("v")\n    return ""\n'''
          new_version = '''def _installed_xray_version() -> str:\n    now = time.monotonic()\n    cached = _XRAY_VERSION_PROBE_CACHE.get("value")\n    if (\n        isinstance(cached, str)\n        and now - float(_XRAY_VERSION_PROBE_CACHE.get("updated_at") or 0.0) < _XRAY_VERSION_PROBE_TTL_SECONDS\n    ):\n        return cached\n\n    value = ""\n    for binary in ("/usr/local/bin/xray", "xray"):\n        try:\n            result = subprocess.run(\n                [binary, "version"],\n                capture_output=True,\n                text=True,\n                timeout=4,\n                check=False,\n            )\n        except (OSError, subprocess.SubprocessError):\n            continue\n        first = (result.stdout or result.stderr or "").splitlines()\n        if result.returncode == 0 and first:\n            parts = first[0].split()\n            if len(parts) >= 2:\n                value = parts[1].lstrip("v")\n                break\n    _XRAY_VERSION_PROBE_CACHE["updated_at"] = now\n    _XRAY_VERSION_PROBE_CACHE["value"] = value\n    return value\n'''
          if old_version not in text:
              raise SystemExit('xray version probe block missing')
          text = text.replace(old_version, new_version, 1)

          old_service = '''def _service_active() -> bool:\n    try:\n        result = subprocess.run(\n            ["systemctl", "is-active", "--quiet", "xray.service"],\n            capture_output=True,\n            text=True,\n            timeout=4,\n            check=False,\n        )\n    except (OSError, subprocess.SubprocessError):\n        return False\n    return result.returncode == 0\n'''
          new_service = '''def _service_active() -> bool:\n    now = time.monotonic()\n    cached = _XRAY_SERVICE_PROBE_CACHE.get("value")\n    if (\n        isinstance(cached, bool)\n        and now - float(_XRAY_SERVICE_PROBE_CACHE.get("updated_at") or 0.0) < _XRAY_SERVICE_PROBE_TTL_SECONDS\n    ):\n        return cached\n    try:\n        result = subprocess.run(\n            ["systemctl", "is-active", "--quiet", "xray.service"],\n            capture_output=True,\n            text=True,\n            timeout=4,\n            check=False,\n        )\n        value = result.returncode == 0\n    except (OSError, subprocess.SubprocessError):\n        value = False\n    _XRAY_SERVICE_PROBE_CACHE["updated_at"] = now\n    _XRAY_SERVICE_PROBE_CACHE["value"] = value\n    return value\n'''
          if old_service not in text:
              raise SystemExit('xray service probe block missing')
          xray.write_text(text.replace(old_service, new_service, 1), encoding='utf-8')

          tls = Path('app/security/tls.py')
          text = tls.read_text(encoding='utf-8')
          text = text.replace('import subprocess\n', 'import subprocess\nimport time\n', 1)
          marker = 'class TlsError(RuntimeError):\n    pass\n\n'
          cache = '''_SERVICE_PROBE_TTL_SECONDS = 3.0\n_SERVICE_PROBE_CACHE: dict[tuple[str, str], tuple[float, bool]] = {}\n\n\ndef _service_probe_cached(kind: str, name: str) -> bool | None:\n    item = _SERVICE_PROBE_CACHE.get((kind, name))\n    if item is None:\n        return None\n    updated_at, value = item\n    if time.monotonic() - updated_at >= _SERVICE_PROBE_TTL_SECONDS:\n        return None\n    return value\n\n\ndef _remember_service_probe(kind: str, name: str, value: bool) -> bool:\n    _SERVICE_PROBE_CACHE[(kind, name)] = (time.monotonic(), bool(value))\n    return bool(value)\n\n\ndef _clear_service_probe_cache() -> None:\n    _SERVICE_PROBE_CACHE.clear()\n\n\n'''
          if marker not in text:
              raise SystemExit('tls cache insertion marker missing')
          text = text.replace(marker, marker + cache, 1)
          text = text.replace(
              '    payload = dict(result.payload)\n    payload.setdefault("ok", True)\n',
              '    _clear_service_probe_cache()\n    payload = dict(result.payload)\n    payload.setdefault("ok", True)\n',
              1,
          )

          old_active = '''def _service_active(name: str) -> bool:\n    try:\n        result = subprocess.run(\n            ["systemctl", "is-active", "--quiet", name],\n            capture_output=True,\n            text=True,\n            timeout=3,\n            check=False,\n        )\n    except (OSError, subprocess.TimeoutExpired):\n        return False\n    return result.returncode == 0\n'''
          new_active = '''def _service_active(name: str) -> bool:\n    cached = _service_probe_cached("active", name)\n    if cached is not None:\n        return cached\n    try:\n        result = subprocess.run(\n            ["systemctl", "is-active", "--quiet", name],\n            capture_output=True,\n            text=True,\n            timeout=3,\n            check=False,\n        )\n        value = result.returncode == 0\n    except (OSError, subprocess.TimeoutExpired):\n        value = False\n    return _remember_service_probe("active", name, value)\n'''
          if old_active not in text:
              raise SystemExit('tls active block missing')
          text = text.replace(old_active, new_active, 1)

          old_enabled = '''def _service_enabled(name: str) -> bool:\n    try:\n        result = subprocess.run(\n            ["systemctl", "is-enabled", "--quiet", name],\n            capture_output=True,\n            text=True,\n            timeout=3,\n            check=False,\n        )\n    except (OSError, subprocess.TimeoutExpired):\n        return False\n    return result.returncode == 0\n'''
          new_enabled = '''def _service_enabled(name: str) -> bool:\n    cached = _service_probe_cached("enabled", name)\n    if cached is not None:\n        return cached\n    try:\n        result = subprocess.run(\n            ["systemctl", "is-enabled", "--quiet", name],\n            capture_output=True,\n            text=True,\n            timeout=3,\n            check=False,\n        )\n        value = result.returncode == 0\n    except (OSError, subprocess.TimeoutExpired):\n        value = False\n    return _remember_service_probe("enabled", name, value)\n'''
          if old_enabled not in text:
              raise SystemExit('tls enabled block missing')
          tls.write_text(text.replace(old_enabled, new_enabled, 1), encoding='utf-8')
          PY
      - name: Prove GREEN
        run: |
          python -m pytest -q tests/test_runtime_probe_cache_02208.py
          python -m pytest -q tests/test_page_runtime_performance_02208.py tests/test_preview31_xray_updates.py tests/test_sg_gateway_v22_xray_2699_contract.py
          python -m pytest -q tests -k 'tls and not browser' --tb=short
      - name: Commit verified product change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/xray/profiles.py app/security/tls.py tests/test_runtime_probe_cache_02208.py
          git rm .github/workflows/zz-runtime-probe-cache.yml
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          files = [p for p in files if p != 'SOURCE-SHA256SUMS']
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(files)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git commit -m 'perf: cache short-lived runtime probes'
          git push origin HEAD:feature/02208-performance-clients
