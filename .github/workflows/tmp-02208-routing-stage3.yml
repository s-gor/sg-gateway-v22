# run 2: macro-generated Routing names are tested at the template contract
name: TEMP 22.08 Routing stage 3

on:
  push:
    branches: [tmp/02208-routing-stage3-run]
    paths: [.github/workflows/tmp-02208-routing-stage3.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Prepare exact Stage 2 base
        run: |
          cp tools/tmp_02208_routing_stage3.py /tmp/stage3.py
          cp tools/tmp_02208_routing_stage3_testfix.py /tmp/stage3_testfix.py
          git fetch --no-tags --depth=1 origin 9c1eb91366392fce2ccf1f476778efe9fe3ad66b
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "9c1eb91366392fce2ccf1f476778efe9fe3ad66b"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt tinycss2
          python -m playwright install --with-deps chromium
      - name: Confirm RED Routing contracts
        run: |
          python - <<'PY'
          import importlib.util
          def load(name, path):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod
          load('stage3','/tmp/stage3.py').write_tests()
          load('stage3_testfix','/tmp/stage3_testfix.py').fix_generated_contract_test()
          PY
          if python -m pytest -q tests/test_sg_gateway_v22_routing_contract_02208.py; then
            echo 'Expected Routing 22.08 structural contract to fail before migration' >&2
            exit 1
          fi
          if python -m pytest -q tests/test_sg_gateway_v22_routing_geometry_02208.py; then
            echo 'Expected Routing 22.08 geometry to fail before migration' >&2
            exit 1
          fi
      - name: Apply Routing 22.08 migration
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('stage3','/tmp/stage3.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          mod.migrate()
          PY
          git add -A
      - name: Focused GREEN
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_v22_routing_contract_02208.py \
            tests/test_sg_gateway_v22_routing_geometry_02208.py \
            tests/test_sg_gateway_v22_ui_function_contract_02208.py \
            tests/test_sg_gateway_v22_ui_architecture_02208.py \
            tests/test_sg_gateway_v22_clients_geometry_02208.py \
            tests/test_sg_gateway_v22_connections_geometry_02208.py
      - name: Refresh source integrity
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked=sorted(p for p in subprocess.check_output(['git','ls-files'], text=True).splitlines() if p != 'SOURCE-SHA256SUMS')
          rows=[]
          for path in tracked:
              rows.append(f"{hashlib.sha256(subprocess.check_output(['git','show',f':{path}'])).hexdigest()}  {path}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
      - name: Full pytest
        run: python -m pytest tests -q
      - name: Create clean commit
        run: |
          git config user.name 'Ser.Gor'
          git config user.email '293675787+s-gor@users.noreply.github.com'
          git commit -m 'refactor: migrate Routing to 22.08 UI rails'
      - name: Verify committed source integrity
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          expected={}
          for line in Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines():
              if line.strip():
                  digest,path=line.split('  ',1); expected[path]=digest
          tracked=sorted(p for p in subprocess.check_output(['git','ls-files'], text=True).splitlines() if p != 'SOURCE-SHA256SUMS')
          assert sorted(expected) == tracked
          for path in tracked:
              assert hashlib.sha256(subprocess.check_output(['git','show',f'HEAD:{path}'])).hexdigest() == expected[path], path
          print(f'Source integrity verified for {len(tracked)} tracked files')
          PY
      - name: FULL package verify
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-FULL.run"
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only
      - name: Publish GREEN candidate
        run: git push --force origin HEAD:refs/heads/feature/02208-routing-stage3-green
