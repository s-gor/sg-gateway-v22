name: Fix30 updater env permission repair

on:
  push:
    branches:
      - fix30-ipv6-dual-stack

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch updater
        run: |
          sed -i 's/local target validation_root/local target validation_root validation_env/' deploy/update-from-github.sh
          sed -i '/"$validation_root" "$validation_root\/data" "$validation_root\/log"/a\  validation_env="$validation_root/sg-gateway.env"\n  install -m 0600 -o sg-gateway -g sg-gateway "$CONFIG_DIR/sg-gateway.env" "$validation_env"' deploy/update-from-github.sh
          sed -i 's#"$PREFIX" "$CONFIG_DIR/sg-gateway.env" "$target" "$validation_root"#"$PREFIX" "$validation_env" "$target" "$validation_root"#' deploy/update-from-github.sh

      - name: Add regression test
        run: |
          printf '%s\n' \
            'from pathlib import Path' \
            '' \
            'SCRIPT = Path("deploy/update-from-github.sh").read_text(encoding="utf-8")' \
            '' \
            'def test_wsgi_validation_does_not_read_root_env_as_service_user():' \
            '    section = SCRIPT.split("validate_deployed_panel() {", 1)[1].split("preflight() {", 1)[0]' \
            '    assert "validation_env=\"$validation_root/sg-gateway.env\"" in section' \
            '    assert "install -m 0600 -o sg-gateway -g sg-gateway" in section' \
            '    assert "\"$CONFIG_DIR/sg-gateway.env\" \"$validation_env\"" in section' \
            '    assert "\"$PREFIX\" \"$validation_env\" \"$target\" \"$validation_root\"" in section' \
            '    assert "\"$PREFIX\" \"$CONFIG_DIR/sg-gateway.env\" \"$target\" \"$validation_root\"" not in section' \
            > tests/test_fix30_updater_env_permission.py

      - name: Validate targeted contract
        run: |
          bash -n deploy/update-from-github.sh
          python3 -m pip install -q 'pytest>=8,<9'
          python3 -m pytest -q tests/test_fix30_updater_env_permission.py tests/test_update_runtime_preservation_contract.py tests/test_fix30_awg3_update_preservation.py

      - name: Remove workflow and refresh checksums
        run: |
          git rm .github/workflows/fix30-updater-env-permission-repair.yml
          git add deploy/update-from-github.sh tests/test_fix30_updater_env_permission.py
          python3 -c 'import hashlib,subprocess; from pathlib import Path; tracked=[p for p in subprocess.check_output(["git","ls-files"],text=True).splitlines() if p != "SOURCE-SHA256SUMS"]; Path("SOURCE-SHA256SUMS").write_text("".join(f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}\n" for p in sorted(tracked)),encoding="utf-8")'
          git add SOURCE-SHA256SUMS

      - name: Commit repair
        run: |
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Fix30: validate panel with private temp env copy"
          git push origin HEAD:fix30-ipv6-dual-stack
