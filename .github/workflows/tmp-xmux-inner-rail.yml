name: Temporary XMUX Inner Rail Correction

on:
  push:
    branches:
      - fix/02207-xmux-cumulative-inner-rail
    paths:
      - .github/workflows/tmp-xmux-inner-rail.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/02207-xmux-cumulative-inner-rail
          fetch-depth: 0

      - name: Correct cumulative rail and refresh source integrity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          css_path = Path('app/web/static/sg-connections-unified-v1.css')
          css = css_path.read_text(encoding='utf-8')
          old = '''body.page-connections #xray-xmux .xmux1-card {
            margin-inline: var(--sg-layout-card-inset);
            padding: 0;
          }'''
          new = '''body.page-connections #xray-xmux .xmux1-card {
            margin-inline: var(--sg-layout-deep-inset);
            padding: 0;
          }'''
          assert css.count(old) == 1, css.count(old)
          css_path.write_text(css.replace(old, new, 1), encoding='utf-8')

          workflow = '.github/workflows/tmp-xmux-inner-rail.yml'
          subprocess.run(['git', 'rm', workflow], check=True)

          excluded = {'SOURCE-SHA256SUMS'}
          raw = subprocess.check_output(['git', 'ls-files', '-z'])
          paths = [p.decode('utf-8') for p in raw.split(b'\0') if p]
          lines = []
          for path in paths:
              if path in excluded:
                  continue
              if path == workflow:
                  continue
              if path == 'app/web/static/sg-connections-unified-v1.css':
                  blob = css_path.read_bytes()
              elif path == 'tests/test_sg_gateway_v22_xmux_inner_alignment.py':
                  blob = Path(path).read_bytes()
              else:
                  blob = subprocess.check_output(['git', 'cat-file', 'blob', f'HEAD:{path}'])
              lines.append(f"{hashlib.sha256(blob).hexdigest()}  {path}\n")
          Path('SOURCE-SHA256SUMS').write_text(''.join(lines), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/static/sg-connections-unified-v1.css SOURCE-SHA256SUMS tests/test_sg_gateway_v22_xmux_inner_alignment.py
          git commit -m "fix: align XMUX inner card to Xray cumulative rail"
          git push origin HEAD:fix/02207-xmux-cumulative-inner-rail
