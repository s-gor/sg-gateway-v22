name: TEMP official install path refresh

on:
  push:
    branches: [fix/02208-official-install-path]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/02208-official-install-path

      - name: Install focused test dependency
        run: python3 -m pip install pytest

      - name: Create regression test
        run: |
          cat > tests/test_official_install_path_02208.py <<'PY'
          from pathlib import Path

          FINAL = "6ec4b31c45bdfd648a8ee0415e588a557614651b"
          STALE = (
              "f709015548de91c631a5daf174194f245f7cce00",
              "889206dd3ddb7d10ef7480f3b5b23694f0b90b7e",
          )

          def test_public_clean_install_is_pinned_to_final_verified_source():
              for name in ("PUBLICATION-02208.md", "deploy/GITHUB-COMMANDS.md"):
                  body = Path(name).read_text(encoding="utf-8")
                  assert FINAL in body, name
                  for stale in STALE:
                      assert stale not in body, (name, stale)

          def test_full_uninstall_reinstall_hint_follows_stable_channel_without_stale_sha():
              body = Path("deploy/full-uninstall-ubuntu.sh").read_text(encoding="utf-8")
              for stale in STALE:
                  assert stale not in body, stale
              assert "stable-02208/deploy/install-from-github.sh" in body
              assert "Для повторной установки SG-Gateway" in body
          PY

      - name: Verify RED on stale uninstall hint
        run: |
          set +e
          python3 -m pytest -q tests/test_official_install_path_02208.py > /tmp/red.log 2>&1
          rc=$?
          set -e
          cat /tmp/red.log
          test "$rc" -ne 0
          grep -q '889206dd3ddb7d10ef7480f3b5b23694f0b90b7e' /tmp/red.log

      - name: Fix stale uninstall reinstall hint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("deploy/full-uninstall-ubuntu.sh")
          body = p.read_text(encoding="utf-8")
          old = "printf '%s\\n' 'curl -4 -fsSL https://raw.githubusercontent.com/s-gor/sg-gateway-v22/889206dd3ddb7d10ef7480f3b5b23694f0b90b7e/deploy/install-from-github.sh | sudo env SG_GATEWAY_GITHUB_BRANCH=stable-02208 SG_GATEWAY_SOURCE_COMMIT=889206dd3ddb7d10ef7480f3b5b23694f0b90b7e bash'"
          new = "printf '%s\\n' 'curl -4 -fsSL https://raw.githubusercontent.com/s-gor/sg-gateway-v22/stable-02208/deploy/install-from-github.sh | sudo env SG_GATEWAY_GITHUB_BRANCH=stable-02208 bash'"
          if old not in body:
              raise SystemExit("stale reinstall footer anchor not found")
          p.write_text(body.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Verify GREEN focused contract
        run: python3 -m pytest -q tests/test_official_install_path_02208.py

      - name: Remove temporary workflow and refresh source integrity
        run: |
          git rm .github/workflows/zz-official-install-path-refresh.yml
          git add PUBLICATION-02208.md deploy/GITHUB-COMMANDS.md deploy/full-uninstall-ubuntu.sh tests/test_official_install_path_02208.py
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines()
          tracked = [p for p in tracked if p != "SOURCE-SHA256SUMS"]
          rows = []
          for path in sorted(tracked):
              data = Path(path).read_bytes()
              rows.append(f"{hashlib.sha256(data).hexdigest()}  {path}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8", newline="\n")
          PY
          git add SOURCE-SHA256SUMS

      - name: Verify refreshed source integrity locally
        run: |
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          expected = {}
          for raw in Path("SOURCE-SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, path = raw.split("  ", 1)
              expected[path] = digest
          tracked = set(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          tracked.discard("SOURCE-SHA256SUMS")
          assert set(expected) == tracked
          for path in tracked:
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected[path], path
          print(f"source integrity ok: {len(tracked)} files")
          PY

      - name: Commit repaired official paths
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: repair official 22.08 install paths'
          git push origin HEAD:fix/02208-official-install-path
