name: run Fix29 isolated AWG3 dual patch

on:
  push:
    branches: [audit-v22-prepublish]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Fix29 branch
        uses: actions/checkout@v4
        with:
          ref: fix29-awg3-dual
          fetch-depth: 0

      - name: Guard clean Fix28 base
        run: |
          test "$(git rev-parse HEAD)" = "04345198231bbe3eb75d9061b879887a0f9cecfd"
          test "$(git rev-parse HEAD^{tree})" = "b9a4cb7b4ae5f2f80e81749b03220de3f4082d00"

      - name: Import only historical AWG3 userspace media
        run: |
          rm -rf /tmp/old
          git clone -q --no-checkout https://github.com/s-gor/sg-gateway.git /tmp/old
          git -C /tmp/old fetch -q --depth=1 origin 816804dfae23fc854444bc274c254b9e47efaed2
          git -C /tmp/old checkout -q --detach FETCH_HEAD
          cp /tmp/old/vendor/cores/amneziawg-tools-3.0.20260805.tar.gz vendor/cores/
          cp /tmp/old/vendor/cores/amneziawg-go-linux-amd64-v3.0.0 vendor/cores/
          cp /tmp/old/hostd/sg_hostd/awg3_runtime.py hostd/sg_hostd/awg3_runtime.py
          cp /tmp/old/deploy/sg-gateway-awg3-userspace.sh deploy/sg-gateway-awg3-userspace.sh
          cp /tmp/old/deploy/sg-gateway-awg3.service deploy/sg-gateway-awg3.service
          chmod 0755 vendor/cores/amneziawg-go-linux-amd64-v3.0.0 deploy/sg-gateway-awg3-userspace.sh
          echo '090f9383532822a756d078890b447e00af7f46bd30a10f9f47c46d633d807b19  vendor/cores/amneziawg-tools-3.0.20260805.tar.gz' | sha256sum -c -
          echo '131110027db6d5dc0e35b19eb5b8a2692676081366c34112088dc68bbb050bcd  vendor/cores/amneziawg-go-linux-amd64-v3.0.0' | sha256sum -c -
          test ! -e vendor/cores/amneziawg-linux-kernel-module-3.0.20260805.tar.gz

      - name: Extract compile and apply atomic product patch
        run: |
          git fetch -q origin audit-v22-prepublish
          git show origin/audit-v22-prepublish:.github/workflows/fix29-awg3-implement.yml > /tmp/fix29-carrier.yml
          python3 - <<'PY'
          from pathlib import Path
          source=Path('/tmp/fix29-carrier.yml').read_text(encoding='utf-8').splitlines()
          begin=next(i for i,line in enumerate(source) if line == "          python3 - <<'PY'")
          end=next(i for i,line in enumerate(source[begin+1:],begin+1) if line == '          PY')
          out=[]
          in_triple=False
          for raw in source[begin+1:end]:
              line = raw if in_triple else (raw[10:] if raw.startswith('          ') else raw)
              out.append(line)
              if line.count("'''") % 2:
                  in_triple = not in_triple
          if in_triple:
              raise SystemExit('unterminated triple-quoted literal in carrier')
          script='\n'.join(out)+'\n'
          compile(script,'/tmp/fix29_patch.py','exec')
          Path('/tmp/fix29_patch.py').write_text(script,encoding='utf-8',newline='\n')
          print(f'PATCH_SCRIPT_COMPILED lines={len(out)}')
          PY
          python3 /tmp/fix29_patch.py
          python3 - <<'PY'
          from pathlib import Path

          helper_path=Path('deploy/sg-gateway-awg3-userspace.sh')
          helper=helper_path.read_text(encoding='utf-8')
          wanted='export PATH="$AWG3_ROOT/bin:$PATH"'
          if wanted not in helper:
              anchor='AWG3_ROOT="/opt/sg-gateway/awg3"\n'
              if helper.count(anchor) != 1:
                  raise SystemExit('AWG3_ROOT helper anchor is not unique')
              helper=helper.replace(anchor, anchor+wanted+'\n', 1)
          if helper.count(wanted) != 1:
              raise SystemExit('AWG3 isolated PATH must appear exactly once')
          helper_path.write_text(helper,encoding='utf-8',newline='\n')

          main_path=Path('app/main.py')
          main=main_path.read_text(encoding='utf-8')
          context_line='            awg3_settings=get_connection_settings("amneziawg3"),\n'
          conn_start=main.index('    @app.get("/connections")\n')
          before=main[:conn_start]
          after=main[conn_start:]
          if context_line in before:
              before=before.replace(context_line,'',1)
          main=before+after
          conn_start=main.index('    @app.get("/connections")\n')
          conn_end=main.index('    @app.post("/connections/amneziawg")\n',conn_start)
          block=main[conn_start:conn_end]
          if context_line not in block:
              anchor='            awg_settings=get_connection_settings("amneziawg"),\n'
              if block.count(anchor) != 1:
                  raise SystemExit('Connections AWG context anchor is not unique')
              block=block.replace(anchor,anchor+context_line,1)
              main=main[:conn_start]+block+main[conn_end:]
          if main.count(context_line) != 1:
              raise SystemExit('AWG3 settings context must exist only in Connections')
          if main.count('@app.post("/connections/amneziawg3")') != 1:
              raise SystemExit('AWG3 Connections update route must exist exactly once')
          main_path.write_text(main,encoding='utf-8',newline='\n')
          PY
          chmod 0755 deploy/sg-gateway-awg3-userspace.sh vendor/cores/amneziawg-go-linux-amd64-v3.0.0

      - name: Static product invariants
        run: |
          bash -n install.sh
          bash -n deploy/sg-gateway-awg3-userspace.sh
          grep -F 'AMNEZIAWG_TOOLS_VERSION="1.0.20260618-2"' install.sh
          grep -F 'AMNEZIAWG_KMOD_VERSION="1.0.20260329-2"' install.sh
          grep -F 'AWG3_TOOLS_VERSION="3.0.20260805"' install.sh
          grep -F 'PREFIX="$PREFIX/awg3" install' install.sh
          ! grep -RIn 'amneziawg-linux-kernel-module-3\.0' install.sh app hostd deploy vendor/cores/SHA256SUMS
          ! grep -RIn 'AMNEZIAWG_KMOD_VERSION="3\.' install.sh app hostd deploy vendor/cores/SHA256SUMS
          grep -F 'export PATH="$AWG3_ROOT/bin:$PATH"' deploy/sg-gateway-awg3-userspace.sh
          grep -F '"$AWG_GO" "$IFACE"' deploy/sg-gateway-awg3-userspace.sh
          grep -F '"$AWG_QUICK" strip "$CONFIG"' deploy/sg-gateway-awg3-userspace.sh
          grep -F '"$AWG" setconf "$IFACE" "$stripped"' deploy/sg-gateway-awg3-userspace.sh

      - name: Install test dependencies
        run: python3 -m pip install -q -r requirements-dev.txt

      - name: Focused dual-AWG contracts
        env:
          PYTHONPATH: .:hostd
        run: |
          python3 -m pytest -q tests/test_sg_gateway_v22_awg3_dual_contract.py tests/test_awg_style_ui.py

      - name: Full test suite
        env:
          PYTHONPATH: .:hostd
        run: python3 -m pytest -q tests

      - name: Template shell and JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          env=Environment()
          for path in Path('app/web/templates').rglob('*.html'):
              env.parse(path.read_text(encoding='utf-8'))
          print('JINJA_OK')
          PY
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done < <(find app/web/static -type f -name '*.js' -print0)

      - name: Regenerate exact source integrity inventory
        run: |
          git add -A
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          files=subprocess.check_output(['git','ls-files'],text=True,encoding='utf-8').splitlines()
          rows=[]
          for rel in sorted(files):
              if rel == 'SOURCE-SHA256SUMS':
                  continue
              rows.append(f"{hashlib.sha256(Path(rel).read_bytes()).hexdigest()}  {rel}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows)+'\n',encoding='utf-8',newline='\n')
          print(f'SOURCE_INVENTORY={len(rows)}')
          PY
          git add SOURCE-SHA256SUMS
          git diff --cached --check

      - name: Vendor integrity and FULL package verify
        run: |
          (cd vendor/cores && sha256sum -c SHA256SUMS)
          OUT=/tmp/SG-Gateway-0.1.0-021.12-DEV-v22-Fix29-AWG3-DUAL-FULL.run
          bash build-run.sh "$OUT"
          bash "$OUT" --verify-only

      - name: Commit exact Fix29 and verify git blobs
        run: |
          git config user.name 'Ser.Gor'
          git config user.email 'infosec.co.il@gmail.com'
          git commit -m 'Fix 29: add isolated AWG3 userspace alongside frozen AWG2'
          python3 - <<'PY'
          import hashlib,re,subprocess
          from pathlib import Path
          expected={}
          for raw in Path('SOURCE-SHA256SUMS').read_text(encoding='utf-8').splitlines():
              match=re.fullmatch(r'([0-9a-f]{64})  (.+)',raw)
              assert match, raw
              expected[match.group(2)]=match.group(1)
          tracked=set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          tracked.discard('SOURCE-SHA256SUMS')
          assert tracked == set(expected)
          for path in sorted(tracked):
              actual=hashlib.sha256(subprocess.check_output(['git','show',f'HEAD:{path}'])).hexdigest()
              assert actual == expected[path], (path,actual,expected[path])
          print(f'GIT_BLOB_INTEGRITY_OK={len(tracked)}')
          PY
          git push origin HEAD:fix29-awg3-dual
          echo "FIX29_COMMIT=$(git rev-parse HEAD)"
