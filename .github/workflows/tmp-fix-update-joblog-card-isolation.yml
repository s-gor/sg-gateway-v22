name: Apply update job log and card isolation patch

on:
  push:
    branches:
      - fix-update-joblog-card-isolation-20260819

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch updater and client UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          updater = Path('deploy/update-from-github.sh')
          body = updater.read_text(encoding='utf-8')

          replacements = [
              (
                  'DATA_DIR="/var/lib/sg-gateway"\nBACKUP_ROOT="/root/sg-gateway-update-safety"',
                  'DATA_DIR="/var/lib/sg-gateway"\nOPERATION_JOB_DIR="$DATA_DIR/security/jobs"\nBACKUP_ROOT="/root/sg-gateway-update-safety"',
              ),
              (
                  'ASSETS_RECOVERY_SOURCE=""\n\nGREEN=',
                  'ASSETS_RECOVERY_SOURCE=""\nROLLBACK_OPERATION_JOBS=""\n\nGREEN=',
              ),
              (
                  '  tar -C / -cpf "$BACKUP_DIR/state.tar" "${existing[@]}"\n  tar -tf "$BACKUP_DIR/state.tar" >/dev/null',
                  '  tar -C / --exclude="${OPERATION_JOB_DIR#/}" -cpf "$BACKUP_DIR/state.tar" "${existing[@]}"\n  tar -tf "$BACKUP_DIR/state.tar" >/dev/null',
              ),
          ]
          for old, new in replacements:
              if old in body:
                  body = body.replace(old, new, 1)
              elif new not in body:
                  raise SystemExit(f'missing updater patch anchor: {old[:80]!r}')

          helpers = r'''
preserve_operation_jobs_for_rollback() {
  local preserved="$TEMP_DIR/rollback-operation-jobs"
  ROLLBACK_OPERATION_JOBS=""
  [[ -d "$OPERATION_JOB_DIR" ]] || return 0
  rm -rf -- "$preserved"
  mv -- "$OPERATION_JOB_DIR" "$preserved"
  ROLLBACK_OPERATION_JOBS="$preserved"
}

restore_operation_jobs_after_rollback() {
  [[ -n "$ROLLBACK_OPERATION_JOBS" && -d "$ROLLBACK_OPERATION_JOBS" ]] || return 0
  mkdir -p -- "$(dirname "$OPERATION_JOB_DIR")"
  rm -rf -- "$OPERATION_JOB_DIR"
  mv -- "$ROLLBACK_OPERATION_JOBS" "$OPERATION_JOB_DIR"
  ROLLBACK_OPERATION_JOBS=""
}

'''
          anchor = 'rollback_update() {\n'
          if helpers not in body:
              if anchor not in body:
                  raise SystemExit('missing rollback_update anchor')
              body = body.replace(anchor, helpers + anchor, 1)

          old = "rollback_update() {\n  (( BACKUP_READY == 1 )) || return 0\n  printf '\\n%s[SG-Gateway Update] ROLLBACK:%s restoring the pre-update server state...\\n' \"$YELLOW\" \"$RESET\"\n  systemctl stop"
          new = "rollback_update() {\n  (( BACKUP_READY == 1 )) || return 0\n  printf '\\n%s[SG-Gateway Update] ROLLBACK:%s restoring the pre-update server state...\\n' \"$YELLOW\" \"$RESET\"\n  preserve_operation_jobs_for_rollback\n  systemctl stop"
          if old in body:
              body = body.replace(old, new, 1)
          elif new not in body:
              raise SystemExit('missing rollback preserve anchor')

          old = '  tar -C / -xpf "$BACKUP_DIR/state.tar"\n  systemctl daemon-reload'
          new = '  tar -C / -xpf "$BACKUP_DIR/state.tar"\n  restore_operation_jobs_after_rollback\n  systemctl daemon-reload'
          if old in body:
              body = body.replace(old, new, 1)
          elif new not in body:
              raise SystemExit('missing rollback restore anchor')

          updater.write_text(body, encoding='utf-8', newline='\n')

          template = Path('app/web/templates/client_detail.html')
          html = template.read_text(encoding='utf-8')
          old = '            <div class="dv16-technical-actions">\n              {% if card.payload and card.status == \'applied\' %}'
          new = '            <div class="dv16-technical-actions">\n              {% if card.status == \'error\' %}<span class="dv16-not-ready" title="{{ card.error_message|e }}">Ошибка генерации</span>{% endif %}\n              {% if card.payload and card.status == \'applied\' %}'
          if old in html:
              html = html.replace(old, new, 1)
          elif new not in html:
              raise SystemExit('missing client detail error action anchor')
          template.write_text(html, encoding='utf-8', newline='\n')
          PY
      - name: Remove temporary workflow and refresh source integrity
        run: |
          git rm -- .github/workflows/tmp-fix-update-joblog-card-isolation.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines()
          paths = [p for p in paths if p != 'SOURCE-SHA256SUMS']
          lines = []
          for path in sorted(paths):
              data = Path(path).read_bytes()
              lines.append(f'{hashlib.sha256(data).hexdigest()}  {path}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Commit patch
        run: |
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Preserve update job logs and isolate client exporters"
          git push origin HEAD:fix-update-joblog-card-isolation-20260819
