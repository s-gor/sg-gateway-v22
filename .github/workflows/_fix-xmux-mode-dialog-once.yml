name: One-shot XMUX preset details dialog

on:
  push:
    branches:
      - fix30-ipv6-dual-stack
    paths:
      - .github/workflows/_fix-xmux-mode-dialog-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix30-ipv6-dual-stack
          fetch-depth: 0

      - name: Apply XMUX dialog patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/xmux_patch.py
          python3 /tmp/xmux_patch.py
          node --check app/web/static/sg-xmux-settings-v1.js
          python3 -m py_compile tests/test_sg_gateway_02204_xmux_sgpanel_contract.py

      - name: Refresh integrity and commit
        shell: bash
        run: |
          git rm .github/workflows/_fix-xmux-mode-dialog-once.yml
          git ls-files | grep -v '^SOURCE-SHA256SUMS$' | sort | while IFS= read -r path; do sha256sum "$path"; done > SOURCE-SHA256SUMS
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "UI: show XMUX preset details in dialog"
          git push origin HEAD:fix30-ipv6-dual-stack
