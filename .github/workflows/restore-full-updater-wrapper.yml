name: Restore full updater wrapper

on:
  push:
    branches:
      - fix/awg3-initialize-on-install
    paths:
      - .github/workflows/restore-full-updater-wrapper.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/awg3-initialize-on-install
          fetch-depth: 0
      - name: Restore updater and add narrow AWG3 post-update migration
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          base = "76407dbf680c54a3a2ef8d3c01f7d2568d5276dc"
          updater = subprocess.check_output(
              ["git", "show", f"{base}:deploy/update-from-github.sh"],
              text=True,
              encoding="utf-8",
          )
          helper = '''post_update_awg3_bootstrap() {
            local prefix="${SG_GATEWAY_PREFIX:-/opt/sg-gateway}"
            local config_dir="${SG_GATEWAY_CONFIG_DIR:-/etc/sg-gateway}"
            local data_dir="${SG_GATEWAY_DATA_DIR:-/var/lib/sg-gateway}"
            local python="$prefix/.venv/bin/python"
            local module="$prefix/app/maintenance/awg3_idle_bootstrap.py"

            [[ -x "$python" && -f "$module" ]] || return 0

            printf '[SG-Gateway Update] Checking AWG3.0 first-start state...\\n'
            set -a
            # shellcheck disable=SC1090
            [[ -f "$config_dir/runtime.env" ]] && source "$config_dir/runtime.env"
            # shellcheck disable=SC1090
            [[ -f "$config_dir/sg-gateway.env" ]] && source "$config_dir/sg-gateway.env"
            set +a

            PYTHONPATH="$prefix:$prefix/hostd" \\
            SG_GATEWAY_APP_ROOT="$prefix" \\
            SG_GATEWAY_CONFIG_DIR="$config_dir" \\
            SG_GATEWAY_DATA_DIR="$data_dir" \\
              "$python" -B -m app.maintenance.awg3_idle_bootstrap
          }

          '''
          marker = "bootstrap_main() {\n"
          if updater.count(marker) != 1:
              raise SystemExit("unexpected bootstrap_main marker count")
          updater = updater.replace(marker, helper + marker, 1)
          old = '''  set +e
            SG_GATEWAY_SOURCE_COMMIT="$commit" bash "$core" "$@"
            rc=$?
            set -e
            return "$rc"
          '''
          new = '''  set +e
            SG_GATEWAY_SOURCE_COMMIT="$commit" bash "$core" "$@"
            rc=$?
            set -e
            (( rc == 0 )) || return "$rc"
            post_update_awg3_bootstrap
          '''
          if old not in updater:
              raise SystemExit("bootstrap core execution block was not found")
          updater = updater.replace(old, new, 1)
          Path("deploy/update-from-github.sh").write_text(updater, encoding="utf-8")

          migration = Path("app/maintenance/awg3_idle_bootstrap.py")
          source = migration.read_text(encoding="utf-8")
          source = source.replace(
              "    mode: int\n",
              "    mode: int\n    uid: int\n    gid: int\n",
              1,
          )
          source = source.replace(
              "return FileSnapshot(path, True, path.read_bytes(), stat.st_mode & 0o777)",
              "return FileSnapshot(\n            path, True, path.read_bytes(), stat.st_mode & 0o777, stat.st_uid, stat.st_gid\n        )",
              1,
          )
          source = source.replace(
              "return FileSnapshot(path, False, b\"\", 0o600)",
              "return FileSnapshot(path, False, b\"\", 0o600, 0, 0)",
              1,
          )
          source = source.replace(
              "    os.chmod(temporary, snapshot.mode)\n    os.replace(temporary, snapshot.path)",
              "    os.chmod(temporary, snapshot.mode)\n    os.chown(temporary, snapshot.uid, snapshot.gid)\n    os.replace(temporary, snapshot.path)",
              1,
          )
          migration.write_text(source, encoding="utf-8")
          PY
      - name: Validate and commit
        run: |
          bash -n deploy/update-from-github.sh
          python3 -m py_compile app/maintenance/awg3_idle_bootstrap.py
          git config user.name "SG-Gateway CI"
          git config user.email "actions@users.noreply.github.com"
          git add deploy/update-from-github.sh app/maintenance/awg3_idle_bootstrap.py
          git commit -m "fix: preserve full updater while bootstrapping idle AWG3"
          git push origin HEAD:fix/awg3-initialize-on-install
