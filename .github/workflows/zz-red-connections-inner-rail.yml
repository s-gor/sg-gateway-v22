name: RED Connections inner rail

on:
  push:
    branches:
      - release/02208-rc

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Verify inner rail contract is RED before implementation
        run: python -m pytest -q tests/test_connections_layout_v24.py::test_awg_and_mihomo_inner_rails_match_naiveproxy
