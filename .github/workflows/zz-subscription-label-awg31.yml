name: Fix SG subscription AWG31 labels

on:
  push:
    branches:
      - feature/02208-compatible-subscription-awg31-from-good-snapshot

permissions:
  contents: write

jobs:
  fix-labels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/02208-compatible-subscription-awg31-from-good-snapshot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: RED - old AWG2 labels must fail
        id: red
        continue-on-error: true
        run: python -m pytest -q tests/test_sg_gateway_v22_subscription_labels_awg31.py
      - name: Require expected RED
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.red.outcome }}" = "failure"
      - name: GREEN - change labels only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/web/templates/_sg_subscription_dual.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('AmneziaWG 2.0', 'AmneziaWG 3.1')
          s = s.replace('SG-CONFIG для AWG2', 'SG-CONFIG для AWG3.1')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify GREEN
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_sg_gateway_v22_subscription_labels_awg31.py tests/test_sg_gateway_v22_hide_awg31_internal_ui.py tests/test_sg_gateway_v22_client_protocol_edit_cleanup.py
      - name: Refresh SOURCE-SHA256SUMS
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          transient = '.github/workflows/zz-subscription-label-awg31.yml'
          tracked = subprocess.check_output(['git','ls-files'], text=True, encoding='utf-8').splitlines()
          tracked = [p for p in tracked if p not in {'SOURCE-SHA256SUMS', transient}]
          rows = [f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}" for p in sorted(tracked)]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/zz-subscription-label-awg31.yml
      - name: Commit verified label fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ui: update SG subscription label to AWG31"
          git push origin HEAD:feature/02208-compatible-subscription-awg31-from-good-snapshot
