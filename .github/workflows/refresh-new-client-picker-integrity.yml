name: Refresh new client picker integrity

on:
  push:
    branches: [fix/new-client-picker-layout]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refresh manifest and remove temporary workflow
        run: |
          git rm -- .github/workflows/refresh-new-client-picker-integrity.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ['git', 'ls-files'], text=True, encoding='utf-8'
          ).splitlines()
          tracked = [path for path in tracked if path != 'SOURCE-SHA256SUMS']
          rows = [
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
              for path in tracked
          ]
          Path('SOURCE-SHA256SUMS').write_text(
              '\n'.join(rows) + '\n', encoding='utf-8'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE-SHA256SUMS
          git commit -m "Refresh source integrity for new client picker"
          git push origin HEAD:fix/new-client-picker-layout
