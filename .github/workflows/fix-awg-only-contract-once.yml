name: Restore AWG-only contract once

on:
  push:
    branches:
      - fix/02206-awg-only-subscription-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply AWG-only behavior and UI contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          MAIN = Path("app/main.py")
          CLIENTS = Path("app/web/templates/clients.html")
          DETAIL = Path("app/web/templates/client_detail.html")
          EDIT = Path("app/web/templates/_client_edit_dialogs.html")
          HELP = Path("app/help/content.py")
          CSS = Path("app/web/static/sg-awg-only-notice-v1.css")
          JS = Path("app/web/static/sg-awg-only-notice-v1.js")
          TEST = Path("tests/test_sg_gateway_v22_awg_only_subscription_contract.py")

          NOTICE_TEXT = (
              "При выборе только AWG-профилей подписка не создаётся. "
              "Используйте QR-коды или файлы конфигурации для каждого соединения."
          )

          def insert_head_assets(text: str, marker: str) -> str:
              if marker in text:
                  return text
              start = text.find("{% block head %}")
              if start < 0:
                  raise SystemExit("head block not found")
              end = text.find("{% endblock %}", start)
              if end < 0:
                  raise SystemExit("head block end not found")
              block = (
                  "  <!-- SG_AWG_ONLY_NOTICE_V1_ASSETS -->\n"
                  "  <link rel=\"stylesheet\" href=\"{{ url_for('static', filename='sg-awg-only-notice-v1.css') }}?v={{ app_version }}\">\n"
                  "  <script src=\"{{ url_for('static', filename='sg-awg-only-notice-v1.js') }}?v={{ app_version }}\" defer></script>\n"
              )
              return text[:end] + block + text[end:]

          def notice(marker: str, indent: str = "    ") -> str:
              return (
                  f"\n{indent}<!-- {marker} -->\n"
                  f"{indent}<div class=\"sg-awg-only-note\" data-awg-only-note role=\"status\" "
                  f"aria-live=\"polite\">{NOTICE_TEXT}</div>"
              )

          def insert_after_protocol_fieldset(
              text: str, dialog_token: str, marker: str
          ) -> str:
              if marker in text:
                  return text
              start = text.find(dialog_token)
              if start < 0:
                  raise SystemExit(f"dialog not found: {dialog_token}")
              fieldset = text.find("<fieldset", start)
              if fieldset < 0:
                  raise SystemExit(f"protocol fieldset not found: {dialog_token}")
              end = text.find("</fieldset>", fieldset)
              if end < 0:
                  raise SystemExit(f"protocol fieldset end not found: {dialog_token}")
              end += len("</fieldset>")
              return text[:end] + notice(marker) + text[end:]

          main = MAIN.read_text(encoding="utf-8")
          clients = CLIENTS.read_text(encoding="utf-8")
          detail = DETAIL.read_text(encoding="utf-8")
          edit = EDIT.read_text(encoding="utf-8")
          help_text = HELP.read_text(encoding="utf-8")

          helper_marker = "SG_GATEWAY_02206_AWG_ONLY_PROTOCOLS_V3"
          helper = '''# SG_GATEWAY_02206_AWG_ONLY_PROTOCOLS_V3
          _CLIENT_SUBSCRIPTION_SOURCES = {"mihomo", "anytls", "tuic"}


          def _prepare_client_protocols(values) -> list[str]:
              # Add SG Client only when at least one subscription source is selected.
              protocols: list[str] = []
              for value in values:
                  token = str(value or "").strip().lower()
                  if not token or token == "sgclient" or token in protocols:
                      continue
                  protocols.append(token)

              has_subscription_source = any(
                  token in _CLIENT_SUBSCRIPTION_SOURCES
                  or token == "xray"
                  or token.startswith("xray_")
                  for token in protocols
              )
              if has_subscription_source:
                  protocols.append("sgclient")
              return protocols
          '''
          helper = textwrap.dedent(helper)

          if helper_marker not in main:
              anchor = "COUNTRY_NAMES = dict(COUNTRY_OPTIONS)\n"
              if main.count(anchor) != 1:
                  raise SystemExit("main.py: COUNTRY_NAMES anchor not found exactly once")
              main = main.replace(anchor, anchor + "\n\n" + helper, 1)

          raw_protocols = 'protocols = request.form.getlist("protocols")'
          prepared_protocols = (
              'protocols = _prepare_client_protocols('
              'request.form.getlist("protocols"))'
          )
          raw_count = main.count(raw_protocols)
          prepared_count = main.count(prepared_protocols)
          if raw_count:
              if raw_count != 4 or prepared_count != 0:
                  raise SystemExit(
                      f"main.py: unexpected route state raw={raw_count} prepared={prepared_count}"
                  )
              main = main.replace(raw_protocols, prepared_protocols)
          elif prepared_count != 4:
              raise SystemExit(
                  f"main.py: expected four prepared routes, found {prepared_count}"
              )

          hidden = re.compile(
              r'^[ \t]*<input type="hidden" name="protocols" value="sgclient">[ \t]*\n?',
              re.MULTILINE,
          )
          clients, clients_hidden = hidden.subn("", clients)
          detail, detail_hidden = hidden.subn("", detail)
          edit, edit_hidden = hidden.subn("", edit)
          if clients_hidden not in (0, 1):
              raise SystemExit(f"clients.html: unexpected hidden count {clients_hidden}")
          if detail_hidden not in (0, 1):
              raise SystemExit(f"client_detail.html: unexpected hidden count {detail_hidden}")
          if edit_hidden not in (0, 2):
              raise SystemExit(f"_client_edit_dialogs.html: unexpected hidden count {edit_hidden}")

          clients = insert_head_assets(clients, "SG_AWG_ONLY_NOTICE_V1_ASSETS")
          detail = insert_head_assets(detail, "SG_AWG_ONLY_NOTICE_V1_ASSETS")

          clients = insert_after_protocol_fieldset(
              clients,
              'id="cv2-dialog"',
              "SG_AWG_ONLY_NOTICE_V1_CREATE_CLIENT",
          )
          detail = insert_after_protocol_fieldset(
              detail,
              'id="dv46-device-dialog"',
              "SG_AWG_ONLY_NOTICE_V1_ADD_DEVICE",
          )
          edit = insert_after_protocol_fieldset(
              edit,
              'id="dv-edit-client-dialog"',
              "SG_AWG_ONLY_NOTICE_V1_EDIT_CLIENT",
          )
          edit = insert_after_protocol_fieldset(
              edit,
              'id="dv-edit-device-{{ device.id }}"',
              "SG_AWG_ONLY_NOTICE_V1_EDIT_DEVICE",
          )

          if "SG_GATEWAY_02206_AWG_ONLY_NOTICE_HELP_V2" not in help_text:
              help_pattern = re.compile(
                  r'    HelpTopic\(\n'
                  r'        slug="clients",\n'
                  r'.*?'
                  r'    \),\n',
                  re.DOTALL,
              )
              help_replacement = (
                  '    # SG_GATEWAY_02206_AWG_ONLY_NOTICE_HELP_V2\n'
                  '    HelpTopic(\n'
                  '        slug="clients",\n'
                  '        title="Клиенты",\n'
                  '        summary="Клиент — это человек или устройство, а не отдельная низкоуровневая запись механизма.",\n'
                  '        body=[\n'
                  '            "Создайте клиента и выберите нужные протоколы для его основного устройства.",\n'
                  '            "Если выбраны только AmneziaWG 2.0, AmneziaWG 3.0 и AmneziaWG 3.1, клиент и соединения создаются нормально, но SG Client subscription не формируется.",\n'
                  '            "Для AWG-профилей используйте отдельные QR-коды или файлы конфигурации каждого соединения.",\n'
                  '            "Отключите клиента, чтобы временно остановить доступ без удаления записи и профилей.",\n'
                  '        ],\n'
                  '    ),\n'
              )
              help_text, help_count = help_pattern.subn(
                  help_replacement, help_text, count=1
              )
              if help_count != 1:
                  raise SystemExit(
                      f"help content: clients topic count is {help_count}, expected 1"
                  )

          CSS.write_text(
              '''/* SG_AWG_ONLY_NOTICE_V1_STYLES */
          .sg-awg-only-note {
            margin: 0.75rem 0 1rem;
            padding: 0.78rem 0.9rem;
            border: 1px solid rgba(148, 163, 184, 0.38);
            border-radius: 0.75rem;
            background: rgba(148, 163, 184, 0.08);
            color: inherit;
            font-size: 0.9rem;
            line-height: 1.45;
            transition: background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
          }

          .sg-awg-only-note.is-active {
            border-color: rgba(245, 158, 11, 0.92);
            background: rgba(245, 158, 11, 0.19);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
          }
          ''',
              encoding="utf-8",
              newline="\n",
          )

          JS.write_text(
              '''/* SG_AWG_ONLY_NOTICE_V1_JS */
          (() => {
            'use strict';

            const awgOnlyValues = new Set(['amneziawg', 'amneziawg3', 'amneziawg31']);

            function initializeNotice(note) {
              const form = note.closest('form');
              if (!form || note.dataset.awgOnlyReady === '1') return;
              note.dataset.awgOnlyReady = '1';

              const syncAwgOnlyNotice = () => {
                const selected = [...form.querySelectorAll(
                  'input[type="checkbox"][name="protocols"]:checked'
                )]
                  .map(input => String(input.value || '').trim())
                  .filter(value => value && value !== 'sgclient');
                const isAwgOnly = (
                  selected.length > 0
                  && selected.every(value => awgOnlyValues.has(value))
                );
                note.classList.toggle('is-active', isAwgOnly);
              };

              form.addEventListener('change', event => {
                if (event.target?.matches('input[name="protocols"]')) {
                  syncAwgOnlyNotice();
                }
              });
              syncAwgOnlyNotice();
            }

            function initialize() {
              document.querySelectorAll('[data-awg-only-note]').forEach(initializeNotice);
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', initialize, {once: true});
            } else {
              initialize();
            }
          })();
          ''',
              encoding="utf-8",
              newline="\n",
          )

          TEST.write_text(
              '''from pathlib import Path

          from jinja2 import Environment

          from app.main import _prepare_client_protocols


          ROOT = Path(__file__).resolve().parents[1]
          MAIN = ROOT / "app" / "main.py"
          CLIENTS = ROOT / "app" / "web" / "templates" / "clients.html"
          DETAIL = ROOT / "app" / "web" / "templates" / "client_detail.html"
          EDIT = ROOT / "app" / "web" / "templates" / "_client_edit_dialogs.html"
          HELP = ROOT / "app" / "help" / "content.py"
          JS = ROOT / "app" / "web" / "static" / "sg-awg-only-notice-v1.js"


          def test_awg_only_protocols_create_without_subscription():
              assert _prepare_client_protocols(
                  ["sgclient", "amneziawg", "amneziawg3", "amneziawg31"]
              ) == ["amneziawg", "amneziawg3", "amneziawg31"]


          def test_non_awg_protocol_adds_single_subscription_credential():
              assert _prepare_client_protocols(
                  ["amneziawg", "mihomo", "sgclient", "mihomo"]
              ) == ["amneziawg", "mihomo", "sgclient"]
              assert _prepare_client_protocols(
                  ["xray_reality_tcp"]
              ) == ["xray_reality_tcp", "sgclient"]


          def test_all_client_and_device_mutations_use_protocol_normalizer():
              source = MAIN.read_text(encoding="utf-8")
              prepared = (
                  'protocols = _prepare_client_protocols('
                  'request.form.getlist("protocols"))'
              )
              assert source.count(prepared) == 4
              assert 'protocols = request.form.getlist("protocols")' not in source


          def test_forms_do_not_force_sgclient_and_show_awg_only_notice():
              clients = CLIENTS.read_text(encoding="utf-8")
              detail = DETAIL.read_text(encoding="utf-8")
              edit = EDIT.read_text(encoding="utf-8")
              for source in (clients, detail, edit):
                  assert 'type="hidden" name="protocols" value="sgclient"' not in source
                  Environment().parse(source)

              assert clients.count("SG_AWG_ONLY_NOTICE_V1_CREATE_CLIENT") == 1
              assert detail.count("SG_AWG_ONLY_NOTICE_V1_ADD_DEVICE") == 1
              assert edit.count("SG_AWG_ONLY_NOTICE_V1_EDIT_CLIENT") == 1
              assert edit.count("SG_AWG_ONLY_NOTICE_V1_EDIT_DEVICE") == 1

              notice = (
                  "При выборе только AWG-профилей подписка не создаётся. "
                  "Используйте QR-коды или файлы конфигурации для каждого соединения."
              )
              assert notice in clients
              assert notice in detail
              assert edit.count(notice) == 2


          def test_awg_only_notice_highlights_only_nonempty_all_awg_selection():
              source = JS.read_text(encoding="utf-8")
              assert "selected.length > 0" in source
              assert "selected.every(value => awgOnlyValues.has(value))" in source
              assert "value !== 'sgclient'" in source


          def test_help_explains_awg_only_creation_contract():
              source = HELP.read_text(encoding="utf-8")
              assert "SG_GATEWAY_02206_AWG_ONLY_NOTICE_HELP_V2" in source
              assert "клиент и соединения создаются нормально" in source
              assert "SG Client subscription не формируется" in source
          ''',
              encoding="utf-8",
              newline="\n",
          )

          MAIN.write_text(main, encoding="utf-8", newline="\n")
          CLIENTS.write_text(clients, encoding="utf-8", newline="\n")
          DETAIL.write_text(detail, encoding="utf-8", newline="\n")
          EDIT.write_text(edit, encoding="utf-8", newline="\n")
          HELP.write_text(help_text, encoding="utf-8", newline="\n")
          PY

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Run AWG-only regression tests
        run: |
          python3 -m pytest -q \
            tests/test_sg_gateway_v22_awg_only_subscription_contract.py \
            tests/test_sg_gateway_v22_client_device_dialog_final.py \
            tests/test_sg_gateway_v22_clients_devices_ux.py

      - name: Refresh source integrity and commit
        env:
          BRANCH_NAME: fix/02206-awg-only-subscription-contract
        run: |
          git rm .github/workflows/fix-awg-only-contract-once.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          tracked = [path for path in tracked if path != "SOURCE-SHA256SUMS"]
          rows = [
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {path}"
              for path in tracked
          ]
          Path("SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n", encoding="utf-8", newline="\n"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests SOURCE-SHA256SUMS
          git commit -m "fix: restore AWG-only creation and subscription guidance"
          git push origin "HEAD:${BRANCH_NAME}"
