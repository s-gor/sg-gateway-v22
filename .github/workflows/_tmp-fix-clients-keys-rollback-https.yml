name: Temporary fix Clients & Keys rollback HTTPS

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/02208-final-awg-ui-performance'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: RED then GREEN rollback HTTPS repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test_clients_keys_dormant_restore_02208.py')
          text = test_path.read_text(encoding='utf-8')
          marker = 'def test_safety_rollback_refreshes_https_before_health_check('
          if marker not in text:
              text += '''\n\ndef test_safety_rollback_refreshes_https_before_health_check() -> None:\n    source = (\n        Path(__file__).resolve().parents[1]\n        / "hostd"\n        / "sg_hostd"\n        / "clients_keys_portable_restore_patch.py"\n    ).read_text(encoding="utf-8")\n    rollback = source.split("except Exception as restore_exc:", 1)[1]\n    refresh = rollback.index("_refresh_restored_https_from_local_files")\n    health = rollback.index("hard._local_panel_health(full)")\n    assert refresh < health\n'''
              test_path.write_text(text, encoding='utf-8', newline='\n')
          PY

          set +e
          python -m pytest -q tests/test_clients_keys_dormant_restore_02208.py -k safety_rollback_refreshes_https_before_health_check
          red_rc=$?
          set -e
          if [ "$red_rc" -eq 0 ]; then
            echo 'Expected RED test before production patch, but it passed.' >&2
            exit 1
          fi
          echo 'RED confirmed.'

          python - <<'PY'
          from pathlib import Path

          path = Path('hostd/sg_hostd/clients_keys_portable_restore_patch.py')
          text = path.read_text(encoding='utf-8')
          old = '''                    full._normalize_panel_data_permissions()\n                    full._validate_runtime_after_restore()\n                    full._restart_runtime(schedule_panel=False)\n                    hard._local_panel_health(full)\n'''
          new = '''                    full._normalize_panel_data_permissions()\n                    rollback_cert_ready, rollback_cert_domain = (\n                        full._restored_certificate_ready()\n                    )\n                    if rollback_cert_domain:\n                        full._refresh_restored_https_from_local_files(\n                            allow_xray_inactive=True\n                        )\n                    full._validate_runtime_after_restore()\n                    full._restart_runtime(schedule_panel=False)\n                    if rollback_cert_domain:\n                        full._refresh_restored_https_from_local_files(\n                            allow_xray_inactive=True\n                        )\n                    hard._local_panel_health(full)\n'''
          if old not in text:
              raise SystemExit('rollback patch target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          python -m pytest -q \
            tests/test_clients_keys_dormant_restore_02208.py \
            tests/test_clients_keys_naiveproxy_tls_dormant_restore_02208.py \
            tests/test_awg_restore_link_integrity_02208.py

          rm -f .github/workflows/_tmp-fix-clients-keys-rollback-https.yml
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          tracked = [p for p in tracked if p != 'SOURCE-SHA256SUMS' and p != '.github/workflows/_tmp-fix-clients-keys-rollback-https.yml']
          rows = []
          for p in sorted(tracked):
              rows.append(f"{hashlib.sha256(Path(p).read_bytes()).hexdigest()}  {p}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8', newline='\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore HTTPS before Clients & Keys safety health check'
          git push origin HEAD:${{ github.head_ref }}
