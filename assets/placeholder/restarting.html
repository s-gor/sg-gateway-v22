<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>SG-Gateway перезапускается</title>
  <style>
    :root{color-scheme:dark;background:#111822;color:#eef4f8;font-family:Inter,Segoe UI,Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 15%,#263746 0,#111822 48%,#0b1118 100%)}
    .card{width:min(620px,100%);padding:34px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(20,29,39,.92);box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a9c6b2}.spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.14);border-top-color:#a9c6b2;border-radius:50%;animation:s .9s linear infinite;margin:20px 0}@keyframes s{to{transform:rotate(360deg)}}
    h1{font-size:30px;margin:0 0 12px}p{color:#c9d3dc;line-height:1.55;margin:0 0 18px}.muted{font-size:14px;color:#91a0ad}
    button{appearance:none;border:0;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;background:#d9e6dc;color:#142019;margin-top:4px}
  </style>
</head>
<body>
  <main class="card">
    <div class="k">SG-GATEWAY · FULL RESTORE</div>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Панель перезапускается</h1>
    <p>Во время полного восстановления это нормально. SG-Gateway уже возвращает службы и проверяет новый сервер.</p>
    <p class="muted" id="state">Проверяю панель… Страница откроется автоматически.</p>
    <button type="button" onclick="location.reload()">Открыть панель</button>
  </main>
  <script>
  (() => {
    const state=document.getElementById('state');
    let n=0;
    async function probe(){
      n++;
      try{
        const r=await fetch('/health?restore_wait='+Date.now(),{cache:'no-store',credentials:'same-origin'});
        const type=(r.headers.get('content-type')||'').toLowerCase();
        if(r.ok && type.includes('application/json')){ location.reload(); return; }
      }catch(e){}
      state.textContent='Панель ещё перезапускается… попытка '+n+'.';
      setTimeout(probe,2000);
    }
    setTimeout(probe,1200);
  })();
  </script>
</body>
</html>
